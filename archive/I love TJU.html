<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>北洋大学 今夕是何年</title>
    <style>
        :root { 
            --tju-blue: #004098; --tju-light: #eff6ff; --bg: #f4f7f9; 
            --ok: #10b981; --err: #f43f5e; --t1: #1e293b; --t2: #64748b; 
        }
        * { box-sizing: border-box; outline: none; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; min-height: 100vh; }

        .global-watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; max-width: 80%; opacity: 0.08; pointer-events: none; z-index: 9999;
        }

        .app { 
            width: 95%; max-width: 1100px; margin: 30px auto; 
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            border-radius: 20px; position: relative; z-index: 10; min-height: 85vh;
        }
        
        header { padding: 25px 40px; background: var(--tju-blue); color: #fff; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; }
        nav { display: none; background: rgba(255,255,255,0.8); border-bottom: 1px solid #eee; padding: 0 30px; }
        .nav-btn { padding: 15px 25px; border: none; background: none; font-size: 16px; font-weight: 600; color: var(--t2); cursor: pointer; border-bottom: 4px solid transparent; }
        .nav-btn.active { color: var(--tju-blue); border-bottom-color: var(--tju-blue); }

        main { padding: 40px; flex: 1; }
        .page { display: none; }
        .page.active { display: block; }

        .tag-chapter { display: inline-block; padding: 4px 10px; background: var(--tju-blue); color: #fff; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .q-text { font-size: 22px; font-weight: 700; margin-bottom: 25px; color: var(--tju-blue); }
        
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 20px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; background: #fff; transition: 0.2s; }
        .opt-idx { width: 30px; height: 30px; background: var(--tju-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; color: var(--tju-blue); }
        .opt.correct { background: #ecfdf5 !important; border-color: var(--ok) !important; }
        .opt.wrong { background: #fff1f2 !important; border-color: var(--err) !important; }

        .ana-box {
            background: linear-gradient(135deg, #f8fbff, #eef4ff);
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid var(--tju-blue);
            margin: 20px 0;
            color: var(--t1);
        }
        .btn-p {
            padding: 12px 30px;
            background: var(--tju-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 10px;
            transition: 0.2s;
        }
        .btn-p:hover { transform: translateY(-1px); }
        .quiz-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 18px 0 22px;
            flex-wrap: wrap;
        }
        .quiz-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-soft { background: #94a3b8; color: #fff; opacity: 0.9; }
        .btn-soft:hover { background: #7b8aa0; opacity: 1; }
        .btn-light {
            background: #eef4ff;
            color: var(--tju-blue);
            border: 1px solid #c9d8f2;
        }
        .progress-panel {
            display: none;
            background: linear-gradient(135deg, #f8fbff, #eef4ff);
            border: 1px solid #dbe7fb;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 22px;
        }
        .progress-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--tju-blue);
            font-weight: 700;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 10px;
        }
        .progress-item {
            height: 42px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: var(--t2);
            cursor: pointer;
            font-weight: 700;
        }
        .progress-item.current { border-color: var(--tju-blue); background: var(--tju-blue); color: #fff; }
        .progress-item.done { border-color: var(--ok); background: #ecfdf5; color: #047857; }
        .progress-item.wrong { border-color: var(--err); background: #fff1f2; color: #be123c; }
        .progress-item.todo { border-color: #cbd5e1; background: #fff; color: #64748b; }
        .campus-line {
            margin-top: 24px;
            padding: 14px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0,64,152,0.08), rgba(0,64,152,0.02));
            border: 1px solid rgba(0,64,152,0.12);
            color: var(--tju-blue);
            text-align: center;
            font-size: 15px;
            line-height: 1.8;
        }
        .campus-line strong {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--t2);
            letter-spacing: 1px;
        }
        .history-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .score-chart {
            display: none;
            background: #fff;
            border: 1px solid #dbe7fb;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,64,152,0.06);
        }
        .score-chart h3 {
            margin: 0 0 12px;
            color: var(--tju-blue);
        }
        .score-chart svg {
            width: 100%;
            height: 260px;
            display: block;
        }
        .chart-axis {
            stroke: #cbd5e1;
            stroke-width: 1;
        }
        .chart-line {
            fill: none;
            stroke: var(--tju-blue);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chart-dot {
            fill: #fff;
            stroke: var(--tju-blue);
            stroke-width: 3;
        }
        .chart-label {
            fill: var(--t2);
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .opt-grid { grid-template-columns: 1fr; }
            .quiz-toolbar { align-items: stretch; }
            .quiz-actions { width: 100%; }
            .quiz-actions .btn-p { flex: 1; margin-right: 0; }
        }
        .mode-card { border: 2px solid #eee; padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; background: #fff; transition: 0.2s; }
        .mode-card.active { border-color: var(--tju-blue); background: var(--tju-light); }
        
        .category-header { background: #f8fafc; padding: 10px 15px; border-radius: 8px; margin: 25px 0 10px 0; color: var(--tju-blue); font-weight: bold; border-left: 4px solid var(--tju-blue); display: flex; justify-content: space-between; }
        
        .snap-item { border-bottom: 1px solid #eee; padding: 25px 0; }
        .item-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; position: relative; }
        .del-btn { position: absolute; right: 15px; top: 15px; color: var(--err); border: 1px solid var(--err); padding: 2px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; z-index: 5; }
        .del-btn:hover { background: var(--err); color: #fff; }

        /* 多行代码块 - 仿图片风格 */
        .code-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid var(--tju-blue);
            font-family: Consolas, 'Courier New', monospace;
            white-space: pre;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            color: #1e293b;
        }
    </style>
</head>
<body>

<img class="global-watermark" src="https://www.tju.edu.cn/images/logo.png" alt="TJU">

<div class="app">
    <header><div class="logo">I love TJU | 客观题答题系统</div><div id="u-tag"></div></header>
    <nav id="main-nav">
        <button class="nav-btn" id="nav-prepare" onclick="goPrepare('normal')">练习中心</button>
        <button class="nav-btn" id="nav-history" onclick="switchPage('history')">历史记录</button>
        <button class="nav-btn" id="nav-wrong" onclick="switchPage('wrong')">错题回顾</button>
    </nav>

    <main>
        <div id="page-login" class="page active" style="text-align:center; padding-top:60px;">
            <h2 style="color:var(--tju-blue)">计算机软件技术基础1 题库练习</h2>
            <input type="text" id="user-input" placeholder="输入姓名" style="padding:15px; width:300px; border:1px solid #ddd; border-radius:10px;">
            <button class="btn-p" onclick="doLogin()">进入</button>
        </div>

        <div id="page-prepare" class="page">
            <div style="max-width:600px; margin:0 auto; text-align:center; padding:30px; border:2px dashed var(--tju-blue); border-radius:20px;">
                <h3 id="prep-mode-title">请选择练习模式</h3>
                <p>模式：<span id="prep-mode-name">-</span> | 题目：<span id="prep-count">-</span> 题</p>
                <div id="hard-config" style="display:none; margin-bottom:15px;">数量：<input type="number" id="hard-num" value="5" style="width:50px;"></div>
                <button class="btn-p" style="width:200px; height:50px; font-size:18px;" onclick="realStart()">开始挑战</button>
            </div>
            <div id="campus-line" class="campus-line">
                <strong>北洋校歌</strong>
                <span id="campus-line-text"></span>
            </div>            <div id="mode-selector" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-top:30px;">
                <div class="mode-card active" onclick="selectInitialMode('standard')"><h4>📜 标准模式</h4></div>
                <div class="mode-card" onclick="selectInitialMode('random')"><h4>🎲 随机模式</h4></div>
                <div class="mode-card" onclick="selectInitialMode('hard')"><h4>🔥 困难模式</h4></div>
            </div>
        </div>

        <div id="page-quiz" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                <div id="tag-container"></div>
                <div id="q-meta-idx" style="color:var(--t2)"></div>
            </div>
            <div class="quiz-toolbar">
                <button class="btn-p btn-light" onclick="toggleProgressPanel()">查看作答情况</button>
                <div class="quiz-actions">
                    <button class="btn-p btn-soft" onclick="submitPaper()">提交试卷</button>
                    <button class="btn-p" onclick="nextQ()">下一题 (Enter)</button>
                </div>
            </div>
            <div id="progress-panel" class="progress-panel"></div>
            <div id="q-text" class="q-text"></div>
            <div id="opt-box" class="opt-grid"></div>
            <div id="ana-area" style="display:none">
                <div class="ana-box" id="ana-cont"></div>
            </div>
        </div>

        <div id="page-result" class="page" style="text-align:center;">
            <h1 id="res-score" style="font-size:100px; color:var(--tju-blue); margin:20px 0;">0</h1>
            <button class="btn-p" onclick="showSnap(null, true)">查看作答详情</button>
            <button class="btn-p" style="background:#64748b" onclick="goPrepare('normal')">返回中心</button>
        </div>

        <div id="page-snap" class="page">
            <div id="snap-list"></div>
            <div id="snap-footer" style="margin-top:30px; padding-bottom:50px; text-align:center;">
                <button class="btn-p" id="snap-back-btn" onclick="switchPage('history')">返回列表</button>
                <button class="btn-p" style="background:#64748b" onclick="goPrepare('normal')">返回中心</button>
            </div>
        </div>

        <div id="page-history" class="page">
            <div class="history-tools">
                <div style="color:var(--t2);">历史成绩与答题记录</div>
                <button class="btn-p btn-light" id="score-chart-btn" style="display:none" onclick="toggleScoreChart()">查看成绩曲线</button>
            </div>
            <div id="score-chart" class="score-chart"></div>
            <div id="hist-list"></div>
        </div>

        <div id="page-wrong" class="page">
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
                <button class="btn-p" style="background:#f59e0b" onclick="goPrepare('w_order')">顺序重练</button>
                <button class="btn-p" style="background:#8b5cf6" onclick="goPrepare('w_rand')">随机重练</button>
                <button class="btn-p" style="background:#ef4444" onclick="goPrepare('w_freq')">难点攻克</button>
            </div>
            <div id="w-content"></div>
        </div>
    </main>
</div>

<script>
const questionData = [
            // 第001题
            {
                title: "【单项选择题001】",
                desc: "下列程序的输出是（　　）",
                code: `for x in range(1,10):    
	if x % 2 !=0:        
		continue             
	print(x, end=' ')`,
                options: [
                    "A. 1 3 5 7 9",
                    "B. 2 4 6 8 10",
                    "C. 2 4 6 8",
                    "D. 1 3 5 7"
                ],
                answer: "C",
                analysis: "range(1,10)生成1-9的整数，当x为奇数时执行continue跳过print，只打印偶数2、4、6、8。"
            },
            // 第002题
            {
                title: "【单项选择题002】",
                desc: "给出如下代码 `TempStr =\"Hello World\"` ,可以输出World子串的是（　　）。",
                code: "",
                options: [
                    "A. print(TempStr[-5:])",
                    "B. print(TempStr[-4:-1])",
                    "C. print(TempStr[-5:0])",
                    "D. print(TempStr[-5:-1])"
                ],
                answer: "A",
                analysis: "字符串切片TempStr[-5:]表示从倒数第5个字符开始到末尾，\"Hello World\"的倒数第5个字符是W，正好截取到World。"
            },
            // 第003题
            {
                title: "【单项选择题003】",
                desc: "在Python中,正确的赋值语句为（　　）",
                code: "",
                options: [
                    "A. x+y=10",
                    "B. x=2y",
                    "C. x=y=30",
                    "D. 3y=x+1"
                ],
                answer: "C",
                analysis: "Python支持链式赋值，x=y=30等价于y=30，x=y；A选项左边是表达式不能赋值；B和D选项的2y、3y写法错误，应为2*y、3*y。"
            },
            // 第004题
            {
                title: "【单项选择题004】",
                desc: "语句x=input()执行时,如果从键盘输入12并按回车键,则x的值是( )",
                code: "",
                options: [
                    "A. '12'",
                    "B. 12",
                    "C. 12+空格",
                    "D. \"12.0\""
                ],
                answer: "A",
                analysis: "input()函数获取的用户输入始终是字符串类型，所以输入12得到的是字符串'12'。"
            },
            // 第005题
            {
                title: "【单项选择题005】",
                desc: "执行下列代码后,m,n的值分别是（　　）",
                code: `n = 123456789
m = 0
while n != 0:
    m = (10 * m) + (n % 10)
    n //= 10`,
                options: [
                    "A. m = 0, n = 0",
                    "B. m = 123456789, n = 1",
                    "C. m = 987654321, n = 0",
                    "D. m = 1,n = 9"
                ],
                answer: "C",
                analysis: "该代码实现数字反转：每次取n的最后一位（n%10）添加到m末尾，然后n整除10去掉最后一位，最终n变为0，m为987654321。"
            },
            // 第006题
            {
                title: "【单项选择题006】",
                desc: "下面代码的输出结果是（　　）",
                code: `x = 1
x *= 3+5**2         
print(x)`,
                options: [
                    "A. 28",
                    "B. 14",
                    "C. 13",
                    "D. 29"
                ],
                answer: "A",
                analysis: "运算优先级：先算5**2=25，再加3得28，最后x *= 28等价于x = 1*28=28。"
            },
            // 第007题
            {
                title: "【单项选择题007】",
                desc: "拟在屏幕上打印输出“Hello World”,以下选项中正确的是（　　）",
                code: "",
                options: [
                    "A.  print(Hello World)",
                    "B.  print('Hello World')",
                    "C.  printf(\"Hello World\")",
                    "D.  printf('Hello World')"
                ],
                answer: "B",
                analysis: "Python中打印使用print()函数，字符串需要用单引号或双引号包裹；printf不是Python的内置函数。"
            },
            // 第008题
            {
                title: "【单项选择题008】",
                desc: "将以下代码运行后输出的是（　　）。",
                code: `li = ['alex','eric','rain']
s = "_".join(li)
print(s)`,
                options: [
                    "A.  _alex_eric_rain",
                    "B.   _alex_eric_rain_",
                    "C.  alex_eric_rain",
                    "D.   alex_eric_rain_"
                ],
                answer: "C",
                analysis: "join()方法将列表元素用指定分隔符连接，'_'.join(li)会在alex、eric、rain之间插入下划线，结果为alex_eric_rain。"
            },
            // 第009题
            {
                title: "【单项选择题009】",
                desc: "设 `lt=['A','B','1','2']`,下列选项中（　　）可以实现将lt中各元素用'-'连接输出,即输出`A-B-1-2` 。",
                code: "",
                options: [
                    "A. print(lt[0:3])",
                    "B. print(lt[0:3],'-')",
                    "C. print('-'.join(lt))",
                    "D. print('-'.split(lt))"
                ],
                answer: "C",
                analysis: "join()方法用于将可迭代对象的元素用指定字符串连接；split()是分割字符串的方法，参数应为字符串而非列表。"
            },
            // 第010题
            {
                title: "【单项选择题010】",
                desc: "下列语句执行后的输出是（　　）。",
                code: `if 2:
    print(5)
else:
    print(6)`,
                options: [
                    "A. 0",
                    "B. 2",
                    "C. 5",
                    "D. 6"
                ],
                answer: "C",
                analysis: "Python中非0数字视为True，所以if 2条件成立，执行print(5)。"
            },
            // 第011题
            {
                title: "【单项选择题011】",
                desc: "下述while循环执行的次数为（　　）",
                code: `k = 10
while k > 2:
	print(k)
	k = k-2`,
                options: [
                    "A. 3",
                    "B. 10",
                    "C. 5",
                    "D. 4"
                ],
                answer: "D",
                analysis: "循环执行过程：k=10→8→6→4，共4次，当k=2时不满足k>2条件退出循环。"
            },
            // 第012题
            {
                title: "【单项选择题012】",
                desc: "下面代码的输出结果是（　　）。",
                code: `sum = 1
for i in range(1,101):
	sum += i
print(sum)`,
                options: [
                    "A. 5049",
                    "B. 5052",
                    "C. 5051",
                    "D. 5050"
                ],
                answer: "C",
                analysis: "1到100的和是5050，sum初始值为1，累加后sum=1+5050=5051。"
            },
            // 第013题
            {
                title: "【单项选择题013】",
                desc: "下列程序输出的最后一个值是（　　）",
                code: `age = 23
start = 2
if age % 2 != 0:
	start = 1
for x in range(start, age + 2, 2):
	print(x)`,
                options: [
                    "A. 23",
                    "B. 21",
                    "C. 25",
                    "D. 22"
                ],
                answer: "A",
                analysis: "age=23是奇数，start=1；range(1,25,2)生成1、3、5...23，最后一个数是23。"
            },
            // 第014题
            {
                title: "【单项选择题014】",
                desc: "下列表达式的值为True的是 ( )。",
                code: "",
                options: [
                    "A. 2!=5 or 0",
                    "B. 3 > 2 > 2",
                    "C. 5+4j > 2-3j",
                    "D. 1 and 5==0"
                ],
                answer: "A",
                analysis: "A选项：2!=5为True，or运算只要有一个为True结果就是True；B选项3>2>2等价于3>2 and 2>2，后者为False；C选项复数不能比较大小；D选项5==0为False，and运算结果为False。"
            },
            // 第015题
            {
                title: "【单项选择题015】",
                desc: "下面代码的输出结果是（　　）。",
                code: `for a in 'mirror':
	print(a,end="")  
	if a == 'r':
		break`,
                options: [
                    "A. mir",
                    "B. mirror ",
                    "C. mi ",
                    "D. mirr"
                ],
                answer: "A",
                analysis: "遍历'mirror'，依次打印m、i、r，当a='r'时执行break退出循环，输出mir。"
            },
            // 第016题
            {
                title: "【单项选择题016】",
                desc: "下列语句中,在Python中非法的是（　　）",
                code: "",
                options: [

// ====================== 以下为原有逻辑（几乎不变，仅renderQ支持代码块） ======================
let user = "";
let rt = { idx: 0, pool: [], trace: [], answers: {}, selectedMode: "standard", isLocked: false, lastRec: null };

window.onkeydown = (e) => {
    if (e.key === "Enter" && document.getElementById("page-quiz").classList.contains("active")) {
        nextQ();
    }
};

function doLogin() {
    user = document.getElementById("user-input").value.trim();
    if(!user) return;
    document.getElementById("u-tag").innerText = "用户 " + user;
    document.getElementById("main-nav").style.display = "flex";
    goPrepare("normal");
}

function switchPage(pid) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + pid).classList.add("active");
    let nid = "nav-" + ((pid === "quiz" || pid === "prepare") ? "prepare" : (pid === "snap" ? "history" : pid));
    if(document.getElementById(nid)) document.getElementById(nid).classList.add("active");
    if(pid === "history") renderHist();
    if(pid === "wrong") renderWrongs();
    window.scrollTo(0,0);
}

function selectInitialMode(m) {
    rt.selectedMode = m;
    document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("active"));
    document.querySelector(`.mode-card[onclick*="${m}"]`).classList.add("active");
    updatePrepView();
}

function updateCampusLine() {
    const el = document.getElementById("campus-line-text");
    if (!el) return;
    const line = SONG_LINES[Math.floor(Math.random() * SONG_LINES.length)];
    el.innerText = line;
}

function goPrepare(m) {
    if(m === "normal") {
        document.getElementById("mode-selector").style.display = "grid";
        selectInitialMode(rt.selectedMode);
        updateCampusLine();
    } else {
        document.getElementById("mode-selector").style.display = "none";
        rt.selectedMode = m;
    }
    updatePrepView();
    switchPage("prepare");
}

function updatePrepView() {
    const names = { "standard":"标准顺序", "random":"完全随机", "hard":"高难模式", "w_order":"错题顺序", "w_rand":"错题随机", "w_freq":"错题强化" };
    let pool = calculatePool();
    document.getElementById("prep-mode-name").innerText = names[rt.selectedMode] || "-";
    document.getElementById("prep-count").innerText = pool.length;
    document.getElementById("hard-config").style.display = rt.selectedMode === "hard" ? "block" : "none";
}

function calculatePool() {
    let p = [...DB];
    if(rt.selectedMode.startsWith("w_")) {
        let wData = JSON.parse(localStorage.getItem("W_DATA_" + user) || "{}");
        let wIds = Object.keys(wData).map(Number);
        p = DB.filter(q => wIds.includes(q.id));
    }
    if(rt.selectedMode === "hard") {
        let n = parseInt(document.getElementById("hard-num")?.value) || 5;
        p.sort((a,b) => b.diff - a.diff);
        p = p.slice(0, n);
    }
    return p;
}

function realStart() {
    rt.pool = calculatePool();
    if(rt.pool.length === 0) return alert("暂无可练题目。");
    if(rt.selectedMode === "random" || rt.selectedMode === "w_rand") {
        rt.pool = rt.pool.sort(() => Math.random() - 0.5);
    }
    rt.idx = 0;
    rt.trace = [];
    rt.answers = {};
    document.getElementById("progress-panel").style.display = "none";
    renderQ();
    switchPage("quiz");
}

function getFullTrace() {
    return rt.pool.map(q => rt.answers[q.id] || { qid: q.id, u: -1, ok: false, skipped: true });
}

function getUnansweredCount() {
    return rt.pool.filter(q => !rt.answers[q.id]).length;
}

function toggleProgressPanel() {
    const panel = document.getElementById("progress-panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    renderProgressPanel();
}

function renderProgressPanel() {
    const panel = document.getElementById("progress-panel");
    const unanswered = getUnansweredCount();
    panel.innerHTML = `
        <div class="progress-head">
            <span>作答情况</span>
            <span>已答 ${rt.pool.length - unanswered} / ${rt.pool.length}，未答 ${unanswered}</span>
        </div>
        <div class="progress-grid">
            ${rt.pool.map((q, index) => {
                const a = rt.answers[q.id];
                let cls = "todo";
                if(index === rt.idx) cls = "current";
                else if(a && a.ok) cls = "done";
                else if(a && !a.ok) cls = "wrong";
                return `<button class="progress-item ${cls}" onclick="jumpToQuestion(${index})">${index + 1}</button>`;
            }).join("")}
        </div>
        <div style="margin-top:10px; color:var(--t2); font-size:13px;">点击题号可直接跳转，浅色按钮表示尚未作答。</div>
    `;
}

window.jumpToQuestion = (index) => {
    rt.idx = index;
    renderQ();
};

function answerCurrent(i) {
    const q = rt.pool[rt.idx];
    if (rt.answers[q.id]) return;

    const ok = (i === q.c);
    const traceItem = { ok, qid: q.id, u: i, skipped: false };
    rt.answers[q.id] = traceItem;

    if (!ok) saveWrong(traceItem);
    renderQ();
}

function renderQ() {
    document.getElementById("ana-area").style.display = "none";

    const q = rt.pool[rt.idx];
    const existing = rt.answers[q.id];
    rt.isLocked = !!existing;

    document.getElementById("tag-container").innerHTML = `<span class="tag-chapter">${CAT_MAP[q.chap] || q.chap}</span>`;
    document.getElementById("q-meta-idx").innerText = `${rt.idx + 1} / ${rt.pool.length}`;

    let qHTML = q.q;
    if (q.code) {
        qHTML += `<div class="code-box">${q.code}</div>`;
    }
    document.getElementById("q-text").innerHTML = qHTML;

    const box = document.getElementById("opt-box");
    box.innerHTML = "";
    q.a.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "opt";
        d.innerHTML = `<span class="opt-idx">${String.fromCharCode(65+i)}</span> ${t}`;
        d.onclick = () => answerCurrent(i);
        box.appendChild(d);
    });

    if (existing) {
        const opts = document.querySelectorAll(".opt");
        opts[q.c].classList.add("correct");
        if (!existing.ok && existing.u !== -1) opts[existing.u].classList.add("wrong");

        document.getElementById("ana-cont").innerHTML = existing.ok
            ? `<b>回答正确</b><br>${q.p}`
            : `<b>正确答案：${String.fromCharCode(65+q.c)}</b><br>${q.p}`;
        document.getElementById("ana-area").style.display = "block";
    }

    renderProgressPanel();
}

function nextQ() {
    if (rt.idx < rt.pool.length - 1) {
        rt.idx++;
        renderQ();
    } else {
        submitPaper();
    }
}

function submitPaper() {
    const unanswered = getUnansweredCount();
    const msg = unanswered > 0
        ? `当前还有 ${unanswered} 题未作答，确认提前交卷吗？`
        : "已完成全部题目，确认提交试卷吗？";

    if (confirm(msg)) finish();
}

function finish() {
    const fullTrace = getFullTrace();
    const score = Math.round((fullTrace.filter(t => t.ok).length / rt.pool.length) * 100);
    document.getElementById("res-score").innerText = score;
    rt.lastRec = { time: new Date().toLocaleString(), score, trace: fullTrace, isWrongMode: rt.selectedMode.startsWith("w_") };
    if(!rt.lastRec.isWrongMode) {
        let h = JSON.parse(localStorage.getItem("H_" + user) || "[]");
        h.unshift(rt.lastRec);
        localStorage.setItem("H_" + user, JSON.stringify(h.slice(0,10)));
    }
    switchPage("result");
}

function showSnap(rec = null, showFooter = false, fromPage = "history") {
    const data = rec || rt.lastRec;
    const list = document.getElementById("snap-list");
    list.innerHTML = `<h3 style="text-align:center; color:var(--tju-blue)">题目详情回顾</h3>`;
    data.trace.forEach((t) => {
        const q = DB.find(item => item.id === t.qid);
        const div = document.createElement("div");
        div.className = "snap-item";
        const statusText = t.skipped ? "未作答" : (t.ok ? "答对" : "答错");
        const statusColor = t.skipped ? "var(--t2)" : (t.ok ? "var(--ok)" : "var(--err)");
        div.innerHTML = `
            <div style="color:${statusColor}; font-weight:bold;">题目编号 #${q.id} - [${CAT_MAP[q.chap] || q.chap}] | ${statusText}</div>
            <div class="q-text" style="font-size:18px; margin:10px 0;">${q.q}</div>
            ${q.code ? `<div class="code-box">${q.code}</div>` : ""}
            <div class="opt-grid">
                ${q.a.map((opt, oi) => `<div class="opt ${oi===q.c ? "correct" : ""} ${oi===t.u && !t.ok && !t.skipped ? "wrong" : ""}" style="padding:10px; font-size:14px;"><span class="opt-idx" style="width:20px; height:20px;">${String.fromCharCode(65+oi)}</span> ${opt}</div>`).join("")}
            </div>
            <div class="ana-box">${t.skipped ? "<b>本题未作答</b><br>" : ""}解析：${q.p}</div>
        `;
        list.appendChild(div);
    });
    document.getElementById("snap-back-btn").innerText = fromPage === "wrong" ? "返回错题列表" : "返回历史记录";
    document.getElementById("snap-back-btn").onclick = () => switchPage(fromPage);
    switchPage("snap");
}

function toggleScoreChart() {
    const panel = document.getElementById("score-chart");
    if (!panel) return;
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    if (panel.style.display === "block") renderScoreChart();
}

function renderScoreChart() {
    const panel = document.getElementById("score-chart");
    const h = JSON.parse(localStorage.getItem("H_" + user) || "[]");
    if (!panel) return;
    if (h.length <= 2) {
        panel.style.display = "none";
        return;
    }

    const points = [...h].reverse();
    const width = 760;
    const height = 260;
    const left = 45;
    const right = 20;
    const top = 20;
    const bottom = 40;
    const innerW = width - left - right;
    const innerH = height - top - bottom;
    const step = points.length > 1 ? innerW / (points.length - 1) : innerW;
    const polyline = points.map((item, index) => {
        const x = left + step * index;
        const y = top + innerH - (item.score / 100) * innerH;
        return `${x},${y}`;
    }).join(" ");
    const dots = points.map((item, index) => {
        const x = left + step * index;
        const y = top + innerH - (item.score / 100) * innerH;
        return `<circle class="chart-dot" cx="${x}" cy="${y}" r="4"></circle><text class="chart-label" x="${x}" y="${y - 10}" text-anchor="middle">${item.score}</text><text class="chart-label" x="${x}" y="${height - 12}" text-anchor="middle">${index + 1}</text>`;
    }).join("");
    const yLabels = [0, 20, 40, 60, 80, 100].map(score => {
        const y = top + innerH - (score / 100) * innerH;
        return `<text class="chart-label" x="8" y="${y + 4}">${score}</text><line class="chart-axis" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>`;
    }).join("");

    panel.innerHTML = `
        <h3>成绩曲线</h3>
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            ${yLabels}
            <line class="chart-axis" x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}"></line>
            <polyline class="chart-line" points="${polyline}"></polyline>
            ${dots}
        </svg>
        <div style="margin-top:8px; color:var(--t2); font-size:13px;">横轴为测试次数，纵轴为分数。</div>
    `;
}

function renderHist() {
    const h = JSON.parse(localStorage.getItem('H_'+user) || '[]');
    const chartBtn = document.getElementById('score-chart-btn');
    const chart = document.getElementById('score-chart');
    if (chartBtn) chartBtn.style.display = h.length > 2 ? 'inline-block' : 'none';
    if (chart && h.length <= 2) chart.style.display = 'none';
    document.getElementById('hist-list').innerHTML = h.map((item, i) => `
        <div class="item-card" onclick="viewHist(${i})"><b>${item.time}</b> <span style="float:right; color:var(--tju-blue); font-weight:bold;">${item.score}分</span></div>
    `).join('') || '<div style="text-align:center; color:var(--t2)">暂无历史记录</div>';
    if (chart && chart.style.display === 'block' && h.length > 2) renderScoreChart();
}

window.viewHist = (i) => {
    const h = JSON.parse(localStorage.getItem('H_'+user) || '[]');
    showSnap(h[i], true, 'history');
};

function renderWrongs() {
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    const ids = Object.keys(wData).map(Number).sort((a,b)=>a-b);
    
    const groups = {};
    ids.forEach(id => {
        const q = DB.find(item => item.id === id);
        if (!q) return;
        const groupName = CAT_MAP[q.chap] || "💠 其他";
        if(!groups[groupName]) groups[groupName] = [];
        groups[groupName].push(q);
    });

    const container = document.getElementById('w-content');
    container.innerHTML = '';

    if(ids.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--t2)">恭喜，目前没有错题记录！</div>';
        return;
    }

    for(const [name, items] of Object.entries(groups)) {
        const section = document.createElement('div');
        section.innerHTML = `<div class="category-header"><span>${name}</span> <span style="font-size:12px; opacity:0.7">${items.length} 题</span></div>`;
        items.forEach(q => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => viewWrongSnap(q.id);
            card.innerHTML = `
                <span class="del-btn" onclick="removeWrong(${q.id}, event)">移除</span>
                <b>#${q.id}</b> ${q.q}
            `;
            section.appendChild(card);
        });
        container.appendChild(section);
    }
}

window.viewWrongSnap = (id) => {
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    showSnap({ trace: [wData[id]], isWrongMode: true }, true, 'wrong');
};

function removeWrong(id, e) {
    e.stopPropagation();
    let wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    delete wData[id];
    localStorage.setItem('W_DATA_'+user, JSON.stringify(wData));
    renderWrongs();
}

function saveWrong(traceItem) {
    let wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    wData[traceItem.qid] = traceItem;
    localStorage.setItem('W_DATA_'+user, JSON.stringify(wData));
}

</script>
