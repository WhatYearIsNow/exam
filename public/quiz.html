<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TJU Quiz Hub｜题库练习</title>
    <style>
        :root { 
            --tju-blue: #004098; --tju-light: #eff6ff; --bg: #f4f7f9; 
            --ok: #10b981; --err: #f43f5e; --t1: #1e293b; --t2: #64748b; 
        }
        * { box-sizing: border-box; outline: none; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; min-height: 100vh; }

        .global-watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; max-width: 80%; opacity: 0.08; pointer-events: none; z-index: 9999;
        }

        .app { 
            width: 95%; max-width: 1100px; margin: 30px auto; 
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            border-radius: 20px; position: relative; z-index: 10; min-height: 85vh;
        }
        
        header { padding: 25px 40px; background: var(--tju-blue); color: #fff; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; }
        nav { display: none; background: rgba(255,255,255,0.8); border-bottom: 1px solid #eee; padding: 0 30px; }
        .nav-btn { padding: 15px 25px; border: none; background: none; font-size: 16px; font-weight: 600; color: var(--t2); cursor: pointer; border-bottom: 4px solid transparent; }
        .nav-btn.active { color: var(--tju-blue); border-bottom-color: var(--tju-blue); }

        main { padding: 40px; flex: 1; }
        .page { display: none; }
        .page.active { display: block; }

        .tag-chapter { display: inline-block; padding: 4px 10px; background: var(--tju-blue); color: #fff; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .q-text { font-size: 22px; font-weight: 700; margin-bottom: 25px; color: var(--tju-blue); }
        
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 20px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; background: #fff; transition: 0.2s; }
        .opt-idx { width: 30px; height: 30px; background: var(--tju-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; color: var(--tju-blue); }
        .opt.correct { background: #ecfdf5 !important; border-color: var(--ok) !important; }
        .opt.wrong { background: #fff1f2 !important; border-color: var(--err) !important; }

        .ana-box {
            background: linear-gradient(135deg, #f8fbff, #eef4ff);
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid var(--tju-blue);
            margin: 20px 0;
            color: var(--t1);
        }
        .btn-p {
            padding: 12px 30px;
            background: var(--tju-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 10px;
            transition: 0.2s;
        }
        .btn-p:hover { transform: translateY(-1px); }
        .quiz-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 18px 0 22px;
            flex-wrap: wrap;
        }
        .quiz-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-soft { background: #94a3b8; color: #fff; opacity: 0.9; }
        .btn-soft:hover { background: #7b8aa0; opacity: 1; }
        .btn-light {
            background: #eef4ff;
            color: var(--tju-blue);
            border: 1px solid #c9d8f2;
        }
        .progress-panel {
            display: none;
            background: linear-gradient(135deg, #f8fbff, #eef4ff);
            border: 1px solid #dbe7fb;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 22px;
        }
        .progress-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--tju-blue);
            font-weight: 700;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 10px;
        }
        .progress-item {
            height: 42px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: var(--t2);
            cursor: pointer;
            font-weight: 700;
        }
        .progress-item.current { border-color: var(--tju-blue); background: var(--tju-blue); color: #fff; }
        .progress-item.done { border-color: var(--ok); background: #ecfdf5; color: #047857; }
        .progress-item.wrong { border-color: var(--err); background: #fff1f2; color: #be123c; }
        .progress-item.todo { border-color: #cbd5e1; background: #fff; color: #64748b; }
        .campus-line {
            margin-top: 24px;
            padding: 14px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0,64,152,0.08), rgba(0,64,152,0.02));
            border: 1px solid rgba(0,64,152,0.12);
            color: var(--tju-blue);
            text-align: center;
            font-size: 15px;
            line-height: 1.8;
        }
        .campus-line strong {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--t2);
            letter-spacing: 1px;
        }
        .history-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .score-chart {
            display: none;
            background: #fff;
            border: 1px solid #dbe7fb;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,64,152,0.06);
        }
        .score-chart h3 {
            margin: 0 0 12px;
            color: var(--tju-blue);
        }
        .score-chart svg {
            width: 100%;
            height: 260px;
            display: block;
        }
        .chart-axis {
            stroke: #cbd5e1;
            stroke-width: 1;
        }
        .chart-line {
            fill: none;
            stroke: var(--tju-blue);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chart-dot {
            fill: #fff;
            stroke: var(--tju-blue);
            stroke-width: 3;
        }
        .chart-label {
            fill: var(--t2);
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .opt-grid { grid-template-columns: 1fr; }
            .quiz-toolbar { align-items: stretch; }
            .quiz-actions { width: 100%; }
            .quiz-actions .btn-p { flex: 1; margin-right: 0; }
        }
        .mode-card { border: 2px solid #eee; padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; background: #fff; transition: 0.2s; }
        .mode-card.active { border-color: var(--tju-blue); background: var(--tju-light); }
        .mode-card small { display: block; margin-top: 6px; color: var(--t2); font-size: 13px; }
        
        .category-header { background: #f8fafc; padding: 10px 15px; border-radius: 8px; margin: 25px 0 10px 0; color: var(--tju-blue); font-weight: bold; border-left: 4px solid var(--tju-blue); display: flex; justify-content: space-between; }
        
        .snap-item { border-bottom: 1px solid #eee; padding: 25px 0; }
        .item-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; position: relative; }
        .del-btn { position: absolute; right: 15px; top: 15px; color: var(--err); border: 1px solid var(--err); padding: 2px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; z-index: 5; }
        .del-btn:hover { background: var(--err); color: #fff; }

        /* 多行代码块 - 仿图片风格 */
        .code-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid var(--tju-blue);
            font-family: Consolas, 'Courier New', monospace;
            white-space: pre;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            color: #1e293b;
        }
    
        /* Three-mode selector */
        .big-mode-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .big-mode-card { border: 2px solid #e2e8f0; padding: 24px 16px; border-radius: 14px; cursor: pointer; text-align: center; background: #fff; transition: all 0.2s; }
        .big-mode-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,64,152,0.1); }
        .big-mode-card.active { border-color: var(--tju-blue); background: var(--tju-light); box-shadow: 0 4px 16px rgba(0,64,152,0.15); }
        .big-mode-card .icon { font-size: 32px; margin-bottom: 8px; }
        .big-mode-card h4 { margin: 0 0 6px; color: var(--t1); }
        .big-mode-card p { margin: 0; color: var(--t2); font-size: 13px; }

        /* Chapter tags */
        .chapter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .chapter-tag { padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; color: var(--t2); transition: 0.15s; user-select: none; }
        .chapter-tag.on { background: var(--tju-blue); color: #fff; border-color: var(--tju-blue); }

        /* Sub-mode selector */
        .submode-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .submode-btn { padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; color: var(--t2); transition: 0.15s; }
        .submode-btn.on { background: var(--tju-blue); color: #fff; border-color: var(--tju-blue); }

        /* Panel card */
        .panel-card { background: #f8fafc; border-radius: 14px; padding: 18px; margin-bottom: 16px; }

        /* Return bar */
        .return-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .return-bar button { padding: 6px 16px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: var(--t2); cursor: pointer; font-size: 13px; transition: 0.15s; }
        .return-bar button:hover { background: #f1f5f9; color: var(--t1); }
        .return-bar .sep { color: #cbd5e1; }

        /* History filter tabs */
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-tab { padding: 8px 18px; border-radius: 20px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; font-size: 13px; color: var(--t2); transition: 0.15s; }
        .filter-tab.on { background: var(--tju-blue); color: #fff; border-color: var(--tju-blue); }

        /* Resume banner */
        .resume-banner { display: none; margin: 16px 0; padding: 14px 20px; background: linear-gradient(135deg, #fef3c7, #fde68a); border-radius: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .resume-banner span { color: #92400e; font-size: 14px; font-weight: 500; }
        .resume-banner .btns { display: flex; gap: 8px; }

        @media (max-width: 768px) {
            .big-mode-row { grid-template-columns: 1fr; }
        }

    
        .chapter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .chapter-card { padding: 18px; border-radius: 12px; cursor: pointer; background: #fff; border: 2px solid #e2e8f0; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .chapter-card:hover { border-color: var(--tju-blue); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,64,152,0.08); }
        .chapter-card .ch-name { font-weight: 600; color: var(--t1); font-size: 15px; }
        .chapter-card .ch-count { font-size: 13px; color: var(--t2); background: #f1f5f9; padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
        @media (max-width: 768px) { .chapter-grid { grid-template-columns: 1fr; } }

        /* TJU Quiz Hub web edition */
        body {
            background:
                radial-gradient(circle at 20% 10%, rgba(7,84,198,.08), transparent 34%),
                #f4f0e7;
            color: #101828;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .app {
            width: min(1180px, calc(100% - 36px));
            margin: 22px auto;
            background: rgba(255,253,248,.94);
            border: 1px solid rgba(7,26,53,.16);
            border-radius: 4px;
            box-shadow: 18px 20px 0 rgba(7,26,53,.09);
            overflow: hidden;
        }
        header {
            min-height: 78px;
            padding: 18px 28px;
            background: #071a35;
            border-radius: 0;
        }
        .logo { display:flex; align-items:center; gap:13px; font-weight:800; letter-spacing:.05em; }
        .logo-mark {
            width: 38px; height: 38px; display:grid; place-items:center;
            border-radius:50%; background:#d7ff54; color:#0754c6;
            font-family:Georgia,serif; font-size:23px; font-weight:900;
        }
        .home-link { color:#fff; text-decoration:none; display:flex; align-items:center; gap:13px; }
        .logo small { display:block; margin-top:2px; color:rgba(255,255,255,.58); font-size:10px; letter-spacing:.16em; }
        nav { background:#fffdf8; border-bottom-color:rgba(7,26,53,.14); overflow-x:auto; padding-inline:22px; }
        .nav-btn { color:#667085; white-space:nowrap; }
        .nav-btn.active { color:#0754c6; border-bottom-color:#0754c6; }
        main { padding:42px; }
        .btn-p { background:#0754c6; border-radius:2px; box-shadow:4px 4px 0 #071a35; }
        .btn-p:hover { transform:translate(-1px,-1px); box-shadow:6px 6px 0 #071a35; }
        .btn-light { background:#e9f1ff; color:#0754c6; border-color:#b9cdef; box-shadow:none; }
        .mode-card, .big-mode-card, .chapter-card, .item-card, .panel-card,
        .progress-panel, .score-chart, .opt { border-radius:3px; }
        .big-mode-card.active, .chapter-card:hover { border-color:#0754c6; }
        .global-watermark {
            width:320px; height:320px; display:grid; place-items:center;
            color:#0754c6; font-family:Georgia,serif; font-size:110px; font-weight:900;
            border:8px double #0754c6; border-radius:50%; opacity:.035;
            transform:translate(-50%,-50%) rotate(-12deg);
        }
        @media (max-width: 768px) {
            .app { width:100%; min-height:100vh; margin:0; border:0; box-shadow:none; }
            header { padding:14px 17px; }
            main { padding:26px 18px 44px; }
            nav { padding-inline:6px; }
            .nav-btn { padding:13px 15px; font-size:14px; }
            #page-login { padding-top:36px !important; }
            #user-input { width:min(100%, 300px) !important; margin-bottom:12px; }
            .q-text { font-size:19px; }
        }

    </style>
</head>
<body>

<div class="global-watermark" aria-hidden="true">T</div>

<div class="app">
    <header><div class="logo"><a class="home-link" href="/"><span class="logo-mark">T</span><span>TJU QUIZ HUB<small>天大刷题站 · 返回首页</small></span></a></div><div id="u-tag"></div></header>
    <nav id="main-nav">
        <button class="nav-btn" id="nav-prepare" onclick="goPrepare('normal')">练习中心</button>
        <button class="nav-btn" id="nav-history" onclick="switchPage('history')">历史记录</button>
        <button class="nav-btn" id="nav-wrong" onclick="switchPage('wrong')">错题回顾</button>
        <button class="nav-btn" id="nav-stats" onclick="window.open('/stats','_blank')" style="display:none;">全服统计</button>
    </nav>

    <main>
        <div id="page-login" class="page active" style="text-align:center; padding-top:60px;">
            <h2 style="color:var(--tju-blue)" id="login-title">题库练习</h2>
            <input type="text" id="user-input" placeholder="输入姓名" style="padding:15px; width:300px; border:1px solid #ddd; border-radius:10px; font-size:16px;">
            <button class="btn-p" onclick="doLogin()">进入</button>
        </div>

        <div id="page-prepare" class="page">
            <div style="max-width:650px; margin:0 auto;">

                <h3 style="text-align:center; color:var(--tju-blue); margin-bottom:24px;">选择练习模式</h3>

                <!-- Resume banner -->
                <div class="resume-banner" id="resume-banner">
                    <span id="resume-text"></span>
                    <div class="btns">
                        <button class="btn-p" style="background:#f59e0b; padding:8px 20px; font-size:13px;" onclick="resumeSession()">继续作答</button>
                        <button class="btn-soft" style="padding:8px 16px; font-size:12px;" onclick="clearSession()">放弃记录</button>
                    </div>
                </div>

                <!-- Three big mode cards -->
                <div class="big-mode-row">
                    <div class="big-mode-card" onclick="switchPage('chapters')" style="cursor:pointer;">
                        <div class="icon">📖</div><h4>章节检测</h4><p>逐章突破 · 点击即练</p>
                    </div>
                    <div class="big-mode-card" onclick="startTrain()">
                        <div class="icon">📚</div><h4>综合训练</h4><p>264题随机打乱</p>
                    </div>
                    <div class="big-mode-card" onclick="startMock()">
                        <div class="icon">📝</div><h4>模拟考试</h4><p>40单选+20多选</p>
                    </div>
                </div>

            </div>
            <div id="campus-line" class="campus-line">
                <strong>北洋校歌</strong>
                <span id="campus-line-text"></span>
            </div>
        </div>

        <!-- ====== 章节检测子页面 ====== -->
        <div id="page-chapters" class="page">
            <div class="return-bar">
                <button onclick="switchPage('prepare')">← 返回练习中心</button>
            </div>
            <h3 style="color:var(--tju-blue); margin-bottom:6px;">选择章节</h3>
            <p style="color:var(--t2); font-size:13px; margin-bottom:18px;">点击章节卡片直接开始练习该章节全部题目</p>
            <div class="chapter-grid" id="chapter-grid"></div>
        </div>

        <div id="page-quiz" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                <div id="tag-container"></div>
                <div id="q-meta-idx" style="color:var(--t2)"></div>
            </div>
            <div class="return-bar">
                <button onclick="confirmReturn()">← 返回练习中心</button>
                <span class="sep">|</span>
                <span style="font-size:13px; color:var(--t2);">进度已自动保存</span>
            </div>
            <div class="quiz-toolbar">
                <button class="btn-p btn-light" onclick="toggleProgressPanel()">作答情况</button>
                <div class="quiz-actions">
                    <button class="btn-p btn-soft" onclick="submitPaper()">提交试卷</button>
                    <button class="btn-p" onclick="nextQ()">下一题 (Enter)</button>
                </div>
            </div>
            <div id="progress-panel" class="progress-panel"></div>
            <div id="q-text" class="q-text"></div>
            <div id="opt-box" class="opt-grid"></div>
            <div style="text-align:center; margin:12px 0; display:none;" id="multi-confirm-area">
                <button class="btn-p" onclick="confirmMultiAnswer()" style="background:#10b981;">确认多选答案</button>
            </div>
            <div id="ana-area" style="display:none">
                <div class="ana-box" id="ana-cont"></div>
            </div>
        </div>

        <div id="page-result" class="page" style="text-align:center;">
            <h1 id="res-score" style="font-size:100px; color:var(--tju-blue); margin:20px 0;">0</h1>
            <p id="res-mode-info" style="color:var(--t2); margin-bottom:20px;"></p>
            <button class="btn-p" onclick="showSnap(null, true)">查看作答详情</button>
            <button class="btn-p" style="background:#64748b" onclick="goPrepare('normal')">返回练习中心</button>
        </div>

        <div id="page-snap" class="page">
            <div id="snap-list"></div>
            <div id="snap-footer" style="margin-top:30px; padding-bottom:50px; text-align:center;">
                <button class="btn-p" id="snap-back-btn" onclick="switchPage('history')">返回列表</button>
                <button class="btn-p" style="background:#64748b" onclick="goPrepare('normal')">返回中心</button>
            </div>
        </div>

        <div id="page-history" class="page">
            <div class="history-tools">
                <strong style="color:var(--tju-blue); font-size:16px;">历史成绩</strong>
                <button class="btn-p btn-light" id="score-chart-btn" style="display:none" onclick="toggleScoreChart()">成绩曲线</button>
            </div>
            <div class="filter-tabs" id="hist-filter-tabs">
                <button class="filter-tab on" onclick="filterHistory('all')">全部</button>
                <button class="filter-tab" onclick="filterHistory('chapter')">📖 章节检测</button>
                <button class="filter-tab" onclick="filterHistory('train')">📚 综合训练</button>
                <button class="filter-tab" onclick="filterHistory('mock')">📝 模拟考试</button>
            </div>
            <div id="score-chart" class="score-chart"></div>
            <div id="hist-list"></div>
        </div>

        <div id="page-wrong" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
                <div>
                    <strong style="color:var(--tju-blue); font-size:16px;">错题本</strong>
                    <span style="color:var(--t2); font-size:13px; margin-left:8px;" id="wrong-count-label"></span>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-p" onclick="startWrongQuiz()" id="btn-wrong-start" style="padding:10px 20px;">练习全部错题</button>
                    <button class="btn-p btn-light" onclick="clearAllWrongs()" style="padding:10px 20px;">清空错题本</button>
                </div>
            </div>
            <div id="w-content"></div>
        </div>
    </main>
</div>

<script>
// ====================== 题库动态加载 ======================
(function(){
    var p = new URLSearchParams(location.search);
    var bank = p.get('bank') || 'history-264';
    document.write('<script src="banks/' + bank + '.js"><\/script>');
})();
</script>
<script>

    // Auto-detect multi-choice support

    // Hide mock exam card if no multi-choice questions
    if (!hasMulti) {
        var mockCards = document.querySelectorAll('.big-mode-card');

<script>
// ====================== 应用逻辑 ======================
const DB = questionData.map((item, index) => {
    const id = parseInt(item.title.match(/\d+/)[0]);
    const chap = QUESTION_CHAPS[index] || "01_反对外国侵略的斗争";
    const cleanOptions = item.options.map(opt => opt.replace(/^[A-D]\.\s*/, '').trim());
    const isMulti = item.answer.length > 1;
    const correctIndices = item.answer.split('').map(ch => ch.charCodeAt(0) - 65);
    return {
        id: id,
        chap: chap,
        diff: 2,
        q: item.desc,
        code: item.code.trim() || "",
        a: cleanOptions,
        multi: isMulti,
        ca: correctIndices,
        c: correctIndices[0],
        p: item.analysis
    };
});
// ====================== 以下为原有逻辑（几乎不变，仅renderQ支持代码块） ======================
let user = "";
let rt = { idx: 0, pool: [], trace: [], answers: {}, selectedMode: "standard", isLocked: false, lastRec: null, _multiSel: null };

window.onkeydown = (e) => {
    if (e.key === "Enter" && document.getElementById("page-quiz").classList.contains("active")) {
        nextQ();
    }
};

function doLogin() {
    user = document.getElementById("user-input").value.trim();
    if(!user) return;
    document.getElementById("u-tag").innerText = "用户 " + user;
    document.getElementById("main-nav").style.display = "flex";
    initChapterCheckboxes();

}

// ========== Chapter selection ==========
let selectedChapters = [];

function initChapterCheckboxes() {
    // no-op: chapter selection is now done via chapter sub-page
}

function renderChapterTags() {
    const chapters = [...new Set(DB.map(q => q.chap))];
    const container = document.getElementById("chapter-tags");
    if (!container) return;
    container.innerHTML = chapters.map(ch => {
        const on = selectedChapters.includes(ch);
        const short = ch.length > 12 ? ch.substring(0,11)+'…' : ch;
        return '<span class="chapter-tag'+(on?' on':'')+'" onclick="toggleChapter(\''+ch.replace(/'/g,"\\'")+'\')" title="'+ch+'">'+short+'</span>';
    }).join("");
    updateChapterCount();
}

function toggleChapter(ch) {
    if (selectedChapters.includes(ch)) {
        selectedChapters = selectedChapters.filter(c => c !== ch);
    } else {
        selectedChapters.push(ch);
    }
    renderChapterTags();

}

function toggleAllChapters(selectAll) {
    const chapters = [...new Set(DB.map(q => q.chap))];
    if (selectAll) { selectedChapters = [...chapters]; }
    else { selectedChapters = chapters.filter(ch => !selectedChapters.includes(ch)); }
    renderChapterTags();

}

function updateChapterCount() {
    const pool = calculatePool();
    const el1 = document.getElementById("ch-selected-count");
    const el2 = document.getElementById("ch-selected-total");
    if (el1) el1.innerText = selectedChapters.length;
    if (el2) el2.innerText = pool.length;
}

function saveSession() {
    if (!user || rt.pool.length === 0) return;
    const session = {
        mode: rt.selectedMode,
        poolIds: rt.pool.map(q => q.id),
        idx: rt.idx,
        answers: rt.answers,
        sessionMode: rt._sessionMode || "",
        time: new Date().toLocaleString()
    };
    localStorage.setItem("SESSION_" + user, JSON.stringify(session));
}

function checkResumeBanner() {
    const banner = document.getElementById("resume-banner");
    if (!banner) return;
    const raw = localStorage.getItem("SESSION_" + user);
    if (!raw) { banner.style.display = "none"; return; }
    try {
        const s = JSON.parse(raw);
        if (s.poolIds && s.poolIds.length > 0) {
            const answered = s.answers ? Object.keys(s.answers).length : 0;
            const total = s.poolIds.length;
            banner.style.display = "flex";
            document.getElementById("resume-text").innerText =
                "上次作答到第 " + (answered+1) + " 题，共 " + total + " 题，已完成 " + answered + " 题";
        } else { banner.style.display = "none"; }
    } catch(e) { banner.style.display = "none"; }
}

function resumeSession() {
    const raw = localStorage.getItem("SESSION_" + user);
    if (!raw) return;
    const s = JSON.parse(raw);
    rt.selectedMode = s.mode || "standard";
    rt._sessionMode = s.sessionMode || "";
    rt.pool = s.poolIds.map(id => DB.find(q => q.id === id)).filter(Boolean);
    if (rt.pool.length === 0) { alert("上次记录已失效，请重新选择模式。"); clearSession(); return; }
    rt.idx = s.idx || 0;
    rt.answers = s.answers || {};
    rt.trace = [];
    rt._multiSel = null;
    var banner = document.getElementById("resume-banner"); if (banner) banner.style.display = "none";
    document.getElementById("progress-panel").style.display = "none";
    renderQ();
    switchPage("quiz");
}

function clearSession() {
    localStorage.removeItem("SESSION_" + user);
    const banner = document.getElementById("resume-banner");
    if (banner) banner.style.display = "none";
}

// ========== Mock exam mode ==========
function buildMockPool() {
    const chapters = [...new Set(DB.map(q => q.chap))];
    const singlePool = [];
    const multiPool = [];
    const hasMulti = DB.some(q => q.multi);

    // Count totals per chapter
    const chSingle = {}; const chMulti = {};
    chapters.forEach(ch => {
        chSingle[ch] = DB.filter(q => q.chap === ch && !q.multi).length;
        chMulti[ch] = DB.filter(q => q.chap === ch && q.multi).length;
    });
    const totalSingle = Object.values(chSingle).reduce((a,b)=>a+b,0);
    const totalMulti = Object.values(chMulti).reduce((a,b)=>a+b,0);

    // If no multi-choice, use 60 single-choice instead
    const targetSingle = hasMulti ? 40 : 60;
    const targetMulti = hasMulti ? 20 : 0;

    // Allocate single-choice proportionally, min 2 per chapter
    const allocS = {};
    chapters.forEach(ch => {
        allocS[ch] = Math.max(2, Math.round(targetSingle * chSingle[ch] / totalSingle));
    });
    // Adjust to sum to targetSingle
    let sumS = Object.values(allocS).reduce((a,b)=>a+b,0);
    while (sumS !== targetSingle) {
        const sortedCh = [...chapters].sort((a,b) => allocS[b] - allocS[a]);
        if (sumS > targetSingle) { allocS[sortedCh[0]]--; sumS--; }
        else { allocS[sortedCh[sortedCh.length-1]]++; sumS++; }
    }

    // Allocate multi-choice proportionally, min 1 per chapter
    const allocM = {};
    if (hasMulti) {
        chapters.forEach(ch => {
            allocM[ch] = Math.max(1, Math.round(targetMulti * chMulti[ch] / totalMulti));
        });
        let sumM = Object.values(allocM).reduce((a,b)=>a+b,0);
        while (sumM !== targetMulti) {
            const sortedCh = [...chapters].sort((a,b) => allocM[b] - allocM[a]);
            if (sumM > targetMulti) { allocM[sortedCh[0]]--; sumM--; }
            else { allocM[sortedCh[sortedCh.length-1]]++; sumM++; }
        }
    }

    // Select questions
    chapters.forEach(ch => {
        const chSingles = DB.filter(q => q.chap === ch && !q.multi);
        const chMultis = DB.filter(q => q.chap === ch && q.multi);
        const shuffledS = [...chSingles].sort(() => Math.random() - 0.5);
        singlePool.push(...shuffledS.slice(0, allocS[ch]));
        if (hasMulti) {
            const shuffledM = [...chMultis].sort(() => Math.random() - 0.5);
            multiPool.push(...shuffledM.slice(0, allocM[ch] || 0));
        }
    });

    // Combine: singles first, then multis, shuffle within each group
    const result = [
        ...singlePool.sort(() => Math.random() - 0.5),
        ...multiPool.sort(() => Math.random() - 0.5)
    ];
    return result;
}

function switchPage(pid) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("page-" + pid).classList.add("active");
    let nid = "nav-" + ((pid === "quiz" || pid === "prepare" || pid === "chapters") ? "prepare" : (pid === "snap" ? "history" : pid));
    if(document.getElementById(nid)) document.getElementById(nid).classList.add("active");
    if(pid === "history") renderHist();
    if(pid === "wrong") renderWrongs();
    if(pid === "chapters") initChaptersPage();
    if(pid === "prepare") { updatePrepView(); }
    window.scrollTo(0,0);
}

function initChaptersPage() {
    const chapters = [...new Set(DB.map(q => q.chap))];
    const grid = document.getElementById("chapter-grid");
    if (!grid) return;
    grid.innerHTML = "";
    chapters.forEach(ch => {
        const qs = DB.filter(q => q.chap === ch);
        const sCnt = qs.filter(q => !q.multi).length;
        const mCnt = qs.filter(q => q.multi).length;
        var typeInfo = mCnt > 0 ? '单选' + sCnt + ' + 多选' + mCnt : sCnt + ' 题';
        const card = document.createElement("div");
        card.className = "chapter-card";
        card.onclick = function(){ startChapter(ch); };
        card.innerHTML = '<div><div class=\"ch-name\">' + ch + '</div>'
            + '<div style=\"font-size:12px;color:var(--t2);margin-top:2px;\">' + typeInfo + '</div></div>'
            + '<div class=\"ch-count\">' + qs.length + ' 题</div>';
        grid.appendChild(card);
    });
}

function startChapter(ch) {
    rt.selectedMode = "standard";
    rt._sessionMode = "chapter";
    rt.pool = [...DB].filter(q => q.chap === ch);
    rt.idx = 0; rt.trace = []; rt.answers = {}; rt._multiSel = null;
    document.getElementById("progress-panel").style.display = "none";
    const banner = document.getElementById("resume-banner");
    if (banner) banner.style.display = "none";
    renderQ(); switchPage("quiz"); saveSession();
}

function startTrain() {
    rt.selectedMode = "random"; rt._sessionMode = "train";
    rt.pool = [...DB].sort(() => Math.random() - 0.5);
    rt.idx = 0; rt.trace = []; rt.answers = {}; rt._multiSel = null;
    document.getElementById("progress-panel").style.display = "none";
    const banner = document.getElementById("resume-banner");
    if (banner) banner.style.display = "none";
    renderQ(); switchPage("quiz"); saveSession();
}

function startMock() {
    rt.selectedMode = "mock"; rt._sessionMode = "mock";
    rt.pool = buildMockPool();
    rt.idx = 0; rt.trace = []; rt.answers = {}; rt._multiSel = null;
    document.getElementById("progress-panel").style.display = "none";
    const banner = document.getElementById("resume-banner");
    if (banner) banner.style.display = "none";
    renderQ(); switchPage("quiz"); saveSession();
}

function selectInitialMode(m) {
    if (m.startsWith("w_")) { rt.selectedMode = m; updatePrepView(); return; }
}

function updateCampusLine() {
    const el = document.getElementById("campus-line-text");
    if (!el) return;
    const line = SONG_LINES[Math.floor(Math.random() * SONG_LINES.length)];
    el.innerText = line;
}

function goPrepare(m) {
    if(m === "normal") {
        updateCampusLine();
        updatePrepView();
        switchPage("prepare");
    } else {
        rt.selectedMode = m;
        localStorage.removeItem("SESSION_" + user);
        realStart();
    }
}

// Confirm before returning to prepare (abandoning current quiz)
function confirmReturn() {
    const answered = Object.keys(rt.answers).length;
    const remaining = rt.pool.length - answered;
    if (remaining > 0 && answered > 0) {
        if (!confirm("已完成 " + answered + "/" + rt.pool.length + " 题，还有 " + remaining + " 题未作答。\n\n进度已保存，返回后可继续。")) return;
    } else if (remaining === rt.pool.length) {
        if (!confirm("尚未作答，确定返回吗？")) return;
    }
    saveSession();
    switchPage("prepare");
}

function updatePrepView() {
    checkResumeBanner();
}

function calculatePool() {
    let p = [...DB];
    if (rt.selectedMode && rt.selectedMode.startsWith("w_")) {
        let wData = JSON.parse(localStorage.getItem("W_DATA_" + user) || "{}");
        let wIds = Object.keys(wData).map(Number);
        p = DB.filter(q => wIds.includes(q.id));
    }
    return p;
}

function realStart() {
    // Legacy: redirect to appropriate start function
    if (rt.selectedMode && rt.selectedMode.startsWith("w_")) {
        rt.pool = calculatePool();
        if(rt.pool.length === 0) return alert("暂无可练题目。");
        rt._sessionMode = "train";
        rt.idx = 0; rt.trace = []; rt.answers = {}; rt._multiSel = null;
        document.getElementById("progress-panel").style.display = "none";
        renderQ(); switchPage("quiz");
    }
}

function getFullTrace() {
    return rt.pool.map(q => rt.answers[q.id] || { qid: q.id, u: (q.multi ? [] : -1), ok: false, skipped: true });
}

function getUnansweredCount() {
    return rt.pool.filter(q => !rt.answers[q.id]).length;
}

function toggleProgressPanel() {
    const panel = document.getElementById("progress-panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    renderProgressPanel();
}

function renderProgressPanel() {
    const panel = document.getElementById("progress-panel");
    const unanswered = getUnansweredCount();
    panel.innerHTML = `
        <div class="progress-head">
            <span>作答情况</span>
            <span>已答 ${rt.pool.length - unanswered} / ${rt.pool.length}，未答 ${unanswered}</span>
        </div>
        <div class="progress-grid">
            ${rt.pool.map((q, index) => {
                const a = rt.answers[q.id];
                let cls = "todo";
                if(index === rt.idx) cls = "current";
                else if(a && a.ok) cls = "done";
                else if(a && !a.ok) cls = "wrong";
                return `<button class="progress-item ${cls}" onclick="jumpToQuestion(${index})">${index + 1}</button>`;
            }).join("")}
        </div>
        <div style="margin-top:10px; color:var(--t2); font-size:13px;">点击题号可直接跳转，浅色按钮表示尚未作答。</div>
    `;
}

window.jumpToQuestion = (index) => {
    rt.idx = index;
    saveSession();
    renderQ();
};

function answerCurrent(i) {
    const q = rt.pool[rt.idx];
    if (rt.answers[q.id]) return;

    if (q.multi) {
        if (!rt._multiSel) rt._multiSel = [];
        const idx = rt._multiSel.indexOf(i);
        if (idx >= 0) rt._multiSel.splice(idx, 1);
        else rt._multiSel.push(i);
        renderQ();
        return;
    }

    const ok = (i === q.c);
    const traceItem = { ok, qid: q.id, u: i, skipped: false };
    rt.answers[q.id] = traceItem;

    if (!ok) saveWrong(traceItem);
    saveSession();
    renderQ();
}

function confirmMultiAnswer() {
    const q = rt.pool[rt.idx];
    if (!q.multi || rt.answers[q.id]) return;
    const sel = (rt._multiSel || []).slice().sort();
    const correct = q.ca.slice().sort();
    const ok = sel.length === correct.length && sel.every((v, i) => v === correct[i]);
    const traceItem = { ok, qid: q.id, u: sel, skipped: sel.length === 0 };
    rt.answers[q.id] = traceItem;
    if (!ok) saveWrong(traceItem);
    rt._multiSel = [];
    saveSession();
    renderQ();
}

function renderQ() {
    document.getElementById("ana-area").style.display = "none";
    document.getElementById("multi-confirm-area").style.display = "none";

    const q = rt.pool[rt.idx];
    const existing = rt.answers[q.id];
    rt.isLocked = !!existing;

    document.getElementById("tag-container").innerHTML = `<span class="tag-chapter">${CAT_MAP[q.chap] || q.chap}</span>`;
    document.getElementById("q-meta-idx").innerText = `${rt.idx + 1} / ${rt.pool.length}`;
    if (q.multi) {
        document.getElementById("q-meta-idx").innerText += ' [多选题]';
    }

    let qHTML = q.q;
    if (q.code) {
        qHTML += `<div class="code-box">${q.code}</div>`;
    }
    document.getElementById("q-text").innerHTML = qHTML;

    const box = document.getElementById("opt-box");
    box.innerHTML = "";
    q.a.forEach((t, i) => {
        const d = document.createElement("div");
        d.className = "opt";
        const isSelected = rt._multiSel && rt._multiSel.includes(i);
        if (isSelected && !existing) d.style.background = "#eef4ff";
        d.innerHTML = `<span class="opt-idx">${String.fromCharCode(65+i)}</span> ${t}`;
        d.onclick = () => answerCurrent(i);
        box.appendChild(d);
    });

    if (q.multi && !existing && rt._multiSel && rt._multiSel.length > 0) {
        document.getElementById("multi-confirm-area").style.display = "block";
    }

    if (existing) {
        const opts = document.querySelectorAll(".opt");
        if (q.multi) {
            q.ca.forEach(ci => { if(opts[ci]) opts[ci].classList.add("correct"); });
            if (!existing.ok && existing.u && Array.isArray(existing.u)) {
                existing.u.forEach(ui => { if(opts[ui]) opts[ui].classList.add("wrong"); });
            }
            const correctStr = q.ca.map(ci => String.fromCharCode(65+ci)).join('');
            document.getElementById("ana-cont").innerHTML = existing.ok
                ? `<b>回答正确</b><br>${q.p}`
                : `<b>正确答案：${correctStr}</b><br>${q.p}`;
        } else {
            opts[q.c].classList.add("correct");
            if (!existing.ok && typeof existing.u === 'number' && existing.u !== -1) {
                opts[existing.u].classList.add("wrong");
            }
            document.getElementById("ana-cont").innerHTML = existing.ok
                ? `<b>回答正确</b><br>${q.p}`
                : `<b>正确答案：${String.fromCharCode(65+q.c)}</b><br>${q.p}`;
        }
        document.getElementById("ana-area").style.display = "block";
    }

    renderProgressPanel();
}

function nextQ() {
    if (rt.idx < rt.pool.length - 1) {
        rt.idx++;
        renderQ();
    } else {
        submitPaper();
    }
}

function submitPaper() {
    const unanswered = getUnansweredCount();
    const msg = unanswered > 0
        ? `当前还有 ${unanswered} 题未作答，确认提前交卷吗？`
        : "已完成全部题目，确认提交试卷吗？";

    if (confirm(msg)) finish();
}

function finish() {
    const fullTrace = getFullTrace();
    const score = Math.round((fullTrace.filter(t => t.ok).length / rt.pool.length) * 100);
    document.getElementById("res-score").innerText = score;
    rt.lastRec = {
        time: new Date().toLocaleString(), score, trace: fullTrace,
        isWrongMode: rt.selectedMode && rt.selectedMode.startsWith("w_"),
        mode: rt._sessionMode || "train",
        sub: rt._sessionSub || "",
        total: rt.pool.length
    };
    if(!rt.lastRec.isWrongMode) {
        let h = JSON.parse(localStorage.getItem("H_" + user) || "[]");
        h.unshift(rt.lastRec);
        localStorage.setItem("H_" + user, JSON.stringify(h.slice(0,20)));
    }
    localStorage.removeItem("SESSION_" + user);
    const modeInfo = document.getElementById("res-mode-info");
    if (modeInfo) {
        const modeNames = {"chapter":"章节检测", "train":"综合训练", "mock":"模拟考试"};
        const rm = rt.lastRec.mode || "train";
        modeInfo.innerText = "模式：" + (modeNames[rm] || "") + " | 题数：" + rt.pool.length;
    }
    // 服务器模式：自动上报
    if (window.__ON_SERVER) {
        submitToServer(score, fullTrace);
    }
    switchPage("result");
}

function showSnap(rec = null, showFooter = false, fromPage = "history") {
    const data = rec || rt.lastRec;
    const list = document.getElementById("snap-list");
    list.innerHTML = `<h3 style="text-align:center; color:var(--tju-blue)">题目详情回顾</h3>`;
    data.trace.forEach((t) => {
        const q = DB.find(item => item.id === t.qid);
        const div = document.createElement("div");
        div.className = "snap-item";
        const statusText = t.skipped ? "未作答" : (t.ok ? "答对" : "答错");
        const statusColor = t.skipped ? "var(--t2)" : (t.ok ? "var(--ok)" : "var(--err)");
        div.innerHTML = `
            <div style="color:${statusColor}; font-weight:bold;">题目编号 #${q.id} - [${CAT_MAP[q.chap] || q.chap}] | ${statusText}</div>
            <div class="q-text" style="font-size:18px; margin:10px 0;">${q.q}</div>
            ${q.code ? `<div class="code-box">${q.code}</div>` : ""}
            <div class="opt-grid">
                ${q.a.map((opt, oi) => {
    let cls = '';
    if (q.multi) {
        if (q.ca.includes(oi)) cls += ' correct';
        if (t.u && Array.isArray(t.u) && t.u.includes(oi) && !t.ok && !t.skipped) cls += ' wrong';
    } else {
        if (oi === q.c) cls += ' correct';
        if (oi === t.u && !t.ok && !t.skipped) cls += ' wrong';
    }
    return `<div class="opt ${cls}" style="padding:10px; font-size:14px;"><span class="opt-idx" style="width:20px; height:20px;">${String.fromCharCode(65+oi)}</span> ${opt}</div>`;
}).join("")}
            </div>
            <div class="ana-box">${t.skipped ? "<b>本题未作答</b><br>" : ""}解析：${q.p}</div>
        `;
        list.appendChild(div);
    });
    document.getElementById("snap-back-btn").innerText = fromPage === "wrong" ? "返回错题列表" : "返回历史记录";
    document.getElementById("snap-back-btn").onclick = () => switchPage(fromPage);
    switchPage("snap");
}

function toggleScoreChart() {
    const panel = document.getElementById("score-chart");
    if (!panel) return;
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    if (panel.style.display === "block") renderScoreChart(null);
}

let histFilter = "all";
function filterHistory(f) {
    histFilter = f;
    document.querySelectorAll("#hist-filter-tabs .filter-tab").forEach(t => t.classList.remove("on"));
    document.querySelectorAll("#hist-filter-tabs .filter-tab").forEach(t => {
        if (t.textContent.includes(f === "all" ? "全部" : f === "chapter" ? "章节" : f === "train" ? "综合" : "模拟")) t.classList.add("on");
    });
    renderHist();
}

function renderHist() {
    const h = JSON.parse(localStorage.getItem('H_'+user) || '[]');
    const filtered = histFilter === "all" ? h : h.filter(item => (item.mode || "") === histFilter);
    const chartBtn = document.getElementById('score-chart-btn');
    const chart = document.getElementById('score-chart');
    if (chartBtn) chartBtn.style.display = filtered.length > 2 ? 'inline-block' : 'none';
    if (chart && filtered.length <= 2) chart.style.display = 'none';

    const modeNames = {"chapter":"章节检测", "train":"综合训练", "mock":"模拟考试"};
    document.getElementById('hist-list').innerHTML = filtered.map((item, i) => {
        const modeTag = item.mode ? (modeNames[item.mode] || item.mode) : "练习";
        let tagColor = item.mode === "chapter" ? "#004098" : item.mode === "train" ? "#7c3aed" : item.mode === "mock" ? "#f59e0b" : "#64748b";
        let subInfo = item.sub ? " · " + ({"standard":"标准顺序","random":"随机打乱","hard":"自定义数量"}[item.sub]||item.sub) : "";
        if (item.mode === "mock") subInfo = " · 40单选+20多选";
        return `<div class="item-card" onclick="viewHist(${h.indexOf(item)})">
            <b>${item.time}</b>
            <span style="float:right; color:var(--tju-blue); font-weight:bold;">${item.score}分</span>
            <div style="margin-top:4px;">
                <span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; background:${tagColor}15; color:${tagColor}; border:1px solid ${tagColor}40;">${modeTag}${subInfo}</span>
                <span style="font-size:12px; color:var(--t2); margin-left:6px;">${item.total||'?'}题</span>
            </div>
        </div>`;
    }).join('') || '<div style="text-align:center; padding:40px; color:var(--t2);">暂无此类记录</div>';
    if (chart && chart.style.display === 'block' && filtered.length > 2) renderScoreChart(filtered);
}

function renderScoreChart(filteredH) {
    const panel = document.getElementById("score-chart");
    const h = filteredH || JSON.parse(localStorage.getItem("H_" + user) || "[]");
    if (!panel) return;
    const filtered = histFilter === "all" ? h : h.filter(item => (item.mode || "") === histFilter);
    if (filtered.length <= 2) { panel.style.display = "none"; return; }

    const points = [...filtered].reverse();
    const width = 760, height = 260, left = 45, right = 20, top = 20, bottom = 40;
    const innerW = width - left - right, innerH = height - top - bottom;
    const step = points.length > 1 ? innerW / (points.length - 1) : innerW;

    const polyline = points.map((item, i) => {
        const x = left + step * i;
        const y = top + innerH - ((item.score || 0) / 100) * innerH;
        return `${x},${y}`;
    }).join(" ");

    const dots = points.map((item, i) => {
        const x = left + step * i;
        const y = top + innerH - ((item.score || 0) / 100) * innerH;
        return `<circle class="chart-dot" cx="${x}" cy="${y}" r="4"></circle><text class="chart-label" x="${x}" y="${y - 10}" text-anchor="middle">${item.score}</text><text class="chart-label" x="${x}" y="${height - 12}" text-anchor="middle">${i + 1}</text>`;
    }).join("");

    const yLabels = [0, 20, 40, 60, 80, 100].map(score => {
        const y = top + innerH - (score / 100) * innerH;
        return `<text class="chart-label" x="8" y="${y + 4}">${score}</text><line class="chart-axis" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>`;
    }).join("");

    panel.innerHTML = `
        <h3>成绩曲线 <small style="font-weight:400; color:var(--t2);">(${histFilter==='all'?'全部':histFilter==='chapter'?'章节检测':histFilter==='train'?'综合训练':'模拟考试'})</small></h3>
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            ${yLabels}
            <line class="chart-axis" x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}"></line>
            <polyline class="chart-line" points="${polyline}"></polyline>
            ${dots}
        </svg>
        <div style="margin-top:8px; color:var(--t2); font-size:13px;">横轴为测试次数，纵轴为分数。</div>
    `;
}

window.viewHist = (i) => {
    const h = JSON.parse(localStorage.getItem('H_'+user) || '[]');
    showSnap(h[i], true, 'history');
};

function renderWrongs() {
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    const ids = Object.keys(wData).map(Number).sort((a,b)=>a-b);

    const label = document.getElementById('wrong-count-label');
    const btn = document.getElementById('btn-wrong-start');
    if (label) label.innerText = ids.length + ' 道错题';
    if (btn) btn.style.display = ids.length > 0 ? '' : 'none';

    const groups = {};
    ids.forEach(id => {
        const q = DB.find(item => item.id === id);
        if (!q) return;
        const ch = q.chap || '其他';
        if(!groups[ch]) groups[ch] = [];
        groups[ch].push(q);
    });

    const container = document.getElementById('w-content');
    container.innerHTML = '';

    if(ids.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--t2);"><div style="font-size:48px; margin-bottom:12px;">🎉</div><p style="font-size:16px;">错题本为空</p><p style="font-size:13px;">继续刷题，做错的题目会自动收录</p></div>';
        return;
    }

    for(const [ch, items] of Object.entries(groups)) {
        const section = document.createElement('div');
        section.innerHTML = '<div class="category-header"><span>' + ch + '</span><span style="font-size:12px;opacity:0.7">' + items.length + ' 题</span></div>';
        items.forEach(q => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => toggleWrongDetail(q.id, card);
            const isMulti = q.multi ? ' [多选]' : '';
            card.innerHTML = '<span class="del-btn" onclick="removeWrong(' + q.id + ', event)" title="移出错题本">✕</span><b>#' + q.id + '</b>' + isMulti + ' ' + q.q;
            section.appendChild(card);
        });
        container.appendChild(section);
    }
}

let _wrongExpanded = null;

function toggleWrongDetail(qid, cardEl) {
    if (_wrongExpanded === qid) {
        // Collapse
        const detail = cardEl.querySelector('.wrong-detail');
        if (detail) detail.remove();
        _wrongExpanded = null;
        return;
    }
    // Collapse previous
    if (_wrongExpanded) {
        const prev = document.querySelector('.wrong-detail');
        if (prev) prev.remove();
    }
    _wrongExpanded = qid;

    const q = DB.find(item => item.id === qid);
    if (!q) return;
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    const rec = wData[qid];

    let optsHTML = q.a.map((opt, i) => {
        let cls = '';
        if (q.multi) {
            if (q.ca.includes(i)) cls += ' correct';
            if (rec && rec.u && Array.isArray(rec.u) && rec.u.includes(i) && !rec.ok) cls += ' wrong';
        } else {
            if (i === q.c) cls += ' correct';
            if (rec && rec.u === i && !rec.ok) cls += ' wrong';
        }
        return '<div class="opt' + cls + '" style="padding:8px 14px; font-size:13px; border-radius:8px; margin-bottom:4px; border:1px solid #e2e8f0;"><span class="opt-idx" style="width:22px;height:22px;font-size:11px;">' + String.fromCharCode(65+i) + '</span> ' + opt + '</div>';
    }).join('');

    const statusText = rec && rec.ok ? '<span style="color:var(--ok);">✓ 上次答对</span>' : (rec ? '<span style="color:var(--err);">✗ 上次答错</span>' : '');

    const detail = document.createElement('div');
    detail.className = 'wrong-detail';
    detail.style.cssText = 'margin-top:12px; padding:14px; background:#f8fafc; border-radius:10px; border-left:4px solid var(--tju-blue);';
    detail.innerHTML = '<div style="margin-bottom:8px;">' + statusText + '</div>'
        + optsHTML
        + '<div class="ana-box" style="margin-top:10px; padding:12px; font-size:13px;">解析：' + q.p + '</div>';
    cardEl.appendChild(detail);
}

function startWrongQuiz() {
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    const ids = Object.keys(wData).map(Number);
    if (ids.length === 0) return alert('没有错题可练！');
    rt.selectedMode = 'wrong';
    rt._sessionMode = 'train';
    rt._sessionSub = 'wrong';
    rt.pool = ids.map(id => DB.find(q => q.id === id)).filter(Boolean);
    rt.pool.sort(() => Math.random() - 0.5);
    rt.idx = 0; rt.trace = []; rt.answers = {}; rt._multiSel = null;
    document.getElementById('progress-panel').style.display = 'none';
    renderQ(); switchPage('quiz');
}

function clearAllWrongs() {
    const wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    const count = Object.keys(wData).length;
    if (count === 0) return;
    if (!confirm('确定要清空全部 ' + count + ' 道错题吗？此操作不可撤销。')) return;
    localStorage.removeItem('W_DATA_'+user);
    renderWrongs();
}

function removeWrong(id, e) {
    e.stopPropagation();
    let wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    delete wData[id];
    localStorage.setItem('W_DATA_'+user, JSON.stringify(wData));
    if (_wrongExpanded === id) _wrongExpanded = null;
    renderWrongs();
}

function saveWrong(traceItem) {
    let wData = JSON.parse(localStorage.getItem('W_DATA_'+user) || '{}');
    wData[traceItem.qid] = traceItem;
    localStorage.setItem('W_DATA_'+user, JSON.stringify(wData));
}

// ====================== 服务器上报 ======================
function submitToServer(score, fullTrace) {
    var subject = (typeof QUIZ_META !== 'undefined' && QUIZ_META.subject) || '未知科目';
    var mode = rt._sessionMode || 'train';

    var wrongs = [];
    fullTrace.forEach(function(t) {
        if (!t.ok && !t.skipped) {
            var q = DB.find(function(item) { return item.id === t.qid; });
            if (q) {
                wrongs.push({
                    qid: t.qid,
                    qtext: q.q,
                    chapter: q.chap || '',
                    answer: q.multi ? q.ca.map(function(ci) { return String.fromCharCode(65+ci); }).join('') : String.fromCharCode(65+q.c)
                });
            }
        }
    });

    var payload = {
        username: user,
        subject: subject,
        score: score,
        total: rt.pool.length,
        mode: mode,
        wrongs: wrongs
    };

    try {
        fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(res) {
            return res.json();
        }).then(function(data) {
            if (data.success) {
                var modeInfo = document.getElementById('res-mode-info');
                if (modeInfo) {
                    modeInfo.innerText += ' | 数据已同步至全服统计';
                }
            }
        }).catch(function() { /* 静默失败，不影响本地功能 */ });
    } catch(e) { /* 静默失败 */ }
}
