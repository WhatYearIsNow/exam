<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>统计看板 - TJU-Quiz-Hub</title>
<style>
:root { --tju-blue: #004098; --bg: #f4f7f9; --ok: #10b981; --err: #f43f5e; --t1: #1e293b; --t2: #64748b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang SC', sans-serif; background: var(--bg); min-height: 100vh; color: var(--t1); }
header { background: var(--tju-blue); color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
header a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.85; }
header a:hover { opacity: 1; }
.container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
.card { background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
.card .num { font-size: 36px; font-weight: 800; color: var(--tju-blue); }
.card .lbl { font-size: 13px; color: var(--t2); margin-top: 4px; }
.section { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.section h2 { color: var(--tju-blue); font-size: 18px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #f1f5f9; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f5f9; }
th { color: var(--t2); font-weight: 600; font-size: 12px; text-transform: uppercase; }
tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-a { background: #ecfdf5; color: #059669; }
.badge-b { background: #eff6ff; color: #2563eb; }
.badge-c { background: #fefce8; color: #ca8a04; }
.badge-d { background: #fff7ed; color: #c2410c; }
.badge-f { background: #fff1f2; color: #e11d48; }
.bar-wrap { background: #f1f5f9; border-radius: 8px; overflow: hidden; height: 24px; margin: 4px 0; }
.bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 600; color: #fff; }
.loading { text-align: center; padding: 60px; color: var(--t2); }
.error { text-align: center; padding: 60px; color: var(--err); }
.empty { text-align: center; padding: 60px; color: var(--t2); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.chapter-bar { margin-bottom: 12px; }
.chapter-bar .label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
@media (max-width: 600px) { .cards { grid-template-columns: 1fr 1fr; } header { padding: 15px 20px; } }
</style>
</head>
<body>

<header>
    <div><strong style="font-size:18px;">TJU-Quiz-Hub</strong> <span style="opacity:0.7;">统计看板</span></div>
    <div>
        <a href="/">← 返回刷题</a>
        &nbsp;&nbsp;
        <select id="subject-filter" onchange="loadStats()" style="padding:6px 10px;border-radius:6px;border:none;font-size:14px;">
            <option value="">全部科目</option>
        </select>
        <button onclick="loadStats()" style="margin-left:8px;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-size:13px;">刷新</button>
    </div>
</header>

<div class="container">
    <div id="content"><div class="loading">加载中...</div></div>
</div>

<script>
const API = "/api/stats";

async function loadStats() {
    const content = document.getElementById("content");
    content.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const subject = document.getElementById("subject-filter").value;
        const url = subject ? API + "?subject=" + encodeURIComponent(subject) : API;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        render(data);
    } catch (e) {
        content.innerHTML = '<div class="error">无法连接到服务器<br><small>' + e.message + '</small></div>';
    }
}

function render(data) {
    const { overview, chapter_stats, top_wrongs, recent, distribution } = data;

    if (!overview.total_attempts) {
        document.getElementById("content").innerHTML =
            '<div class="empty"><div class="icon">📊</div><p style="font-size:16px;">暂无数据</p><p style="font-size:13px;color:var(--t2);">学生开始刷题并提交后，统计数据将显示在这里。</p></div>';
        return;
    }

    const distTotal = (distribution.a||0)+(distribution.b||0)+(distribution.c||0)+(distribution.d||0)+(distribution.f||0) || 1;

    let html = "";

    // 总览卡片
    html += '<div class="cards">' +
        '<div class="card"><div class="num">' + overview.total_attempts + '</div><div class="lbl">总提交次数</div></div>' +
        '<div class="card"><div class="num">' + overview.avg_score + '</div><div class="lbl">平均分</div></div>' +
        '<div class="card"><div class="num">' + overview.best_score + '</div><div class="lbl">最高分</div></div>' +
        '<div class="card"><div class="num">' + overview.users + '</div><div class="lbl">参与人数</div></div>' +
        '</div>';

    // 成绩分布
    html += '<div class="section"><h2>成绩分布</h2>';
    [
        { k: "a", label: "90-100", cls: "badge-a", color: "#10b981" },
        { k: "b", label: "80-89", cls: "badge-b", color: "#3b82f6" },
        { k: "c", label: "70-79", cls: "badge-c", color: "#eab308" },
        { k: "d", label: "60-69", cls: "badge-d", color: "#f97316" },
        { k: "f", label: "<60", cls: "badge-f", color: "#ef4444" },
    ].forEach(g => {
        const val = distribution[g.k] || 0;
        const pct = Math.round(val / distTotal * 100);
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
            '<span class="badge ' + g.cls + '" style="width:60px;text-align:center;">' + g.label + '</span>' +
            '<div class="bar-wrap" style="flex:1;"><div class="bar-fill" style="width:' + pct + '%;background:' + g.color + ';">' + (pct > 8 ? val + '人 (' + pct + '%)' : '') + '</div></div>' +
            (pct <= 8 ? '<span style="font-size:12px;color:var(--t2);">' + val + '人 (' + pct + '%)</span>' : '') +
            '</div>';
    });
    html += '</div>';

    // 章节难度排行（按错题数）
    if (chapter_stats.length) {
        const maxCnt = Math.max(...chapter_stats.map(c => c.wrong_count));
        html += '<div class="section"><h2>章节难度排行（错题越多越需加强）</h2>';
        chapter_stats.forEach(c => {
            const pct = Math.round(c.wrong_count / maxCnt * 100);
            html += '<div class="chapter-bar"><div class="label"><span>' + (c.chapter || "未分类") + '</span><span style="color:var(--t2);">' + c.wrong_count + ' 次错误 · ' + c.unique_wrongs + ' 道不同题</span></div>' +
                '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%;background:var(--tju-blue);"></div></div></div>';
        });
        html += '</div>';
    }

    // 高频错题
    if (top_wrongs.length) {
        html += '<div class="section"><h2>全服高频错题 Top ' + top_wrongs.length + '（大家踩过的坑）</h2>';
        html += '<table><thead><tr><th>#</th><th>题目</th><th>章节</th><th>答案</th><th>错误次数</th></tr></thead><tbody>';
        top_wrongs.forEach((w, i) => {
            html += '<tr><td style="color:var(--err);font-weight:700;">' + (i + 1) + '</td>' +
                '<td>' + (w.question_text.length > 60 ? w.question_text.substring(0, 57) + '...' : w.question_text) + '</td>' +
                '<td><span class="badge" style="background:#eff6ff;color:var(--tju-blue);">' + (w.chapter || "-") + '</span></td>' +
                '<td style="font-weight:600;">' + (w.correct_answer || "-") + '</td>' +
                '<td style="color:var(--err);font-weight:700;">' + w.cnt + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    // 最近提交
    if (recent.length) {
        html += '<div class="section"><h2>最近提交</h2>';
        html += '<table><thead><tr><th>时间</th><th>用户</th><th>科目</th><th>成绩</th><th>模式</th></tr></thead><tbody>';
        const modeNames = { chapter: "章节检测", train: "综合训练", mock: "模拟考试" };
        recent.forEach(r => {
            const scoreColor = r.score >= 80 ? "var(--ok)" : r.score >= 60 ? "#eab308" : "var(--err)";
            html += '<tr><td style="color:var(--t2);font-size:12px;">' + r.created_at + '</td>' +
                '<td>' + r.username + '</td><td>' + r.subject + '</td>' +
                '<td style="color:' + scoreColor + ';font-weight:700;">' + r.score + ' / ' + r.total + '</td>' +
                '<td>' + (modeNames[r.mode] || r.mode) + '</td></tr>';
        });
        html += '</tbody></table></div>';
    }

    document.getElementById("content").innerHTML = html;
}

// 初始化：加载科目列表
async function init() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        const subjects = [...new Set((data.recent || []).map(r => r.subject))];
        // 加上默认科目
        ["中国近现代史纲要", "计算机软件技术基础"].forEach(s => {
            if (!subjects.includes(s)) subjects.push(s);
        });
        const sel = document.getElementById("subject-filter");
        subjects.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s; opt.textContent = s;
            sel.appendChild(opt);
        });
    } catch (e) { /* ignore */ }
    loadStats();
}

init();
</script>
</body>
</html>
