# physics-quiz-sync 云同步 Worker 配置
# 部署步骤见同目录 README.md

name = "physics-quiz-sync"
main = "worker.js"
compatibility_date = "2025-08-01"

# 首次 `wrangler deploy` 时若未填 id，wrangler 会自动创建并回填
[[kv_namespaces]]
binding = "QUIZ_SYNC"
# id = "创建后填入，或删除本行让 wrangler 自动创建"

# 密钥用 `npx wrangler secret put SYNC_TOKEN` 设置，不写在文件里
