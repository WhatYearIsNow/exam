name: 错误报告
description: 报告可以稳定复现的功能或显示问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞或包含个人敏感信息的问题，请按[安全政策](https://github.com/WhatYearIsNow/TJU-Quiz-Hub/security/policy)私密报告。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请简洁说明发生了什么。
      placeholder: 在……时出现……
    validations:
      required: true

  - type: dropdown
    id: usage
    attributes:
      label: 使用方式
      options:
        - 直接打开 index.html
        - 使用 npm run dev
        - 使用 Flask 参考服务器
        - 访问已部署的网站
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出能够稳定复现问题的最少步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 预期应该……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际却……
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 请填写操作系统、浏览器及版本；本地开发时也请填写 Node.js 版本。
      placeholder: Windows 11，Edge 130，Node.js 22.13.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可粘贴日志、截图或其他线索，请先移除个人敏感信息。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同报告。
          required: true
        - label: 此报告不包含安全漏洞或个人敏感信息。
          required: true
