name: 功能建议
description: 提议新功能或改进现有体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请说明当前遇到的问题，以及谁会从改进中受益。
      placeholder: 当……时，目前很难……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的行为，必要时附上示例。
      placeholder: 希望可以……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 刷题界面与交互
        - 题库格式与内容
        - 成绩统计与服务器模式
        - 构建与部署
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如已尝试其他做法，请简要说明。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附上草图、截图、相关链接或其他背景。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 我已说明实际使用场景，而不只是提出实现方式。
          required: true
