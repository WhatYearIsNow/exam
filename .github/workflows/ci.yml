name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test server and frontend configuration
        run: python3 -m unittest discover -s tests -v
      - name: Check frontend payloads and question counts
        run: |
          python3 tools/build_frontend.py
          git diff --exit-code -- web/index.html web/exam/index.html
      - name: Check Android command-line helpers
        run: |
          python3 android/build.py --help
          python3 android/sign.py --help
      - name: Validate and export webpage question banks
        run: python3 tools/extract_bank.py --out "$RUNNER_TEMP/exam-bank-data"
