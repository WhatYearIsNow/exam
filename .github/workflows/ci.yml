name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test server and frontend configuration
        run: python3 -m unittest discover -s tests -v
      - name: Inspect question banks
        run: |
          python3 tools/make_book.py --subject marx --inspect
          python3 tools/make_book.py --subject physics --inspect
          python3 tools/make_book.py --subject probability --inspect
      - name: Build offline distribution
        run: python3 tools/package_offline.py
