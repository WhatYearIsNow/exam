<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#002a55">
  <title>I Love TJU</title>
  <script src="/config.local.js"></script>
  <style>

    :root {
      color-scheme: light;
      --shell-blue: #003f7d;
      --shell-blue-deep: #002a55;
      --shell-blue-bright: #075fa9;
      --shell-gold: #ffc800;
      --bar-height: 78px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background: #eef3f8;
      color: #172033;
    }
    button { font: inherit; }
    .topbar {
      position: relative;
      z-index: 10;
      height: var(--bar-height);
      padding: 10px max(18px, env(safe-area-inset-right)) 10px max(18px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 22px;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 74% -120%, rgba(255,255,255,.22), transparent 42%),
        linear-gradient(115deg, var(--shell-blue-deep), var(--shell-blue) 55%, var(--shell-blue-bright));
      box-shadow: 0 8px 28px rgba(0, 42, 85, .2);
    }
    .topbar::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      right: -80px;
      top: -196px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;
      box-shadow: 0 0 0 28px rgba(255,255,255,.04), 0 0 0 62px rgba(255,255,255,.025);
      pointer-events: none;
    }
    .topbar::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 3%, var(--shell-gold) 28%, #ffe784 50%, var(--shell-gold) 72%, transparent 97%);
      opacity: .95;
    }
    .brand {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 170px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 13px;
      color: var(--shell-blue-deep);
      background: linear-gradient(145deg, #ffe780, var(--shell-gold));
      box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.72);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -.04em;
    }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-copy strong { font-size: 17px; letter-spacing: .05em; }
    .brand-copy small { margin-top: 4px; color: rgba(232,244,255,.72); font-size: 10px; letter-spacing: .14em; }
    .tabs {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      justify-content: center;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .subject-tab {
      flex: 0 1 154px;
      min-width: 122px;
      height: 54px;
      padding: 7px 14px 7px 9px;
      display: grid;
      grid-template-columns: 36px 1fr;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 16px;
      color: #edf7ff;
      background: rgba(255,255,255,.09);
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .subject-tab:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
    .subject-tab:active { transform: scale(.98); }
    .subject-tab:focus-visible { outline: 3px solid rgba(255,200,0,.48); outline-offset: 2px; }
    .tab-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: rgba(255,255,255,.13);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 800;
      transition: color .18s ease, background .18s ease;
    }
    .tab-copy { min-width: 0; display: flex; flex-direction: column; }
    .tab-title { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .tab-meta { margin-top: 2px; color: rgba(231,244,255,.68); font-size: 10px; white-space: nowrap; }
    .subject-tab[aria-selected="true"] {
      color: var(--shell-blue-deep);
      background: #fff;
      border-color: rgba(255,255,255,.9);
      box-shadow: 0 9px 24px rgba(0,24,55,.2), inset 0 -3px var(--shell-gold);
      transform: translateY(-1px);
    }
    .subject-tab[aria-selected="true"] .tab-icon { color: var(--shell-blue-deep); background: var(--shell-gold); }
    .subject-tab[aria-selected="true"] .tab-meta { color: #66758a; }
    .offline-badge {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: rgba(239,248,255,.8);
      background: rgba(0,24,52,.18);
      font-size: 11px;
      white-space: nowrap;
    }
    .offline-badge::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #65d796; box-shadow: 0 0 0 3px rgba(101,215,150,.14); }
    .workspace {
      position: relative;
      height: calc(100vh - var(--bar-height));
      height: calc(100dvh - var(--bar-height));
      isolation: isolate;
      background: #f3f6fa;
    }
    .subject-frame { display: none; width: 100%; height: 100%; border: 0; background: #f4f7fb; }
    .subject-frame.is-active { display: block; animation: frame-in .22s ease-out both; }
    .loading-screen {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f7f9fc, #edf3f8);
    }
    .loading-screen[hidden] { display: none; }
    .loader-card {
      min-width: 190px;
      padding: 22px 26px;
      border: 1px solid #dce6f0;
      border-radius: 18px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 38px rgba(17,52,88,.12);
      text-align: center;
      color: #41536a;
      font-size: 13px;
    }
    .loader-ring {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #dbe8f4;
      border-top-color: var(--shell-blue);
      border-right-color: var(--shell-gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .loader-ring[hidden] { display: none; }
    .loader-retry {
      margin-top: 14px;
      padding: 8px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--shell-blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .loader-retry[hidden] { display: none; }
    @keyframes frame-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 820px) {
      :root { --bar-height: 70px; }
      .topbar { gap: 12px; padding-left: 12px; padding-right: 12px; }
      .brand { min-width: auto; }
      .brand-copy small, .offline-badge { display: none; }
      .subject-tab { min-width: 100px; height: 50px; grid-template-columns: 32px 1fr; padding: 6px 10px 6px 7px; }
      .tab-icon { width: 32px; height: 32px; border-radius: 10px; }
    }
    @media (max-width: 560px) {
      :root { --bar-height: 64px; }
      .topbar { gap: 8px; padding: 7px 8px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 12px; font-size: 14px; }
      .brand-copy { display: none; }
      .tabs { justify-content: flex-start; gap: 6px; }
      .subject-tab { flex: 1 0 76px; min-width: 76px; height: 48px; display: flex; justify-content: center; gap: 7px; padding: 6px 8px; border-radius: 13px; }
      .tab-icon { width: 29px; height: 29px; flex: 0 0 auto; font-size: 13px; }
      .tab-title { font-size: 13px; }
      .tab-meta { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
<style id="practical-mobile-shell-v1">

:root { --collapsed-bar-height:42px; }
.topbar { padding-right:max(58px,env(safe-area-inset-right)); transition:height .2s ease,padding .2s ease; }
.nav-toggle {
  position:absolute;
  z-index:12;
  right:max(12px,env(safe-area-inset-right));
  bottom:50%;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  padding:0;
  transform:translateY(50%);
  border:1px solid rgba(255,255,255,.28);
  border-radius:11px;
  color:#fff;
  background:rgba(255,255,255,.1);
  cursor:pointer;
  transition:background .16s ease,transform .16s ease;
}
.nav-toggle:hover { background:rgba(255,255,255,.19); }
.nav-toggle:focus-visible { outline:3px solid rgba(255,200,0,.48); outline-offset:2px; }
.nav-toggle-icon {
  width:9px;
  height:9px;
  border-top:2px solid currentColor;
  border-left:2px solid currentColor;
  transform:translateY(2px) rotate(45deg);
  transition:transform .2s ease;
}
.topbar.is-collapsed {
  height:var(--collapsed-bar-height);
  min-height:var(--collapsed-bar-height);
  padding-top:3px;
  padding-bottom:3px;
  box-shadow:0 4px 14px rgba(0,42,85,.18);
}
.topbar.is-collapsed::before,.topbar.is-collapsed .brand,.topbar.is-collapsed .offline-badge { display:none; }
.topbar.is-collapsed .tabs { justify-content:center; margin-right:34px; overflow:hidden; }
.topbar.is-collapsed .subject-tab { display:none; }
.topbar.is-collapsed .subject-tab[aria-selected="true"] {
  width:auto;
  min-width:0;
  height:34px;
  display:flex;
  flex:0 0 auto;
  justify-content:center;
  gap:7px;
  padding:3px 10px;
  border-color:transparent;
  border-radius:10px;
  color:#fff;
  background:transparent;
  box-shadow:none;
  transform:none;
}
.topbar.is-collapsed .subject-tab[aria-selected="true"] .tab-icon {
  width:27px;
  height:27px;
  color:var(--shell-blue-deep);
  background:var(--shell-gold);
  border-radius:8px;
  font-size:12px;
}
.topbar.is-collapsed .tab-title { color:#fff; font-size:14px; }
.topbar.is-collapsed .tab-meta { display:none; }
.topbar.is-collapsed .nav-toggle-icon { transform:translateY(-2px) rotate(225deg); }
.topbar.is-collapsed + .workspace {
  height:calc(100vh - var(--collapsed-bar-height));
  height:calc(100dvh - var(--collapsed-bar-height));
}
@media (max-width:560px) {
  .topbar { padding-right:max(48px,env(safe-area-inset-right)); }
  .nav-toggle { right:max(8px,env(safe-area-inset-right)); width:32px; height:32px; border-radius:10px; }
  .topbar.is-collapsed .tabs { margin-right:28px; }
}
</style>

<body>
  <header class="topbar">
    <div class="brand" aria-label="天津大学三合一刷题中心">
      <span class="brand-mark" aria-hidden="true">TJU</span>
      <span class="brand-copy"><strong>三合一刷题</strong><small>STUDY CENTER</small></span>
    </div>
    <nav class="tabs" aria-label="学科切换">
      <button class="subject-tab" type="button" data-page="marx" aria-controls="frame-marx">
        <span class="tab-icon" aria-hidden="true">M</span><span class="tab-copy"><span class="tab-title">马原</span><span class="tab-meta">438 道题</span></span>
      </button>
      <button class="subject-tab" type="button" data-page="probability" aria-controls="frame-probability">
        <span class="tab-icon" aria-hidden="true">P</span><span class="tab-copy"><span class="tab-title">概率论</span><span class="tab-meta">424 道题</span></span>
      </button>
      <button class="subject-tab" type="button" data-page="physics" aria-controls="frame-physics">
        <span class="tab-icon" aria-hidden="true">Φ</span><span class="tab-copy"><span class="tab-title">大物</span><span class="tab-meta">264 道题</span></span>
      </button>
      <button class="subject-tab" type="button" data-page="shezhi" aria-controls="frame-shezhi">
        <span class="tab-icon" aria-hidden="true">设</span><span class="tab-copy"><span class="tab-title">设制</span><span class="tab-meta">255 道题</span></span>
      </button>
      <button class="subject-tab" type="button" data-page="gongtu" aria-controls="frame-gongtu">
        <span class="tab-icon" aria-hidden="true">图</span><span class="tab-copy"><span class="tab-title">工图</span><span class="tab-meta">93 道题</span></span>
      </button>
      <button class="subject-tab" type="button" data-page="yingyu" aria-controls="frame-yingyu">
        <span class="tab-icon" aria-hidden="true">英</span><span class="tab-copy"><span class="tab-title">英语</span><span class="tab-meta">179 道题</span></span>
      </button>
    </nav>
    <div class="offline-badge">离线题库</div>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="true" aria-label="收起学科导航" title="展开或收起学科导航"><span class="nav-toggle-icon" aria-hidden="true"></span></button>
  </header>
  <main class="workspace" aria-busy="false">
    <div class="loading-screen" id="loading-screen" aria-live="polite">
      <div class="loader-card">
        <div class="loader-ring" id="loader-ring" aria-hidden="true"></div>
        <div id="loader-message">正在载入题库…</div>
        <button class="loader-retry" id="loader-retry" type="button" hidden>重新加载</button>
      </div>
    </div>
    <iframe id="frame-marx" class="subject-frame" title="马原刷题" allow="clipboard-read; clipboard-write"></iframe>

      var sec = selS.value === '-1' ? null : selS.value;
      mdText = tjuBuildStudyMd(c.label, sec, c.secs);
      var ta = box.querySelector('.tju-export-ta');
      ta.value = mdText;
      ta.style.display = 'block';
      var acts = box.querySelectorAll('.tju-note-acts');
      acts[acts.length - 1].style.display = 'flex';
      try { toast('已生成 ' + mdText.length + ' 字'); } catch (e) {}
    });
    box.querySelector('.tju-export-copy').addEventListener('click', function () {
      var ta = box.querySelector('.tju-export-ta');
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      try { toast(ok ? '已复制全文，可直接粘贴给 AI' : '复制失败，请长按文本手动选择复制'); } catch (e) {}
    });
    box.querySelector('.tju-export-dl').addEventListener('click', function () {
      if (!mdText) return;
      var fname = '学情报告-' + (({physics:'大学物理',marx:'马原',probability:'概率论',shezhi:'设制',gongtu:'工图',yingyu:'英语'})[SUBJ]||'刷题') +
        '-' + (selC.options[selC.selectedIndex].text) + (selS.value === '-1' ? '' : '-' + selS.value) +
        '-' + new Date().toISOString().slice(0, 10) + '.md';
      if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
        window.AndroidBridge.saveFile(fname, mdText);
        try { toast('已保存到手机下载目录'); } catch (e) {}
      } else {
        var blob = new Blob([mdText], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      }
    });
  } catch (e) { try { toast('导出失败：' + e.message); } catch (e2) {} }
};

window.tjuBuildStudyMd = function (chapterLabel, section, secOrder) {
  var qs = DATA.questions.filter(function (q) {
    return ((q.chapter && q.chapter.label) || '未分章') === chapterLabel &&
           (section === null || ((q.chapter && q.chapter.section) || '未分节') === section);
  });
  var viaName = { chapter: '章节练习', paper: '真题练习', wrong: '错题重做' };
  var stat = { total: qs.length, answered: 0, right: 0, wrong: 0, cleared: 0, aiChecked: 0, flagged: 0 };
  var wrongList = [];
  var fmtT = function (t) { try { return t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : ''; } catch (e) { return ''; } };
  var verdictText = function (c) { return c === true ? '页面答案正确' : c === false ? '页面答案有误' : '无法确定'; };

  function aiBlock(v, tag) {
    var L = [];
    var conf = (typeof v.confidence === 'number') ? '，置信度 ' + Math.round(v.confidence * 100) + '%' : '';
    L.push('- ' + tag + '：**' + verdictText(v.correct) + '**（第 ' + (v.stage || 1) + ' 轮 · ' + (v.model || '?') + conf + '）');
    if (v.correctAnswer) L.push('  - AI 认为正确答案：' + v.correctAnswer);
    if (v.doubt) L.push('  - 我的质疑：' + v.doubt);
    if (v.reason) L.push('  - AI 推理全文：' + String(v.reason).replace(/\n/g, '\n  > '));
    if (v.checkedAt) L.push('  - 核验时间：' + fmtT(v.checkedAt));
    return L;
  }

  var bySec = {};
  qs.forEach(function (q) {
    var sl = (q.chapter && q.chapter.section) || '未分节';
    (bySec[sl] = bySec[sl] || []).push(q);
  });
  var order = (secOrder || []).filter(function (s) { return bySec[s]; });
  Object.keys(bySec).forEach(function (s) { if (order.indexOf(s) < 0) order.push(s); });

  var L = [];
  var subjName = ({physics:'大学物理',marx:'马原',probability:'概率论',shezhi:'设制',gongtu:'工图',yingyu:'英语'})[SUBJ]||'刷题';
  qs.forEach(function (q) {
    var r = records[q.id];
    if (r && r.cleared) { stat.cleared++; return; }
    if (r && (r.my !== undefined || r.ok !== undefined)) {
      stat.answered++;
      if (r.ok === true) stat.right++; else if (r.ok === false) { stat.wrong++; wrongList.push((q.chapter.section || '') + ' 第' + (q.num || '?') + '题'); }
    }
    if (annot.ai[q.id] && annot.ai[q.id].v) stat.aiChecked++;
    if (annot.flags[q.id] && annot.flags[q.id].v) stat.flagged++;
  });

  L.push('# 学情报告 · ' + subjName + ' · ' + chapterLabel + (section ? ' · ' + section : '（整章）'));
  L.push('');
  L.push('> 生成时间：' + new Date().toLocaleString('zh-CN', { hour12: false }) + '　|　题目范围：' + qs.length + ' 题');
  L.push('> 用途：供 AI 了解学习情况。状态说明：[已答·对/错] 为本人作答；「AI 核验」为对页面标准答案的独立复核（含全部轮次与本人质疑），非错题本子集。');
  L.push('');
  L.push('## 一、总览');
  L.push('- 题目总数：' + qs.length + '；已答 ' + stat.answered + '（对 ' + stat.right + ' / 错 ' + stat.wrong + '）；未答 ' + (qs.length - stat.answered - stat.cleared) + '；已清除 ' + stat.cleared);
  L.push('- AI 核验过：' + stat.aiChecked + ' 题；存疑标记：' + stat.flagged + ' 题');
  if (wrongList.length) L.push('- 错题：' + wrongList.join('、'));
  order.forEach(function (s) {
    var arr = bySec[s];
    var dn = arr.filter(function (q) { var r = records[q.id]; return r && !r.cleared && (r.my !== undefined || r.ok !== undefined); }).length;
    L.push('- ' + s + '：' + dn + '/' + arr.length + ' 题');
  });
  L.push('');
  L.push('## 二、逐题明细');
  order.forEach(function (s) {
    L.push('');
    L.push('### ' + s);
    bySec[s].forEach(function (q) {
      var r = records[q.id];
      var st;
      if (!r || r.cleared) st = r && r.cleared ? '已清除' : '未答';
      else if (r.ok === true) st = '已答·正确'; else if (r.ok === false) st = '已答·错误'; else st = '已查看答案';
      L.push('');
      L.push('#### ' + q.source + '（' + ({ choice: '单选', multi: '多选' }[q.type] || (q.subtype === 'judge' ? '判断' : '开放题')) + '）　[' + st + ']');
      L.push('- 题干：' + String(q.desc || '').replace(/\n/g, ' '));
      if (q.options && q.options.length) {
        q.options.forEach(function (o) { L.push('  - ' + (o.letter || '?') + '. ' + o.text); });
      }
      L.push('- 页面标注答案：' + (q.answer || '（无）'));
      if (q.analysis) L.push('- 页面解析：' + q.analysis);
      if (r && !r.cleared && (r.my !== undefined || r.ok !== undefined || r.wrong !== undefined)) {
        var my = r.my !== undefined ? r.my : (r.ok !== undefined ? '（查看答案，未选）' : '（未选）');
        L.push('- 我的作答：' + my + '　|　判定：' + (r.ok === true ? '正确' : r.ok === false ? '错误' : '—') +
          '　|　来源：' + (viaName[r.via] || '章节练习') + '　|　次数：' + (r.n || 1) +
          (r.prevMy ? '　|　上次错选：' + r.prevMy : '') +
          (r.at ? '　|　时间：' + fmtT(r.at) : ''));
      } else if (r && r.cleared) {
        L.push('- 作答记录：已清除');
      } else {
        L.push('- 我的作答：未答');
      }
      var e = annot.ai[q.id];
      if (e && e.v) {
        L.push('- AI 核验（本人发起，含质疑回应）：');
        L = L.concat(aiBlock(e.v, '本轮结论'));
        if (e.v.firstResult) L = L.concat(aiBlock(e.v.firstResult, '上一轮结论（供对照）'));
      } else {
        L.push('- AI 核验：未发起');
      }
      if (annot.flags[q.id] && annot.flags[q.id].v) L.push('- 存疑标记：⚠ 已标记答案存疑');
      if (annot.notes[q.id] && annot.notes[q.id].v) L.push('- 我的备注：' + annot.notes[q.id].v);
      var corr = annot.corr[q.id];
      if (corr && corr.v && corr.v.answer) L.push('- 已采纳勘误：页面答案 ' + (corr.v.origAnswer || '?') + ' → ' + corr.v.answer);
    });
  });
  return L.join('\n');
};

function tjuInject() {
  var card = document.querySelector('.qcard');
  if (!card || card.querySelector('.tju-tools')) return;
  var q = null;
  try { if (typeof qs === 'function' && typeof pracList !== 'undefined' && pracList.length && typeof pracIdx === 'number') q = qs(pracList[pracIdx]); } catch (e) {}
  if (!q) return;
  var qid = q.id;
  var flag = annot.flags[qid];
  var flagOn = !!(flag && flag.v);
  var note = annot.notes[qid];
  var noteOn = !!(note && note.v);
  var ai = annot.ai[qid];
  var aiV = ai && ai.v;
  if (flagOn) card.classList.add('tju-flagged');

  var tools = document.createElement('div');
  tools.className = 'tju-tools';

  var bFlag = document.createElement('button');
  bFlag.className = 'tju-btn' + (flagOn ? ' flag-on' : '');
  bFlag.textContent = flagOn ? '⚠ 已标记存疑' : '⚠ 标记答案存疑';
  bFlag.title = '标记该题页面标注的答案疑似有误（多端同步）';
  bFlag.addEventListener('click', function () {
    var cur = !!(annot.flags[qid] && annot.flags[qid].v);
    annot.flags[qid] = { v: !cur, at: Date.now() };
    annotChanged(); rerender();
  });

  var bNote = document.createElement('button');
  bNote.className = 'tju-btn' + (noteOn ? ' note-on' : '');
  bNote.textContent = noteOn ? '📝 备注(' + String(note.v).length + '字)' : '📝 备注';
  bNote.addEventListener('click', function () { tjuToggleNote(); });

  var bAi = document.createElement('button');
  bAi.className = 'tju-btn' + (aiV ? (aiV.correct === false ? ' ai-bad' : (aiV.correct === true ? ' ai-ok' : '')) : '');
  bAi.textContent = '🤖 AI核验';
  bAi.addEventListener('click', function () {
    var abox = document.querySelector('.tju-ai-box');
    if (abox && abox.innerHTML.trim() && tjuUI.aiState !== 'closed') {
      abox.innerHTML = '';
      tjuUI.aiState = 'closed';
      tjuUI.aiDraft = '';
      return;
    }
    tjuAiCheck(qid);
  });

  tools.appendChild(bFlag);
  tools.appendChild(bNote);
  tools.appendChild(bAi);

  var corr = annot.corr[qid];
  var corrOn = !!(corr && corr.v && corr.v.answer);
  if (corrOn) {
    bAi.classList.remove('ai-bad', 'ai-ok');
    bAi.classList.add('corr-on');
    bAi.title = '该题页面答案已按 AI 结论修正';
  }
  card.appendChild(tools);

  var box = document.createElement('div');
  box.className = 'tju-note-box';
  var ta = document.createElement('textarea');
  ta.className = 'tju-note-ta';
  ta.placeholder = '记录这道题的备注（疑点、易错点、记忆技巧…），多端同步。';
  ta.value = noteOn ? String(note.v) : '';
  var acts = document.createElement('div');
  acts.className = 'tju-note-acts';
  var bSave = document.createElement('button');
  bSave.className = 'tju-mini-btn save'; bSave.textContent = '保存备注';
  var bCancel = document.createElement('button');
  bCancel.className = 'tju-mini-btn cancel'; bCancel.textContent = '取消';
  acts.appendChild(bSave); acts.appendChild(bCancel);
  box.appendChild(ta); box.appendChild(acts);
  card.appendChild(box);
  card.querySelectorAll('.ansbox.wrong .ct').forEach(function (ct) {
    if (ct.dataset.tjuFixed) return;
    ct.dataset.tjuFixed = '1';
    if (!ct.querySelector('.tju-correct-ans-label')) {
      var s = document.createElement('span');
      s.className = 'tju-correct-ans-label';
      s.textContent = '正确答案：';
      ct.insertBefore(s, ct.firstChild);
    }
  });

  bSave.addEventListener('click', function () {
    var txt = ta.value.trim();
    // 空文本 = 空值墓碑：带最新 at 覆盖云端旧备注，否则 30 秒轮询会把删除"复活"（与 corr 撤销同模式）
    annot.notes[qid] = { v: txt, at: Date.now() };
    tjuUI.noteOpen = false;
    tjuUI.noteDraft = txt;
    annotChanged(); rerender();
    try { toast(txt ? '备注已保存' : '备注已删除'); } catch (e) {}
  });
  bCancel.addEventListener('click', function () {
    tjuUI.noteOpen = false; rerender();
  });

  var aiBox = document.createElement('div');
  aiBox.className = 'tju-ai-box';
  card.appendChild(aiBox);

  /* 改题入口：题卡右上角低调铅笔；有勘误时铅笔呈琥珀色（修改详情在改题弹窗内展示） */
  var corrActive = false;
  try {
    var ce = annot.corr && annot.corr[qid];
    corrActive = !!(ce && ce.v && tjuCorrParts(ce).length);
  } catch (e) {}
  var qhead = card.querySelector('.qhead');
  if (qhead && !qhead.querySelector('.tju-editq')) {
    var bE = document.createElement('button');
    bE.className = 'tju-editq' + (corrActive ? ' on' : '');
    bE.textContent = '✎';
    bE.title = '改题（答案/题面/选项/解析），保存后多端同步';
    bE.addEventListener('click', function () { tjuEditQ(qid); });
    qhead.appendChild(bE);
  }

  /* 恢复上一打开面板状态（切题时自动重置） */
  if (tjuUI.qid !== qid) {
    tjuUI.qid = qid;
    tjuUI.noteOpen = false;
    tjuUI.noteDraft = '';
    tjuUI.aiState = 'closed';
    tjuUI.aiDraft = '';
  }
  ta.addEventListener('input', function () { tjuUI.noteDraft = ta.value; });
  if (tjuUI.noteOpen) {
    box.classList.add('open');
    ta.value = tjuUI.noteDraft;
  }
  if (tjuUI.aiState === 'input') {
    tjuAiCheck(qid);
    var dta = aiBox.querySelector('.tju-doubt-ta');
    if (dta && tjuUI.aiDraft) dta.value = tjuUI.aiDraft;
  } else if (tjuUI.aiState === 'loading') {
    aiBox.innerHTML = '<div class="tju-ai-panel loading">🤖 AI 正在核验该题答案…可能需要十几秒</div>';
  } else if (tjuUI.aiState === 'result') {
    tjuAiShowCached(qid);
  }
}

function tjuToggleNote() {
  var box = document.querySelector('.tju-note-box');
  if (!box) return;
  var ta = box.querySelector('.tju-note-ta');
  if (ta) tjuUI.noteDraft = ta.value;
  tjuUI.noteOpen = !tjuUI.noteOpen;
  box.classList.toggle('open', tjuUI.noteOpen);
}

function tjuAiCheck(qid) {
  var q = null;
  try { q = qs(qid); } catch (e) {}
  var box = document.querySelector('.tju-ai-box');
  if (!box || !q) return;
  var prev = annot.ai[qid] && annot.ai[qid].v;
  if (prev) { tjuAiShowCached(qid); return; }   /* 已有结论：直接展示，不再弹输入面板 */
  tjuAiInputPanel(qid);
}

/* 纯输入面板（首次核验 / 点「重新核验」进入） */
function tjuAiInputPanel(qid) {
  var q = null;
  try { q = qs(qid); } catch (e) {}
  var box = document.querySelector('.tju-ai-box');
  if (!box || !q) return;
  var prev = annot.ai[qid] && annot.ai[qid].v;
  var prevDoubt = (prev && prev.doubt) ? prev.doubt : '';

    + '<div class="tju-ai-hd">🤖 AI 答案核验（两段式）</div>'

    + '<textarea class="tju-doubt-ta" placeholder="对这道题的质疑 / 补充观点（可选）">' + tjuEsc(prevDoubt) + '</textarea>'
    + '<div class="tju-note-acts">'
    + '<button class="tju-mini-btn save tju-ai-start">开始核验</button>'

  });

  if (cachedBtn) cachedBtn.addEventListener('click', function () { tjuAiShowCached(qid); });
}

function tjuSmallImages(q) {
  /* 把题目原图（data URI）缩到最长边 560px / JPEG q0.72，供多模态核验；缓存于 q._tjuSm */
  return new Promise(function (resolve) {
    var imgs = (q && q.images) ? q.images.slice(0, 3) : [];
    if (!imgs.length) { resolve([]); return; }
    if (q._tjuSm) { resolve(q._tjuSm); return; }
    var out = [];
    var done = 0;
    var finish = function () {
      q._tjuSm = out.filter(Boolean);
      resolve(q._tjuSm);
    };
    imgs.forEach(function (src, idx) {
      var im = new Image();
      im.onload = function () {
        try {
          var maxd = 560;
          var sc = Math.min(1, maxd / Math.max(im.width, im.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * sc));
          c.height = Math.max(1, Math.round(im.height * sc));
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          out[idx] = c.toDataURL('image/jpeg', 0.72);
        } catch (e) { out[idx] = ''; }
        if (++done === imgs.length) finish();
      };
      im.onerror = function () { out[idx] = ''; if (++done === imgs.length) finish(); };
      im.src = src;
    });
  });
}

function tjuQPayload(q) {
  return {
    type: q.type || '', subtype: q.subtype || '', source: q.source || '',
    desc: q.desc || '', options: q.options || [], answer: q.answer || '',
    analysis: q.analysis || ''
  };
}

/* 一审：tju-llm；useFirst=false 不带一审结论。二审：DeepSeek，useFirst=true 带上当前一审结论 */
function tjuAiRun(qid, doubt, useFirst) {
  var q = null;
  try { q = qs(qid); } catch (e) {}
  var box = document.querySelector('.tju-ai-box');
  if (!box || !q) return;
  var first = null;
  if (useFirst && annot.ai[qid] && annot.ai[qid].v) {
    first = annot.ai[qid].v;
  }
  var bodyObj = { subject: SUBJ, doubt: doubt, question: tjuQPayload(q) };
  if (first) bodyObj.firstResult = {
    correct: first.correct, confidence: first.confidence,
    correctAnswer: first.correctAnswer, reason: first.reason,
    stage: first.stage || 1, model: first.model || ''
  };
  /* 带图题：缩图随请求上传（tju-llm 支持读图；DeepSeek 不支持，服务端会自动路由） */
  tjuSmallImages(q).then(function (imgs) {
    if (imgs.length) bodyObj.images = imgs;
    return tjuAiSend(qid, doubt, first, bodyObj);
  });
  tjuAiSend(qid, doubt, first, bodyObj);
}

function tjuAiSend(qid, doubt, first, bodyObj) {
  var q = null;
  try { q = qs(qid); } catch (e) {}
  var box = document.querySelector('.tju-ai-box');
  if (!box || !q) return;
  var token = tjuToken();
  if (!token) {
    tjuAiFailPanel(qid, '请先在菜单中配置云端同步密钥，再使用 AI 核验。');
    return;
  }
  var loading = first
    ? '🤖 正在基于上一轮结论继续复核' + (doubt ? '（已纳入你的质疑）' : '') + '…可能需要十几秒'
    : '🤖 tju-llm 正在核验该题答案' + (doubt ? '（已纳入你的质疑）' : '') + '…可能需要十几秒';
  box.innerHTML = '<div class="tju-ai-panel loading">' + loading + '</div>';
  tjuUI.aiState = 'loading';
  try {
    fetch(API_CHECK, {
      method: 'POST',
      headers: { 'authorization': 'Bearer ' + token, 'content-type': 'application/json' },
      body: JSON.stringify(bodyObj)
    })
      .then(function (r) { return r.json(); })
      .then(function (obj) {
        /* 轮询重渲染会重建 DOM：回调实时取当前面板；结论先入库，面板归属已变则静默不抢占 */
        var box2 = document.querySelector('.tju-ai-box');
        if (!box2) { tjuUI.aiState = 'closed'; return; }
        if (obj && obj.error) { tjuAiFailPanel(qid, '🤖 校验失败：' + obj.error); return; }
        if (!obj || (typeof obj.correct !== 'boolean' && obj.correct !== null)) { tjuAiFailPanel(qid, '🤖 AI 未能给出判定，请稍后重试。'); return; }
        annot.ai[qid] = {
          v: {
            correct: obj.correct, confidence: obj.confidence,
            correctAnswer: obj.correctAnswer || '', reason: obj.reason || '',
            doubt: doubt, stage: obj.stage || 1, model: obj.model || '',
            firstResult: obj.firstResult || null, checkedAt: Date.now()
          },
          at: Date.now()
        };
        annotChanged();
        if (tjuUI.qid !== qid || tjuUI.aiState === 'closed') return;
        tjuUI.aiState = 'result';
        tjuUI.aiDraft = '';
        box2.innerHTML = tjuAiHtml(annot.ai[qid].v, qid);
        tjuApplyMath(box2);
        tjuWirePanel(qid, box2);
      })
      .catch(function () { tjuAiFailPanel(qid, '🤖 校验失败（网络错误），请检查网络后重试。'); });
  } catch (e) { tjuAiFailPanel(qid, '🤖 校验失败，请重试。'); }
}

function tjuAiSecondInput(qid) {
  var box = document.querySelector('.tju-ai-box');

    + '<textarea class="tju-doubt-ta"></textarea>'

function tjuWirePanel(qid, box) {
  var again = box.querySelector('.tju-ai-again');
  if (again) again.addEventListener('click', function () {
    var vv = annot.ai[qid] && annot.ai[qid].v;

    if (!q2) return;
    var vv = annot.ai[qid] && annot.ai[qid].v;
    if (!vv || !vv.correctAnswer) return;
    var newAns = tjuNormAnswer(q2, vv.correctAnswer);
    if (!newAns || newAns === q2.answer) return;
    annot.corr[qid] = { v: { answer: newAns, origAnswer: q2.answer, source: 'ai', analysis: vv.reason || '', at: Date.now() }, at: Date.now() };
    annotChanged();
    applyCorrections();

}

function tjuAiHtml(v, qid) {
  var stg = v.stage || 1;
  var modelTag = v.model === 'deepseek'

  var verdict = v.correct === true
    ? '<span class="tju-ai-verdict ok">✔ AI 判定：答案正确</span>'
    : (v.correct === false
      ? '<span class="tju-ai-verdict bad">✘ AI 判定：答案疑似有误</span>'
      : '<span class="tju-ai-verdict unk">⚠ AI 无法确定（题目或答案存在歧义）</span>');
  var conf = (typeof v.confidence === 'number') ? '（置信度 ' + Math.round(v.confidence * 100) + '%）' : '';
  var ansDiff = '';
  if (v.correct !== true && v.correctAnswer) ansDiff = '<div class="tju-ai-ans">AI 认为正确答案：' + tjuMd(v.correctAnswer) + '</div>';
  var acceptBtn = '';

    acceptBtn = '<button class="tju-mini-btn tju-accept" style="background:#ff9800;color:#fff">认可，修正答案</button>';
  }
  var secondBtn = '<button class="tju-mini-btn tju-ai-2nd" style="background:#e3f2fd;color:#1565c0">'
    + (stg >= 2 ? '不认可，继续审核' : '不认可，转二审') + '</button>';
  var doubtHtml = v.doubt ? '<div class="tju-ai-doubt">你的质疑：' + tjuEsc(v.doubt) + '</div>' : '';
  return '<div class="tju-ai-panel">'
    + headRow + verdict + conf
    + '<div class="tju-ai-reason">' + tjuMdReason(v.reason || '') + '</div>'
    + ansDiff + doubtHtml

    + '<button class="tju-mini-btn tju-ai-again" style="background:#eef1f6;color:#374a63;border-color:#c5cae9">再次核验</button>'
    + '</div></div>';
}

function tjuEditQ(qid) {
  var q = null;
  try { q = qs(qid); } catch (e) {}
  if (!q) { try { toast('题目数据未就绪'); } catch (e2) {} return; }
  var old = document.querySelector('.tju-editq-mask');
  if (old) old.remove();

  var hasOpts = !!(q.options && q.options.length);
  var isMulti = q.type === 'multi';
  var ansCtrl;
  if (hasOpts && !isMulti) {
    ansCtrl = '<select class="tju-editq-ans">' + q.options.map(function (o) {
      return '<option value="' + tjuEsc(String(o.letter)) + '"' + (o.letter === q.answer ? ' selected' : '') + '>' + tjuEsc(String(o.letter)) + '</option>';
    }).join('') + '</select>';
  } else {
    ansCtrl = '<input class="tju-editq-ans" value="' + tjuEsc(String(q.answer == null ? '' : q.answer)) + '" placeholder="'
      + (isMulti ? '多选字母连写，如 ABD' : (q.subtype === 'judge' ? '如 T / F' : '答案内容，如 3/4')) + '">';
  }
  var optsTa = hasOpts
    ? '<label class="tju-editq-lb">选项（每行一个，按顺序对应 A、B、C…）</label><textarea class="tju-editq-opts" rows="4">' + tjuEsc(q.options.map(function (o) { return String(o.text || ''); }).join('\n')) + '</textarea>'
    : '';

  var corrHtml = '';
  var corrEntry = annot.corr && annot.corr[qid];
  var corrParts = tjuCorrParts(corrEntry);
  if (corrParts.length) {
    corrHtml = '<div class="tju-editq-corr"><div class="tju-editq-corr-info">当前勘误（'
      + (corrEntry.v.source === 'ai' ? '依据 AI 结论' : '手动') + '）：' + corrParts.join('；') + '</div>'
      + '<button class="tju-mini-btn cancel tju-editq-revert">撤销全部修正</button></div>';
  }

  var mask = document.createElement('div');
  mask.className = 'tju-editq-mask';
  mask.innerHTML = '<div class="tju-editq-box">'
    + '<div class="tju-editq-hd"><span>改题 · ' + tjuEsc(qid) + '</span><button class="tju-editq-x">✕</button></div>'
    + corrHtml
    + '<label class="tju-editq-lb">答案</label>' + ansCtrl
    + '<label class="tju-editq-lb">题面（支持 LaTeX/Markdown）</label><textarea class="tju-editq-desc" rows="5">' + tjuEsc(String(q.desc || '')) + '</textarea>'
    + optsTa
    + '<label class="tju-editq-lb">解析（支持 LaTeX/Markdown）</label><textarea class="tju-editq-ana" rows="5">' + tjuEsc(String(q.analysis || '')) + '</textarea>'
    + '<div class="tju-editq-tip">保存后立即生效并多端同步；把内容改回原文即可清除对应修正，「撤销全部修正」可一键还原本题所有勘误。</div>'
    + '<div class="tju-editq-acts"><button class="tju-mini-btn cancel tju-editq-cancel">取消</button><button class="tju-mini-btn save tju-editq-save">保存勘误</button></div>'
    + '</div>';
  document.body.appendChild(mask);
  mask.addEventListener('click', function (ev) { if (ev.target === mask) mask.remove(); });
  mask.querySelector('.tju-editq-x').addEventListener('click', function () { mask.remove(); });
  mask.querySelector('.tju-editq-cancel').addEventListener('click', function () { mask.remove(); });
  var revBtn = mask.querySelector('.tju-editq-revert');
  if (revBtn) revBtn.addEventListener('click', function () {
    annot.corr[qid] = { v: {}, at: Date.now() };  // 空值墓碑：保证多端同步撤销
    annotChanged(); applyCorrections();
    try { toast('已撤销全部修正'); } catch (e) {}
    mask.remove();
    tjuEditQ(qid); // 重开弹窗，展示还原后的原始内容
  });

  mask.querySelector('.tju-editq-save').addEventListener('click', function () {
    var q2 = null;
    try { q2 = qs(qid); } catch (e) {}
    if (!q2) return;
    var v = {};

    var origAns = q2._tjuOrigAnswer !== undefined ? q2._tjuOrigAnswer : q2.answer;
    var ans = tjuNormAnswer(q2, String(mask.querySelector('.tju-editq-ans').value || '').trim());
    if (ans && ans !== origAns) { v.answer = ans; v.origAnswer = origAns; }

    var dEl = mask.querySelector('.tju-editq-desc');
    if (dEl) {
      var desc = dEl.value.replace(/\s+$/, '');
      var origDesc = q2._tjuOrigDesc !== undefined ? q2._tjuOrigDesc : q2.desc;
      if (desc && desc !== origDesc) v.desc = desc;
    }
    var oEl = mask.querySelector('.tju-editq-opts');
    if (oEl && q2.options && q2.options.length) {
      var lines = oEl.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
      var origOpts = q2._tjuOrigOptions !== undefined ? q2._tjuOrigOptions : q2.options;
      var changed = lines.length && (lines.length !== origOpts.length || lines.some(function (t, i) { return t !== origOpts[i].text; }));
      if (changed) {
        var letters = 'ABCDEFGHIJKL';
        v.options = lines.map(function (t, i) {
          return { letter: i < origOpts.length ? origOpts[i].letter : letters[i], text: t };
        });
      }
    }
    var aEl = mask.querySelector('.tju-editq-ana');
    if (aEl) {
      var ana = aEl.value.replace(/\s+$/, '');
      var origAna = q2._tjuOrigAnalysis !== undefined ? q2._tjuOrigAnalysis : q2.analysis;
      if (ana && ana !== origAna) v.analysis = ana;
    }

    var finalOpts = v.options || q2.options || [];
    if (v.answer && finalOpts.length) {
      var bad = String(v.answer).split('').some(function (ch) { return finalOpts.every(function (o) { return o.letter !== ch; }); });
      if (bad) { try { toast('答案字母不在选项中，请检查'); } catch (e) {} return; }
    }

    var n = Object.keys(v).filter(function (k) { return k !== 'origAnswer'; }).length;
    annot.corr[qid] = { v: v, at: Date.now() };  // v 为空 = 墓碑，撤销所有修正
    annotChanged(); applyCorrections();
    mask.remove();
    try { toast(n ? '勘误已保存并多端同步' : '内容与原文一致，已清除勘误'); } catch (e) {}
    rerender();
  });
}

<script>
    const tabs = [...document.querySelectorAll('.subject-tab')];
    const frames = new Map(tabs.map(tab => [tab.dataset.page, document.getElementById(`frame-${tab.dataset.page}`)]));
    const loadedPages = new Set();

    function setShellCollapsed(collapsed, persist = true) {
      shellTopbar.classList.toggle('is-collapsed', collapsed);
      navToggle.setAttribute('aria-expanded', String(!collapsed));
      navToggle.setAttribute('aria-label', collapsed ? '展开学科导航' : '收起学科导航');
      if (persist) {
        try { localStorage.setItem('tju-quiz-shell-collapsed-v1', collapsed ? '1' : '0'); } catch {}
      }
    }

    function toggleShellNavigation() {
      setShellCollapsed(!shellTopbar.classList.contains('is-collapsed'));
    }

    navToggle.addEventListener('click', toggleShellNavigation);

    let shellStateBeforePractice = null;

    function syncPracticeShell(frame) {
      const active = frame?.dataset.practice === '1';
      shellTopbar.classList.toggle('is-practice', active);
      if (active) {
        if (shellStateBeforePractice === null) shellStateBeforePractice = shellTopbar.classList.contains('is-collapsed');
        setShellCollapsed(true, false);
      } else if (shellStateBeforePractice !== null) {
        setShellCollapsed(shellStateBeforePractice, false);
        shellStateBeforePractice = null;
      }
    }

    window.addEventListener('message', event => {
      if (!event.data) return;
      const frame = [...frames.values()].find(item => item.contentWindow === event.source);
      if (!frame) return;
      if (event.data.type === 'tju-quiz-switch-subject') {
        if (frame.classList.contains('is-active') && frames.has(event.data.page)) {
          const target = frames.get(event.data.page);
          const openChapter = () => target.contentWindow.postMessage({type:'tju-quiz-open-chapter'}, '*');
          if (target.dataset.ready === '1') openChapter();
          else target.addEventListener('load', openChapter, { once: true });
          activatePage(event.data.page);
        }
        return;
      }
      if (event.data.type !== 'tju-quiz-practice-state') return;
      frame.dataset.practice = event.data.active ? '1' : '0';
      if (frame.classList.contains('is-active')) syncPracticeShell(frame);
    });

    function showLoading(message = '正在载入题库…') {
      loaderMessage.textContent = message;
      loaderRing.hidden = false;
      loaderRetry.hidden = true;
      loadingScreen.hidden = false;
      workspace.setAttribute('aria-busy', 'true');
    }

    function hideLoading() {
      loadingScreen.hidden = true;
      workspace.setAttribute('aria-busy', 'false');
    }

    function showLoadError(pageId) {
      loaderMessage.textContent = '题库加载失败，请检查网络后重试';
      loaderRing.hidden = true;
      loaderRetry.dataset.page = pageId;
      loaderRetry.hidden = false;
      loadingScreen.hidden = false;
      workspace.setAttribute('aria-busy', 'false');
    }

    function loadPage(pageId, reload = false) {
      const frame = frames.get(pageId);
      if (loadedPages.has(pageId)) {
        hideLoading();
        return;
      }
      showLoading();
      if (loadingPages.has(pageId)) return;
      const request = fetch(`/exam/${pageId}.html`, { cache: reload ? 'reload' : 'default' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(page => new Promise(resolve => {
          frame.addEventListener('load', () => {
            frame.dataset.ready = '1';
            loadedPages.add(pageId);
            if (frame.classList.contains('is-active')) hideLoading();
            resolve();
          }, { once: true });
          const enhancer = document.getElementById('tju-enhancer');
          frame.srcdoc = page + (enhancer ? '<scr'+'ipt>\n'+enhancer.textContent+'\n<\/scr'+'ipt>' : '');
        }))
        .catch(() => {
          if (frame.classList.contains('is-active')) showLoadError(pageId);
        })
        .finally(() => loadingPages.delete(pageId));
      loadingPages.set(pageId, request);
    }

    loaderRetry.addEventListener('click', () => loadPage(loaderRetry.dataset.page, true));

    function activatePage(pageId) {
      if (!frames.has(pageId)) pageId = tabs[0].dataset.page;
      loadPage(pageId);
      tabs.forEach(tab => {
        const active = tab.dataset.page === pageId;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      frames.forEach((frame, id) => {
        const active = id === pageId;
        frame.classList.toggle('is-active', active);
        frame.setAttribute('aria-hidden', String(!active));
      });
      syncPracticeShell(frames.get(pageId));
      const currentTab = tabs.find(tab => tab.dataset.page === pageId);
      if (currentTab) document.title = `${currentTab.querySelector('.tab-title').textContent} · I Love TJU`;
      try { localStorage.setItem('tju-quiz-suite-active-v1', pageId); } catch {}
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        activatePage(tab.dataset.page);
        if (mobileNavQuery.matches) setShellCollapsed(true);
      });
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const offset = event.key === 'ArrowRight' ? 1 : -1;
        const nextTab = tabs[(index + offset + tabs.length) % tabs.length];
        activatePage(nextTab.dataset.page);
        nextTab.focus();
      });
    });

    let initialPage = tabs[0].dataset.page;
    try { initialPage = localStorage.getItem('tju-quiz-suite-active-v1') || initialPage; } catch {}
    let savedShellState = null;
    try { savedShellState = localStorage.getItem('tju-quiz-shell-collapsed-v1'); } catch {}
    setShellCollapsed(savedShellState === null ? mobileNavQuery.matches : savedShellState === '1', false);
    activatePage(initialPage);
  </script>

<script>
/* 离线缓存与题库更新：注册 Service Worker，联网时比对 /api/manifest，
 * 有新版就下载校验后写入 SW 缓存，下次加载即离线可用。Android WebView
 * 不支持 Service Worker，由壳的原生拦截层负责，此处自动跳过。 */
(function () {
  if (location.protocol !== 'https:' || !('serviceWorker' in navigator)) return;
  var CACHE_NAME = 'tju-shell-v2';
  var LS_MANIFEST = 'tju-quiz-manifest-v2';
  function toastMsg(msg) {
    try {
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:50%;bottom:9%;transform:translateX(-50%);max-width:82%;background:rgba(20,24,34,.9);color:#fff;padding:9px 16px;border-radius:9px;font:13px/1.5 system-ui,sans-serif;z-index:99999;box-shadow:0 4px 14px rgba(0,0,0,.35);';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 3200);
    } catch (e) {}
  }
  function sha256Hex(buf) {
    return crypto.subtle.digest('SHA-256', buf).then(function (d) {
      return Array.from(new Uint8Array(d), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  async function checkShellUpdate() {
    try {
      const m = await fetch('/api/manifest', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null);
      const files = m && m.files;
      if (!files || !files['/']) return;
      const fingerprint = JSON.stringify(files);
      const known = localStorage.getItem(LS_MANIFEST);
      if (known === fingerprint) return;
      const downloaded = [];
      for (const [path, entry] of Object.entries(files)) {
        const resp = await fetch(path, { cache: 'reload' }); // 绕过 SW 与 HTTP 缓存取最新
        if (!resp.ok) return;
        const buf = await resp.arrayBuffer();
        if ((await sha256Hex(buf)) !== entry.sha256) return;
        downloaded.push({ path, buf, headers: Array.from(resp.headers.entries()) });
      }
      const cache = await caches.open(CACHE_NAME);
      for (const item of downloaded) {
        await cache.put(item.path, new Response(item.buf, { status: 200, headers: item.headers }));
      }
      localStorage.setItem(LS_MANIFEST, fingerprint);
      if (known) toastMsg('题库已更新，刷新页面后生效');
    } catch (e) {}
  }
  navigator.serviceWorker.register('/sw.js')
    .then(() => setTimeout(checkShellUpdate, 2500))
    .catch(() => {});
  window.addEventListener('online', () => { checkShellUpdate(); });
})();
</script>
