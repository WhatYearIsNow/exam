<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a56db">
<title>马克思主义基本原理</title>
<!-- 马原刷题页：无公式排版需求，已移除 KaTeX 依赖 -->
<style>
:root{
  /* 天津大学 VI 标准色：北洋蓝 #00468c + 辅助金黄 #ffc800 */
  --blue:#00468c; --blue-l:#e9f0f8; --blue-d:#00315f; --blue-xd:#002647;
  --gold:#ffc800; --gold-l:#fff6d6; --gold-t:#8a6d00;
  --green:#005a1e; --green-l:#e4f2e9; --red:#962800; --red-l:#fae9e3;
  --gray:#64748b; --gray-l:#eef2f6; --bg:#f6f8fb; --card:#fff; --bd:#dce4ed;
  --txt:#1f2937; --txt2:#6b7280; --safe-b:env(safe-area-inset-bottom,0px);
  --serif:'Songti SC','STSong','SimSun',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{font:inherit}
button:focus-visible,.sec:focus-visible,.grp-h:focus-visible,.qrow:focus-visible,.opt:focus-visible{outline:3px solid rgba(255,200,0,.85);outline-offset:2px}
html,body{height:100%}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;display:flex;flex-direction:column}

/* Top：北洋蓝头部 + 校徽 + 金黄饰线 */
.top{background:var(--blue-d);color:#fff;padding:8px max(16px,calc((100% - 980px)/2));padding-top:calc(8px + env(safe-area-inset-top,0px));min-height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--gold)}
.top-brand{display:flex;align-items:center;gap:10px;min-width:0}
.top-logo{height:36px;width:36px;flex-shrink:0;border-radius:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.top h1{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px;line-height:1.25;color:#fff}
.top .sub{font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.3px;margin-top:2px}
.top-btns{display:flex;gap:6px;position:relative}
.top-btn{width:34px;height:34px;padding:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:0;border-radius:8px;cursor:pointer;position:relative}
.top-btn::before{content:'⋯';font-size:18px;line-height:1;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateY(-2px)}
.top-btn:active{background:rgba(255,255,255,.32)}

/* ⋯ 菜单下拉 */
.menu-pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:200;min-width:140px;overflow:hidden}
.menu-pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:12px 16px;font-size:13px;color:var(--txt);cursor:pointer}
.menu-pop button:active{background:var(--gray-l)}
.menu-pop button+button{border-top:1px solid var(--gray-l)}

/* Mode tabs：分段控件风格 */
.modes{display:flex;gap:0;background:#fff;padding:0 max(12px,calc((100% - 980px)/2));border-bottom:1px solid var(--bd);flex-shrink:0}
.mode{flex:1;padding:11px 0 10px;text-align:center;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;transition:all .18s}
.mode:active{transform:scale(.97)}
.mode.active{background:transparent;color:var(--blue);border-bottom-color:var(--gold)}
.mode .badge{display:inline-block;min-width:18px;font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 5px;margin-left:4px;vertical-align:1px}

/* Main */
.main{flex:1;width:100%;max-width:980px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;padding-bottom:calc(24px + var(--safe-b))}

/* Group list (chapter/paper) */
.grp{background:var(--card);border:1px solid var(--bd);border-radius:11px;margin-bottom:8px;overflow:hidden;box-shadow:0 2px 5px rgba(15,42,77,.035);transition:border-color .18s,box-shadow .18s}
.grp.open{border-color:#b9cde1;box-shadow:0 4px 12px rgba(15,42,77,.07)}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 12px 13px;cursor:pointer;font-weight:700;font-size:15px;min-height:48px;border-left:4px solid transparent}
.grp.open .grp-h{background:linear-gradient(90deg,#f0f6fc,#fff 70%);border-left-color:var(--blue)}
.grp-h:active{background:var(--gray-l)}
.grp-h .meta{font-size:12px;color:var(--txt2);font-weight:400}
.grp-h .arrow{color:var(--gray);font-size:12px;transition:transform .2s}
.grp.open .grp-h .arrow{transform:rotate(90deg)}
.grp-body{display:none;border-top:1px solid var(--bd);padding:4px 0 5px;background:#fbfcfe}
.grp.open .grp-body{display:block}
.sec{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 24px;margin:2px 8px;font-size:14px;cursor:pointer;border-bottom:none;border-radius:7px;min-height:42px;transition:background .15s,color .15s}
.sec:hover{background:#f0f5fa}
.sec:active{background:var(--blue-l)}
.sec .cnt{font-size:12px;color:var(--txt2)}
/* 必备知识首项（教材提炼）*/
.sec-note{color:var(--blue);font-weight:700;background:#edf5fc;border-left:3px solid var(--gold);padding-left:21px}
.sec-note:active{background:#e9f2fb}
.sec-note .nb-arrow{color:var(--gray);font-size:12px;transition:transform .2s}
.grp.note-open .nb-arrow{transform:rotate(90deg)}
.notes-body{display:none;margin:0 8px 5px;padding:12px 14px 14px 21px;font-size:13.5px;line-height:1.85;background:#f7fbff;border:1px solid #dcebf7;border-radius:7px}
.notes-body h2{font-size:13px;color:var(--blue);margin:10px 0 4px;font-weight:700}
.notes-body h2:first-child{margin-top:0}
.notes-body ul{margin:0;padding-left:18px}
.notes-body li{margin:3px 0}
.notes-body p{margin:4px 0}
/* 不涉及考题的小节：浅蓝标记 */
.sec-none{color:#94a7b9;background:transparent;cursor:default}
.sec-none:active{background:transparent}
.sec-none .cnt{color:#a7b7c5}

/* Question list row */
.qrow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:9px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 3px rgba(15,42,77,.05);transition:border-color .15s,box-shadow .15s,transform .15s}
.qrow:hover{border-color:#b7c9dc;box-shadow:0 3px 8px rgba(15,42,77,.08);transform:translateY(-1px)}
.qrow:active{background:var(--blue-l)}
.qrow .qn{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.qrow .qn.done{background:var(--green-l);color:var(--green)}
.qrow .qn.wrong{background:var(--red-l);color:var(--red)}
.qrow .info{flex:1;min-width:0}
.qrow .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .t2{font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* 错题重做：上次错选提示条 */
.prev-ans{margin-top:12px;padding:9px 13px;border:1px dashed #e3b94d;background:#fffaeb;border-radius:9px;color:#8a6a12;font-size:13px;line-height:1.5}

/* 错题回顾工具栏：分类切换 + 右上角重置 */
.wtoolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wsegs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--bd)}
.wseg{padding:6px 11px;font-size:13px;font-weight:600;color:var(--txt2);border:none;background:transparent;border-radius:8px;cursor:pointer}
.wseg.active{background:var(--blue);color:#fff}
.wreset{padding:7px 14px;font-size:13px;font-weight:600;color:var(--red);background:var(--red-l);border:1px solid var(--red);border-radius:8px;cursor:pointer;flex-shrink:0}
.wreset:active{transform:scale(.96)}
/* 错题分组标题 */
.wgrp{margin-bottom:14px}
.wgrp-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--txt2);margin:0 2px 8px}
.wgrp-h .cnt{font-weight:600;color:var(--red)}
/* 重置弹层选项按钮 */
.rst-btn{display:block;width:100%;padding:13px;margin-bottom:10px;font-size:14px;font-weight:600;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);cursor:pointer;text-align:center}
.rst-btn:last-child{margin-bottom:0}
.rst-btn:active{transform:scale(.98)}
.rst-btn.danger{color:var(--red);border-color:var(--red);background:var(--red-l)}
.rst-btn:disabled{opacity:.45;cursor:default}
.rst-tip{font-size:12px;color:var(--txt2);margin:-4px 0 10px;line-height:1.6}

/* Empty state */
.empty{text-align:center;color:var(--txt2);padding:60px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:12px}

/* Practice view */
.pv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:38px}
.back-btn{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer}
.pv-title{flex:1;font-size:13px;color:var(--txt2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-cnt{font-size:13px;color:var(--blue);font-weight:600;flex-shrink:0;background:var(--blue-l);padding:5px 12px;border-radius:7px;cursor:pointer;border:none}
.pv-cnt:active{transform:scale(.95)}

/* 题号选择弹层（点计数器弹出）*/
.qnav-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.qnav-box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:70vh;overflow-y:auto;animation:qnav-up .2s ease}
@keyframes qnav-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.qnav-hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;margin-bottom:12px}
.qnav-x{color:var(--txt2);cursor:pointer;padding:4px 10px;font-weight:400}
.qnum-grid{display:flex;flex-wrap:wrap;gap:8px}
.qnum{width:42px;height:38px;border:1.5px solid var(--bd);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;transition:all .15s}
.qnum:active{transform:scale(.93)}
.qnum.cur{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.qnum.done{background:var(--green-l);border-color:var(--green);color:var(--green)}
.qnum.wrong{background:var(--red-l);border-color:var(--red);color:var(--red)}

.qcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 2px 10px rgba(15,42,77,.06);overflow:hidden;margin-bottom:12px}
.qhead{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px 0}
.tag{font-size:11px;padding:4px 11px;border-radius:999px;font-weight:600}
.tag.src{background:var(--blue-l);color:var(--blue)}
.tag.chap{background:var(--gold-l);color:var(--gold-t)}
.tag.type{background:var(--gray-l);color:var(--txt2)}
.qbody{padding:12px 16px;font-size:15px;line-height:1.9}
.qbody img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.qbody p{margin:6px 0}
.missing-image{display:flex;align-items:center;justify-content:center;min-height:72px;margin:8px 0;padding:12px;border:1px dashed var(--bd);border-radius:8px;background:var(--gray-l);color:var(--txt2);font-size:13px}

/* Options */
.opts{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;padding:11px 13px;border:2px solid var(--bd);border-radius:9px;cursor:pointer;transition:all .15s;background:#fff;min-height:46px}
.opt:hover{border-color:#9db5cf;background:#fbfdff}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.incorrect{border-color:var(--red);background:var(--red-l)}
.opt-l{width:25px;height:25px;border-radius:50%;background:var(--gray-l);color:var(--txt2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:11px;flex-shrink:0;margin-top:1px}
.opt.sel .opt-l{background:var(--blue);color:#fff}
.opt.correct .opt-l{background:var(--green);color:#fff}
.opt.incorrect .opt-l{background:var(--red);color:#fff}
.opt-t{flex:1;font-size:14px;line-height:1.6}

/* Open question actions */
.open-act{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.96)}
.btn.show{background:var(--blue);color:#fff}
.btn.mark-wrong{background:var(--red-l);color:var(--red);border:1.5px solid var(--red)}
.btn.mark-right{background:var(--green-l);color:var(--green);border:1.5px solid var(--green)}
.btn.done-state{opacity:.55}

/* Answer & analysis */
.ansbox{margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.ansbox .hd{padding:10px 14px;font-size:13px;font-weight:700;background:var(--gray-l);display:flex;justify-content:space-between;align-items:center}
.ansbox .hd.right{background:var(--green-l);color:var(--green)}
.ansbox .hd.wrong{background:var(--red-l);color:var(--red)}
.ansbox .ct{padding:12px 14px;font-size:14px;line-height:1.85;background:#fff}
.ansbox .ct img{max-width:100%;border-radius:6px}

/* AI 解析：默认折叠，点标题展开 */
.ansbox.ana-fold .hd{cursor:pointer;user-select:none}
.ansbox.ana-fold .hd:hover{filter:brightness(.98)}
.ansbox.ana-fold .ct{display:none}
.ansbox.ana-fold.open .ct{display:block}
.ana-arrow{font-size:11px;color:var(--txt2);transition:transform .2s}
.ansbox.ana-fold.open .ana-arrow{transform:rotate(90deg)}
/* 解析分行排版：编号步骤 + 易错点高亮块 */
.ana-line{display:flex;gap:9px;padding:4px 0;align-items:flex-start}
.ana-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.ana-line>span:last-child{flex:1}
.ana-warn{background:var(--gold-l);border-left:3px solid var(--gold);padding:9px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;line-height:1.8}
.ana-warn b{color:var(--gold-t)}

/* Nav */
.pnav{display:flex;justify-content:space-between;gap:10px;padding-bottom:calc(6px + var(--safe-b))}
.pnav .btn{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--txt)}
.pnav .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.pnav .btn:disabled{opacity:.4}

/* Toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

/* Inline LaTeX（备用渲染器样式；主渲染走本地 KaTeX）*/
.tex{font-family:'STIX Two Math','Cambria Math','Times New Roman',serif;font-style:normal;font-size:1.06em}
.tex i{font-style:italic}
.tex-display{display:block;text-align:center;margin:14px 0;font-size:1.15em;overflow-x:auto;padding:8px 0}
.tex sub,.tex sup{font-size:.72em}
.tex .frac{display:inline-block;vertical-align:middle;text-align:center;font-size:.95em;margin:0 2px}
.tex .frac>span{display:block;padding:1px 5px;line-height:1.35}
.tex .frac>span.bot{border-top:1.2px solid currentColor}
.tex .sqrt::before{content:'√'}
.tex .sqrt-inner{border-top:1px solid currentColor;display:inline-block;padding:0 1px}
.tex .mathrm,.tex .text{font-style:normal}
.tex .text{font-family:-apple-system,'PingFang SC',sans-serif}
.tex .mathbf{font-style:normal;font-weight:bold}
.tex .overline{text-decoration:overline}

/* KaTeX 适配 */
.qbody .katex{font-size:1.08em}
.qcard .katex-display{margin:12px 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.opt-t .katex{font-size:1.05em}
.ansbox .ct .katex{font-size:1.05em}
.qbody,.opt-t,.ansbox .ct{overflow-wrap:anywhere}
.qbody img,.ansbox .ct img{height:auto;object-fit:contain;background:#fff}
.katex-display>.katex{display:inline-block;min-width:max-content;text-align:left}

/* Loading / misc */
.loading{text-align:center;padding:50px;color:var(--txt2)}
.hidden{display:none!important}
input[type=file]{display:none}

/* 填空空位样式 */
.qblank{display:inline-block;min-width:72px;border-bottom:2px solid var(--blue);margin:0 3px;height:1.05em;vertical-align:-2px}
.empty .big{filter:grayscale(.2)}

/* 练习进度条（金黄强调色）*/
.pv-progress{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-bottom:12px}
.pv-progress i{display:block;height:100%;background:var(--gold);transition:width .25s}

@media (max-width:600px){
  .top{padding-left:12px;padding-right:12px;min-height:58px}
  .top-brand{gap:9px}
  .top-logo{height:34px;width:34px}
  .top h1{font-size:16px}
  .top .sub{font-size:10px}
  .main{padding:12px 10px;padding-bottom:calc(18px + var(--safe-b))}
  .grp-h{padding-left:13px;padding-right:13px}
  .sec{padding-left:22px;padding-right:13px}
  .pv-title{font-size:12px}
  .qbody{padding-left:14px;padding-right:14px}
  .opts{padding-left:14px;padding-right:14px}
}

/* 现代校园风视觉层：保持原有功能与 DOM 交互不变 */
:root{
  --blue:#07539a;--blue-l:#edf5fc;--blue-d:#073968;--blue-xd:#052a4f;
  --gold:#f2bd27;--gold-l:#fff8df;--gold-t:#7b5a00;
  --green:#147a46;--green-l:#eaf7f0;--red:#bd3b32;--red-l:#fff0ee;
  --gray:#718096;--gray-l:#f1f5f9;--bg:#f3f7fb;--card:#fff;--bd:#dfe8f1;
  --txt:#172033;--txt2:#68758a;
  --shadow-sm:0 2px 8px rgba(7,57,104,.055);
  --shadow-md:0 12px 34px rgba(7,57,104,.10);
}
body{
  background:
    radial-gradient(circle at 12% 0,rgba(7,83,154,.07),transparent 28rem),
    linear-gradient(180deg,#f7faff 0,#f3f7fb 22rem);
  letter-spacing:.01em;
}
.top{
  min-height:74px;padding:12px max(24px,calc((100% - 1040px)/2));
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(118deg,var(--blue-xd),var(--blue-d) 62%,#0b4c82);
  border-bottom:0;box-shadow:0 8px 28px rgba(5,42,79,.16);
}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),#ffe089 42%,transparent 78%)}
.top{position:relative}
.top-brand{gap:13px}
.top-logo{width:42px;height:42px;border-radius:11px;padding:3px;background:rgba(255,255,255,.10);filter:none}
.top h1{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:19px;letter-spacing:.06em;font-weight:750}
.top .sub{font-size:11px;color:rgba(255,255,255,.68);margin-top:3px}
.top-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.15);transition:background .18s,transform .18s}
.top-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.menu-pop{top:calc(100% + 10px);border:1px solid rgba(223,232,241,.9);border-radius:14px;box-shadow:var(--shadow-md);padding:5px;min-width:174px}
.menu-pop button{padding:11px 13px;border-radius:9px}
.menu-pop button:hover{background:var(--blue-l);color:var(--blue)}
.menu-pop button+button{border-top:0}
.modes{
  gap:8px;padding:9px max(20px,calc((100% - 1040px)/2));
  background:rgba(255,255,255,.92);border-bottom:1px solid rgba(223,232,241,.85);
  box-shadow:0 4px 16px rgba(7,57,104,.035);backdrop-filter:blur(12px);
}

.modes,.main { position:relative; z-index:1; }
.modes {
  gap:6px;
  padding:7px max(10px,calc((100% - 980px)/2));
  border-bottom:1px solid rgba(205,222,239,.9);
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px rgba(39,105,180,.08);
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
}
.mode {
  min-height:38px;
  padding:7px 10px;
  border:1px solid transparent;
  border-bottom-width:1px;
  border-radius:12px;
  color:#607286;
  background:transparent;
  transition:color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease;
}
.mode:hover { color:var(--blue-d); background:#eef6ff; }
.mode.active {
  border-color:rgba(255,255,255,.22);
  color:#fff;
  background:linear-gradient(135deg,#216fc7,var(--blue) 62%,#65a7f3);
  box-shadow:0 7px 18px rgba(44,126,223,.24),inset 0 1px rgba(255,255,255,.2);
}
.mode.active .badge { color:var(--blue-d); background:#fff; }
.modes .top-btns { border-left-color:#dbe7f3; }
.modes .top-btn {
  border-color:#d5e4f3;
  color:var(--blue-d);
  background:#eff6fe;
  box-shadow:inset 0 1px rgba(255,255,255,.8);
}
.modes .top-btn:hover { border-color:#a9c8e8; background:#e2f0ff; }
.modes .menu-pop { border:1px solid #dbe7f3; box-shadow:0 12px 34px rgba(25,95,174,.18); }
.main {
  overscroll-behavior-x:contain;
  scrollbar-color:#b7cee6 transparent;
}
.grp,.qrow,.qcard,.wsegs {
  border-color:#dce8f5;
  box-shadow:0 5px 18px rgba(30,91,157,.055);
}
.grp,.qcard { border-radius:14px; }
.qrow { border-radius:11px; }
.mode-enter-next { animation:mode-enter-next .22s cubic-bezier(.22,.75,.28,1) both; }
.mode-enter-prev { animation:mode-enter-prev .22s cubic-bezier(.22,.75,.28,1) both; }
@keyframes mode-enter-next { from { opacity:.48; transform:translateX(20px); } to { opacity:1; transform:none; } }
@keyframes mode-enter-prev { from { opacity:.48; transform:translateX(-20px); } to { opacity:1; transform:none; } }
@media (max-width:620px) {
  body::before { top:63%; width:min(88vw,380px); opacity:.052; }
  .modes { gap:3px; padding:5px 6px; }
  .mode { min-height:36px; padding:6px 5px; border-radius:10px; font-size:12px; }
  .modes .top-btns { padding-left:4px; }
  .main { padding-top:10px; }
}
@media (prefers-reduced-motion:reduce) {
  .mode-enter-next,.mode-enter-prev { animation:none!important; }
}
</style>

<style id="practical-behavior-v3">
.modes {
  gap:4px;
  padding:5px max(8px,calc((100% - 980px)/2));
  border-bottom:1px solid #dce7f2;
  background:#fff;
  box-shadow:0 2px 8px rgba(31,91,157,.06);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
.mode {
  min-height:36px;
  padding:6px 8px;
  border-radius:10px;
  color:#617185;
}
.mode.active {
  border-color:#2c7edf;
  color:#fff;
  background:#2c7edf;
  box-shadow:none;
}
.modes .top-btn { border-color:#d8e4f0; background:#f3f7fb; box-shadow:none; }
body.practice-active .modes { display:none!important; }
body.practice-active .main { padding-top:8px; }
@media (max-width:620px) {
  .modes { padding:4px 5px; }
  .mode { min-height:34px; padding:5px 4px; }
  body.practice-active .main { padding-top:7px; }
}
</style>

<style id="unified-header-v4">
.menu-pop {
  width:min(292px,calc(100vw - 16px));
  min-width:244px;
  padding:7px;
  border-radius:13px;
}
.menu-label {
  padding:3px 6px 6px;
  color:#75869a;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
}
.menu-subjects {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
}
.menu-pop .menu-subject {
  width:auto;
  padding:8px 5px;
  border:1px solid #dce7f2;
  border-radius:9px;
  color:#51657b;
  background:#f5f8fb;
  text-align:center;
  font-size:12px;
  font-weight:700;
}
.menu-pop .menu-subject.current {
  border-color:#2c7edf;
  color:#fff;
  background:#2c7edf;
}
.menu-divider {
  height:1px;
  margin:7px 2px;
  background:#e4ecf4;
}
.menu-pop .menu-reset {
  color:#9b2f2f;
  background:#fff5f5;
}
.wtoolbar { justify-content:flex-start; }
.wsegs { flex:1; }
.pv-top {
  display:grid;
  grid-template-columns:minmax(62px,1fr) minmax(0,2.25fr) minmax(62px,1fr);
  align-items:center;
  gap:8px;
  min-height:48px;
}
.back-btn { justify-self:start; }
.pv-cnt { justify-self:end; }
.pv-title {
  min-width:0;
  display:flex;
  flex:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  overflow:visible;
  color:#34475d;
  line-height:1.28;
  text-align:center;
  white-space:normal;
}
.pv-title span {
  display:block;
  width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.pv-title span+span {
  color:#728398;
  font-size:11.5px;
  font-weight:500;
}
@media (max-width:480px) {
  .pv-top { grid-template-columns:minmax(58px,1fr) minmax(0,2fr) minmax(58px,1fr); gap:5px; }
  .back-btn { padding-left:9px; padding-right:9px; }
  .pv-cnt { padding-left:8px; padding-right:8px; }
  .pv-title { font-size:12.5px; }
}
</style>

<style id="menu-overlay-fix-v5">

  isolation:isolate;

.modes .menu-pop {
  z-index:2000!important;

  min-height:46px;
  padding:10px 8px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  line-height:1.2;
}
.modes .top-btns {
  min-height:46px;
  padding-left:6px;
}
.modes .top-btn {
  width:44px;
  height:44px;
  border-radius:12px;
}
@media (max-width:620px) {
  .modes {
    min-height:56px;
    gap:4px;
    padding:6px 5px;
  }
  .mode {

    padding:8px 4px;

<style id="ui-polish-v1">
/* ── UI Polish v1 (2026-10-11)：仅覆盖样式，不改 DOM；回退=整块删除 ── */
/* 1. 列表卡片紧凑化：单行布局（标题 | 计数 进度 箭头），一屏更多章节 */
.grp-h{min-height:44px;padding:8px 12px 8px 14px;font-size:15px}
.grp-h>span:last-child{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.grp-h .meta{display:inline;margin-bottom:0}
.grp-h .arrow{display:inline-flex;width:24px;height:24px}
.grp{margin-bottom:10px}
.grp-progress{background:#e3ecf4;border-radius:99px}
.grp-progress i{background:linear-gradient(90deg,#2b6cb0,#4c8fd6);border-radius:99px}
@media(min-width:700px){main{max-width:880px}}
/* 2. 底部工具条：白底卡片感 + 悬浮反馈（!important 压过增强层运行时样式） */
.tju-btn{background:#fff !important;border:1px solid #dbe4ee !important;box-shadow:0 1px 3px rgba(15,42,77,.07) !important;font-weight:600}
.tju-btn:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(15,42,77,.12) !important}
.tju-btn:active{transform:scale(.96)}
.tju-tools{padding-top:4px}
/* 3. 选项反馈：可点提示 / 按压 / 徽章联动 */
.opt{transition:border-color .15s,background .15s,box-shadow .15s,transform .1s}
.opt:not(.correct):not(.incorrect):hover{border-color:#b9cde1;background:#f7fbff}
.opt:active{transform:scale(.985)}
.opt.correct{border-color:#2e8a55;background:#f0f9f3}
.opt.incorrect{border-color:#d98c85;background:#fdf3f2}
.opt-l{transition:background .15s,color .15s,border-color .15s}
/* 4. 顶栏进度条 + 跳题按钮 */
.pv-progress{height:6px;border-radius:99px}
.pv-progress i{border-radius:99px}
.pv-cnt{border:1px solid var(--bd);background:#fff;transition:border-color .15s,transform .1s}
.pv-cnt:active{transform:scale(.96)}
/* 5. 解析排版：编号行距统一 */
.ana-line{padding:5px 0}
.ansbox .ct{line-height:1.85}
/* 6. 全局触感统一 */
.qrow{transition:border-color .15s,background .15s,transform .1s}
.qrow:hover{border-color:#c3d6e8}
.qrow:active{transform:scale(.99)}
.btn{transition:transform .1s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
@media(max-width:480px){
.grp-h>span:last-child{gap:7px}
.grp-h .meta{font-size:11px;white-space:nowrap}
.grp-h .grp-progress{width:40px}
.grp-h{padding-left:12px;font-size:14.5px}
}
</style>
</head>

<script>
// ═══════════════ 零依赖 LaTeX / Markdown 渲染器 ═══════════════
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',varepsilon:'ε',zeta:'ζ',eta:'η',theta:'θ',vartheta:'ϑ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',upsilon:'υ',phi:'φ',varphi:'φ',chi:'χ',psi:'ψ',omega:'ω',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',Upsilon:'Υ',Phi:'Φ',Psi:'Ψ',Omega:'Ω',infty:'∞',partial:'∂',forall:'∀',emptyset:'∅',land:'∧',lor:'∨',cap:'∩',cup:'∪',subset:'⊂',supset:'⊃',subseteq:'⊆',in:'∈',notin:'∉',leq:'≤',geq:'≥',ll:'≪',gg:'≫',neq:'≠',approx:'≈',equiv:'≡',sim:'∼',simeq:'≃',propto:'∝',pm:'±',mp:'∓',times:'×',div:'÷',cdot:'·',circ:'∘',le:'≤',ge:'≥',ne:'≠',dots:'…',perp:'⊥',nabla:'∇',times:'×',leftarrow:'←',rightarrow:'→',Leftarrow:'⇐',Rightarrow:'⇒',leftrightarrow:'↔',to:'→',sum:'∑',prod:'∏',int:'∫',oint:'∮',oplus:'⊕',otimes:'⊗',cdots:'⋯',ldots:'…',angle:'∠',triangle:'△',degree:'°',hbar:'ℏ',ell:'ℓ',quad:'&nbsp;',qquad:'&nbsp;&nbsp;',prime:'′'};
const FUNCS=['sin','cos','tan','cot','sec','csc','arcsin','arccos','arctan','sinh','cosh','tanh','log','ln','lg','exp','lim','max','min','sup','inf','det','dim','arg'];

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 提取成对花括号内容（支持嵌套），返回 [内容, 剩余]
function readGroup(s,i){
  if(s[i]!=='{')return null;
  let d=1,j=i+1;
  while(j<s.length&&d>0){if(s[j]==='{')d++;else if(s[j]==='}')d--;j++;}
  return [s.slice(i+1,j-1),s.slice(j)];
}

function texInline(tex,upright){
  let out='',i=0;
  while(i<tex.length){
    const ch=tex[i];
    // 预生成的 HTML 标签（来自 texFrac/texSqrt）直接透传，不再转义
    if(ch==='<'){
      const gt=tex.indexOf('>',i);
      if(gt>i){out+=tex.slice(i,gt+1);i=gt+1;continue;}
    }
    if(ch==='\\'){
      // 其他命令：读取命令名
      const m=tex.slice(i).match(/^\\([A-Za-z]+)/);
      if(m){
        const name=m[1];
        if(GREEK[name]!==undefined){
          // 小写希腊字母变量斜体，大写正体（数学排版惯例）
          const val=GREEK[name];
          out+=(!upright&&/^[a-z]/.test(name))?'<i>'+val+'</i>':val;
          i+=m[0].length;continue;
        }
        if(name==='vec'){
          const after=tex.slice(i+4).match(/^\s*\{/);
          if(after){
            const g=readGroup(tex,i+4+after[0].length-1);
            if(g){out+=texInline(g[0])+'\u20D7';i=tex.length-(g[1]?g[1].length:0);continue;}
          }
          out+='\u20D7';i+=4;continue;
        }
        if(FUNCS.includes(name)){out+='<span class="mathrm">'+name+'</span>';i+=m[0].length;continue;}
        // \left \right 等定界符
        if(name==='left'||name==='right'){out+=tex[i+m[0].length]||'';i+=m[0].length+1;continue;}
        // \mathrm{...} \text{...} \mathbf{...}
        if(['mathrm','text','mathbf','mbox','textbf'].includes(name)){
          const after=tex.slice(i+m[0].length).match(/^\s*\{/);
          if(after){
            const g=readGroup(tex,i+m[0].length+after[0].length-1);
            if(g){const cls=name==='mathbf'?'mathbf':(name==='text'||name==='mbox'||name==='textbf'?'text':'mathrm');
              out+='<span class="'+cls+'">'+texInline(g[0],true)+'</span>';
              i=i+m[0].length+after[0].length+g[0].length+1;continue;}
          }
        }
        out+=m[0];i+=m[0].length;continue;
      }
      // \, \; 等
      const sm=tex.slice(i).match(/^\\[,;!](\s*)/);
      if(sm){out+='&nbsp;';i+=sm[0].length;continue;}
      out+=escHtml(ch);i++;continue;
    }
    if(ch==='^'||ch==='_'){
      const tag=ch==='^'?'sup':'sub';
      let j=i+1;while(tex[j]===' ')j++;
      if(tex[j]==='{'){const g=readGroup(tex,j);if(g){out+='<'+tag+'>'+texInline(g[0])+'</'+tag+'>';i=j+g[0].length+2;continue;}}
      else if(tex[j]){out+='<'+tag+'>'+texInline(tex[j])+'</'+tag+'>';i=j+1;continue;}
      out+=ch;i++;continue;
    }
    if(ch==='{'){out+='';i++;continue;}
    if(ch==='}'){i++;continue;}
    // 变量字母斜体，数字/标点正体（数学排版惯例）
    if(/[A-Za-z]/.test(ch)&&!upright){out+='<i>'+ch+'</i>';i++;continue;}
    out+=escHtml(ch);i++;
  }
  return out;
}

// 用 readGroup（支持嵌套花括号）重写 \frac / \sqrt 处理
function texFrac(tex){
  let guard=0;
  while(tex.indexOf('\\frac')>=0&&guard++<60){
    const i=tex.indexOf('\\frac');
    let p=i+5;while(tex[p]===' ')p++;
    const g1=tex[p]==='{'?readGroup(tex,p):null;
    if(!g1){tex=tex.slice(0,i)+'frac'+tex.slice(i+5);continue;}
    let p2=g1[1].length? p+g1[0].length+2 : p;
    // g1[1] 是剩余串，在其起始处读第二组：定位原串位置 = 总长 - 剩余长
    p2=tex.length-g1[1].length;
    while(tex[p2]===' ')p2++;
    const g2=tex[p2]==='{'?readGroup(tex,p2):null;
    if(!g2){tex=tex.slice(0,i)+'frac'+tex.slice(i+5);continue;}
    const rep='<span class="frac"><span>'+g1[0]+'</span><span class="bot">'+g2[0]+'</span></span>';
    tex=tex.slice(0,i)+rep+tex.slice(tex.length-(g2[1]?g2[1].length:0));
  }
  return tex;
}
function texSqrt(tex){
  let guard=0;
  while(tex.indexOf('\\sqrt')>=0&&guard++<60){
    const i=tex.indexOf('\\sqrt');
    let p=i+5;while(tex[p]===' ')p++;
    let inner='';
    if(tex[p]==='{'){
      const g=readGroup(tex,p);
      if(!g){tex=tex.slice(0,i)+'sqrt'+tex.slice(i+5);continue;}
      inner=g[0];tex=tex.slice(0,i)+'<span class="sqrt"><span class="sqrt-inner">'+inner+'</span></span>'+tex.slice(tex.length-(g[1]?g[1].length:0));
    }else if(tex[p]){
      inner=tex[p];
      tex=tex.slice(0,i)+'<span class="sqrt"><span class="sqrt-inner">'+inner+'</span></span>'+tex.slice(p+1);
    }else{tex=tex.slice(0,i)+'sqrt';}
  }
  return tex;
}

// 题库中部分早期题目使用裸文本公式，补上定界符后交给 KaTeX 渲染
function wrapBareMath(text){
  if(!text||typeof text!=='string')return text;
  return text; // 马原题库以文字为主，无需物理公式包装
  const protect=match=>{protectedParts.push(match);return '\u0000M'+(protectedParts.length-1)+'\u0000';};
  let out=text.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+?\$/g,protect);
  out=out.replace(/\(\s*([+-]?\d+)\s*\/\s*(\d+)\s*\)(?=\s*(?:s|m|cm|mm|Hz|N|eV|nm|μm|$|[，。；,.;]))/g,'$\\frac{$1}{$2}$');
  out=out.replace(/(?<![\w/])([+-]?\d+)\s*\/\s*(\d+)(?=\s*(?:s|m|cm|mm|Hz|N|eV|nm|μm|[，。；,.;]|$))/g,(_,numerator,denominator)=>'$\\frac{'+numerator+'}{'+denominator+'}$');
  out=out.replace(/(?<![A-Za-zα-ωΑ-Ω\\])([A-Za-zα-ωΑ-Ω](?:\s*[_^]\s*[A-Za-z0-9]+)?\s*=\s*[-+]?\s*(?:_{2,}|_+|[A-Za-z0-9.]+)(?:\s*(?:cm|mm|m|s|Hz|N|eV|nm|μm|rad\/s|m\/s))?(?:\s*[+\\-×/]\s*[-+]?\s*[A-Za-z0-9.]+)*)/g,(_,formula)=>'$'+formula+'$');
  return out.replace(/\u0000M(\d+)\u0000/g,(_,i)=>protectedParts[i]);
}

function wrapInlinePhysics(text){
  if(!text||typeof text!=='string')return text;
  return text; // 马原题库无单位/数值排版需求
  const protect=match=>{protectedParts.push(match);return '\u0000P'+(protectedParts.length-1)+'\u0000';};
  let out=text.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+?\$/g,protect);
  const units='MeV|eV|kHz|MHz|GHz|Hz|μm|nm|mm|cm|km|kg|mg|N/m|m/s|cm/s|mm/s|rad/s|m|g|s|V|K|N|J|C|Pa|Wb|T';
  out=out.replace(new RegExp('(^|[^A-Za-z0-9])([+-]?\\d+(?:\\.\\d+)?(?:\\s*[×x]\\s*10\\s*\\^?\\s*\\{?[+-]?\\d+\\}?)?\\s*(?:'+units+'))(?=$|[\\s\\u4e00-\\u9fff，。；、,.!?！？:：)）])','g'),(_,prefix,value)=>{
    let formula=value.replace(/×|x(?=\s*10)/g,'\\times ').replace(/10\s*\^?\s*\{?([+-]?\d+)\}?/g,'10^{$1}');
    formula=formula.replace(new RegExp('\\s*('+units+')$'),(_,unit)=>unit==='μm'?'\\ \\mu\\mathrm{m}':'\\ \\mathrm{'+unit+'}');
    return prefix+'$'+formula+'$';
  });
  out=out.replace(/(^|[^\d])([+-]?\d+(?:\.\d+)?\s*:\s*[+-]?\d+(?:\.\d+)?)(?=$|[^\d])/g,(_,prefix,ratio)=>prefix+'$'+ratio.replace(/\s/g,'')+'$');
  out=out.replace(/(^|[^\d])([+-]?\d+(?:\.\d+)?)°/g,(_,prefix,value)=>prefix+'$'+value+'^\\circ$');
  out=out.replace(/(^|[^\d])([+-]?\d+(?:\.\d+)?)(?=\s*(?:条|倍|个波长))/g,(_,prefix,value)=>prefix+'$'+value+'$');
  out=out.replace(/\$[^$\n]+?\$/g,protect);
  out=out.replace(/(^|[^0-9])([+-]?\d+(?:\.\d+)?)\s*\^\s*0(?=$|[\s，。；、,:：)）])/g,(_,prefix,value)=>prefix+'$'+value+'^\\circ$');
  out=out.replace(/([λμνθφψωΔε])/g,'$$$1$');
  out=out.replace(/(^|[\s\u4e00-\u9fff（(，,；;：:])([A-Za-z])(?=\s*(?:[\u4e00-\u9fff，。；、,:：=<>+\-*/()（）]|$))/g,'$1$$$2$');
  // mobile-math-notation-v1
  out=out.replace(/(^|[\s\u4e00-\u9fff（(，,；;：:])([ED])\s*([XYZ])\s*=\s*([+-]?\d+(?:\.\d+)?)(?=$|[\s\u4e00-\u9fff，。；、,.!?！？)）])/g,(_,prefix,op,v,value)=>prefix+'$'+op+'('+v+')='+value+'$');
  out=out.replace(/(^|[\s\u4e00-\u9fff（(，,；;：:])([ED])\s*([XYZ])(?=$|[\s\u4e00-\u9fff，。；、,.!?！？=)）])/g,(_,prefix,op,v)=>prefix+'$'+op+'('+v+')$');
  return out.replace(/\u0000P(\d+)\u0000/g,(_,i)=>protectedParts[i]);
}

function renderTex(text){
  if(!text)return'';
  // KaTeX 可用时保留原始 $...$ 定界符，交由 renderMathInElement 排版（真实 LaTeX 效果）
  if(typeof renderMathInElement==='function'){
    // 公式内空位下划线 → KaTeX \underline{\quad}，避免 qblank span 破坏公式解析
    text=wrapBareMath(text);
    text=wrapInlinePhysics(text);
    return escHtml(text.replace(/\$([^$]*)\$/g,(m,t)=>'$'+(t||'').replace(/(?:\\_){2,}|_{2,}|＿{2,}/g,'\\underline{\\quad}')+'$'));
  }
  // 备用：先保护 $$...$$
  const blocks=[];
  text=text.replace(/\$\$([\s\S]*?)\$\$/g,(m,t)=>{blocks.push(t);return'\u0000B'+(blocks.length-1)+'\u0000';});
  const inls=[];
  text=text.replace(/\$([^$\n]+?)\$/g,(m,t)=>{inls.push(t);return'\u0000I'+(inls.length-1)+'\u0000';});
  text=escHtml(text);
  const texify=t=>texInline(texSqrt(texFrac(escHtml(t.replace(/\\dfrac/g,'\\frac').replace(/\n/g,' ')))));
  text=text.replace(/\u0000B(\d+)\u0000/g,(m,n)=>'<div class="tex-display tex">'+texify(blocks[n])+'</div>');
  text=text.replace(/\u0000I(\d+)\u0000/g,(m,n)=>'<span class="tex">'+texify(inls[n])+'</span>');
  return text;
}

// OCR 早期题目中有少量整行 LaTeX 未带 $ 定界符，识别后按块级公式渲染
function normalizeBareMathLine(line){
  if(!line||line.includes('$'))return line;
  const command=/\\(?:frac|sqrt|cos|sin|tan|psi|varphi|phi|pi|times|left|right|begin|infty|mathrm|quad)\b/.test(line);
  const structure=/[=_^{}]/.test(line);
  const startsLikeFormula=/^\s*\(?\s*(?:[A-Za-z]|\\[A-Za-z]+)(?:\s*[_^(]|\s*=)/.test(line);
  const denseLatex=(line.match(/\\/g)||[]).length>=2;
  if(command&&structure&&(startsLikeFormula||denseLatex)){
    const fixed=line.replace(/\\tag\s*\{SI\}/g,'\\quad \\mathrm{(SI)}');
    return '$$'+fixed+'$$';
  }
  const plain=line.replace(/[.;；。]+$/,'').trim();
  const allowed=/^[0-9A-Za-zα-ωΑ-ΩλμνθπΔεφψω\s.=+\-*/^(){}\[\]\\]+$/.test(plain);
  const plainVars=/^[a-zα-ωλμνθπδεφψω](?:\s*[a-zα-ωλμνθπδεφψω*/+\-]\s*){0,7}$/.test(plain);
  const numericOnly=/^[+-]?\d+(?:\.\d+)?$/.test(plain);
  const mathLike=plainVars||numericOnly||(/[0-9]/.test(plain)&&/[A-Za-zα-ωΑ-ΩλμνθπΔεφψω]|[=+\-*/^()]/.test(plain));
  if(allowed&&mathLike&&plain.length<=120){
    let fixed=plain.replace(/λ/g,'\\lambda ').replace(/μ/g,'\\mu ');
    fixed=fixed.replace(/\s*(MeV|eV|kHz|MHz|GHz|Hz|μm|nm|mm|cm|km|kg|mg|N\/m|m\/s|cm\/s|mm\/s|rad\/s|m|g|s|V|K|N|J|C|Pa|Wb|T)\s*$/,'\\ \\mathrm{$1}');
    return '$'+fixed+'$';
  }
  return line;
}

function renderMd(text){
  if(!text)return'';
  const lines=String(text).split('\n');
  let html='',buf=[];
  const missingImage=line=>{
    const match=line.match(/^!\[\[([^\]|]+)(?:\|([^\]]+))?\]\]\s*$/);
    if(!match)return null;
    const imageName=match[1].trim();
    const size=match[2]?parseInt(match[2],10):0;
    const width=size>0?' style="width:'+size+'px;max-width:100%;height:auto"':'';
    return '<img src="images/'+escHtml(imageName)+'" loading="lazy"'+width+' alt="题目示意图">';
  };
  // 填空空位：转义下划线或连续下划线 → 样式空位线（须在 renderTex 转义之后；公式段 $...$ 不碰）
  const blankify=h=>h.split(/(\$[^$]+\$)/g).map(seg=>/^\$[^$]+\$$/.test(seg)?seg:seg.replace(/(?:\\_\s*){2,}|_{2,}|＿{2,}/g,'<span class="qblank"></span>').replace(/\\_/g,'_')).join('');
  const renderLine=l=>{
    const images=[];
    l=l.replace(/!\[[^\]]*\]\(([^)]+)\)/g,(_,src)=>{images.push(src);return '\u0000IMG'+(images.length-1)+'\u0000';});
    return blankify(renderTex(l)).replace(/\u0000IMG(\d+)\u0000/g,(_,i)=>'<img src="'+escHtml(images[i])+'" loading="lazy" style="max-width:100%;border-radius:6px">');
  };
  const flush=()=>{
    if(!buf.length)return;
    // 整段是块级公式时整体渲染，避免 <br> 混入公式
    if(/^\$\$/.test(buf[0])&&/\$\$$/.test(buf[buf.length-1])){
      html+=renderTex(buf.join('\n'));
    }else{
      html+='<p>'+buf.map(renderLine).join('<br>')+'</p>';
    }
    buf=[];
  };
  for(const raw of lines){
    const line=normalizeBareMathLine(raw.trim());
    if(line===''){flush();continue;}
    const imgm=line.match(/^!\[[^\]]*\]\(([^)]+)\)\s*$/);
    if(imgm){flush();html+='<img src="'+escHtml(imgm[1])+'" loading="lazy">';continue;}
    const missing=missingImage(line);
    if(missing){flush();html+=missing;continue;}
    let l=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    buf.push(l);
  }
  flush();
  return html;
}

function questionDesc(q, displayNumber){
  const desc=String(q.desc||'').replace(/^\s*\d+\s*[、.．]\s*/, '');
  return (displayNumber===null?'':displayNumber+'、')+desc;
}

// AI 解析排版：按句号拆成编号步骤，“易错点”单独高亮块（公式内不含中文句号，切分安全）
function renderAnalysis(text){
  if(!text)return'';
  const parts=String(text).split(/(?=易错点[:：])/);
  const main=(parts[0]||'').trim();
  const warn=parts.slice(1).join('').trim();
  let html='';
  // 拆步：优先按句号；若只有一句且较长，再按逗号拆成步骤（公式不含中文标点，切分安全）
  let steps=main.split('。').map(s=>s.trim()).filter(Boolean);
  if(steps.length===1&&steps[0].length>30&&steps[0].includes('，')){
    steps=steps[0].split('，').map(s=>s.trim()).filter(Boolean);
  }
  if(steps.length>1){
    html+=steps.map((s,i)=>'<div class="ana-line"><span class="ana-num">'+(i+1)+'</span><span>'+renderTex(s)+'</span></div>').join('');
  }else if(main){
    html+='<div>'+renderTex(main)+'</div>';
  }
  if(warn){
    const ci=warn.search(/[:：]/);
    const label=ci>=0?warn.slice(0,ci+1):'易错点：';
    const body=ci>=0?warn.slice(ci+1):warn;
    html+='<div class="ana-warn"><b>⚠ '+renderTex(label)+'</b> '+renderTex(body.replace(/。$/,''))+'</div>';
  }
  return html;
}

function normalizedOptions(q){
  const options=(q.options||[]).map(o=>({...o}));
  if(q.type==='choice'&&options.length===4){
    const last=options[3];
    const match=String(last.text||'').match(/(?:^|\s)(E)[.、]\s*(.+)$/s);
    if(match){
      last.text=String(last.text).slice(0,match.index).trim();
      options.push({letter:'E',text:match[2].trim()});
    }
  }
  return options;
}

function toggleAna(hd){

// KaTeX 排版：在 DOM 插入后对容器内 $...$ / $$...$$ 统一渲染
function applyMath(el){
  if(!el||typeof renderMathInElement!=='function')return;
  renderMathInElement(el,{
    delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],
    throwOnError:false
  });
}

// ═══════════════ 数据与状态 ═══════════════
let DATA=null;
let mode='chapter';           // chapter | paper | wrong
let view='list';              // list | practice
let pracList=[];              // 当前练习题目 id 列表
let pracIdx=0;
let pracTitle='';
let lastOpenGrp=null;         // 记忆章节列表展开状态，返回时恢复
let wrongGroup='date';        // 错题回顾分类：date 按日期 | chapter 按章节 | paper 按真题卷
let records={};               // localStorage 作答记录

const LS_KEY='marx-quiz-records-v1';
const LS_UI='marx-quiz-ui-v1';
function loadRecords(){try{records=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(e){records={};}}

/* ─── 可靠推送：脏键差量 + 失败重试 + 关页 keepalive ─── */
const LS_SNAP=LS_KEY+':pushsnap', LS_DIRTY=LS_KEY+':dirty';
let dirtyKeys={};
try{dirtyKeys=JSON.parse(localStorage.getItem(LS_DIRTY)||'{}')||{};}catch(e){dirtyKeys={};}
function saveDirty(){try{localStorage.setItem(LS_DIRTY,JSON.stringify(dirtyKeys));}catch(e){}}
function recSnapshot(){try{return JSON.parse(localStorage.getItem(LS_SNAP)||'{}')||{};}catch(e){return {};}}
function snapNow(){try{localStorage.setItem(LS_SNAP,JSON.stringify(records));}catch(e){}}
function recDiff(){
  const snap=recSnapshot(),dirty={};
  const keys=new Set([...Object.keys(records),...Object.keys(snap)]);
  for(const k of keys){
    if(JSON.stringify(records[k]===undefined?null:records[k])!==JSON.stringify(snap[k]===undefined?null:snap[k]))dirty[k]=1;
  }
  return dirty;
}
function pushSubset(){
  const ks=Object.keys(dirtyKeys);
  const sub={};
  for(const k of ks){if(records[k]!==undefined)sub[k]=records[k];}
  return sub;
}
function saveRecords(){
  localStorage.setItem(LS_KEY,JSON.stringify(records));
  Object.assign(dirtyKeys,recDiff());
  saveDirty();
  updateWrongBadge();
  schedulePush();
}

function rec(qid){return records[qid]||{};}
function isWrong(qid){return !!rec(qid).wrong;}
function isDone(qid){const r=rec(qid);return r.ok===true||r.ok===false;}
// 作答状态按训练上下文隔离：章节/真题互不可见（via 记录作答来源；旧记录无 via 视为章节作答）
function viaOf(r){return (r&&r.via)||'chapter';}
function recIn(qid){const r=rec(qid);return mode!=='wrong'&&viaOf(r)!==mode?null:r;}
function doneIn(qid){const r=recIn(qid);return !!r&&(r.ok===true||r.ok===false);}

// UI 状态持久化：刷新后恢复模式/展开分组/练习进度
function saveUI(){
  try{localStorage.setItem(LS_UI,JSON.stringify({
    mode,lastOpenGrp,wrongGroup,
    session:view==='practice'?{list:pracList,idx:pracIdx,title:pracTitle}:null
  }));}catch(e){}
}
function loadUI(){try{return JSON.parse(localStorage.getItem(LS_UI)||'{}');}catch(e){return{};}}

// 续做记忆：退出练习时记住做到第几题，同一题目列表再次进入时接着做（刷新恢复走 session，与此独立）
// 位置按单元存为 records 里的 __resume-<科目>-<卷特征> 记录，随作答记录走同一云端同步通道（按键按 at 合并，各单元互不覆盖）；LS_RESUME 为旧版本地格式仅作回退
const LS_RESUME=LS_KEY.replace('records','resume');
const RESUME_KEY='__resume-'+LS_KEY.replace('-quiz-records-v1','');
function resumeUnitKey(ids){return RESUME_KEY+'-'+ids.length+'_'+ids[0]+'_'+ids[ids.length-1];}
function saveResume(idx){
  try{
    if(!pracList.length)return;
    records[resumeUnitKey(pracList)]={list:pracList.slice(),idx:idx==null?pracIdx:idx,title:pracTitle,at:Date.now()};
    saveRecords();
  }catch(e){}
}
function resumeIdx(ids){
  if(!ids.length)return 0;
  let s=rec(resumeUnitKey(ids));
  if(!Array.isArray(s.list)){try{s=JSON.parse(localStorage.getItem(LS_RESUME)||'null')||{};}catch(e){s={};}}
  if(Array.isArray(s.list)&&s.list.length===ids.length&&s.list.every((id,i)=>ids[i]===id))return Math.min(Math.max(s.idx||0,0),ids.length-1);
  return 0;
}

// 时间格式化：08-24 15:30
function fmtTs(ts){
  if(!ts)return'';
  const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function updateWrongBadge(){
  const n=DATA?DATA.questions.filter(q=>isWrong(q.id)).length:0;
  const b=document.getElementById('wrong-badge');

// ═══════════════ 导出 / 导入 ═══════════════
function exportData(){
  const text=JSON.stringify({v:1,exportedAt:new Date().toISOString(),records},null,1);
  const filename='马原刷题记录-'+new Date().toISOString().slice(0,10)+'.json';
  if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){
    window.AndroidBridge.saveFile(filename,text);
    toast('请选择保存位置');
    return;
  }
  const blob=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();URL.revokeObjectURL(a.href);
  toast('已导出作答记录');
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const recs=obj.records||obj;
      if(typeof recs!=='object')throw 0;
      let n=0;
      for(const[k,v]of Object.entries(recs)){if(v&&typeof v==='object'){records[k]=v;n++;}}
      saveRecords();toast('已导入 '+n+' 条记录');
      renderList();
    }catch(e){toast('导入失败：文件格式错误');}
  };
  rd.readAsText(f);input.value='';
}

function subjName(){
  return ({marx:'马原',physics:'大物',probability:'概率论'})[(LS_KEY||'').replace('-quiz-records-v1','')]||'刷题';
}
function buildWrongMd(){
  const wqs=DATA.questions.filter(q=>isWrong(q.id));
  if(!wqs.length)return '';
  const typeName=q=>q.type==='multi'?'多选题':(q.subtype==='judge'?'判断题':(q.type==='choice'?'单选题':'开放题（自判）'));
  const L=[];
  L.push('# '+subjName()+'错题导出（'+new Date().toISOString().slice(0,10)+'，共 '+wqs.length+' 道）');
  L.push('');
  L.push('说明：以下是答题者的错题清单，每题包含完整题干、选项、答题者的作答、正确答案与解析。请基于这些内容帮忙分析错因、讲解相关知识点。');
  L.push('');
  let lastChap=null,i=0;
  for(const q of wqs){
    const r=rec(q.id);
    if(q.chapter.label!==lastChap){lastChap=q.chapter.label;L.push('## '+lastChap);L.push('');}
    i++;
    L.push('### '+i+'. '+(q.source||'')+' ｜ '+typeName(q));
    L.push('');
    L.push('**题干：**'+String(q.desc||'').trim());
    L.push('');
    if(q.options&&q.options.length){
      for(const o of q.options)L.push('- '+o.letter+'. '+String(o.text).replace(/\n/g,' '));
      L.push('');
    }
    let my;
    if(r.my!==undefined&&r.my!=='')my=String(r.my);
    else if(q.type!=='choice'&&q.type!=='multi')my=r.ok===true?'（自判：做对了）':r.ok===false?'（自判：做错了）':'（未作答）';
    else my=r.revealed?'（未作答，查看过答案）':'（未记录）';
    L.push('- 我的答案：'+my);
    L.push('- 正确答案：'+q.answer);
    if(q.analysis)L.push('- 课本解析：'+String(q.analysis).replace(/\n/g,' '));
    L.push('- 作答 '+(r.n||1)+' 次'+(r.at?'，最近 '+fmtTs(r.at):''));
    L.push('');
  }
  return L.join('\n');
}
function exportWrongMd(){

  const n=DATA.questions.filter(q=>isWrong(q.id)).length;

  if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){

  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');

  a.download=filename;
  a.click();URL.revokeObjectURL(a.href);

}

// ═══════════════ 云端同步（Cloudflare Worker + KV）═══════════════
const LS_SYNC='marx-quiz-sync-v1';
let syncCfg=null;
function loadSyncCfg(){try{syncCfg=JSON.parse(localStorage.getItem(LS_SYNC)||'null');}catch(e){syncCfg=null;}}
function syncConfig(){
  const cur=syncCfg||{};
  const url=prompt('同步服务器地址（Worker URL）',cur.url||'');
  if(url===null)return;
  const token=prompt('同步密钥（token）',cur.token||'');
  if(token===null)return;
  const slot=prompt('同步槽位（自己的设备用同一个，默认 default）',cur.slot||'default');
  if(slot===null)return;
  if(!url||!token){syncCfg=null;localStorage.removeItem(LS_SYNC);toast('已清除同步配置');return;}
  syncCfg={url:url.replace(/\/+$/,''),token,slot:slot||'default'};
  localStorage.setItem(LS_SYNC,JSON.stringify(syncCfg));
  toast('同步已配置，正在拉取…');
  pullCloud(true);
}
function syncHeaders(){return{'authorization':'Bearer '+syncCfg.token,'content-type':'application/json'};}
function syncUrl(){return syncCfg.url+'/?slot='+encodeURIComponent(syncCfg.slot);}
// 合并：同题以时间戳较新为准，返回本地更新条数
function mergeRemote(remote){
  let changed=0;
  for(const[k,v]of Object.entries(remote||{})){
    if(!v||typeof v!=='object')continue;
    const l=records[k];
    if(!l||((v.at||0)>(l.at||0))){records[k]=v;changed++;}
  }
  return changed;
}
async function pullCloud(silent){
  if(!syncCfg){if(!silent)toast('未配置同步：⋯ → 云端同步设置');return;}
  try{
    const r=await fetch(syncUrl(),{headers:syncHeaders()});
    if(!r.ok)throw new Error(r.status);
    const obj=await r.json();
    const changed=mergeRemote(obj.records||{});
    localStorage.setItem(LS_KEY,JSON.stringify(records));
    snapNow();
    updateWrongBadge();
    if(pendingPush)setTimeout(()=>{if(pendingPush)pushCloud(true);},1000);
    if(changed){if(view==='list')renderList();else renderPractice();}
    if(!silent)toast(changed?'已拉取，更新 '+changed+' 条':'云端无更新');
  }catch(e){if(!silent)toast('拉取失败：'+e.message);}
}
let pushRetryTimer=null;
async function pushCloud(silent){
  if(!syncCfg){if(!silent)toast('未配置同步：⋯ → 云端同步设置');return;}
  const sub=pushSubset();
  if(!Object.keys(sub).length){pendingPush=false;return;}
  try{
    const r=await fetch(syncUrl(),{method:'PUT',headers:syncHeaders(),
      body:JSON.stringify({v:1,pushedAt:new Date().toISOString(),records:sub})});
    if(!r.ok)throw new Error(r.status);
    Object.assign(dirtyKeys,recDiff());     // 推送期间可能有新改动
    for(const k of Object.keys(sub)){if(JSON.stringify(records[k]===undefined?null:records[k])===JSON.stringify(sub[k]===undefined?null:sub[k]))delete dirtyKeys[k];}
    saveDirty();snapNow();
    pendingPush=false;
    if(!silent)toast('已推送到云端 ✓');
  }catch(e){
    pendingPush=true;
    if(!silent)toast('推送失败：'+e.message+'，将自动重试');
    clearTimeout(pushRetryTimer);
    pushRetryTimer=setTimeout(()=>{if(pendingPush)pushCloud(true);},5000);
  }
}
// 作答后自动延迟推送（防抖）
let pushTimer=null;let pendingPush=false;
function schedulePush(){
  if(!syncCfg)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushCloud(true),1500);
}
// 清除类操作立即推送，防止刷新时被云端旧记录合并回滚
function pushNow(){
  if(!syncCfg)return;
  clearTimeout(pushTimer);
  pushCloud(true);
}
window.addEventListener('pagehide',function(){
  try{
    if(!syncCfg)return;
    Object.assign(dirtyKeys,recDiff());
    const sub=pushSubset();
    if(!Object.keys(sub).length)return;
    fetch(syncUrl(),{method:'PUT',headers:syncHeaders(),keepalive:true,
      body:JSON.stringify({v:1,pushedAt:new Date().toISOString(),records:sub})}).catch(function(){});
  }catch(e){}
});

性、顺序性（一维性）；空间指物质运动的广延性、伸张性（三维性）。没有离开物质运动的纯粹时间和空间。\n- 意识的起源：自然界长期发展的产物 + 社会历史发展的产物（社会实践特别是劳动起决定作用）。\n- 意识是人脑的机能和属性，是客观世界的主观映象：内容客观、形式主观。“观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已。”\n- 意识的能动作用：目的性和计划性、创造性、指导实践改造客观世界、调控人的行为和生理活动。\n- 尊重客观规律是正确发挥主观能动性的前提；只有充分发挥主观能动性才能正确认识和利用客观规律。\n- 世界的统一性在于它的物质性，世界统一于物质。\n## 第二节 事物的普遍联系和变化发展\n- 联系的特点：客观性（事物本身所固有、不以人的意志为转移）、普遍性（三层含义）、多样性、条件性。\n- 发展的实质：新事物的产生和旧事物的灭亡。\n- 对立统一规律是唯物辩证法的实质和核心。矛盾的两种基本属性：同一性（相互依存、相互贯通）与斗争性（相互排斥、相互分离）。\n- 矛盾的普遍性和特殊性（共性和个性）辩证关系原理，是马克思主义普遍真理同各国具体实际相结合的哲学基础。\n- 量变质变规律：量变是质变的必要准备，质变是量变的必然结果；事物发展是渐进性与飞跃性的统一。\n- 否定之否定规律：辩证否定的实质是“扬弃”；事物发展是前进性与曲折性的统一（螺旋式上升）。\n- 基本范畴（联系和发展的基本环节）：内容与形式、本质与现象、原因与结果、必然性与偶然性、现实与可能。基因变异导致新物种产生＝偶然转化为必然。\n## 第三节 唯物辩证法是认识世界和改造世界的根本方法\n- 辩证思维方法：归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一。\n- 矛盾分析法是根本的认识方法；坚持“两点论”与“重点论”的统一（牵住“牛鼻子”）。","第二章 实践与认识及其发展规律":"## 第一节 实践与认识\n- 实践观点是马克思主义首要的和基本的观点。实践是人类能动地改造客观世界的物质活动，具有客观实在性、自觉能动性和社会历史性。\n- 实践的基本形式：物质生产实践（最基本，构成全部社会生活的基础）、社会政治实践、科学文化实践。\n- 认识的本质：主体在实践基础上对客体的能动反映（反映性与创造性的统一）。\n- 感性认识的形式：感觉、知觉、表象；理性认识的形式：概念、判断、推理。割裂二者会导致经验论和唯理论。\n- 认识过程的两次飞跃：实践→认识，认识→实践（“实践—认识—实践”）。\n- 实践是认识的基础：实践是认识的来源、是认识发展的动力、是认识的目的、是检验认识真理性的唯一标准。\n## 第二节 真理与价值\n- 真理是标志主观与客观相符合的哲学范畴；真理的本质属性是客观性；真理具有一元性。\n- 真理的绝对性与相对性：任何真理既包含不依赖于人的客观内容（绝对性），其反映的范围和程度又是有限的（相对性）；根源于人类认识能力的无限性与有限性的矛盾。\n- 真理与谬误：有原则界限，又相互依存、在一定条件下相互转化；真理的发展是通过与谬误的斗争实现的。\n- 实践是检验真理的唯一标准，由真理的本性和实践的特点（直接现实性）决定。\n- 价值的特性：主体性、客观性、多维性、社会历史性。价值是一种客观存在，独立于人们对它的认识和评价。\n## 第三节 认识世界和改造世界\n- 认识世界的根本目的在于改造世界；一切从实际出发，实事求是；坚持守正创新。","第三章 人类社会及其发展规律":"## 第一节 人类社会的存在与发展\n- 社会历史观的基本问题：社会存在与社会意识的关系问题。\n- 社会存在＝自然地理环境＋人口因素＋物质生产方式。地理环境和人口因素只能加速或延缓社会发展，生产方式是社会历史发展的决定力量。\n- 社会意识分为社会心理（低层次、感性为主）和社会意识形式（高层次）。意识形态包括政治法律思想、道德、艺术、宗教、哲学等；自然科学、形式逻辑不属于意识形态。\n- 社会意识的相对独立性：不完全同步性和不平衡性；内部各形式相互影响及历史继承性；对社会存在的能动反作用（突出表现）。\n- 生产力基本要素：劳动资料、劳动对象、劳动者。生产工具是生产力发展水平的客观尺度。\n- 生产关系三方面：生产资料所有制关系（最基本、有决定意义）、生产中人与人的关系、产品分配关系。生产关系是人与人之间的经济关系。\n- 生产力决定生产关系，生产关系反作用于生产力；经济基础决定上层建筑，上层建筑反作用于经济基础。这两对矛盾是社会基本矛盾。\n- 经济基础是生产关系的总和，其实质即社会的经济结构。上层建筑＝政治上层建筑（制度、设施、组织，居主导地位）＋观念上层建筑（意识形态）。\n## 第二节 社会历史发展的动力\n- 社会基本矛盾是社会发展的根本动力；阶级斗争是阶级社会发展的直接动力；改革是同一种社会形态的自我完善和发展；科技革命的作用具有两重性。\n## 第三节 人民群众在历史发展中的作用\n- 人民群众是历史的创造者：社会物质财富、精神财富的创造者，社会变革的决定力量。\n- 从质上看，人民群众是一切对社会历史发展起推动作用的人们；从量上看，是社会人口的绝大多数。\n- 人的本质是一切社会关系的总和，本质属性是社会属性。评价历史人物要坚持历史分析方法和阶级分析方法。","第四章 资本主义的本质及规律":"## 第一节 商品经济和价值规律\n- 商品经济产生的两个历史条件：社会分工的出现；生产资料和劳动产品属于不同的所有者。\n- 商品二因素：使用价值（自然属性，构成社会财富的物质内容）和价值（社会属性，凝结的无差别人类劳动）。劳动二重性决定商品二因素：具体劳动创造使用价值，抽象劳动形成价值。\n- 价值量与社会必要劳动时间成正比，与劳动生产率成反比。\n- 货币是固定充当一般等价物的商品，本质是商品价值的一般等价物。流通手段和支付手段职能使经济危机有了抽象的可能性。\n- 价值规律：商品价值量由社会必要劳动时间决定，商品按价值量交换；表现形式是价格围绕价值自发波动。消极后果：可能导致垄断、阻碍技术进步；两极分化；比例失调、资源浪费。\n- 私有制商品经济的基本矛盾：私人劳动和社会劳动的矛盾。“惊险的跳跃”成功，私人劳动才能转化为社会劳动。\n- 马克思劳动价值论扬弃了英国古典政治经济学，为剩余价值论的创立奠定了基础。\n## 第二节 资本主义经济制度\n- 资本原始积累用暴力手段使生产者与生产资料分离，不是资本积累的源泉；资本积累的源泉是剩余价值。\n- 劳动力成为商品的两个条件：劳动者是自由人；劳动者没有生产资料和生活资料。货币转化为资本的关键是买到劳动力。\n- 劳动力商品的价值：维持本人及家属生存所必需的生活资料价值＋教育训练费用（含历史和道德因素）。\n- 不变资本（c，生产资料）只转移价值不增殖；可变资本（v，劳动力）创造剩余价值，是剩余价值的唯一源泉。\n- 必要劳动时间再生产劳动力价值，剩余劳动时间生产剩余价值。剩余价值率 m'=m/v 反映剥削程度。\n- 绝对剩余价值靠延长工作日；相对剩余价值靠缩短必要劳动时间（社会劳动生产率普遍提高），是资本家追逐超额剩余价值的客观后果；超额剩余价值只能由少数资本家暂时获得。\n- 工资的本质是劳动力的价值或价格，不是劳动的价值或价格。\n- 资本有机构成提高使资本对劳动力的需求日益相对减少，形成相对过剩人口。\n- 利润率 p'=m/(c+v) 反映预付资本的增殖程度，总是低于剩余价值率。部门间竞争导致利润率平均化，价值转化为生产价格；全社会利润总额＝剩余价值总额。\n- 经济危机的根本原因：资本主义基本矛盾（生产社会化与生产资料资本主义私人占有的矛盾）。危机周期四个阶段：危机（基本阶段）、萧条、复苏、高涨。\n## 第三节 资本主义上层建筑\n- 资本主义政治制度的本质是资产阶级进行政治统治的工具；资本主义意识形态是资产阶级的阶级意识的集中体现。","第五章 资本主义的发展及其趋势":"## 第一节 垄断资本主义的形成与发展\n- 自由竞争引起生产集中和资本集中，发展到一定阶段必然引起垄断。资本主义发展两个阶段：自由竞争阶段和垄断阶段。\n- 金融寡头在经济领域的统治靠“参与制”，在政治上的统治靠同政府的“个人联合”。\n- 垄断利润是垄断资本的实质，主要通过垄断价格（垄断高价和垄断低价）实现。垄断条件下竞争的目的是获取高额垄断利润。\n- 垄断不能消除竞争：垄断没有消除产生竞争的经济条件；垄断必须通过竞争来维持；社会生产复杂多样，垄断组织不可能囊括一切生产。\n- 国家垄断资本主义的主要形式：国家直接经营企业、国家与私人合营、国家参与私人垄断资本再生产、宏观调节（财政政策、货币政策）和微观规制（反托拉斯法等）。凯恩斯《通论》为其奠定理论基础。\n- 经济全球化迅猛发展的三点动因：科技进步和生产力发展（根本推动力）；跨国公司（适宜的企业组织形式）；各国经济体制变革和国际经济组织（体制与组织保障）。\n## 第二节 正确认识当代资本主义的新变化\n- 二战后新变化：所有制变化（法人资本所有制居主导）；劳资关系和分配关系变化；社会阶层和阶级结构变化（高级职业经理成为大公司实际控制者）；经济调节机制和危机形态变化；政治制度变化。\n- 变化的实质：人类社会发展一般规律和资本主义经济规律作用的结果；资本主义制度基本框架内的变化，生产关系根本性质未变。\n- 21世纪当代资本主义最突出、最鲜明、最主要的特征：国际金融资本的垄断。\n- 世界大变局下的内部矛盾：经济发展失调（虚拟与实体经济失衡、福利风险增加、债务负担沉重）；政治体制失灵（西式选举难以选贤、政党利益凌驾于国家利益）；社会融合机制失效等。\n## 第三节 资本主义的历史地位和发展趋势\n- 资本主义为社会主义所代替是历史的必然性（两个必然）。","第六章 社会主义的发展及其规律":"## 第一节 社会主义五百年的历史进程\n- 社会主义从空想到科学：唯物史观和剩余价值论两大发现使之成为科学。\n- 社会主义从理想到现实：1917年十月革命胜利，建立第一个社会主义国家。\n## 第二节 科学社会主义基本原则\n- 主要内容包括：在生产资料公有制基础上组织生产，满足全体社会成员需要；对社会生产进行有计划的指导和调节，实行按劳分配；合乎自然规律地改造和利用自然；无产阶级革命是无产阶级斗争的最高形式，以建立无产阶级专政国家为目的；坚持无产阶级政党的领导；逐步实现消灭剥削和阶级、人的自由而全面发展的共产主义；资本主义必然灭亡、社会主义必然胜利。\n## 第三节 在实践中探索社会主义的发展规律\n- 社会主义建设过程具有长期性；社会主义发展道路具有多样性；社会主义在实践中开拓前进。","第七章 共产主义崇高理想及其最终实现":"## 第一节 展望未来共产主义新社会\n- 预见未来社会的方法论原则：在揭示人类社会发展一般规律的基础上指明方向；在剖析资本主义旧世界中阐发新世界；立足于揭示未来社会的一般特征，而不作详尽的细节描绘。\n- 共产主义社会的基本特征：物质财富极大丰富、消费资料按需分配；社会关系高度和谐、人们精神境界极大提高；每个人自由而全面的发展，人类从必然王国向自由王国飞跃。\n- 马克思主义追求的根本价值目标：实现人的自由而全面的发展。\n## 第二节 实现共产主义是历史发展的必然趋势\n- 实现共产主义是历史发展的必然，也是长期的历史过程。\n## 第三节 共产主义远大理想与中国特色社会主义共同理想\n- 坚持远大理想与共同理想的辩证统一，坚定理想信念。"}},"questions":[{"id":"14151-T1","fileId":"14151","source":"2014-2015学年第1学期 A卷 第1题","paper":"2014-2015学年第1学期 A卷","num":1,"chapter":{"label":"导论","section":"三、马克思主义的基本特征","raw":"导论 · 三、马克思主义的基本特征"},"type":"choice","subtype":"single","desc":"马克思主义具有强大生命力的根源在于","options":[{"letter":"A","text":"它的以实践为基础的科学性与革命性的统一"},{"letter":"B","text":"它的革命性"},{"letter":"C","text":"它的科学性"},{"letter":"D","text":"它的与时俱进的理论品格"}],"images":[],"answer":"A","analysis":"课本导论指出，马克思主义的科学性与革命性统一于实践基础之上，这种以实践为基础的科学性和革命性的统一，是马克思主义具有强大生命力的根源。B、C只讲了一个方面，D是其理论品格而非根源。"},{"id":"14151-T2","fileId":"14151","source":"2014-2015学年第1学期 A卷 第2题","paper":"2014-2015学年第1学期 A卷","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"恩格斯指出，全部哲学，特别是近代哲学的重大的基本问题，是","options":[{"letter":"A","text":"思维能不能认识现实世界的问题"},{"letter":"B","text":"世界是怎样存在的问题"},{"letter":"C","text":"思维和存在的关系问题"},{"letter":"D","text":"物质和精神何者是第一性、何者是第二性的问题"}],"images":[],"answer":"C","analysis":"课本第一章：思维和存在的关系问题是哲学的基本问题，它包括何者为第一性（划分唯物主义与唯心主义的标准）和有无同一性（划分可知论与不可知论的标准）两方面。D只是其中一个方面。"},{"id":"14151-T3","fileId":"14151","source":"2014-2015学年第1学期 A卷 第3题","paper":"2014-2015学年第1学期 A卷","num":3,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"马克思主义认为，世界的真正统一性在于它的","options":[{"letter":"A","text":"三维性"},{"letter":"B","text":"一维性"},{"letter":"C","text":"无限性"},{"letter":"D","text":"物质性"}],"images":[],"answer":"D","analysis":"课本：马克思主义认为，世界的统一性在于它的物质性，世界统一于物质。自然界是物质的，人类社会本质上是生产实践基础上形成的物质体系，意识是物质的产物。"},{"id":"14151-T4","fileId":"14151","source":"2014-2015学年第1学期 A卷 第4题","paper":"2014-2015学年第1学期 A卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"马克思主义认为，社会生活在本质上是","options":[{"letter":"A","text":"历史的"},{"letter":"B","text":"实践的"},{"letter":"C","text":"矛盾的"},{"letter":"D","text":"和谐的"}],"images":[],"answer":"B","analysis":"课本引马克思《关于费尔巴哈的提纲》：“全部社会生活在本质上是实践的。”物质生产实践是最基本的实践活动，构成全部社会生活的基础。"},{"id":"14151-T5","fileId":"14151","source":"2014-2015学年第1学期 A卷 第5题","paper":"2014-2015学年第1学期 A卷","num":5,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"“先有计划，后做工作；先有图纸，后造房子”。这说明","options":[{"letter":"A","text":"意识先于物质而存在"},{"letter":"B","text":"物质决定意识"},{"letter":"C","text":"意识具有目的性和计划性"},{"letter":"D","text":"意识能够创造物质"}],"images":[],"answer":"C","analysis":"课本：意识的能动作用首先表现为意识活动具有目的性和计划性——劳动过程结束时得到的结果，在过程开始时就已经在劳动者的表象中观念地存在着。题干正是这一表现的通俗例证。"},{"id":"14151-T6","fileId":"14151","source":"2014-2015学年第1学期 A卷 第6题","paper":"2014-2015学年第1学期 A卷","num":6,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"唯物辩证法认为，事物是运动、变化、发展的，发展的实质是","options":[{"letter":"A","text":"事物的前进性"},{"letter":"B","text":"质变"},{"letter":"C","text":"前进性与曲折性的统一"},{"letter":"D","text":"新事物的产生和旧事物的灭亡"}],"images":[],"answer":"D","analysis":"课本：发展是前进的、上升的运动，发展的实质是新事物的产生和旧事物的灭亡，即新事物取代旧事物。"},{"id":"14151-T7","fileId":"14151","source":"2014-2015学年第1学期 A卷 第7题","paper":"2014-2015学年第1学期 A卷","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"马克思主义的普遍真理同各国具体实际相结合的哲学依据是","options":[{"letter":"A","text":"矛盾的同一性和矛盾的斗争性的原理"},{"letter":"B","text":"矛盾的普遍性和特殊性辩证关系的原理"},{"letter":"C","text":"量变和质变辩证关系的原理"},{"letter":"D","text":"事物普遍联系的原理"}],"images":[],"answer":"B","analysis":"课本：矛盾的普遍性和特殊性（共性和个性）辩证关系原理，是马克思主义普遍真理同各国具体实际相结合的哲学基础，也是建设中国特色社会主义的哲学基础。"},{"id":"14151-T8","fileId":"14151","source":"2014-2015学年第1学期 A卷 第8题","paper":"2014-2015学年第1学期 A卷","num":8,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"关于龙的意象，自古以来就有“角似鹿、头似驼、眼似兔、项似蛇、鳞似鱼、爪似鹰、掌似虎、耳似牛”的说法。这表明","options":[{"letter":"A","text":"观念的东西是移入人脑并在人脑中改造过的物质的东西"},{"letter":"B","text":"一切观念都是现实的模仿"},{"letter":"C","text":"虚幻的观念也是对事物本质的反映"},{"letter":"D","text":"任何观念都是人头脑中自生的"}],"images":[],"answer":"A","analysis":"课本：意识是客观世界的主观映象。马克思说“观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已”。龙的意象虽虚幻，其构成要素仍来自客观世界，是对客观存在的能动反映。B否认意识的能动性，C错在“本质”（虚幻观念未必反映本质），D是唯心主义观点。"},{"id":"14151-T9","fileId":"14151","source":"2014-2015学年第1学期 A卷 第9题","paper":"2014-2015学年第1学期 A卷","num":9,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"马克思主义认识论首要的和基本的观点是","options":[{"letter":"A","text":"意识反作用于物质的观点"},{"letter":"B","text":"对立统一的观点"},{"letter":"C","text":"实践的观点"},{"letter":"D","text":"世界是可以被认识的观点"}],"images":[],"answer":"C","analysis":"课本：马克思主义认识论把实践观点作为首要的和基本的观点，强调实践是认识的基础，认识是主体在实践基础上对客体的能动反映。"},{"id":"14151-T10","fileId":"14151","source":"2014-2015学年第1学期 A卷 第10题","paper":"2014-2015学年第1学期 A卷","num":10,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"从“物到感觉和思想”与“从思想和感觉到物”是","options":[{"letter":"A","text":"可知论和不可知论的对立"},{"letter":"B","text":"唯物主义和唯心主义两条认识路线的对立"},{"letter":"C","text":"辩证法和形而上学两条认识路线的对立"},{"letter":"D","text":"辩证唯物主义和旧唯物主义两条认识路线的对立"}],"images":[],"answer":"B","analysis":"课本：从物到感觉和思想是唯物主义认识路线，从思想和感觉到物是唯心主义认识路线，这是两条根本对立的认识路线。可知论与不可知论的对立针对的是思维与存在有无同一性的问题。"},{"id":"14151-T11","fileId":"14151","source":"2014-2015学年第1学期 A卷 第11题","paper":"2014-2015学年第1学期 A卷","num":11,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"任何特定的真理不仅所反映的对象在范围上是有限的，而且其正确程度也是有限的。这说明真理具有","options":[{"letter":"A","text":"至上性"},{"letter":"B","text":"非至上性"},{"letter":"C","text":"绝对性"},{"letter":"D","text":"相对性"}],"images":[],"answer":"D","analysis":"课本：真理的相对性指人们在一定条件下对客观事物及其规律的认识总是有限的——从广度看，反映的对象在范围上有限；从深度看，反映的正确程度有限。"},{"id":"14151-T12","fileId":"14151","source":"2014-2015学年第1学期 A卷 第12题","paper":"2014-2015学年第1学期 A卷","num":12,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"实践之所以能够作为真理的检验标准，这是由","options":[{"letter":"A","text":"实践的社会历史性决定的"},{"letter":"B","text":"真理的本性和实践的特点决定的"},{"letter":"C","text":"真理的绝对性和相对性决定的"},{"letter":"D","text":"实践标准的确定性与不确定性决定的"}],"images":[],"answer":"B","analysis":"课本：实践作为检验真理的唯一标准，是由真理的本性（主观认识与客观实际相符合）和实践的特点（直接现实性）决定的。只有实践能把主观认识与客观现实联系起来加以对照。"},{"id":"14151-T13","fileId":"14151","source":"2014-2015学年第1学期 A卷 第13题","paper":"2014-2015学年第1学期 A卷","num":13,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会历史观的基本问题是","options":[{"letter":"A","text":"生产力与生产关系的关系问题"},{"letter":"B","text":"经济基础与上层建筑的关系问题"},{"letter":"C","text":"社会存在与社会意识的关系问题"},{"letter":"D","text":"如何看待人民群众和个人的历史作用的问题"}],"images":[],"answer":"C","analysis":"课本：社会存在与社会意识的关系问题是社会历史观的基本问题，对它的不同回答是划分唯物史观和唯心史观的唯一标准。"},{"id":"14151-T14","fileId":"14151","source":"2014-2015学年第1学期 A卷 第14题","paper":"2014-2015学年第1学期 A卷","num":14,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在人们的社会物质生活条件中，作为社会历史发展决定力量的是","options":[{"letter":"A","text":"社会意识"},{"letter":"B","text":"地理环境"},{"letter":"C","text":"人口因素"},{"letter":"D","text":"生产方式"}],"images":[],"answer":"D","analysis":"课本：社会存在包括自然地理环境、人口因素和物质生产方式。地理环境和人口因素对社会发展起加速或延缓作用，物质生产方式才是社会历史发展的决定力量。"},{"id":"14151-T15","fileId":"14151","source":"2014-2015学年第1学期 A卷 第15题","paper":"2014-2015学年第1学期 A卷","num":15,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在生产关系中，最基本的，具有决定意义的方面是","options":[{"letter":"A","text":"生产中人与人的关系"},{"letter":"B","text":"生产资料的所有制关系"},{"letter":"C","text":"产品的分配关系"},{"letter":"D","text":"产品的交换关系"}],"images":[],"answer":"B","analysis":"课本：生产资料所有制关系是生产关系中最基本的、具有决定意义的方面，它是区分不同生产方式、判定社会经济结构性质的客观依据。"},{"id":"14151-T16","fileId":"14151","source":"2014-2015学年第1学期 A卷 第16题","paper":"2014-2015学年第1学期 A卷","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"马克思说：“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。”这句话揭示了","options":[{"letter":"A","text":"生产关系对生产力具有能动的反作用"},{"letter":"B","text":"科学技术是第一生产力"},{"letter":"C","text":"经济基础决定上层建筑"},{"letter":"D","text":"生产力状况决定生产关系的性质"}],"images":[],"answer":"D","analysis":"课本：生产力决定生产关系，生产力状况决定生产关系的性质。生产工具（手推磨、蒸汽磨）是生产力发展水平的客观尺度，它决定相应社会的生产关系性质。"},{"id":"14151-T17","fileId":"14151","source":"2014-2015学年第1学期 A卷 第17题","paper":"2014-2015学年第1学期 A卷","num":17,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"经济基础的实质是","options":[{"letter":"A","text":"社会一定发展阶段上的基本经济制度"},{"letter":"B","text":"国家政权"},{"letter":"C","text":"经济体制"},{"letter":"D","text":"经济结构"}],"images":[],"answer":"D","analysis":"课本：经济基础是指由社会一定发展阶段的生产力所决定的生产关系的总和，生产关系的总和构成社会的经济结构，故经济基础的实质是经济结构。经济体制只是生产关系的具体实现形式，国家政权属于上层建筑。"},{"id":"14151-T18","fileId":"14151","source":"2014-2015学年第1学期 A卷 第18题","paper":"2014-2015学年第1学期 A卷","num":18,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"新一届中央政府成立以来，多次召开国务院常务会议，就深化行政审批制度改革、简政放权作出重大决定，以激发市场主体的创造活力。“简政放权”的主要哲学依据是","options":[{"letter":"A","text":"人民群众是历史创造者的原理"},{"letter":"B","text":"生产关系一定要适合生产力状况的规律"},{"letter":"C","text":"社会存在决定社会意识的原理"},{"letter":"D","text":"上层建筑一定要适合经济基础状况的规律"}],"images":[],"answer":"D","analysis":"课本：行政审批制度属于政治上层建筑。改革行政审批制度、简政放权，是调整上层建筑使之适合经济基础状况，依据的是上层建筑一定要适合经济基础状况的规律。"},{"id":"14151-T19","fileId":"14151","source":"2014-2015学年第1学期 A卷 第19题","paper":"2014-2015学年第1学期 A卷","num":19,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"当代科学技术发展在造福人类的同时，由于应用不当，也带来环境污染、生态破坏、能源和资源枯竭等全球问题，这表明","options":[{"letter":"A","text":"科学技术是社会发展的重要动力"},{"letter":"B","text":"科学技术是全球问题产生的根源"},{"letter":"C","text":"科学技术的社会作用具有两重性"},{"letter":"D","text":"科学技术已经完全“表现为异己的、敌对的和统治的权力”"}],"images":[],"answer":"C","analysis":"课本：科学技术的社会作用具有两重性，既能通过促进经济社会发展造福人类，也可能在应用不当时带来消极后果。全球问题的根源在于科技的社会应用方式而非科技本身，B错误；D是对科技消极作用的夸大。"},{"id":"14151-T20","fileId":"14151","source":"2014-2015学年第1学期 A卷 第20题","paper":"2014-2015学年第1学期 A卷","num":20,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"商品经济产生的历史条件是","options":[{"letter":"A","text":"自然经济的存在与发展"},{"letter":"B","text":"社会化大生产与资本主义私有制"},{"letter":"C","text":"社会化大生产与社会主义公有制"},{"letter":"D","text":"社会分工的出现与生产资料、劳动产品属于不同的所有者"}],"images":[],"answer":"D","analysis":"课本：商品经济产生的历史条件有两个：一是社会分工的出现，二是生产资料和劳动产品属于不同的所有者。前者使交换成为必要，后者使交换成为可能。"},{"id":"14151-T21","fileId":"14151","source":"2014-2015学年第1学期 A卷 第21题","paper":"2014-2015学年第1学期 A卷","num":21,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"某地连续干旱，农民采取各种措施，如打深井、扩大灌溉面积等，保证了蔬菜供应，但蔬菜价格普遍上涨。造成蔬菜价格普遍上涨的根本原因是","options":[{"letter":"A","text":"蔬菜价格放开"},{"letter":"B","text":"蔬菜供不应求"},{"letter":"C","text":"蔬菜价值在增大"},{"letter":"D","text":"蔬菜运费增加"}],"images":[],"answer":"C","analysis":"课本：价值决定价格，供求只能影响价格。题干中蔬菜供应已得到保证，排除了供不应求因素；抗旱措施增加了生产成本，使生产蔬菜的社会必要劳动时间增加、价值增大，这才是价格上涨的根本原因。"},{"id":"14151-T22","fileId":"14151","source":"2014-2015学年第1学期 A卷 第22题","paper":"2014-2015学年第1学期 A卷","num":22,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"商品的价值量与劳动生产率","options":[{"letter":"A","text":"成正比"},{"letter":"B","text":"成反比"},{"letter":"C","text":"不成比例"},{"letter":"D","text":"无相关性"}],"images":[],"answer":"B","analysis":"课本：单位商品的价值量与生产该商品所耗费的（社会必要）劳动时间成正比，与劳动生产率成反比。劳动生产率越高，同一劳动在单位时间内生产的商品越多，单位商品的价值量越小。"},{"id":"14151-T23","fileId":"14151","source":"2014-2015学年第1学期 A卷 第23题","paper":"2014-2015学年第1学期 A卷","num":23,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"私有制商品经济的基本矛盾是指","options":[{"letter":"A","text":"商品的价值和使用价值的矛盾"},{"letter":"B","text":"具体劳动和抽象劳动的矛盾"},{"letter":"C","text":"私人劳动和社会劳动的矛盾"},{"letter":"D","text":"生产资料资本主义私人占有和生产社会化之间的矛盾"}],"images":[],"answer":"C","analysis":"课本：私人劳动和社会劳动的矛盾构成私有制商品经济的基本矛盾，它贯穿商品经济发展过程的始终，决定着商品经济的本质及其发展过程，是商品经济其他一切矛盾的基础。D是资本主义的基本矛盾。"},{"id":"14151-T24","fileId":"14151","source":"2014-2015学年第1学期 A卷 第24题","paper":"2014-2015学年第1学期 A卷","num":24,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是追求超额剩余价值，但其客观后果则是整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，而剩余劳动时间相对延长，整个资本家阶级普遍获得更多的","options":[{"letter":"A","text":"绝对剩余价值"},{"letter":"B","text":"相对剩余价值"},{"letter":"C","text":"资本积累"},{"letter":"D","text":"平均利润"}],"images":[],"answer":"B","analysis":"课本：相对剩余价值是在工作日长度不变的条件下，通过缩短必要劳动时间、相对延长剩余劳动时间而生产的剩余价值，它是全社会劳动生产率普遍提高的结果，也是各个资本家追逐超额剩余价值的客观后果。"},{"id":"14151-T25","fileId":"14151","source":"2014-2015学年第1学期 A卷 第25题","paper":"2014-2015学年第1学期 A卷","num":25,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"社会再生产的核心问题是社会总产品的实现问题，即社会总产品的","options":[{"letter":"A","text":"生产和分配问题"},{"letter":"B","text":"循环和周转问题"},{"letter":"C","text":"补偿和精神补偿问题"},{"letter":"D","text":"价值补偿和实物补偿问题"}],"images":[],"answer":"D","analysis":"课本：社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿（替换）问题。"},{"id":"14151-T26","fileId":"14151","source":"2014-2015学年第1学期 A卷 第26题","paper":"2014-2015学年第1学期 A卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"为了得到尽可能高的利润率和尽可能多的利润，不同部门的资本家之间展开激烈的竞争，大量资本必然从利润率低的部门转投到利润率高的部门，从而导致","options":[{"letter":"A","text":"垄断利润的产生"},{"letter":"B","text":"利润率的平均化"},{"letter":"C","text":"绝对剩余价值的生产"},{"letter":"D","text":"资本主义生产关系的部分质变"}],"images":[],"answer":"B","analysis":"课本：不同部门之间的竞争引起资本在部门间转移，使利润率趋于平均化，形成平均利润率，商品价值随之转化为生产价格。"},{"id":"14151-T27","fileId":"14151","source":"2014-2015学年第1学期 A卷 第27题","paper":"2014-2015学年第1学期 A卷","num":27,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义工资的本质是","options":[{"letter":"A","text":"雇佣工人全部劳动的报酬"},{"letter":"B","text":"雇佣工人剩余劳动的报酬"},{"letter":"C","text":"雇佣工人劳动的价值或价格"},{"letter":"D","text":"雇佣工人劳动力的价值或价格"}],"images":[],"answer":"D","analysis":"课本：资本主义工资的本质是劳动力的价值或价格，而不是劳动的价值或价格。工资表现为“劳动的价格”，抹杀了必要劳动与剩余劳动的区分，从而掩盖了资本主义剥削关系。"},{"id":"14151-T28","fileId":"14151","source":"2014-2015学年第1学期 A卷 第28题","paper":"2014-2015学年第1学期 A卷","num":28,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"正确表述自由竞争与生产集中关系的是","options":[{"letter":"A","text":"生产集中引起自由竞争"},{"letter":"B","text":"自由竞争限制了生产集中"},{"letter":"C","text":"自由竞争引起生产集中"},{"letter":"D","text":"生产集中消灭了自由竞争"}],"images":[],"answer":"C","analysis":"课本：自由竞争中，大企业凭借优势不断吞并中小企业，引起生产集中和资本集中；生产集中发展到一定阶段就走向垄断。即自由竞争引起生产集中，生产集中引起垄断。"},{"id":"14151-T29","fileId":"14151","source":"2014-2015学年第1学期 A卷 第29题","paper":"2014-2015学年第1学期 A卷","num":29,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"金融寡头在经济领域的统治主要是","options":[{"letter":"A","text":"自由竞争实现的"},{"letter":"B","text":"同政府的“个人联合”来实现的"},{"letter":"C","text":"一定的垄断组织形式实现的"},{"letter":"D","text":"通过“参与制”实现的"}],"images":[],"answer":"D","analysis":"课本：金融寡头在经济领域中的统治主要是通过“参与制”实现的；在政治上的统治主要是通过同政府的“个人联合”实现的；还通过建立政策咨询机构、掌握新闻媒体等左右国家的内政外交和社会生活。"},{"id":"14151-T30","fileId":"14151","source":"2014-2015学年第1学期 A卷 第30题","paper":"2014-2015学年第1学期 A卷","num":30,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"第二次世界大战后资本主义所有制发生了新的变化，居主导地位的资本所有制形式是","options":[{"letter":"A","text":"国家资本所有制"},{"letter":"B","text":"私人股份资本所有制"},{"letter":"C","text":"法人资本所有制"},{"letter":"D","text":"个体资本所有制"}],"images":[],"answer":"C","analysis":"课本：二战后资本主义生产资料所有制发生新变化：国家资本所有制形成并发挥重要作用，法人资本所有制崛起并成为居主导地位的资本所有制形式。"},{"id":"14151-T31","fileId":"14151","source":"2014-2015学年第1学期 A卷 第31题","paper":"2014-2015学年第1学期 A卷","num":31,"chapter":{"label":"导论","section":"一、什么是马克思主义","raw":"导论 · 一、什么是马克思主义"},"type":"multi","subtype":"","desc":"马克思主义的三个基本组成部分是","options":[{"letter":"A","text":"历史唯物主义"},{"letter":"B","text":"马克思主义政治经济学"},{"letter":"C","text":"科学社会主义"},{"letter":"D","text":"马克思主义哲学"}],"images":[],"answer":"BCD","analysis":"课本导论：马克思主义哲学、马克思主义政治经济学和科学社会主义是马克思主义的三个基本组成部分，它们有机统一并共同构成马克思主义理论体系的主体内容。历史唯物主义属于马克思主义哲学的组成部分。"},{"id":"14151-T32","fileId":"14151","source":"2014-2015学年第1学期 A卷 第32题","paper":"2014-2015学年第1学期 A卷","num":32,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"马克思主义物质观的理论意义在于","options":[{"letter":"A","text":"坚持了物质的客观实在性原则，坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限"},{"letter":"B","text":"坚持了能动的反映论和可知论，批判了不可知论"},{"letter":"C","text":"体现了唯物论和辩证法的统一，克服了形而上学唯物主义的缺陷"},{"letter":"D","text":"体现了唯物主义自然观与唯物主义历史观的统一，为彻底的唯物主义奠定了理论基础"}],"images":[],"answer":"ABCD","analysis":"课本：马克思主义物质观的理论意义正包括这四点：坚持唯物主义一元论；坚持能动的反映论和可知论；体现唯物论和辩证法的统一；体现唯物主义自然观与历史观的统一，为彻底的唯物主义奠定了理论基础。"},{"id":"14151-T33","fileId":"14151","source":"2014-2015学年第1学期 A卷 第33题","paper":"2014-2015学年第1学期 A卷","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"矛盾的同一性在事物发展中的作用表现为","options":[{"letter":"A","text":"同一性是事物存在和发展的前提，矛盾一方的发展以另一方的发展为条件"},{"letter":"B","text":"同一性使矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展"},{"letter":"C","text":"同一性是一种矛盾统一体向另一种矛盾统一体过渡的决定力量"},{"letter":"D","text":"同一性规定着事物转化的可能和发展的趋势"}],"images":[],"answer":"ABD","analysis":"课本：矛盾同一性在事物发展中的作用有三：同一性是事物存在和发展的前提；同一性使矛盾双方相互吸取有利于自身的因素而各自得到发展；同一性规定着事物转化的可能和发展的趋势。C错误，矛盾统一体之间的过渡是同一性和斗争性共同作用的结果，不能把决定力量仅归于同一性。"},{"id":"14151-T34","fileId":"14151","source":"2014-2015学年第1学期 A卷 第34题","paper":"2014-2015学年第1学期 A卷","num":34,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"下列选项中属于真理与谬误相互关系内容的有","options":[{"letter":"A","text":"真理与谬误是对立的"},{"letter":"B","text":"真理与谬误是相互联系的"},{"letter":"C","text":"真理的发展是通过与谬误的斗争来实现的"},{"letter":"D","text":"真理与谬误在一定条件下相互转化"}],"images":[],"answer":"ABCD","analysis":"课本：真理与谬误是对立的，二者有着原则的界限；又是相互联系、相互依存的；真理的发展是通过与谬误的斗争实现的；真理与谬误在一定条件下可以相互转化。四项均为课本观点。"},{"id":"14151-T35","fileId":"14151","source":"2014-2015学年第1学期 A卷 第35题","paper":"2014-2015学年第1学期 A卷","num":35,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"社会意识的相对独立性主要表现为","options":[{"letter":"A","text":"社会意识与社会存在发展的不完全同步性和不平衡性"},{"letter":"B","text":"社会存在是社会意识内容的客观来源，社会意识反映社会存在"},{"letter":"C","text":"社会意识内部各种形式之间的相互影响及各自具有的历史继承性"},{"letter":"D","text":"社会意识对社会存在能动的反作用"}],"images":[],"answer":"ACD","analysis":"课本：社会意识相对独立性表现为：与社会存在发展的不完全同步性和不平衡性；社会意识内部各种形式之间的相互影响及各自具有的历史继承性；对社会存在的能动的反作用（这是其突出表现）。B说的是社会存在对社会意识的决定作用，不属于相对独立性的表现。"},{"id":"14151-T36","fileId":"14151","source":"2014-2015学年第1学期 A卷 第36题","paper":"2014-2015学年第1学期 A卷","num":36,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"生产力具有复杂的系统结构。其基本要素包括","options":[{"letter":"A","text":"劳动资料"},{"letter":"B","text":"劳动对象"},{"letter":"C","text":"科学技术"},{"letter":"D","text":"劳动者"}],"images":[],"answer":"ABD","analysis":"课本：生产力的基本要素是劳动资料、劳动对象和劳动者。科学技术是生产力中的重要因素，能渗透到生产力诸要素中转化为现实生产能力，但不属于独立的基本要素。"},{"id":"14151-T37","fileId":"14151","source":"2014-2015学年第1学期 A卷 第37题","paper":"2014-2015学年第1学期 A卷","num":37,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"价值规律在对经济活动进行自发调节时，会产生一些消极的后果，其消极后果主要有","options":[{"letter":"A","text":"可能导致垄断的发生，阻碍技术的进步"},{"letter":"B","text":"可能消除产生竞争的经济条件"},{"letter":"C","text":"可能出现比例失调，造成社会资源的浪费"},{"letter":"D","text":"可能引起商品生产者的两极分化"}],"images":[],"answer":"ACD","analysis":"课本：价值规律自发调节的消极后果包括：可能导致垄断的发生、阻碍技术进步；可能引起商品生产者的两极分化；可能出现比例失调、造成社会资源浪费。B错误，价值规律的自发调节不可能消除产生竞争的经济条件。"},{"id":"14151-T38","fileId":"14151","source":"2014-2015学年第1学期 A卷 第38题","paper":"2014-2015学年第1学期 A卷","num":38,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"产业资本的运动必须具备的两个基本前提条件是","options":[{"letter":"A","text":"生产资本区分为固定资本和流动资本"},{"letter":"B","text":"产业资本执行三种不同的职能"},{"letter":"C","text":"产业资本的三种职能形式必须在空间上同时并存"},{"letter":"D","text":"产业资本的三种职能形式必须在时间上继起"}],"images":[],"answer":"CD","analysis":"课本：产业资本循环顺利进行的两个基本前提条件：产业资本的三种职能形式（货币资本、生产资本、商品资本）必须在空间上同时并存，在时间上相继转化（继起）。A、B均非循环的前提条件。"},{"id":"14151-T40","fileId":"14151","source":"2014-2015学年第1学期 A卷 第40题","paper":"2014-2015学年第1学期 A卷","num":40,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"导致经济全球化迅猛发展的因素主要有","options":[{"letter":"A","text":"科学技术的进步和生产力的发展"},{"letter":"B","text":"跨国公司的发展"},{"letter":"C","text":"国际分工进一步深化"},{"letter":"D","text":"各国经济体制的变革"}],"images":[],"answer":"ABD","analysis":"课本：导致经济全球化迅猛发展的因素主要有三点：科学技术的进步和生产力的发展提供了物质基础和根本推动力；跨国公司的发展提供了适宜的企业组织形式；各国经济体制的变革（和国际经济组织的发展）提供了体制与组织保障。国际分工的深化是经济全球化的表现和背景，不在课本所列三点动因之内。"},{"id":"15161-T1","fileId":"15161","source":"2015-2016学年第1学期 A卷 第1题","paper":"2015-2016学年第1学期 A卷","num":1,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"马克思主义公开问世的标志是","options":[{"letter":"A","text":"《德意志意识形态》的出版"},{"letter":"B","text":"《共产党宣言》的发表"},{"letter":"C","text":"国际工人协会（“第一国际”）的成立"},{"letter":"D","text":"《资本论》第一卷的出版"}],"images":[],"answer":"B","analysis":"课本导论：1848年2月《共产党宣言》的发表，标志着马克思主义公开问世。《德意志意识形态》首次系统阐述唯物史观但当时未出版，《资本论》第一卷出版于1867年。"},{"id":"15161-T2","fileId":"15161","source":"2015-2016学年第1学期 A卷 第2题","paper":"2015-2016学年第1学期 A卷","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"划分唯物主义和唯心主义的标准是","options":[{"letter":"A","text":"思维能不能认识现实世界的问题"},{"letter":"B","text":"世界是怎样存在的问题"},{"letter":"C","text":"思维和存在的关系问题"},{"letter":"D","text":"物质和精神何者是第一性、何者是第二性的问题"}],"images":[],"answer":"D","analysis":"课本：哲学基本问题即思维和存在的关系问题（C），其中第一方面——物质和精神何者为第一性——是划分唯物主义和唯心主义的唯一标准；第二方面（能否认识世界）划分可知论与不可知论。"},{"id":"15161-T3","fileId":"15161","source":"2015-2016学年第1学期 A卷 第3题","paper":"2015-2016学年第1学期 A卷","num":3,"chapter":{"label":"第一章 世界的
