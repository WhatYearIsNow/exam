-2022学年第1学期 A卷 第25题","paper":"2021-2022学年第1学期 A卷","num":25,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"超额剩余价值可以由（）","options":[{"letter":"A","text":"少数资本家暂时获得"},{"letter":"B","text":"多数资本家暂时获得"},{"letter":"C","text":"少数资本家长期获得"},{"letter":"D","text":"多数资本家长期获得"}],"images":[],"answer":"A","analysis":"课本：超额剩余价值是企业由于个别价值低于社会价值的差额而获得的剩余价值。个别资本家率先提高劳动生产率后，能暂时获得超额剩余价值；当新技术普及、社会劳动生产率普遍提高后，超额剩余价值就消失并转化为相对剩余价值，故只能是少数资本家暂时获得。"},{"id":"21221-T26","fileId":"21221","source":"2021-2022学年第1学期 A卷 第26题","paper":"2021-2022学年第1学期 A卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"相对剩余价值是（）","options":[{"letter":"A","text":"个别企业提高劳动生产率的结果"},{"letter":"B","text":"各部门资本家竞争的结果"},{"letter":"C","text":"延长工作日，增加剩余劳动的时间获得的"},{"letter":"D","text":"社会劳动生产率普遍提高的结果"}],"images":[],"answer":"D","analysis":"课本：相对剩余价值是在工作日长度不变的条件下，通过缩短必要劳动时间、相对延长剩余劳动时间生产的剩余价值，其前提和结果是全社会劳动生产率的普遍提高（使生活资料价值下降）。个别企业提高生产率获得的是超额剩余价值。"},{"id":"21221-T27","fileId":"21221","source":"2021-2022学年第1学期 A卷 第27题","paper":"2021-2022学年第1学期 A卷","num":27,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"劳动力商品创造的新价值是（）","options":[{"letter":"A","text":"商品价值"},{"letter":"B","text":"劳动力本身的价值"},{"letter":"C","text":"剩余价值"},{"letter":"D","text":"劳动力价值与剩余价值之和"}],"images":[],"answer":"D","analysis":"课本：劳动力商品的消费过程即劳动过程，能够创造出比自身价值更大的价值。工人劳动创造的新价值（v+m）包括两部分：补偿劳动力价值的部分（必要劳动创造）和剩余价值（剩余劳动创造），即劳动力价值与剩余价值之和。"},{"id":"21221-T28","fileId":"21221","source":"2021-2022学年第1学期 A卷 第28题","paper":"2021-2022学年第1学期 A卷","num":28,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义利润率反映（）","options":[{"letter":"A","text":"不变资本的增殖程度"},{"letter":"B","text":"可变资本的增殖程度"},{"letter":"C","text":"预付资本的增殖程度"},{"letter":"D","text":"资本家对工人的剥削程度"}],"images":[],"answer":"C","analysis":"课本：利润率是剩余价值与全部预付资本的比率（p'=m/(c+v)），反映预付资本的增殖程度；剩余价值率（m'=m/v）才准确反映资本家对工人的剥削程度。利润率掩盖了剥削的真实程度。"},{"id":"21221-T29","fileId":"21221","source":"2021-2022学年第1学期 A卷 第29题","paper":"2021-2022学年第1学期 A卷","num":29,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义工资的本质是（）","options":[{"letter":"A","text":"雇佣工人全部劳动的报酬"},{"letter":"B","text":"雇佣工人剩余劳动的报酬"},{"letter":"C","text":"雇佣工人劳动的价值或价格"},{"letter":"D","text":"雇佣工人劳动力的价值或价格"}],"images":[],"answer":"D","analysis":"课本：资本主义工资的本质是劳动力的价值或价格，而不是劳动的价值或价格。劳动不是商品，工资表现为“劳动的价格”掩盖了剥削关系。"},{"id":"21221-T30","fileId":"21221","source":"2021-2022学年第1学期 A卷 第30题","paper":"2021-2022学年第1学期 A卷","num":30,"chapter":{"label":"第七章 共产主义崇高理想及其最终实现","section":"第一节 展望未来共产主义新社会","raw":"第七章 共产主义崇高理想及其最终实现 · 第一节 展望未来共产主义新社会"},"type":"choice","subtype":"single","desc":"1894年1月3日，意大利人卡内帕给恩格斯写信，请求他为即将在日内瓦出版的《新纪元》周刊的创刊号题词，而且要求尽量用简短的字句来表述未来社会主义纪元的基本思想，以区别于伟大诗人但丁的对旧纪元所作的“一些人统治，另一些人受苦难”的界定。恩格斯回答说，这就是“代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里，每个人的自由发展是一切人的自由发展的条件”。这段话表明，马克思主义追求的根本价值目标是（）","options":[{"letter":"A","text":"实现人类永恒不变的普适价值"},{"letter":"B","text":"实现人的自由而全面的发展"},{"letter":"C","text":"建立一个四海之内皆兄弟的大同世界"},{"letter":"D","text":"建立一个自由、平等、博爱的理性王国"}],"images":[],"answer":"B","analysis":"课本：实现人的自由而全面的发展，是马克思主义追求的根本价值目标，也是共产主义社会的根本特征。《共产党宣言》中的这段话正是这一价值目标的经典表述。"},{"id":"21221-T31","fileId":"21221","source":"2021-2022学年第1学期 A卷 第31题","paper":"2021-2022学年第1学期 A卷","num":31,"chapter":{"label":"导论","section":"一、什么是马克思主义","raw":"导论 · 一、什么是马克思主义"},"type":"multi","subtype":"","desc":"马克思主义的三个基本组成部分是（）","options":[{"letter":"A","text":"马克思主义哲学"},{"letter":"B","text":"马克思主义历史学"},{"letter":"C","text":"马克思主义政治经济学"},{"letter":"D","text":"科学社会主义"}],"images":[],"answer":"ACD","analysis":"课本导论：马克思主义哲学、马克思主义政治经济学和科学社会主义是马克思主义的三个基本组成部分，有机统一并共同构成马克思主义理论体系的主体内容。不存在“马克思主义历史学”这一独立组成部分。"},{"id":"21221-T32","fileId":"21221","source":"2021-2022学年第1学期 A卷 第32题","paper":"2021-2022学年第1学期 A卷","num":32,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"关于人工智能，马克思主义认为（）","options":[{"letter":"A","text":"人工智能不可能真正具备人类的社会属性"},{"letter":"B","text":"人工智能是人的意识能动性的一种特殊表现"},{"letter":"C","text":"人工智能只是对人类的理性智能的模拟和扩展"},{"letter":"D","text":"人工智能具有人的意识，即将取代或超越人类智能"}],"images":[],"answer":"ABC","analysis":"课本：意识是人脑的机能和社会的产物，人工智能是对人类智能的模拟和延伸，是人的意识能动性的特殊表现，不具有人的意识的社会属性，不可能取代或超越人类智能。D错误。"},{"id":"21221-T33","fileId":"21221","source":"2021-2022学年第1学期 A卷 第33题","paper":"2021-2022学年第1学期 A卷","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"multi","subtype":"","desc":"下列哪些选项属于辩证思维方法（）","options":[{"letter":"A","text":"本质与现象"},{"letter":"B","text":"原因与结果"},{"letter":"C","text":"归纳与演绎"},{"letter":"D","text":"分析与综合"}],"images":[],"answer":"CD","analysis":"课本：辩证思维方法主要包括归纳与演绎、分析与综合、抽象与具体、逻辑与历史相统一等。本质与现象、原因与结果属于唯物辩证法的基本范畴（联系和发展的基本环节），不是思维方法。"},{"id":"21221-T34","fileId":"21221","source":"2021-2022学年第1学期 A卷 第34题","paper":"2021-2022学年第1学期 A卷","num":34,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"庄子说：“吾生也有涯，而知也无涯。以有涯随无涯，殆已。”庄子认为，人的生命是有限的，而知识是无限的，用有限的生命去追求无限的知识，只会徒耗人的精力，是不值得做的。从认识论的角度看，庄子的说法（）","options":[{"letter":"A","text":"割裂了真理与谬误的对立统一"},{"letter":"B","text":"割裂了真理的绝对性与相对性的统一"},{"letter":"C","text":"割裂了人类认识世界能力的无限性与有限性的统一"},{"letter":"D","text":"割裂了实践标准的确定性与不确定性的统一"}],"images":[],"answer":"BC","analysis":"课本：真理的绝对性和相对性根源于人类认识能力的无限性和有限性的矛盾：就人类整体和世代延续而言，认识能力是无限的（至上性）；就个人和特定阶段而言，认识能力又是有限的（非至上性）。庄子只看到个人生命的有限性而否定人类认识的无限可能性，割裂了二者的统一，陷入不可知论的倾向。"},{"id":"21221-T35","fileId":"21221","source":"2021-2022学年第1学期 A卷 第35题","paper":"2021-2022学年第1学期 A卷","num":35,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"改革开放以后，党日益重视生态环境保护。党中央强调，生态文明建设是关乎中华民族永续发展的根本大计，保护生态环境就是保护生产力，改善生态环境就是发展生产力，决不以牺牲环境为代价换取一时的经济增长。关于自然地理环境，下列说法正确的是（）","options":[{"letter":"A","text":"自然地理是社会历史发展的决定力量"},{"letter":"B","text":"自然生态平衡对社会生活起着重要作用"},{"letter":"C","text":"应当合理地调节人与自然之间的物质变换"},{"letter":"D","text":"自然地理环境是人们生活和生产的自然基础"}],"images":[],"answer":"BCD","analysis":"课本：自然地理环境是社会存在和发展的经常的、必要的物质条件，是人们生活和生产的自然基础，生态平衡对社会生活起重要作用，人类应合理调节与自然之间的物质变换。但自然地理环境不能决定社会性质和社会形态更替，决定力量是生产方式，A概念错误。"},{"id":"21221-T36","fileId":"21221","source":"2021-2022学年第1学期 A卷 第36题","paper":"2021-2022学年第1学期 A卷","num":36,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"千百年来，在古老的丝绸之路上，各国人民共同谱写千古传诵的友好篇章。一带一路国家的交往历史证明，只要坚持团结互信、平等互利、包容互鉴、合作共赢，不同种族、不同信仰、不同文化背景的国家完全可以共享和平，共同发展。交往作为人类实践活动的重要组成部分，对社会生活有哪些重要影响（）","options":[{"letter":"A","text":"促进生产力的发展"},{"letter":"B","text":"促进社会关系的进步"},{"letter":"C","text":"促进文化的发展与传播"},{"letter":"D","text":"促进人的全面发展"}],"images":[],"answer":"ABCD","analysis":"课本：交往是人类实践活动的重要组成部分，对社会生活有重要影响：促进生产力的发展；促进社会关系的进步；促进文化的发展与传播；促进人的全面发展。四个选项均为课本原话。"},{"id":"21221-T37","fileId":"21221","source":"2021-2022学年第1学期 A卷 第37题","paper":"2021-2022学年第1学期 A卷","num":37,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"产业资本运动必须具备的基本前提条件是（）","options":[{"letter":"A","text":"产业资本的三种职能形式必须在空间上同时并存"},{"letter":"B","text":"社会总产品在价值上得到补偿，在实物上得到替换"},{"letter":"C","text":"产业资本的三种职能形式必须在时间上继起"},{"letter":"D","text":"社会生产分为两大部类"}],"images":[],"answer":"AC","analysis":"课本：产业资本循环顺利进行的两个基本前提条件：产业资本的三种职能形式（货币资本、生产资本、商品资本）必须在空间上同时并存，在时间上相互继起。B是社会再生产的实现问题，D是社会资本再生产的分析前提。"},{"id":"21221-T38","fileId":"21221","source":"2021-2022学年第1学期 A卷 第38题","paper":"2021-2022学年第1学期 A卷","num":38,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"垄断在自由竞争的基础上产生，但垄断没有消除竞争。垄断与竞争并存的原因是（）","options":[{"letter":"A","text":"垄断没有消除产生竞争的经济条件，垄断组织间的竞争更激烈"},{"letter":"B","text":"科技进步和创新不断激发新的竞争"},{"letter":"C","text":"非垄断的中小企业仍然大量存在"},{"letter":"D","text":"社会生产复杂多样，垄断组织不可能囊括社会的一切商品生产"}],"images":[],"answer":"ACD","analysis":"课本：垄断不能消除竞争的原因：一是垄断没有消除产生竞争的经济条件（商品经济是竞争存在的经济基础）；二是垄断必须通过竞争来维持，垄断组织之间的竞争更加激烈；三是社会生产复杂多样，任何垄断组织都不可能囊括一切商品生产，非垄断中小企业仍然大量存在。"},{"id":"21221-T39","fileId":"21221","source":"2021-2022学年第1学期 A卷 第39题","paper":"2021-2022学年第1学期 A卷","num":39,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"multi","subtype":"","desc":"2008年金融危机后，西方国家出现的经济发展失调主要表现在（）","options":[{"letter":"A","text":"虚拟经济与实体经济发展失衡"},{"letter":"B","text":"社会流动性退化"},{"letter":"C","text":"福利风险增加"},{"letter":"D","text":"债务负担沉重"}],"images":[],"answer":"ACD","analysis":"课本：世界大变局下，资本主义国家内部矛盾日益明显，其中经济发展失调具体表现为三点：一是虚拟经济与实体经济发展失衡；二是福利风险增加；三是债务负担沉重。B“社会流动性退化”不属于课本所列经济发展失调的表现。"},{"id":"21221-T40","fileId":"21221","source":"2021-2022学年第1学期 A卷 第40题","paper":"2021-2022学年第1学期 A卷","num":40,"chapter":{"label":"第六章 社会主义的发展及其规律","section":"第二节 科学社会主义基本原则","raw":"第六章 社会主义的发展及其规律 · 第二节 科学社会主义基本原则"},"type":"multi","subtype":"","desc":"科学社会主义的基本原则包括（）","options":[{"letter":"A","text":"资本主义必然灭亡，社会主义必然胜利"},{"letter":"B","text":"无产阶级革命是无产阶级进行斗争的最高形式，以建立无产阶级专政的国家为目的"},{"letter":"C","text":"社会主义社会要对社会生产进行有计划地指导和调节，实行按劳分配的原则"},{"letter":"D","text":"社会主义社会要合乎自然规律的改造和利用自然，努力实现人与自然的和谐共生"}],"images":[],"answer":"ABCD","analysis":"课本第六章：科学社会主义基本原则包括：在生产资料公有制基础上组织生产，满足全体社会成员的需要是社会主义生产的根本目的；对社会生产进行有计划的指导和调节，实行按劳分配原则；合乎自然规律地改造和利用自然；无产阶级革命是无产阶级斗争的最高形式，以建立无产阶级专政国家为目的；社会主义事业必须坚持无产阶级政党的领导；通过社会主义高度发展逐步走向消灭剥削和阶级、实现人的自由而全面发展的共产主义社会；人类社会必然走向社会主义共产主义（两个必然）。四个选项均为基本原则内容。"},{"id":"25261-T1","fileId":"25261","source":"2025-2026学年第1学期 B卷 第1题","paper":"2025-2026学年第1学期 B卷","num":1,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"事物的联系是事物本身所固有的、不以人的意志为转移的，这表明（）","options":[{"letter":"A","text":"联系具有条件性"},{"letter":"B","text":"联系具有多样性"},{"letter":"C","text":"联系具有普遍性"},{"letter":"D","text":"联系具有客观性"}],"images":[],"answer":"D","analysis":"课本：联系具有客观性，事物的联系是事物本身所固有的，不以人的意志为转移，人不能任意创造或消灭联系。普遍性指联系无处不在；多样性指联系形式多种多样；条件性指联系依赖于具体条件。"},{"id":"25261-T2","fileId":"25261","source":"2025-2026学年第1学期 B卷 第2题","paper":"2025-2026学年第1学期 B卷","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"马克思指出：“观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已。”这句话说明（）","options":[{"letter":"A","text":"意识是客观世界的主观映象"},{"letter":"B","text":"意识是自然界长期发展的产物"},{"letter":"C","text":"意识是社会历史发展的产物"},{"letter":"D","text":"意识具有指导实践改造客观世界的作用"}],"images":[],"answer":"A","analysis":"课本：这句话说明意识在内容上是客观的、在形式上是主观的，意识是客观世界的主观映象。B、C讲的是意识的起源，D讲的是意识的能动作用，均不符合题意。"},{"id":"25261-T3","fileId":"25261","source":"2025-2026学年第1学期 B卷 第3题","paper":"2025-2026学年第1学期 B卷","num":3,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"既要注重总体谋划，又要注重牵住“牛鼻子”，这句话运用了（）","options":[{"letter":"A","text":"矛盾的普遍性和特殊性辩证关系原理"},{"letter":"B","text":"主要矛盾和次要矛盾、矛盾的主要方面和次要方面的辩证关系原理"},{"letter":"C","text":"矛盾的同一性和斗争性辩证关系原理"},{"letter":"D","text":"矛盾的绝对性与相对性辩证关系原理"}],"images":[],"answer":"B","analysis":"课本：主要矛盾在矛盾体系中处于支配地位、对事物发展起决定作用，要求我们抓重点、抓关键（牵住“牛鼻子”）；同时兼顾次要矛盾，坚持“两点论”与“重点论”的统一（总体谋划）。这是主要矛盾和次要矛盾、矛盾的主要方面和次要方面辩证关系原理的方法论运用。"},{"id":"25261-T4","fileId":"25261","source":"2025-2026学年第1学期 B卷 第4题","paper":"2025-2026学年第1学期 B卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"在生物进化中，某个基因变异会导致新物种的产生，这是（）","options":[{"letter":"A","text":"必然转化为偶然"},{"letter":"B","text":"基因突变"},{"letter":"C","text":"偶然转化为必然"},{"letter":"D","text":"必然就是偶然"}],"images":[],"answer":"C","analysis":"课本原话：在生物进化中，某个基因变异会导致新物种的产生，这是偶然转化为必然；旧物种的基本性状在新物种中表现为返祖现象，这是必然转化为偶然。必然性与偶然性相互依存并在一定条件下相互转化。"},{"id":"25261-T5","fileId":"25261","source":"2025-2026学年第1学期 B卷 第5题","paper":"2025-2026学年第1学期 B卷","num":5,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"真理的本质属性是（）","options":[{"letter":"A","text":"绝对性"},{"letter":"B","text":"相对性"},{"letter":"C","text":"客观性"},{"letter":"D","text":"主观性"}],"images":[],"answer":"C","analysis":"课本：真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映。真理的本质属性是客观性：真理的内容是客观的，检验真理的标准（实践）也是客观的。"},{"id":"25261-T6","fileId":"25261","source":"2025-2026学年第1学期 B卷 第6题","paper":"2025-2026学年第1学期 B卷","num":6,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"人类的社会生活色彩斑斓，实践活动丰富多彩，其中构成全部社会生活的基础的实践活动是（）","options":[{"letter":"A","text":"科学文化实践"},{"letter":"B","text":"物质生产实践"},{"letter":"C","text":"虚拟实践"},{"letter":"D","text":"社会政治实践"}],"images":[],"answer":"B","analysis":"课本：物质生产实践是人类最基本的实践活动，它解决人与自然的矛盾，满足人们物质生活资料和生产劳动资料的需要，构成全部社会生活的基础；其他实践形式在它基础上产生和发展。"},{"id":"25261-T7","fileId":"25261","source":"2025-2026学年第1学期 B卷 第7题","paper":"2025-2026学年第1学期 B卷","num":7,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会心理是（）","options":[{"letter":"A","text":"以感性认识为主"},{"letter":"B","text":"以理性认识为主"},{"letter":"C","text":"是定型的社会意识"},{"letter":"D","text":"是高层次的社会意识"}],"images":[],"answer":"A","analysis":"课本：社会意识分为社会心理和社会意识形式两个层次。社会心理是低层次的、自发的、不系统的社会意识，以感性认识为主，表现为人们在日常生活中的情感、情绪、风俗、习惯和自发倾向；社会意识形式才是高层次的、定型的、自觉的社会意识。"},{"id":"25261-T8","fileId":"25261","source":"2025-2026学年第1学期 B卷 第8题","paper":"2025-2026学年第1学期 B卷","num":8,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在整个上层建筑中，居于主导地位的是（）","options":[{"letter":"A","text":"观念上层建筑"},{"letter":"B","text":"社会意识"},{"letter":"C","text":"政治法律思想"},{"letter":"D","text":"政治上层建筑"}],"images":[],"answer":"D","analysis":"课本：上层建筑由观念上层建筑和政治上层建筑构成。政治上层建筑（政治法律制度及设施和政治组织）是在一定思想指导下建立的，一旦形成便居于主导地位；国家政权是政治上层建筑的核心。"},{"id":"25261-T9","fileId":"25261","source":"2025-2026学年第1学期 B卷 第9题","paper":"2025-2026学年第1学期 B卷","num":9,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"中国特色社会主义进入新时代，社会主要矛盾已经转化为（）","options":[{"letter":"A","text":"社会存在和社会意识的矛盾"},{"letter":"B","text":"生产力和生产关系、经济基础和上层建筑的矛盾"},{"letter":"C","text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"},{"letter":"D","text":"人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}],"images":[],"answer":"C","analysis":"课本：社会基本矛盾是生产力与生产关系、经济基础与上层建筑的矛盾（B），它贯穿一切社会形态。我国进入新时代后，社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。D是此前对我国社会主要矛盾的表述。"},{"id":"25261-T10","fileId":"25261","source":"2025-2026学年第1学期 B卷 第10题","paper":"2025-2026学年第1学期 B卷","num":10,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"人民群众是社会历史的主体，是历史的创造者。从质上看，人民群众是（）","options":[{"letter":"A","text":"一切对社会历史发展起推动作用的人"},{"letter":"B","text":"社会人口中的绝大多数"},{"letter":"C","text":"从事物质资料生产的劳动群众"},{"letter":"D","text":"包含不同的阶级、阶层和集团"}],"images":[],"answer":"A","analysis":"课本：人民群众是一个历史范畴。从质上看，人民群众是指一切对社会历史发展起推动作用的人们；从量上看，是指社会人口中的绝大多数。注意质与量两个角度的区分。"},{"id":"25261-T11","fileId":"25261","source":"2025-2026学年第1学期 B卷 第11题","paper":"2025-2026学年第1学期 B卷","num":11,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"构成社会财富的物质内容的是商品的（）","options":[{"letter":"A","text":"交换价值"},{"letter":"B","text":"使用价值"},{"letter":"C","text":"剩余价值"},{"letter":"D","text":"价值"}],"images":[],"answer":"B","analysis":"课本：使用价值是指商品能满足人们某种需要的属性，是商品的自然属性，构成社会财富的物质内容。价值是商品的社会属性，是凝结在商品中的无差别的人类劳动。"},{"id":"25261-T12","fileId":"25261","source":"2025-2026学年第1学期 B卷 第12题","paper":"2025-2026学年第1学期 B卷","num":12,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"商品生产者生产商品是为了取得商品的（）","options":[{"letter":"A","text":"价格"},{"letter":"B","text":"使用价值"},{"letter":"C","text":"交换价值"},{"letter":"D","text":"价值"}],"images":[],"answer":"D","analysis":"课本：商品的使用价值和价值是对立统一的：商品生产者生产商品是为了获得价值（通过让渡使用价值来实现），购买者是为了获得使用价值（通过支付价值来实现）。同一主体不能同时占有商品的使用价值和价值。"},{"id":"25261-T13","fileId":"25261","source":"2025-2026学年第1学期 B卷 第13题","paper":"2025-2026学年第1学期 B卷","num":13,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"剩余价值的唯一源泉是（）","options":[{"letter":"A","text":"固定资本"},{"letter":"B","text":"流动资本"},{"letter":"C","text":"不变资本"},{"letter":"D","text":"可变资本"}],"images":[],"answer":"D","analysis":"课本：不变资本（以生产资料形式存在）在生产过程中只转移自身价值、不发生增殖；可变资本（购买劳动力的资本）在生产过程中由工人再生产出来并有剩余，创造出剩余价值。剩余价值的唯一源泉是雇佣工人的剩余劳动，即可变资本。"},{"id":"25261-T14","fileId":"25261","source":"2025-2026学年第1学期 B卷 第14题","paper":"2025-2026学年第1学期 B卷","num":14,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在通常情况下，利润率（）剩余价值率","options":[{"letter":"A","text":"高于"},{"letter":"B","text":"低于"},{"letter":"C","text":"等于"},{"letter":"D","text":"多倍于"}],"images":[],"answer":"B","analysis":"课本：利润率是剩余价值与全部预付资本的比率（m/(c+v)），剩余价值率是剩余价值与可变资本的比率（m/v）。由于预付资本（c+v）大于可变资本（v），在通常情况下利润率总是低于剩余价值率，利润率掩盖了剥削程度。"},{"id":"25261-T15","fileId":"25261","source":"2025-2026学年第1学期 B卷 第15题","paper":"2025-2026学年第1学期 B卷","num":15,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"根据马克思剩余价值理论，以生产资料形式存在的资本（）","options":[{"letter":"A","text":"通过工人的具体劳动被一次性转移到新产品中"},{"letter":"B","text":"通过工人的具体劳动被多次生产过程转移到新产品中"},{"letter":"C","text":"在生产过程中只转移自己的价值量，不发生增殖"},{"letter":"D","text":"在生产过程中不仅转移自身的价值量，还创造剩余价值"}],"images":[],"answer":"C","analysis":"课本：以生产资料形式存在的资本是不变资本，在生产过程中通过工人的具体劳动把自身的价值转移到新产品中，只转移自己的价值量而不发生价值增殖。创造新价值和剩余价值的是活劳动（可变资本）。A、B只涉及转移方式，D混淆了不变资本与可变资本。"},{"id":"25261-T16","fileId":"25261","source":"2025-2026学年第1学期 B卷 第16题","paper":"2025-2026学年第1学期 B卷","num":16,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"社会资本再生产的周期一般包括四个阶段，其中（）是周期的基本阶段，也是必经阶段","options":[{"letter":"A","text":"危机阶段"},{"letter":"B","text":"萧条阶段"},{"letter":"C","text":"复苏阶段"},{"letter":"D","text":"高涨阶段"}],"images":[],"answer":"A","analysis":"课本：资本主义经济危机具有周期性，社会资本再生产的周期一般包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是周期的基本阶段（必经阶段），它既是上一个周期的终点，又是下一个周期的起点。"},{"id":"25261-T17","fileId":"25261","source":"2025-2026学年第1学期 B卷 第17题","paper":"2025-2026学年第1学期 B卷","num":17,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"资本主义的发展经历了两个阶段，即（）","options":[{"letter":"A","text":"资本原始积累阶段和资本积累阶段"},{"letter":"B","text":"资本原始积累阶段和自由竞争资本主义阶段"},{"letter":"C","text":"自由竞争资本主义阶段和垄断资本主义阶段"},{"letter":"D","text":"私人垄断资本阶段和国家垄断资本主义阶段"}],"images":[],"answer":"C","analysis":"课本：资本主义的发展经历了两个阶段：自由竞争资本主义阶段和垄断资本主义阶段。19世纪70年代以前资本主义处于自由竞争阶段，19世纪末20世纪初垄断代替自由竞争占统治地位，进入垄断阶段。"},{"id":"25261-T18","fileId":"25261","source":"2025-2026学年第1学期 B卷 第18题","paper":"2025-2026学年第1学期 B卷","num":18,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"进入21世纪以来，当代资本主义最突出、最鲜明、最主要的特征是（）","options":[{"letter":"A","text":"国际金融资本的垄断"},{"letter":"B","text":"发达资本主义国家在世界范围内推行霸权主义和强权政治"},{"letter":"C","text":"传统技能逐渐被智能化、自动化所取代"},{"letter":"D","text":"资本主义生产方式向数字化、智能化方向发展"}],"images":[],"answer":"A","analysis":"课本：当代资本主义变化的新特征之一是经济高度金融化，金融垄断资本的控制能力大大提升。进入21世纪以来，国际金融资本的垄断是当代资本主义最突出、最鲜明、最主要的特征。"},{"id":"25261-T19","fileId":"25261","source":"2025-2026学年第1学期 B卷 第19题","paper":"2025-2026学年第1学期 B卷","num":19,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"在当代资本主义生产关系中，社会阶层和阶级结构的新变化是（）","options":[{"letter":"A","text":"拥有所有权的资本家仍然直接控制企业"},{"letter":"B","text":"高级职业经理成为大公司经营活动的实际控制者"},{"letter":"C","text":"知识型和服务型劳动者越来越控制企业"},{"letter":"D","text":"资本家及其代理人逐渐采取激化和劳资关系的激励制度"}],"images":[],"answer":"B","analysis":"课本：二战后资本主义社会阶层和阶级结构的新变化包括：资本家的地位和作用发生变化，拥有所有权的资本家一般不再直接经营企业；高级职业经理成为大公司经营活动的实际控制者；知识型和服务型劳动者的数量不断增加。A、C、D表述错误。"},{"id":"25261-T20","fileId":"25261","source":"2025-2026学年第1学期 B卷 第20题","paper":"2025-2026学年第1学期 B卷","num":20,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"在国家垄断资本主义的主要形式中，属于宏观调节的手段是（）","options":[{"letter":"A","text":"社会福利开支"},{"letter":"B","text":"制定反托拉斯法"},{"letter":"C","text":"保护知识产权"},{"letter":"D","text":"运用货币政策"}],"images":[],"answer":"D","analysis":"课本：国家垄断资本主义的主要形式包括国家所有并直接经营的企业、国家与私人共有合营企业、国家通过多种形式参与私人垄断资本的再生产过程、宏观调节和微观规制等。宏观调节主要是运用财政政策和货币政策对社会总供给与总需求进行调节；社会福利开支属于社会再分配，反托拉斯法和知识产权保护属于微观规制。"},{"id":"25261-T21","fileId":"25261","source":"2025-2026学年第1学期 B卷 第21题","paper":"2025-2026学年第1学期 B卷","num":21,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"multi","subtype":"","desc":"马克思主义创立的直接理论来源是（）","options":[{"letter":"A","text":"德国古典哲学"},{"letter":"B","text":"英国古典政治经济学"},{"letter":"C","text":"法国复辟时期历史学家的进步思想"},{"letter":"D","text":"英法空想社会主义"}],"images":[],"answer":"ABD","analysis":"课本导论：德国古典哲学、英国古典政治经济学、英法空想社会主义为马克思主义的创立提供了直接的理论来源。法国复辟时期历史学家的进步思想属于更广泛意义上的思想来源。"},{"id":"25261-T22","fileId":"25261","source":"2025-2026学年第1学期 B卷 第22题","paper":"2025-2026学年第1学期 B卷","num":22,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"时间和空间是运动着的物质的基本存在形式，下列说法正确的是（）","options":[{"letter":"A","text":"时间是指物质运动的持续性、顺序性"},{"letter":"B","text":"空间是指物质运动的广延性、伸张性"},{"letter":"C","text":"没有离开物质运动的“纯粹”时间和空间"},{"letter":"D","text":"没有离开时间和空间的物质运动"}],"images":[],"answer":"ABCD","analysis":"课本：时间是指物质运动的持续性、顺序性，特点是一维性；空间是指物质运动的广延性、伸张性，特点是三维性。没有离开物质运动的“纯粹”时间和空间，也没有离开时间和空间的物质运动，物质运动与时空的不可分割证明了时空的客观性。"},{"id":"25261-T23","fileId":"25261","source":"2025-2026学年第1学期 B卷 第23题","paper":"2025-2026学年第1学期 B卷","num":23,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"实践是认识发展的动力，表现在（）","options":[{"letter":"A","text":"实践的需要推动认识的产生和发展"},{"letter":"B","text":"实践为认识的发展提供了手段和条件"},{"letter":"C","text":"实践是检验认识真理性的唯一标准"},{"letter":"D","text":"实践改造了人的主观世界，锻炼和提高了人的认识能力"}],"images":[],"answer":"ABD","analysis":"课本：实践是认识发展的动力，表现为：实践的需要推动认识的产生和发展；实践为认识的发展提供了手段和条件；实践锻炼和提高了人的认识能力（改造了人的主观世界）。C表述本身正确，但它是实践对认识的检验功能，不是“动力”的表现。"},{"id":"25261-T24","fileId":"25261","source":"2025-2026学年第1学期 B卷 第24题","paper":"2025-2026学年第1学期 B卷","num":24,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"交往是人类实践活动的重要组成部分，对社会生活有着重要的影响，表现在（）","options":[{"letter":"A","text":"促进生产力的发展"},{"letter":"B","text":"促进社会关系的进步"},{"letter":"C","text":"促进文化的发展与传播"},{"letter":"D","text":"促进人的全面发展"}],"images":[],"answer":"ABCD","analysis":"课本：交往对社会生活的重要影响包括四个方面：促进生产力的发展；促进社会关系的进步；促进文化的发展与传播；促进人的全面发展。均为课本原话。"},{"id":"25261-T25","fileId":"25261","source":"2025-2026学年第1学期 B卷 第25题","paper":"2025-2026学年第1学期 B卷","num":25,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"multi","subtype":"","desc":"科技革命对生产方式产生了深刻影响，主要表现在（）","options":[{"letter":"A","text":"新的科学理论和技术手段影响思维主体、思维客体和思维工具"},{"letter":"B","text":"改变了社会生产力的构成要素"},{"letter":"C","text":"改变了人们的劳动形式"},{"letter":"D","text":"改变了社会经济结构，特别是导致产业结构发生变革"}],"images":[],"answer":"BCD","analysis":"课本：科技革命对社会的影响体现在生产方式、生活方式和思维方式三方面。对生产方式的影响：改变了社会生产力的构成要素；改变了人们的劳动形式；改变了社会经济结构，特别是导致产业结构发生变革。A属于科技革命对思维方式的影响。"},{"id":"25261-T26","fileId":"25261","source":"2025-2026学年第1学期 B卷 第26题","paper":"2025-2026学年第1学期 B卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"货币有两个职能会引起经济危机的抽象的一般的可能性，它们是（）","options":[{"letter":"A","text":"价值尺度"},{"letter":"B","text":"支付手段"},{"letter":"C","text":"流通手段"},{"letter":"D","text":"贮藏手段"}],"images":[],"answer":"BC","analysis":"课本：货币执行流通手段职能使买和卖在时间和空间上分离，产生了经济危机的抽象可能性；货币执行支付手段职能形成债务链条，使危机可能性进一步发展。价值尺度和贮藏手段不直接产生这种可能性。"},{"id":"25261-T27","fileId":"25261","source":"2025-2026学年第1学期 B卷 第27题","paper":"2025-2026学年第1学期 B卷","num":27,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"劳动力商品的价值包括（）","options":[{"letter":"A","text":"维持劳动者本人生存所必需的生活资料的价值"},{"letter":"B","text":"维持劳动者家属的生存所必需的生活资料的价值"},{"letter":"C","text":"劳动者接受教育和训练所支出的费用"},{"letter":"D","text":"劳动者创新创业所需要的费用"}],"images":[],"answer":"ABC","analysis":"课本：劳动力商品的价值包括三部分：维持劳动者本人生存所必需的生活资料的价值；维持劳动者家属生存所必需的生活资料的价值；劳动者接受教育和训练所支出的费用。劳动力价值的构成还包含历史和道德的因素。D不在其列。"},{"id":"25261-T28","fileId":"25261","source":"2025-2026学年第1学期 B卷 第28题","paper":"2025-2026学年第1学期 B卷","num":28,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"垄断价格是垄断组织在销售或购买商品时，凭借其垄断地位规定的、旨在保证最大限度利润的市场价格，垄断价格的形式包括（）","options":[{"letter":"A","text":"垄断高价"},{"letter":"B","text":"成本价格加平均利润"},{"letter":"C","text":"垄断低价"},{"letter":"D","text":"成本价格加垄断利润"}],"images":[],"answer":"AC","analysis":"课本：垄断价格包括垄断高价和垄断低价两种形式：垄断高价是垄断组织销售商品时规定的高於生产价格的价格；垄断低价是垄断组织向非垄断企业和小生产者购买原材料等时规定的低于生产价格的价格。垄断价格不能凭空创造价值，全社会商品价格总额仍与价值总额一致。"},{"id":"25261-T29","fileId":"25261","source":"2025-2026学年第1学期 B卷 第29题","paper":"2025-2026学年第1学期 B卷","num":29,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"multi","subtype":"","desc":"世界大变局下资本主义国家内部的矛盾与冲突日益明显，其中政治体制失灵主要表现在以下方面（）","options":[{"letter":"A","text":"西式选举往往难以选贤"},{"letter":"B","text":"政党利益可能凌驾于国家利益之上"},{"letter":"C","text":"社会极端思潮抬头"},{"letter":"D","text":"虚拟经济与实体经济发展失衡"}],"images":[],"answer":"AB","analysis":"课本：世界大变局下资本主义国家内部矛盾日益明显，其中政治体制失灵主要表现为：一是西式选举往往难以选贤；二是政党利益可能凌驾于国家利益之上（“否决政治”盛行、政治极化）。C属于社会融合危机（社会矛盾）的表现，D属于经济发展失调的表现。"},{"id":"25261-T30","fileId":"25261","source":"2025-2026学年第1学期 B卷 第30题","paper":"2025-2026学年第1学期 B卷","num":30,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"经济全球化对发展中国家的积极作用主要表现为（）","options":[{"letter":"A","text":"为发展中国家提供先进技术和管理经验"},{"letter":"B","text":"为发展中国家提供更多就业机会"},{"letter":"C","text":"推动发展中国家国际贸易的发展"},{"letter":"D","text":"促进发展中国家跨国公司的发展"}],"images":[],"answer":"ABCD","analysis":"课本：经济全球化对发展中国家的积极作用：提供先进技术和管理经验；提供更多就业机会；推动国际贸易的发展；促进发展中国家跨国公司的发展。同时经济全球化也是一把双刃剑，对发展中国家存在消极影响。"},{"id":"25261-T31","fileId":"25261","source":"2025-2026学年第1学期 B卷 第31题","paper":"2025-2026学年第1学期 B卷","num":31,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"judge","desc":"对存在和思维是否具有同一性的不同回答，产生了唯物主义和唯心主义的理论划分","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：哲学基本问题包括两方面：对存在和思维何者为第一性的不同回答，是划分唯物主义和唯心主义的唯一标准；对存在和思维是否具有同一性（思维能否正确认识存在）的不同回答，划分的是可知论与不可知论。题干张冠李戴。"},{"id":"25261-T32","fileId":"25261","source":"2025-2026学年第1学期 B卷 第32题","paper":"2025-2026学年第1学期 B卷","num":32,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"judge","desc":"唯物史观和剩余价值学说是马克思一生的两个伟大发现","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本导论：马克思一生的两个伟大发现是唯物史观和剩余价值学说。这两大发现使社会主义由空想变为科学，是马克思主义区别于其他理论的重要标志。"},{"id":"25261-T33","fileId":"25261","source":"2025-2026学年第1学期 B卷 第33题","paper":"2025-2026学年第1学期 B卷","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"judge","desc":"马克思、恩格斯深刻揭示了自然存在的客观实在性，克服了旧唯物主义物质观的缺陷，实现了物质观上的重大变革","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：马克思、恩格斯深刻揭示的是社会存在的客观实在性（而非仅仅是自然存在），克服了旧唯物主义物质观局限于自然领域的缺陷，把唯心主义从社会历史领域中彻底驱除出去，实现了物质观上的重大变革。题干把“社会存在”换成了“自然存在”。"},{"id":"25261-T34","fileId":"25261","source":"2025-2026学年第1学期 B卷 第34题","paper":"2025-2026学年第1学期 B卷","num":34,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"judge","desc":"量变质变规律体现了事物发展的渐进性和飞跃性的统一","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：量变是事物渐进的、不显著的变化，体现发展的渐进性；质变是事物根本性质的变化，是渐进过程的中断，体现发展的飞跃性。量变质变规律揭示了事物发展是渐进性和飞跃性的统一。"},{"id":"25261-T35","fileId":"25261","source":"2025-2026学年第1学期 B卷 第35题","paper":"2025-2026学年第1学期 B卷","num":35,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"judge","desc":"在人的认识活动中，反映特性与能动的创造特性是不可分割的","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，是反映性与创造性的统一。反映特性与能动的创造特性相互联系、不可分割：创造以反映为基础，反映中包含着创造。"},{"id":"25261-T36","fileId":"25261","source":"2025-2026学年第1学期 B卷 第36题","paper":"2025-2026学年第1学期 B卷","num":36,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"judge","desc":"认识主体在立场观点方法等方面的差异会导致人们对于同一客体的真理性认识多元化","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：真理具有一元性：对于特定的认识客体来说，真理只有一个，它不因主体认识的差别和变化而改变。主体立场观点方法的差异会影响认识过程，但不能推出真理性认识多元化。"},{"id":"25261-T37","fileId":"25261","source":"2025-2026学年第1学期 B卷 第37题","paper":"2025-2026学年第1学期 B卷","num":37,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"judge","desc":"价值是一种客观存在，独立于人们对它的认识和评价","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本原话：价值的客观性是指在一定条件下客体对于主体的意义不依赖于主体的主观意识而存在。价值是一种客观存在，独立于人们对它的认识和评价。认识和评价可以反映价值，但不能创造也不能消灭价值。"},{"id":"25261-T38","fileId":"25261","source":"2025-2026学年第1学期 B卷 第38题","paper":"2025-2026学年第1学期 B卷","num":38,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"judge","desc":"社会意识形态是高层次的社会意识，包括政治法律思想、道德、艺术、宗教、哲学、科学等","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：社会意识形态（观念上层建筑）包括政治法律思想、道德、艺术、宗教、哲学等，是高层次的社会意识。但自然科学、形式逻辑等不属于意识形态，它们没有阶级性，可以为不同的社会制度服务。题干把“科学”笼统列入意识形态，错误。"},{"id":"25261-T39","fileId":"25261","source":"2025-2026学年第1学期 B卷 第39题","paper":"2025-2026学年第1学期 B卷","num":39,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"judge","desc":"根据历史人物所具有的历史特征和阶级特点，评价历史人物时应该坚持历史分析方法和阶级分析方法","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：评价历史人物要坚持历史分析方法和阶级分析方法：历史分析方法要求把历史人物置于当时的历史背景中考察；阶级分析方法要求把历史人物置于其所属的阶级关系中考察。二者都是唯物史观评价历史人物的科学方法。"},{"id":"25261-T40","fileId":"25261","source":"2025-2026学年第1学期 B卷 第40题","paper":"2025-2026学年第1学期 B卷","num":40,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"judge","desc":"自然地理环境和人口因素都是社会生活的物质方面，都决定了社会的性质和社会形态的更替","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：自然地理环境和人口因素都是社会存在的重要内容，对社会发展起加速或延缓的作用，但都不能决定社会的性质和社会形态的更替。决定社会性质和形态更替的是物质生产方式。"},{"id":"25261-T41","fileId":"25261","source":"2025-2026学年第1学期 B卷 第41题","paper":"2025-2026学年第1学期 B卷","num":41,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"judge","desc":"单位商品的价值量与生产商品所消耗的社会必要劳动时间成正比，与劳动生产率成反比","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：这是劳动价值论的基本原理。单位商品的价值量由生产该商品的社会必要劳动时间决定，与之成正比；劳动生产率越高，单位商品中包含的社会必要劳动时间越少，价值量越小，故成反比。"},{"id":"25261-T42","fileId":"25261","source":"2025-2026学年第1学期 B卷 第42题","paper":"2025-2026学年第1学期 B卷","num":42,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"judge","desc":"商品的二因素决定了劳动的二重性","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：因果关系说反了。劳动的二重性（具体劳动和抽象劳动）决定商品的二因素（使用价值和价值）：具体劳动创造使用价值，抽象劳动形成价值。劳动二重性理论是理解马克思主义政治经济学的枢纽。"},{"id":"25261-T43","fileId":"25261","source":"2025-2026学年第1学期 B卷 第43题","paper":"2025-2026学年第1学期 B卷","num":43,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"judge","desc":"资本积累和资本原始积累虽然主要处于资本主义不同阶段，但是，积累的源泉是相同的","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：二者源泉不同。资本原始积累发生在资本主义生产方式确立之前，主要是用暴力手段（剥夺农民土地、殖民掠夺等）使生产者与生产资料分离、货币财富迅速集中；资本积累则是把剩余价值转化为资本，其源泉是雇佣工人创造的剩余价值。"},{"id":"25261-T44","fileId":"25261","source":"2025-2026学年第1学期 B卷 第44题","paper":"2025-2026学年第1学期 B卷","num":44,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"judge","desc":"价值转化为生产价格后，整个资产阶级获得的利润总额就会高于雇佣工人所创造的剩余价值总额","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：价值转化为生产价格、利润转化为平均利润后，从个别部门看利润与剩余价值不再相等，但从全社会看，整个资产阶级获得的利润总额仍然等于雇佣工人所创造的剩余价值总额，生产价格总额等于价值总额。平均利润规律没有改变剩余价值的总量。"},{"id":"25261-T45","fileId":"25261","source":"2025-2026学年第1学期 B卷 第45题","paper":"2025-2026学年第1学期 B卷","num":45,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"judge","desc":"资本从利润率低的部门投向利润率高的部门，这是等量资本获得等量利润的客观要求，结果是不同部门的资本家瓜分到平均利润","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：等量资本要求获得等量利润。部门之间的竞争和资本转移使利润率趋于平均化，形成平均利润率，不同部门的资本家按照等量资本获得等量利润的原则瓜分剩余价值，即获得平均利润。"},{"id":"25261-T46","fileId":"25261","source":"2025-2026学年第1学期 B卷 第46题","paper":"2025-2026学年第1学期 B卷","num":46,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"judge","desc":"相对剩余价值的生产是资本家追逐超额剩余价值的结果","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：各个资本家追逐超额剩余价值，竞相改进技术、提高个别劳动生产率，最终导致社会劳动生产率普遍提高、生活资料价值下降、必要劳动时间缩短，从而整个资本家阶级普遍获得相对剩余价值。相对剩余价值生产正是资本家追逐超额剩余价值的客观结果。"},{"id":"25261-T47","fileId":"25261","source":"2025-2026学年第1学期 B卷 第47题","paper":"2025-2026学年第1学期 B卷","num":47,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"judge","desc":"垄断条件下的竞争的目的依然是获取超额剩余价值","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：垄断不能消除竞争，反而使竞争更加复杂剧烈。但垄断条件下竞争的目的不是获取超额剩余价值，而是获取高额垄断利润。超额剩余价值是自由竞争条件下个别资本家率先提高生产率获得的。"},{"id":"25261-T48","fileId":"25261","source":"2025-2026学年第1学期 B卷 第48题","paper":"2025-2026学年第1学期 B卷","num":48,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"judge","desc":"马克思的劳动价值论和剩余价值论是相互独立的两个理论，彼此之间互不形成前提与基础","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"F","analysis":"课本：马克思劳动价值论扬弃了英国古典政治经济学的观点，为剩余价值论的创立奠定了基础。只有在劳动二重性理论科学区分了劳动与劳动力、不变资本与可变资本之后，剩余价值的来源和资本主义剥削的秘密才得以揭示。两论不是彼此孤立的。"},{"id":"25261-T49","fileId":"25261","source":"2025-2026学年第1学期 B卷 第49题","paper":"2025-2026学年第1学期 B卷","num":49,"chapter":{"label":"第六章 社会主义的发展及其规律","section":"第一节 社会主义五百年的历史进程","raw":"第六章 社会主义的发展及其规律 · 第一节 社会主义五百年的历史进程"},"type":"choice","subtype":"judge","desc":"十月社会主义革命的胜利，标志着社会主义从理想开始变成现实","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：1917年俄国十月革命的胜利，建立了世界上第一个社会主义国家，使社会主义从理想变为现实、从理论变为实践，开启了社会主义从一国到多国发展的历史进程。"},{"id":"25261-T50","fileId":"25261","source":"2025-2026学年第1学期 B卷 第50题","paper":"2025-2026学年第1学期 B卷","num":50,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"judge","desc":"第二次世界大战后资本主义的变化从根本上说是人类社会发展一般规律和资本主义经济规律作用的结果","options":[{"letter":"T","text":"正确"},{"letter":"F","text":"不正确"}],"images":[],"answer":"T","analysis":"课本：当代资本主义新变化的实质：这些变化从根本上说是人类社会发展一般规律和资本主义经济规律作用的结果，是资本主义生产方式为适应生产力发展要求而作出的自我调节的结果；这些变化是在资本主义制度基本框架内的变化，并不意味着资本主义生产关系的根本性质发生了变化。"},{"id":"MARX-SELECTED-Q53-0005","fileId":"MARX-SELECTED","source":"精选练习题 第1题（Q53-0005）","paper":"精选练习题","num":1,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"空间是指","options":[{"letter":"A","text":"物质运动的持续性"},{"letter":"B","text":"物质运动的广延性"},{"letter":"C","text":"物质运动的顺序性"},{"letter":"D","text":"物质运动的特殊状态"}],"images":[],"answer":"B","analysis":"课本第一章指出，时间和空间是运动着物质的基本存在形式：时间指物质运动的持续性、顺序性，特点是一维性；空间指物质运动的广延性、伸张性，特点是三维性，故选B。A、C都是对时间的规定，D接近相对静止的说法，即物质运动在一定条件下的稳定状态，与空间无关。"},{"id":"MARX-SELECTED-Q53-0544","fileId":"MARX-SELECTED","source":"精选练习题 第2题（Q53-0544）","paper":"精选练习题","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"唯物辩证法的总特征是","options":[{"letter":"A","text":"矛盾的同一性和斗争性相结合的观点"},{"letter":"B","text":"普遍联系和永恒发展的观点"},{"letter":"C","text":"矛盾的对立面既统一又斗争的观点"},{"letter":"D","text":"运动和静止辩证统一的观点"}],"images":[],"answer":"B","analysis":"课本第一章指出，联系和发展的观点是唯物辩证法的总观点，集中体现了它的总特征，即世界是普遍联系和永恒发展的，故选B。A、C说的是矛盾双方的同一与斗争，对立统一规律是唯物辩证法的实质和核心，并非“总特征”；D讲运动与静止的关系，属于物质的存在方式，更谈不上整个辩证法的总特征。"},{"id":"MARX-SELECTED-Q53-0017","fileId":"MARX-SELECTED","source":"精选练习题 第3题（Q53-0017）","paper":"精选练习题","num":3,"chapter":{"label":"导论","section":"一、什么是马克思主义","raw":"导论 · 一、什么是马克思主义"},"type":"choice","subtype":"single","desc":"马克思主义的精髓是","options":[{"letter":"A","text":"实事求是"},{"letter":"B","text":"阶级斗争理论"},{"letter":"C","text":"社会发展理论"},{"letter":"D","text":"人民群众历史作用理论"}],"images":[],"answer":"A","analysis":"课本导论讲马克思主义的基本方法，把实事求是列为首要方法；邓小平更直接说过，实事求是是马克思主义的精髓。它体现唯物主义与辩证法的统一、主观与客观具体的历史的统一，贯穿于马克思主义整个立场观点方法之中。B、C、D都只是马克思主义的某一方面基本观点，属于体系中的具体内容，称不上贯穿全体系的精髓。"},{"id":"MARX-SELECTED-Q53-0026","fileId":"MARX-SELECTED","source":"精选练习题 第4题（Q53-0026）","paper":"精选练习题","num":4,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"社会主义社会的改革是","options":[{"letter":"A","text":"改变社会主义的基本政治制度"},{"letter":"B","text":"改变社会主义的基本经济制度"},{"letter":"C","text":"改变社会主义的基本文化制度"},{"letter":"D","text":"社会主义制度的自我完善"}],"images":[],"answer":"D","analysis":"课本第三章讲改革在社会发展中的作用时指出，改革适用于解决现存社会体制的问题，它在不改变社会基本制度的前提下变革生产关系和上层建筑中不相适应的环节，是社会制度的自我调整和完善，社会主义改革从性质上正是社会主义制度的自我完善和发展。A、B、C都主张改变基本政治、经济、文化制度，那已触及基本制度本身，恰是改革排除的界限。"},{"id":"MARX-SELECTED-Q53-0030","fileId":"MARX-SELECTED","source":"精选练习题 第5题（Q53-0030）","paper":"精选练习题","num":5,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第三节 认识世界和改造世界","raw":"第二章 实践与认识及其发展规律 · 第三节 认识世界和改造世界"},"type":"choice","subtype":"single","desc":"在自由和必然的关系问题上，马克思主义哲学认为自由是指人们","options":[{"letter":"A","text":"完全按照自己的意志创造历史"},{"letter":"B","text":"不受必然性制约的创造性活动"},{"letter":"C","text":"对客观必然性的认识和对客观世界的改造"},{"letter":"D","text":"按照共同拟定的计划改造自然和社会"}],"images":[],"answer":"C","analysis":"课本第二章第三节指出，自由是人在活动中通过认识和利用必然表现出的自觉自主状态，“自由是对必然的认识和对客观世界的改造”。它有两个条件：对规律的正确认识，以及用这种认识指导实践去改造世界，C 两方面都讲到了。A、B 属于唯意志论，幻想摆脱必然性的制约；D 只说按计划改造，没有以承认客观规律为前提，仍不等于自由。"},{"id":"MARX-SELECTED-Q53-0050","fileId":"MARX-SELECTED","source":"精选练习题 第6题（Q53-0050）","paper":"精选练习题","num":6,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"坚持真理的客观性是真理观点的","options":[{"letter":"A","text":"唯物主义"},{"letter":"B","text":"唯心主义"},{"letter":"C","text":"形而上学"},{"letter":"D","text":"机械论"}],"images":[],"answer":"A","analysis":"课本第二章指出，真理是不是客观的，是真理观中的首要问题：真理的内容是对客观事物及其规律的正确反映，包含着不依赖于主体的客观内容，对此作肯定回答的正是唯物主义，唯心主义一律否认。B项从贝克莱的“真理在观念之中”到实用主义的“有用即真理”，都否定了客观真理；C、D说的是思维方式和旧唯物主义的缺陷，与承不承认客观真理无关。"},{"id":"MARX-SELECTED-Q53-0057","fileId":"MARX-SELECTED","source":"精选练习题 第7题（Q53-0057）","paper":"精选练习题","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"矛盾问题的精髓是指","options":[{"letter":"A","text":"矛盾的共性和个性、绝对和相对的关系"},{"letter":"B","text":"根本矛盾和非根本矛盾的关系"},{"letter":"C","text":"主要矛盾和非主要矛盾的关系"},{"letter":"D","text":"矛盾的主要方面和非主要方面的关系"}],"images":[],"answer":"A","analysis":"课本第一章：矛盾的普遍性即共性、特殊性即个性，共性是无条件的绝对的，个性是有条件的相对的，共性寓于个性之中。共性与个性、绝对与相对的道理，才是关于事物矛盾问题的精髓，不懂它就无法真正掌握唯物辩证法。B、C、D讲根本与非根本矛盾、主次矛盾、矛盾主次方面的区别，属于矛盾发展的不平衡性，并非“精髓”。"},{"id":"MARX-SELECTED-Q53-0059","fileId":"MARX-SELECTED","source":"精选练习题 第8题（Q53-0059）","paper":"精选练习题","num":8,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在经济基础和上层建筑的辩证关系中","options":[{"letter":"A","text":"上层建筑决定经济基础"},{"letter":"B","text":"经济基础服务于上层建筑"},{"letter":"C","text":"经济基础决定上层建筑"},{"letter":"D","text":"经济基础产生于上层建筑"}],"images":[],"answer":"C","analysis":"课本第三章指出，在这对辩证关系中经济基础决定上层建筑，上层建筑对经济基础只具有反作用，C正是这一决定作用的表述。A把决定与被决定说反了；B颠倒了服务的方向，教材说的是上层建筑为自己的经济基础服务、帮助它确立和巩固统治地位；D同样倒置，上层建筑的产生和存在归根到底要从经济结构中得到说明，经济基础并不产生于上层建筑。"},{"id":"MARX-SELECTED-Q53-0081","fileId":"MARX-SELECTED","source":"精选练习题 第9题（Q53-0081）","paper":"精选练习题","num":9,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"感性认识和理性认识的联系表现在","options":[{"letter":"A","text":"理性认识依赖于感性认识"},{"letter":"B","text":"感性认识有待于发展为理性认识"},{"letter":"C","text":"感性认识依赖于理性认识"},{"letter":"D","text":"感性认识和理性认识相互渗透"},{"letter":"E","text":"理性认识是感性认识的总和"}],"images":[],"answer":"ABD","analysis":"课本第二章讲，感性认识与理性认识是辩证统一的：理性认识依赖于感性认识，感性认识有待于发展和深化为理性认识，二者又相互渗透、相互包含，故A、B、D入选。C把依赖关系颠倒过来，E把理性认识说成感性材料的简单相加，抹杀了抽象思维的加工作用；割裂二者的统一，就会倒向唯理论或经验论。"},{"id":"MARX-SELECTED-Q53-0096","fileId":"MARX-SELECTED","source":"精选练习题 第10题（Q53-0096）","paper":"精选练习题","num":10,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"哲学基本问题是指","options":[{"letter":"A","text":"世界观和方法论的关系"},{"letter":"B","text":"理论和实践的关系"},{"letter":"C","text":"思维和存在的关系"},{"letter":"D","text":"物质和运动的关系"}],"images":[],"answer":"C","analysis":"课本第一章指出，恩格斯第一次明确提出，全部哲学的重大基本问题就是思维和存在的关系问题，它包括谁是本原、二者有无同一性两层内容，对第一层的回答划分出唯物主义与唯心主义。A只是界定了哲学的性质，B属于认识论中的问题，D讲的是物质的存在方式，都不构成哲学的基本问题。"},{"id":"MARX-SELECTED-Q53-0120","fileId":"MARX-SELECTED","source":"精选练习题 第11题（Q53-0120）","paper":"精选练习题","num":11,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"事物发展的周期性体现了","options":[{"letter":"A","text":"事物发展的直线性与曲折性的统一"},{"letter":"B","text":"事物发展是一个不断地回到出发点的运动"},{"letter":"C","text":"事物发展的周而复始的循环性"},{"letter":"D","text":"事物发展的前进性与曲折性的统一"}],"images":[],"answer":"D","analysis":"课本第一章讲否定之否定规律：事物经过两次否定、三个阶段形成一个周期，否定之否定阶段仿佛是回到出发点，却是在更高阶段上的回复，因此发展呈波浪式前进或螺旋式上升。周期的每一次回复都既有前进又有曲折，故D正确。A错在“直线性”，发展本就不是直线；B、C只看到回到原点、周而复始，抹掉了前进性。"},{"id":"MARX-SELECTED-Q53-0121","fileId":"MARX-SELECTED","source":"精选练习题 第12题（Q53-0121）","paper":"精选练习题","num":12,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"感性认识和理性认识的区别在于","options":[{"letter":"A","text":"感性认识是对事物现象的认识,理性认识是对事物本质的认识"},{"letter":"B","text":"感性认识来源于实践,理性认识来源于书本"},{"letter":"C","text":"感性认识是直接经验,理性认识是间接经验"},{"letter":"D","text":"感性认识可靠,理性认识不可靠"}],"images":[],"answer":"A","analysis":"课本：感性认识是认识的初级阶段，以具体形象直接反映事物的现象和外部联系；理性认识借助抽象思维把握事物的本质、全体和内部联系，具有抽象性和间接性，这就是二者的区别，故选A。B错在把理性认识说成来源于书本，二者归根到底都来源于实践；C把感性、理性混同于直接经验和间接经验；D颠倒了可靠程度，理性认识更深刻也更可靠。"},{"id":"MARX-SELECTED-Q53-0144","fileId":"MARX-SELECTED","source":"精选练习题 第13题（Q53-0144）","paper":"精选练习题","num":13,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"对立统一规律是唯物辩证法的","options":[{"letter":"A","text":"全部内容"},{"letter":"B","text":"实质和核心"},{"letter":"C","text":"惟一特征"},{"letter":"D","text":"惟一范畴"}],"images":[],"answer":"B","analysis":"课本第一章指出，对立统一规律是唯物辩证法的实质和核心：它揭示了事物普遍联系的根本内容和变化发展的内在动力，从根本上回答了事物为什么会发展；它是贯穿量变质变规律、否定之否定规律和各对范畴的中心线索，也是理解它们的钥匙，并提供矛盾分析方法。A把整个辩证法收进一条规律，C、D的“惟一”明显绝对化。"},{"id":"MARX-SELECTED-Q53-0145","fileId":"MARX-SELECTED","source":"精选练习题 第14题（Q53-0145）","paper":"精选练习题","num":14,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"矛盾问题的精髓是","options":[{"letter":"A","text":"主要矛盾和次要矛盾的关系问题"},{"letter":"B","text":"主要矛盾方面和次要矛盾方面的关系问题"},{"letter":"C","text":"运动和静止的关系问题"},{"letter":"D","text":"矛盾的共性和个性、绝对和相对的关系问题"}],"images":[],"answer":"D","analysis":"课本第一章说，矛盾的普遍性即共性、特殊性即个性，共性无条件、绝对，个性有条件、相对，任何现实事物的矛盾都是二者有机统一，共性寓于个性之中，这个道理就是关于事物矛盾问题的精髓，是正确理解矛盾学说的关键。A、B讲矛盾力量的不平衡性，只是矛盾特殊性的两种情形；C运动和静止说的是物质的存在方式，与矛盾问题无关。"},{"id":"MARX-SELECTED-Q53-0147","fileId":"MARX-SELECTED","source":"精选练习题 第15题（Q53-0147）","paper":"精选练习题","num":15,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"一切唯物主义的认识论都是","options":[{"letter":"A","text":"反映论"},{"letter":"B","text":"能动的反映论"},{"letter":"C","text":"科学的反映论"},{"letter":"D","text":"机械的反映论"}],"images":[],"answer":"A","analysis":"课本第二章第一节讲认识的本质时指出，唯物主义认识路线坚持从物到感觉和思想，也就是坚持反映论，认为认识是主体对客体的反映，这是一切唯物主义认识论的共同立场。B、C 专指马克思主义的认识论，即以实践为基础、把辩证法应用于反映论的能动的科学的反映论；D 是旧唯物主义的缺陷，只把认识看成照镜子式的直观被动反映。"},{"id":"MARX-SELECTED-Q53-0151","fileId":"MARX-SELECTED","source":"精选练习题 第16题（Q53-0151）","paper":"精选练习题","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"人类社会发展的最终决定力量是","options":[{"letter":"A","text":"从事物质资料生产的劳动者"},{"letter":"B","text":"经济上占统治地位的阶级"},{"letter":"C","text":"物质资料生产方式"},{"letter":"D","text":"作为阶级统治工具的国家"}],"images":[],"answer":"C","analysis":"课本第三章讲社会存在时指出，物质生产方式是生产力和生产关系的统一体，是社会存在和发展的基础及决定力量：它决定社会的结构、性质和面貌，它的变更决定社会形态由低级向高级更替。A劳动者是生产力中最活跃的因素，B、D属于由经济关系决定而又反作用于它的政治领域，都不能充当历史的最终决定力量。"},{"id":"MARX-SELECTED-Q53-0155","fileId":"MARX-SELECTED","source":"精选练习题 第17题（Q53-0155）","paper":"精选练习题","num":17,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在生产关系中，起决定作用的是","options":[{"letter":"A","text":"产品的分配形式"},{"letter":"B","text":"生产资料所有制"},{"letter":"C","text":"经营管理形式"},{"letter":"D","text":"劳动者的素质"}],"images":[],"answer":"B","analysis":"课本第三章讲，生产关系包括生产资料所有制关系、生产中人与人的关系和产品分配关系，其中所有制关系最基本，是物质生产的前提，生产、分配、交换和消费在很大程度上由它决定，它也是区分生产方式、判定社会经济性质的客观依据。A分配形式、C经营管理形式都由所有制派生并受其制约；D劳动者素质属于生产力方面，不在生产关系之内。"},{"id":"MARX-SELECTED-Q53-0160","fileId":"MARX-SELECTED","source":"精选练习题 第18题（Q53-0160）","paper":"精选练习题","num":18,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"马克思说：“手推磨产生的是封建主为首的社会，蒸汽磨产生的是工业资本家为首的社会”，这表明","options":[{"letter":"A","text":"有什么样的生产力,就有什么样的生产关系"},{"letter":"B","text":"有什么样的生产关系,就有什么样的生产力与之相适应"},{"letter":"C","text":"生产关系对生产力具有反作用"},{"letter":"D","text":"生产力直接决定社会形态"}],"images":[],"answer":"A","analysis":"课本第三章指出，生产力状况决定生产关系的性质，有什么样的生产力就会有什么样的生产关系，马克思以手推磨和蒸汽磨作比，说的正是这一点。B把方向颠倒，是生产力决定生产关系，而非生产关系派生出生产力；C讲生产关系的反作用，与引语无关；D错在“直接”二字，生产力要经由生产关系即经济基础才能规定社会形态。"},{"id":"MARX-SELECTED-Q53-0250","fileId":"MARX-SELECTED","source":"精选练习题 第19题（Q53-0250）","paper":"精选练习题","num":19,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"辩证唯物主义认为，认识的本质是","options":[{"letter":"A","text":"主观精神的产物"},{"letter":"B","text":"客观精神的显现"},{"letter":"C","text":"主体对客体的直观反映"},{"letter":"D","text":"主体对客体的能动反映"}],"images":[],"answer":"D","analysis":"课本第二章指出，辩证唯物主义认识论是以实践为基础的能动反映论，它把认识的本质规定为主体在实践基础上对客体的能动反映，既有摹写性又有创造性。A是主观唯心主义先验论，B是客观唯心主义，C是旧唯物主义离开实践、离开辩证法的直观反映论，只讲被动摹写。"},{"id":"MARX-SELECTED-Q53-0268","fileId":"MARX-SELECTED","source":"精选练习题 第20题（Q53-0268）","paper":"精选练习题","num":20,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"哲学基本问题是","options":[{"letter":"A","text":"物质和运动的关系问题"},{"letter":"B","text":"思维和存在的关系问题"},{"letter":"C","text":"社会和自然的关系问题"},{"letter":"D","text":"主体和客体的关系问题"}],"images":[],"answer":"B","analysis":"课本第一章指出，恩格斯第一次明确把思维和存在的关系问题规定为全部哲学特别是近代哲学的重大基本问题，其内容一是谁是本原，二是二者有无同一性。A、C、D分别涉及运动的载体、人与自然、认识活动中的主体与客体，都只是这一基本关系在特定领域的表现，取代不了哲学基本问题。"},{"id":"MARX-SELECTED-Q53-0284","fileId":"MARX-SELECTED","source":"精选练习题 第21题（Q53-0284）","paper":"精选练习题","num":21,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"马克思哲学认为，认识的本质是","options":[{"letter":"A","text":"主体对客体的能动反映"},{"letter":"B","text":"主体对客体的直观反映"},{"letter":"C","text":"主体对客体的思维建构"},{"letter":"D","text":"主体对客体的价值判断"}],"images":[],"answer":"A","analysis":"课本第二章指出，马克思主义认识论是以实践为基础能动的反映论，认识的本质是主体在实践基础上对客体的能动反映，关键就在实践和能动两个字。B是旧唯物主义的直观反映论，丢掉了能动和辩证法；C把认识说成主体的思维建构，等于否认认识的客观内容；D只涉及价值关系，是认识的一个方面而不是本质。"},{"id":"MARX-SELECTED-Q53-0289","fileId":"MARX-SELECTED","source":"精选练习题 第22题（Q53-0289）","paper":"精选练习题","num":22,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在生产力和生产关系这对矛盾中","options":[{"letter":"A","text":"生产关系是生产力的物质基础"},{"letter":"B","text":"生产力落后于生产关系的变化"},{"letter":"C","text":"生产力决定生产关系"},{"letter":"D","text":"生产关系可以超越生产力的发展水平"}],"images":[],"answer":"C","analysis":"课本第三章指出，生产力与生产关系中生产力居支配地位：生产力状况决定生产关系的性质，生产力的发展决定生产关系的变化，故C正确。A说反了，生产关系形成的物质基础是生产力；B错，生产力是最活跃、最革命的要素，总是生产关系落后于生产力的发展；D“超越”违背生产关系一定要适合生产力状况的规律，人为“拔高”同样阻碍生产力发展。"},{"id":"MARX-SELECTED-Q53-0296","fileId":"MARX-SELECTED","source":"精选练习题 第23题（Q53-0296）","paper":"精选练习题","num":23,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"物质生活的生产方式是人类社会存在和发展的基础，其表现有","options":[{"letter":"A","text":"生产方式直接决定社会生活的一切方面"},{"letter":"B","text":"生产方式是全部社会生活方式的总和"},{"letter":"C","text":"生产方式决定整个社会的面貌"},{"letter":"D","text":"生产方式决定社会制度的性质"},{"letter":"E","text":"生产方式决定社会制度的更替"}],"images":[],"answer":"CDE","analysis":"课本第三章：生产方式是生产力与生产关系的统一体，它决定社会结构、性质和面貌，制约着全部社会生活，并决定社会形态由低级向高级更替，C、D、E正是这一原理的表现。A“直接决定社会生活的一切方面”把决定作用简单化，政治生活、精神生活有相对独立性，须经中介才受制约；B把生产方式等同于各种生活方式的总和，抹去了它的确定内涵。"},{"id":"MARX-SELECTED-Q53-0314","fileId":"MARX-SELECTED","source":"精选练习题 第24题（Q53-0314）","paper":"精选练习题","num":24,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"choice","subtype":"single","desc":"马克思主义哲学吸取的黑格尔哲学中的合理内核是","options":[{"letter":"A","text":"唯物主义"},{"letter":"B","text":"辩证法"},{"letter":"C","text":"可知论"},{"letter":"D","text":"认识论"}],"images":[],"answer":"B","analysis":"课本第一章引马克思《资本论》中的话说，黑格尔把辩证法“倒立着”，必须把它倒过来，才能发现神秘外壳中的合理内核。马克思、恩格斯批判他的唯心主义体系，吸取的正是辩证法这一合理内核；至于唯物主义的基本内核，来自费尔巴哈而非黑格尔，A因此是张冠李戴。C、D只是哲学的局部领域，构不成所谓内核。"},{"id":"MARX-SELECTED-Q53-0329","fileId":"MARX-SELECTED","source":"精选练习题 第25题（Q53-0329）","paper":"精选练习题","num":25,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会意识相对独立性的最突出表现是","options":[{"letter":"A","text":"社会意识的历史继承性"},{"letter":"B","text":"各种社会意识之间的相互影响"},{"letter":"C","text":"社会意识对社会存在的反作用"},{"letter":"D","text":"社会意识对社会存在变化上的滞后性"}],"images":[],"answer":"C","analysis":"课本第三章把社会意识的相对独立性归结为三方面：与社会存在发展不完全同步、不平衡，内部诸形式相互影响且各有历史继承性，以及对社会存在的能动的反作用，并说最后一项才是突出表现。一种意识只有转化为物质力量、促进或阻碍社会发展，才最充分地显示出它并不消极地依附于社会存在。A、B是另两项表现，D的滞后性属于不同步性。"},{"id":"MARX-SELECTED-Q53-0332","fileId":"MARX-SELECTED","source":"精选练习题 第26题（Q53-0332）","paper":"精选练习题","num":26,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"人类社会发展的基本动力是","options":[{"letter":"A","text":"阶级斗争"},{"letter":"B","text":"改革开放"},{"letter":"C","text":"科学技术革命"},{"letter":"D","text":"社会基本矛盾"}],"images":[],"answer":"D","analysis":"课本第三章第二节指出，社会发展动力是一个系统，其中基础性、根本性的动力是社会基本矛盾，即生产力与生产关系、经济基础与上层建筑的矛盾，它贯穿社会发展过程始终，规定社会发展的基本性质和趋势。A 只是阶级社会发展的直接动力，B 改革、C 科技革命都是在社会基本矛盾推动下起作用的具体动力，不是基本动力。"},{"id":"MARX-SELECTED-Q53-0340","fileId":"MARX-SELECTED","source":"精选练习题 第27题（Q53-0340）","paper":"精选练习题","num":27,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"人类全部社会关系中最基础的关系是","options":[{"letter":"A","text":"生产关系"},{"letter":"B","text":"血缘关系"},{"letter":"C","text":"政治关系"},{"letter":"D","text":"思想关系"}],"images":[],"answer":"A","analysis":"课本第三章指出，生产关系是人们在物质生产过程中形成的、不以人的意志为转移的经济关系，它是社会关系中最基本的关系，政治关系、家庭关系、宗教关系等其他社会关系都受它的支配和制约。C政治关系、D思想关系是在经济基础上形成的，B血缘关系属于家庭关系，同样要由生产方式来说明，因而都不是最根源的一层。"},{"id":"MARX-SELECTED-Q53-0360","fileId":"MARX-SELECTED","source":"精选练习题 第28题（Q53-0360）","paper":"精选练习题","num":28,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"全部社会生活在本质上是","options":[{"letter":"A","text":"物质的"},{"letter":"B","text":"实践的"},{"letter":"C","text":"相互联系的"},{"letter":"D","text":"发展变化的"}],"images":[],"answer":"B","analysis":"课本第二章讲，马克思在《关于费尔巴哈的提纲》中强调，全部社会生活在本质上是实践的，凡是把理论引向神秘主义的神秘东西，都能在人的实践中得到合理解决。物质生产是最首要的实践，社会关系和社会结构都在实践中生成，所以本质规定是实践。A说的是世界统一于物质的前提，答不出社会生活的特殊本质；C、D只是社会的存在状态。"},{"id":"MARX-SELECTED-Q53-0379","fileId":"MARX-SELECTED","source":"精选练习题 第29题（Q53-0379）","paper":"精选练习题","num":29,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"人类社会的基本矛盾是","options":[{"letter":"A","text":"人和自然界、人和人之间的矛盾"},{"letter":"B","text":"个人和社会、自然界和社会之间的矛盾"},{"letter":"C","text":"先进和落后、正确和错误之间的矛盾"},{"letter":"D","text":"生产力和生产关系、经济基础和上层建筑之间的矛盾"}],"images":[],"answer":"D","analysis":"课本第三章界定：贯穿社会发展始终、规定其基本性质和趋势、并起根本推动作用的矛盾就是社会基本矛盾，即生产力与生产关系、经济基础与上层建筑的矛盾，D正确。A、B、C罗列的都是社会生活具体领域的矛盾，属非基本矛盾，其存在和发展要受基本矛盾制约，如人与自然、人与人的矛盾归根到底仍须从生产方式的两对矛盾去说明。"},{"id":"MARX-SELECTED-Q53-0389","fileId":"MARX-SELECTED","source":"精选练习题 第30题（Q53-0389）","paper":"精选练习题","num":30,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第三节 认识世界和改造世界","raw":"第二章 实践与认识及其发展规律 · 第三节 认识世界和改造世界"},"type":"choice","subtype":"single","desc":"在自由和必然关系问题上马克思主义哲学认为，自由是","options":[{"letter":"A","text":"主观意志的产物"},{"letter":"B","text":"不受任何限制的活动"},{"letter":"C","text":"对必然性的否定和超越"},{"letter":"D","text":"对必然性的认识和对客观世界的改造"}],"images":[],"answer":"D","analysis":"课本第二章讲认识世界和改造世界是从必然走向自由：自由是人在活动中通过认识和利用必然表现出来的自觉自主状态。获得自由要有两个条件，一是正确认识规律，二是把这种认识用于改造世界。A、B是唯意志论，把自由讲成不受任何限制的任性；C把自由同必然对立起来，恰恰不懂自由以承认必然为前提。"},{"id":"MARX-SELECTED-Q53-0413","fileId":"MARX-SELECTED","source":"精选练习题 第31题（Q53-0413）","paper":"精选练习题","num":31,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"构成矛盾的两种基本属性是","options":[{"letter":"A","text":"普遍性和特殊性"},{"letter":"B","text":"绝对性和相对性"},{"letter":"C","text":"对抗性和非对抗性"},{"letter":"D","text":"同一性和斗争性"}],"images":[],"answer":"D","analysis":"课本讲，矛盾即对立统一，对立和统一分别体现为矛盾的两种基本属性，即斗争性与同一性，二者相互联结才构成事物运动，故选D。A的普遍性与特殊性说的是矛盾的存在状况，是矛盾问题的精髓；B的绝对性与相对性指这两种属性各自的性质；C的对抗与非对抗只是斗争形式的分类，都不是属性本身。"},{"id":"MARX-SELECTED-Q53-0433","fileId":"MARX-SELECTED","source":"精选练习题 第32题（Q53-0433）","paper":"精选练习题","num":32,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"生产力中最重要的要素是","options":[{"letter":"A","text":"劳动资料"},{"letter":"B","text":"劳动对象"},{"letter":"C","text":"劳动者"},{"letter":"D","text":"劳动工具"}],"images":[],"answer":"C","analysis":"课本第三章把生产力分为劳动资料、劳动对象和劳动者三个基本要素，并指出劳动者是生产力中最活跃的因素：物的要素只有同具有一定生产经验、技能和知识的劳动者结合，才能形成现实的生产力，所以最重要的要素是C。D生产工具只是劳动资料中最重要的部分，别把两个层次的说法混为一谈；A、B属于生产力中的物质要素。"},{"id":"MARX-SELECTED-Q53-0448","fileId":"MARX-SELECTED","source":"精选练习题 第33题（Q53-0448）","paper":"精选练习题","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"choice","subtype":"single","desc":"“在对现存事物的肯定的理解中同时包含着对现存事物的否定的理解，即对现存事物的必然灭亡的理解。”这是一种","options":[{"letter":"A","text":"唯物辩证法的观点"},{"letter":"B","text":"相对主义的观点"},{"letter":"C","text":"庸俗进化论的观点"},{"letter":"D","text":"激变论的观点"}],"images":[],"answer":"A","analysis":"这是马克思对唯物辩证法本质的经典表述，课本第一章据此说明辩证法不崇拜任何东西，它从每一既成形式的暂时性方面去理解事物，把肯定与否定、存在与必然灭亡看作内在相通，所以是唯物辩证法的观点。B相对主义只承认相对而否认绝对，C庸俗进化论只承认渐变、否认质变，D激变论又否认渐进积累、只讲突然毁灭，都讲不清肯定中包含否定。"},{"id":"MARX-SELECTED-Q53-0451","fileId":"MARX-SELECTED","source":"精选练习题 第34题（Q53-0451）","paper":"精选练习题","num":34,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"揭示事物发展是前进性和曲折性统一的规律是","options":[{"letter":"A","text":"联系和发展的规律"},{"letter":"B","text":"对立统一规律"},{"letter":"C","text":"质量互变规律"},{"letter":"D","text":"否定之否定规律"}],"images":[],"answer":"D","analysis":"课本第一章指出，否定之否定规律揭示事物经过两次否定、三个阶段实现自我发展，呈现出波浪式前进或螺旋式上升，前进性与曲折性的统一正是它揭示的内容，故选D。B对立统一规律揭示事物发展的动力和源泉，C质量互变规律揭示发展的形式和状态，即量变与质变的相互转化；A是对辩证法总特征的概括，不是某一条具体规律。"},{"id":"MARX-SELECTED-Q53-0470","fileId":"MARX-SELECTED","source":"精选练习题 第35题（Q53-0470）","paper":"精选练习题","num":35,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"“社会生活本质上是实践”的观点属于","options":[{"letter":"A","text":"神学历史观"},{"letter":"B","text":"唯心主义历史观"},{"letter":"C","text":"自然主义历史观"},{"letter":"D","text":"唯物史观"}],"images":[],"answer":"D","analysis":"课本第二章讲科学实践观的创立时指出，马克思在《关于费尔巴哈的提纲》中强调全部社会生活在本质上是实践的。把实践看作社会生活的本质，就是从人的物质活动而不是从观念、神意或人的自然本性出发解释历史，这正是唯物史观与唯心史观的分界，故D对。A、B、C都改用神、观念或直观的自然来说明社会，与这一命题相反。"},{"id":"MARX-SELECTED-Q53-0501","fileId":"MARX-SELECTED","source":"精选练习题 第36题（Q53-0501）","paper":"精选练习题","num":36,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"哲学的基本问题是","options":[{"letter":"A","text":"物质和运动的关系问题"},{"letter":"B","text":"可知论和不可知论的关系问题"},{"letter":"C","text":"理论和实践的关系问题"},{"letter":"D","text":"思维和存在的关系问题"}],"images":[],"answer":"D","analysis":"课本第一章引恩格斯的论断：全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题。世界万事归结为物质与精神两类现象，人的活动归结为认识与改造世界两类，都绕不开它。A物质与运动讲的是世界的存在方式；B可知与不可知的分野只是这一问题的第二方面内容；C理论与实践的关系属于认识论。"},{"id":"MARX-SELECTED-QYK-0028","fileId":"MARX-SELECTED","source":"精选练习题 第37题（QYK-0028）","paper":"精选练习题","num":37,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"唯物辩证法的实质和核心是","options":[{"letter":"A","text":"联系和发展的观点"},{"letter":"B","text":"对立统一规律"},{"letter":"C","text":"量变质变规律"},{"letter":"D","text":"否定之否定规律"}],"images":[],"answer":"B","analysis":"课本第一章第二节明确指出，对立统一规律是唯物辩证法的实质和核心：它揭示了事物普遍联系的根本内容和变化发展的内在动力，是贯穿量变质变规律、否定之否定规律以及各对基本范畴的中心线索，也提供了矛盾分析方法这一根本方法。A 联系和发展是唯物辩证法的总特征，C、D 是辩证法的具体规律，都要靠矛盾来说通。"},{"id":"MARX-SELECTED-Q53-0578","fileId":"MARX-SELECTED","source":"精选练习题 第38题（Q53-0578）","paper":"精选练习题","num":38,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"事物矛盾的精髓是","options":[{"letter":"A","text":"矛盾同一性和斗争性关系"},{"letter":"B","text":"矛盾的共性和个性、绝对和相对关系"},{"letter":"C","text":"主要矛盾和次要矛盾关系"},{"letter":"D","text":"内因和外因关系"}],"images":[],"answer":"B","analysis":"课本第一章讲矛盾的普遍性和特殊性时说，共性即普遍性，是无条件的绝对的，个性即特殊性，是有条件的相对的，任何现实事物的矛盾都是二者统一，共性寓于个性之中。这共性与个性、绝对与相对的道理，就是关于事物矛盾问题的精髓，不懂它就不能真正掌握唯物辩证法。A是矛盾的两种基本属性，C讲矛盾发展的不平衡性，D讲事物变化的条件和动因。"},{"id":"MARX-SELECTED-Q53-0589","fileId":"MARX-SELECTED","source":"精选练习题 第39题（Q53-0589）","paper":"精选练习题","num":39,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"choice","subtype":"single","desc":"马克思主义活的灵魂是","options":[{"letter":"A","text":"一分为二"},{"letter":"B","text":"重点论"},{"letter":"C","text":"具体问题具体分析"},{"letter":"D","text":"矛盾的斗争性"}],"images":[],"answer":"C","analysis":"课本第一章在讲矛盾分析方法时引列宁的话：马克思主义的活的灵魂，就是对具体情况作具体分析；毛泽东在《矛盾论》中作了同样的表述。这是因为矛盾分析方法的核心要求正是善于分析矛盾的特殊性。A“一分为二”只是两点论、全面地看矛盾；B重点论讲的是抓主要矛盾和矛盾的主要方面；D斗争性只是矛盾的一种基本属性，都不是“活的灵魂”的所指。"},{"id":"MARX-SELECTED-Q53-0625","fileId":"MARX-SELECTED","source":"精选练习题 第40题（Q53-0625）","paper":"精选练习题","num":40,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"物质的唯一特性是","options":[{"letter":"A","text":"运动的绝对性"},{"letter":"B","text":"客观实在性"},{"letter":"C","text":"可知性"},{"letter":"D","text":"矛盾性"}],"images":[],"answer":"B","analysis":"课本第一章指出，客观实在性是物质的唯一特性，这是物质区别于意识的最本质规定。A是易混项，运动是物质的根本属性和存在方式，不是“唯一特性”；C可知性回答的是思维能否反映存在，属于哲学基本问题的第二方面；D矛盾性是一切事物的普遍属性，不足以单独规定物质。"},{"id":"MARX-SELECTED-Q53-0638","fileId":"MARX-SELECTED","source":"精选练习题 第41题（Q53-0638）","paper":"精选练习题","num":41,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"时间和空间是运动着的物质的","options":[{"letter":"A","text":"唯一属性"},{"letter":"B","text":"整理认识材料的主观工具"},{"letter":"C","text":"存在形式"},{"letter":"D","text":"感觉系列调整了的体系"}],"images":[],"answer":"C","analysis":"课本第一章指出，时间和空间是运动着物质的基本存在形式：时间讲持续性与一维性，空间讲广延性与三维性，物质运动与时空不可分割，这正证明时空是客观的。A错在“唯一”，运动才是物质的根本属性；B把时空当成人心中整理材料的主观框架，D把它说成感觉系列的安排，两者都否认了时空的客观性。"},{"id":"MARX-SELECTED-Q53-0640","fileId":"MARX-SELECTED","source":"精选练习题 第42题（Q53-0640）","paper":"精选练习题","num":42,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"世界的统一性在于","options":[{"letter":"A","text":"它的存在性"},{"letter":"B","text":"它的物质性"},{"letter":"C","text":"它的可知性"},{"letter":"D","text":"它的矛盾性"}],"images":[],"answer":"B","analysis":"世界的统一性问题问的是万事万物有没有共同的本质，课本的回答是它统一于物质，即统一性在于物质性：自然界、人类社会和人的意识都统一于物质，这是多样性的统一。A的存在性回避了本质，恩格斯批评的\"世界统一于存在\"正是把精神也塞进存在；C的可知性说的是认识能力，D的矛盾性是发展的动力，都不是本原。"},{"id":"MARX-SELECTED-Q53-0655","fileId":"MARX-SELECTED","source":"精选练习题 第43题（Q53-0655）","paper":"精选练习题","num":43,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"人的任何意识，都是对客观世界的","options":[{"letter":"A","text":"正确反映"},{"letter":"B","text":"歪曲反映"},{"letter":"C","text":"虚幻反映"},{"letter":"D","text":"反映"}],"images":[],"answer":"D","analysis":"课本第一章讲物质与意识的辩证关系时指出，意识是人脑的机能和属性，是客观世界的主观映象，内容上是客观的、形式上是主观的。因而任何意识，不论正确还是错误，都是对客观世界的反映，只是反映的性质和程度不同，D的表述才完整。A把反映等同于正确的反映，B、C只说中了错误或歪曲的那一类反映，都以偏概全。"},{"id":"MARX-SELECTED-QJJ-0029","fileId":"MARX-SELECTED","source":"精选练习题 第44题（QJJ-0029）","paper":"精选练习题","num":44,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"一定的社会形态是","options":[{"letter":"A","text":"生产力和生产关系的统一"},{"letter":"B","text":"经济基础和上层建筑的统一"},{"letter":"C","text":"社会存在和社会意识的统一"},{"letter":"D","text":"自然界和人类社会的统一"}],"images":[],"answer":"B","analysis":"课本第三章“社会形态的内涵”一节讲得很明确：社会形态是同生产力发展一定阶段相适应的经济基础与上层建筑的统一体，包括经济形态、政治形态和意识形态三者的历史的、具体的统一，故选B。A生产力和生产关系的统一构成的是生产方式；C社会存在与社会意识的统一是社会历史观的基本问题；D说的是自然与社会的分野，都不是社会形态的规定。"},{"id":"MARX-SELECTED-QYK-0001","fileId":"MARX-SELECTED","source":"精选练习题 第45题（QYK-0001）","paper":"精选练习题","num":45,"chapter":{"label":"导论","section":"一、什么是马克思主义","raw":"导论 · 一、什么是马克思主义"},"type":"multi","subtype":"","desc":"马克思主义的三个基本组成部分是","options":[{"letter":"A","text":"历史唯物主义"},{"letter":"B","text":"马克思主义哲学"},{"letter":"C","text":"马克思主义政治经济学"},{"letter":"D","text":"科学社会主义"}],"images":[],"answer":"BCD","analysis":"课本导论指出，马克思主义哲学、马克思主义政治经济学和科学社会主义是马克思主义的三个基本组成部分，它们有机统一，共同构成马克思主义理论体系的主体内容，故选BCD。A历史唯物主义同辩证唯物主义一起构成马克思主义哲学，是马克思主义哲学内部的内容，不能与三个基本组成部分并列。"},{"id":"MARX-SELECTED-QYK-0002","fileId":"MARX-SELECTED","source":"精选练习题 第46题（QYK-0002）","paper":"精选练习题","num":46,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"1848年2月发表，标志着马克思主义的公开问世的是","options":[{"letter":"A","text":"《资本论》"},{"letter":"B","text":"《共产党宣言》"},{"letter":"C","text":"《德意志意识形态》"},{"letter":"D","text":"《德法年鉴》"}],"images":[],"answer":"B","analysis":"课本导论写明，1848年2月《共产党宣言》发表，标志着马克思主义的公开问世，它是马克思、恩格斯为共产主义者同盟起草的世界第一个无产阶级政党的党纲。A《资本论》是马克思后来在伦敦的政治经济学研究，系统阐述剩余价值学说；C《德意志意识形态》首次系统阐述历史唯物主义；D《德法年鉴》是更早的刊物，与题意无关。"},{"id":"MARX-SELECTED-QYK-0003","fileId":"MARX-SELECTED","source":"精选练习题 第47题（QYK-0003）","paper":"精选练习题","num":47,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"multi","subtype":"","desc":"（ ）和（ ）是马克思一生的两个伟大发现。","options":[{"letter":"A","text":"辩证法"},{"letter":"B","text":"劳动价值论"},{"letter":"C","text":"唯物史观"},{"letter":"D","text":"剩余价值学说"}],"images":[],"answer":"CD","analysis":"课本导论明确说，唯物史观和剩余价值学说是马克思一生的两个伟大发现：前者把唯物主义贯彻到社会历史领域，揭示人类社会发展的一般规律；后者经《资本论》系统阐发，揭开资本主义生产关系的秘密，二者使社会主义由空想变成科学。A辩证法是贯穿理论的方法而非发现；B劳动价值论是剩余价值学说的理论前提，不与这两个发现并列。"},{"id":"MARX-SELECTED-QYK-0004","fileId":"MARX-SELECTED","source":"精选练习题 第48题（QYK-0004）","paper":"精选练习题","num":48,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"是当代中国马克思主义、21世纪马克思主义，为马克思主义的发展作出了时代性、原创性贡献。","options":[{"letter":"A","text":"邓小平理论"},{"letter":"B","text":"习近平新时代中国特色社会主义思想"},{"letter":"C","text":"“三个代表”重要思想"},{"letter":"D","text":"科学发展观"}],"images":[],"answer":"B","analysis":"课本导论指出，习近平新时代中国特色社会主义思想是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是当代中国马克思主义、21世纪马克思主义。A、C、D 都形成于改革开放和社会主义现代化建设新时期，只有中国特色社会主义进入新时代创立的这一思想才承担这一专门定位。"},{"id":"MARX-SELECTED-QYK-0005","fileId":"MARX-SELECTED","source":"精选练习题 第49题（QYK-0005）","paper":"精选练习题","num":49,"chapter":{"label":"导论","section":"三、马克思主义的基本特征","raw":"导论 · 三、马克思主义的基本特征"},"type":"multi","subtype":"","desc":"马克思主义的鲜明特征是","options":[{"letter":"A","text":"科学性"},{"letter":"B","text":"人民性"},{"letter":"C","text":"实践性"},{"letter":"D","text":"发展性"}],"images":[],"answer":"ABCD","analysis":"课本导论讲马克思主义的基本特征，列出四个鲜明特征：它是科学的理论，创造性揭示了人类社会发展规律；是人民的理论，第一次创立了人民实现自身解放的思想体系；是实践的理论，指引着人民改造世界的行动；是不断发展的开放的理论，始终站在时代前沿。这四项共同体现了马克思主义的本质和使命，也展现出它的理论形象，缺一不可，故全选。"},{"id":"MARX-SELECTED-QYK-0008","fileId":"MARX-SELECTED","source":"精选练习题 第50题（QYK-0008）","paper":"精选练习题","num":50,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"对（ ）的不同回答，产生了可知论和不可知论的理论分野。","options":[{"letter":"A","text":"世界是怎样存在的问题"},{"letter":"B","text":"物质和意识是否具有同一性的问题"},{"letter":"C","text":"思维和存在的关系问题"},{"letter":"D","text":"物质和意识何者为第一性的问题"}],"images":[],"answer":"B","analysis":"课本第一章第一节讲，哲学基本问题有两方面内容：一是何者为第一性的问题，对它的不同回答划分出唯物主义和唯心主义；二是物质和意识有无同一性的问题，即思维能否正确反映存在，对它的不同回答才产生可知论与不可知论的分野。故应选B，“世界是怎样存在的”是辩证法与形而上学的分歧所在。"},{"id":"MARX-SELECTED-QYK-0009","fileId":"MARX-SELECTED","source":"精选练习题 第51题（QYK-0009）","paper":"精选练习题","num":51,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"物质的共同特性是","options":[{"letter":"A","text":"客观实在性"},{"letter":"B","text":"发展性"},{"letter":"C","text":"实践性"},{"letter":"D","text":"第一性"}],"images":[],"answer":"A","analysis":"课本第一章讲，列宁的物质定义表明，客观实在性撇开了各种具体形态的差别，为自然存在和社会存在所共有，这正是物质的共同特性，故选A。D第一性说的是物质与意识何者为本原，属哲学基本问题的内容；B发展性、C实践性都只涉及物质世界的部分方面，实践更是人的存在方式，谈不上是一切物的共同特性。"},{"id":"MARX-SELECTED-QYK-0011","fileId":"MARX-SELECTED","source":"精选练习题 第52题（QYK-0011）","paper":"精选练习题","num":52,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"物质的根本属性是","options":[{"letter":"A","text":"可知性"},{"letter":"B","text":"第一性"},{"letter":"C","text":"绝对性"},{"letter":"D","text":"运动"}],"images":[],"answer":"D","analysis":"课本第一章讲，物质的根本属性是运动，恩格斯把运动理解为物质的存在方式和固有属性，宇宙中的一切变化和过程都是运动。A可知性回答的是世界能不能被认识，B第一性说的是物质与意识何者为本原，C绝对性本是指运动的性质；至于客观实在性，那是物质的唯一特性，不要同根本属性混用。"},{"id":"MARX-SELECTED-QYK-0016","fileId":"MARX-SELECTED","source":"精选练习题 第53题（QYK-0016）","paper":"精选练习题","num":53,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"意识的能动作用主要表现在","options":[{"letter":"A","text":"意识具有目的性和计划性"},{"letter":"B","text":"意识具有创造性"},{"letter":"C","text":"意识具有指导实践改造客观世界的作用"},{"letter":"D","text":"意识具有调控人的行为和生理活动的作用"}],"images":[],"answer":"ABCD","analysis":"课本第一章把意识对物质的反作用称作能动作用，列出四条表现：活动有目的性和计划性，能在观念中构造出现实中还没有的世界即创造性，能指导实践改造客观世界，还能调控人的行为和生理活动，A、B、C、D正好一一对应，全选。但这一切都以物质决定意识为前提，能动性只有借助实践和一定物质条件才能兑现。"},{"id":"MARX-SELECTED-QYK-0017","fileId":"MARX-SELECTED","source":"精选练习题 第54题（QYK-0017）","paper":"精选练习题","num":54,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"空间是指物质运动的","options":[{"letter":"A","text":"广延性"},{"letter":"B","text":"伸张性"},{"letter":"C","text":"持续性"},{"letter":"D","text":"顺序性"}],"images":[],"answer":"AB","analysis":"课本第一章指出，时间和空间是运动着的物质的基本存在形式，空间说的是物质运动的广延性、伸张性，其特点是三维性，即有长、宽、高三方面的规定性，A、B当选。C持续性、D顺序性讲的是时间，其特点是一维性，流逝一去不复返，这是本题最容易混淆的一处。"},{"id":"MARX-SELECTED-QYK-0019","fileId":"MARX-SELECTED","source":"精选练习题 第55题（QYK-0019）","paper":"精选练习题","num":55,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"（ ）是客观规律性与主观能动性统一的基础。","options":[{"letter":"A","text":"实践"},{"letter":"B","text":"物质"},{"letter":"C","text":"意识"},{"letter":"D","text":"意识的能动作用"}],"images":[],"answer":"A","analysis":"课本第一章指出，规律是客观的，人不能随意创造或消灭规律；但只有充分发挥主观能动性，才能正确认识并利用规律，而把尊重规律与能动创造贯通起来的环节是实践，因此实践才是二者统一的基础，选A。B物质只是标志客观实在的哲学范畴，C意识和D意识的能动作用都只讲到了能动的一面，都没有说明统一在何处实现。"},{"id":"MARX-SELECTED-QYK-0020","fileId":"MARX-SELECTED","source":"精选练习题 第56题（QYK-0020）","paper":"精选练习题","num":56,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"人工智能不能真正具有人类意识，不能取代或超越人类智能，因为","options":[{"letter":"A","text":"人工智能只是对人类的理性智能的模拟和扩展"},{"letter":"B","text":"人工智能不可能真正具备人类的社会属性"},{"letter":"C","text":"人工智能难以完全具备理解自然语言真实意义的能力"},{"letter":"D","text":"人工智能在计算速度和精确度的表现超出人类所能"}],"images":[],"answer":"ABC","analysis":"课本在讲意识与人工智能时指出：人工智能只是对人类理性智能的模拟和扩展，不具备情感、信念和意志；社会性是人类意识固有的本质属性，机器不可能真正具备；自然语言总与具体情境相连、难以彻底形式化，机器难以完全理解其真实意义，这三条正是A、B、C。D虽是事实，但课本把它作为让步，计算再快也达不到人类智能的层级，因而构不成原因。"},{"id":"MARX-SELECTED-QYK-0021","fileId":"MARX-SELECTED","source":"精选练习题 第57题（QYK-0021）","paper":"精选练习题","num":57,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"世界的统一性在于它的","options":[{"letter":"A","text":"实践"},{"letter":"B","text":"物质性"},{"letter":"C","text":"社会存在"},{"letter":"D","text":"意识"}],"images":[],"answer":"B","analysis":"课本第一章讲世界的物质统一性时指出，世界的统一性问题就是万事万物有没有共同的本质或本原，马克思主义的回答是世界的统一性在于它的物质性，世界统一于物质。A实践是人的感性活动，是理解社会生活的钥匙，却不是世界的本原；C社会存在只涉及社会领域的物质方面；D意识是物质世界长期发展的产物，居于第二性。"},{"id":"MARX-SELECTED-QYK-0022","fileId":"MARX-SELECTED","source":"精选练习题 第58题（QYK-0022）","paper":"精选练习题","num":58,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"（ ）的观点是唯物辩证法的总观点，集中体现了唯物辩证法的总特征。","options":[{"letter":"A","text":"实践"},{"letter":"B","text":"对立统一"},{"letter":"C","text":"联系和发展"},{"letter":"D","text":"运动和静止"}],"images":[],"answer":"C","analysis":"课本第一章指出，万事万物都处于普遍联系之中，普遍联系引起事物的变化发展，因而联系和发展的观点是唯物辩证法的总观点，集中体现了它的总特征。A实践是马克思主义认识论首要的和基本的观点；B对立统一规律是辩证法的实质和核心、事物发展的根本规律，却不叫总观点；D运动和静止说的是物质的存在方式，层次不同。"},{"id":"MARX-SELECTED-QYK-0023","fileId":"MARX-SELECTED","source":"精选练习题 第59题（QYK-0023）","paper":"精选练习题","num":59,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"联系的普遍性有三层含义：","options":[{"letter":"A","text":"任何事物内部的不同部分和要素之间都是相互联系的"},{"letter":"B","text":"任何事物都不能孤立存在"},{"letter":"C","text":"事物之间的联系是多样的"},{"letter":"D","text":"整个世界是相互联系的统一整体"}],"images":[],"answer":"ABD","analysis":"课本第一章讲联系的特点时，把普遍性概括为三层含义：任何事物内部的不同部分和要素相互联系，事物因而具有内在结构性；任何事物都不能孤立存在，都同其他事物处于一定的联系之中；整个世界是相互联系的统一整体。A、B、D 正对应这三层。C 讲的是联系的多样性，即联系形式的多种多样，它与普遍性并列，不是普遍性的含义。"},{"id":"MARX-SELECTED-QYK-0025","fileId":"MARX-SELECTED","source":"精选练习题 第60题（QYK-0025）","paper":"精选练习题","num":60,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"物质世界的发展，特别是人类社会的发展，其实质是","options":[{"letter":"A","text":"事物发展的渐进性"},{"letter":"B","text":"事物发展的曲折性"},{"letter":"C","text":"事物发展的连续性"},{"letter":"D","text":"新事物的产生和旧事物的灭亡"}],"images":[],"answer":"D","analysis":"课本第一章讲事物的变化发展时指出，发展的实质是新事物的产生和旧事物的灭亡，正是这种新陈代谢使世界蓬勃发展。新事物合乎历史前进方向、有远大前途，旧事物丧失历史必然性；判断新旧不看形式是否新奇、出现是否在后。A渐进性和C连续性说的是发展的状态与过程，B曲折性说的是发展的道路和趋势，都不是实质。"},{"id":"MARX-SELECTED-QYK-0029","fileId":"MARX-SELECTED","source":"精选练习题 第61题（QYK-0029）","paper":"精选练习题","num":61,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"矛盾的同一性在事物发展中的作用表现在","options":[{"letter":"A","text":"同一性造成矛盾双方力量发展的不平衡"},{"letter":"B","text":"同一性是事物存在和发展的前提"},{"letter":"C","text":"同一性使矛盾双方相互吸取有利于自身的因素"},{"letter":"D","text":"同一性规定着事物转化的可能和发展的趋势"}],"images":[],"answer":"BCD","analysis":"课本第一章把同一性的作用归为三条：它是事物存在和发展的前提，一方的发展以另一方为条件；它使矛盾双方相互吸取有利于自身的因素而各自得到发展；它规定着事物转化的可能和发展的趋势。A说造成双方力量发展的不平衡，那是斗争性的作用——相互排斥才推动力量对比变化、为质变创造条件，最易与同一性混淆，故不选。"},{"id":"MARX-SELECTED-QYK-0030","fileId":"MARX-SELECTED","source":"精选练习题 第62题（QYK-0030）","paper":"精选练习题","num":62,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"是一种矛盾统一体向另一种统一体过渡的决定性力量。","options":[{"letter":"A","text":"矛盾的同一性"},{"letter":"B","text":"矛盾的斗争性"},{"letter":"C","text":"矛盾的普遍性"},{"letter":"D","text":"矛盾的特殊性"}],"images":[],"answer":"B","analysis":"课本第一章指出，矛盾双方的相互排斥和否定促使旧统一体破裂、新统一体产生，因此斗争性是一种矛盾统一体向另一种矛盾统一体过渡的决定性力量，B正确。A同一性只是事物存在和发展的前提，它规定着转化的可能和趋势，本身不提供打破旧统一体的力量；C普遍性与D特殊性说明的是矛盾的存在状况，不是过渡的动力。"},{"id":"MARX-SELECTED-QYK-0034","fileId":"MARX-SELECTED","source":"精选练习题 第63题（QYK-0034）","paper":"精选练习题","num":63,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"量变和质变的辩证关系是","options":[{"letter":"A","text":"量变是质变的必要准备"},{"letter":"B","text":"质变是量变的必然结果"},{"letter":"C","text":"在总的量变过程中有阶段性和局部性的部分质变"},{"letter":"D","text":"在质变过程中也有旧质在量上的收缩和新质在量上的扩张"}],"images":[],"answer":"ABCD","analysis":"课本第一章把量变与质变的关系讲成三层：量变是质变的必要准备，质变是量变的必然结果并为新的量变开辟道路，二者又相互渗透。A、B对应前两层；C、D正是相互渗透的两种情形，即总的量变过程中有阶段性和局部性的部分质变，质变过程中又有旧质在量上收缩、新质在量上扩张。四项都入选。"},{"id":"MARX-SELECTED-QYK-0035","fileId":"MARX-SELECTED","source":"精选练习题 第64题（QYK-0035）","paper":"精选练习题","num":64,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"辩证否定的实质是","options":[{"letter":"A","text":"彻底否定"},{"letter":"B","text":"既批判又克服"},{"letter":"C","text":"扬弃"},{"letter":"D","text":"既继承又保留"}],"images":[],"answer":"C","analysis":"按课本，辩证的否定是事物的自我否定，既是发展的环节又是联系的环节，其实质是\"扬弃\"：新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素，故C对。A的彻底否定属于形而上学否定观，割断了新旧事物的联系；B只有批判和克服、D只有继承和保留，各说出\"扬弃\"的一个侧面，失之片面。"},{"id":"MARX-SELECTED-QYK-0037","fileId":"MARX-SELECTED","source":"精选练习题 第65题（QYK-0037）","paper":"精选练习题","num":65,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"否定之否定规律揭示了","options":[{"letter":"A","text":"事物普遍联系的根本内容和变化发展的内在动力"},{"letter":"B","text":"事物矛盾问题的精髓"},{"letter":"C","text":"事物发展的渐进性和飞跃性的统一"},{"letter":"D","text":"事物发展的前进性和曲折性的统一"}],"images":[],"answer":"D","analysis":"课本第一章指出，三大规律各有侧重：对立统一规律揭示事物普遍联系的根本内容和变化发展的内在动力，量变质变规律和否定之否定规律揭示发展的状态、过程和趋势，其中否定之否定规律揭示的是事物发展的前进性与曲折性的统一，道路是曲折的，方向是前进的。A是对立统一规律的作用，B讲的是矛盾问题的精髓，C属于量变质变规律。"},{"id":"MARX-SELECTED-QYK-0043","fileId":"MARX-SELECTED","source":"精选练习题 第66题（QYK-0043）","paper":"精选练习题","num":66,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"choice","subtype":"single","desc":"“要胸怀两个大局，一个是中华民族伟大复兴的战略全局，一个是世界百年未有之大变局”，讲的是（ ）","options":[{"letter":"A","text":"增强辩证思维能力"},{"letter":"B","text":"增强历史思维能力"},{"letter":"C","text":"增强系统思维能力"},{"letter":"D","text":"增强底线思维能力"}],"images":[],"answer":"C","analysis":"课本第一章讲增强多种思维能力，系统思维能力就是从联系的结构与功能上全面分析和处理问题的能力。“胸怀两个大局”要求把全局与局部、当前与长远、国内与国际统筹起来谋划，正是坚持系统观念、运用系统思维的典型，故选C。A辩证思维侧重矛盾分析与联系发展的眼光，B历史思维侧重鉴往知来，D底线思维侧重防患于未然，都不如C切题。"},{"id":"MARX-SELECTED-QYK-0044","fileId":"MARX-SELECTED","source":"精选练习题 第67题（QYK-0044）","paper":"精选练习题","num":67,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第三节 唯物辩证法是认识世界和改造世界的根本方法","raw":"第一章 世界的物质性及发展规律 · 第三节 唯物辩证法是认识世界和改造世界的根本方法"},"type":"choice","subtype":"single","desc":"把握底线思维，就要","options":[{"letter":"A","text":"凡事从坏处准备,努力争取最好的结果"},{"letter":"B","text":"打破迷信经验、迷信本本、迷信权威的惯性思维"},{"letter":"C","text":"善于观大势、谋大事"},{"letter":"D","text":"以史为鉴、知古鉴今"}],"images":[],"answer":"A","analysis":"课本第一章讲思维能力时指出，底线是事物发生质变的临界点，把握底线思维，就要凡事从坏处准备，努力争取最好的结果，做到有备无患、牢牢把握主动权，故选A。B打破迷信经验、迷信本本、迷信权威是创新思维的要求；C观大势、谋大事属于战略思维的全局眼光；D以史为鉴、知古鉴今是历史思维。几种思维能力各有标志性表述，须按定义对号入座。"},{"id":"MARX-SELECTED-QYK-0048","fileId":"MARX-SELECTED","source":"精选练习题 第68题（QYK-0048）","paper":"精选练习题","num":68,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"实践的主体和客体之间最根本的关系是","options":[{"letter":"A","text":"实践关系"},{"letter":"B","text":"认识关系"},{"letter":"C","text":"价值关系"},{"letter":"D","text":"反映与被反映的关系"}],"images":[],"answer":"A","analysis":"课本第二章讲实践的基本结构时指出，主体与客体相互作用的关系包括实践关系、认识关系和价值关系，其中实践关系即改造与被改造的关系是最根本的。主体首先要变革客体才能认识客体，认识关系是在改造过程中发生的；价值关系是认识与改造归结到主体需要上的关系。D反映与被反映说的只是认识关系，B、C都不是首要的一环。"},{"id":"MARX-SELECTED-QYK-0049","fileId":"MARX-SELECTED","source":"精选练习题 第69题（QYK-0049）","paper":"精选练习题","num":69,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"实践的三种基本类型中，（ ）是最基本的实践活动，构成全部社会生活的基础。","options":[{"letter":"A","text":"虚拟实践"},{"letter":"B","text":"科学文化实践"},{"letter":"C","text":"社会政治实践"},{"letter":"D","text":"物质生产实践"}],"images":[],"answer":"D","analysis":"课本第二章把实践分为物质生产实践、社会政治实践和科学文化实践三种基本类型。物质生产实践解决人与自然的矛盾，提供衣食住行所需的资料和工具，同时生产和再生产社会的基本经济关系，所以它是最基本的实践活动，构成全部社会生活的基础。B、C都在物质生产的基础上产生并受其制约；A虚拟实践不在三种基本类型之内。"},{"id":"MARX-SELECTED-QYK-0050","fileId":"MARX-SELECTED","source":"精选练习题 第70题（QYK-0050）","paper":"精选练习题","num":70,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"实践对认识的决定作用表现在","options":[{"letter":"A","text":"实践是认识的来源"},{"letter":"B","text":"实践是认识发展的动力"},{"letter":"C","text":"实践是认识的目的"},{"letter":"D","text":"实践是检验认识真理性的唯一标准"}],"images":[],"answer":"ABCD","analysis":"课本第二章第一节指出，实践是认识的基础，在认识活动中起决定作用，具体表现为四个方面：实践是认识的来源，认识的内容在实践基础上产生；实践是认识发展的动力，实践的需要推动认识并为其提供手段；实践是认识的目的，认识最终要回到实践中去指导改造世界；实践是检验认识真理性的唯一标准。四个选项正好一一对应，缺一不可，都要选。"},{"id":"MARX-SELECTED-QYK-0052","fileId":"MARX-SELECTED","source":"精选练习题 第71题（QYK-0052）","paper":"精选练习题","num":71,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"辩证唯物论的
