物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"物质的根本属性是","options":[{"letter":"A","text":"时间"},{"letter":"B","text":"空间"},{"letter":"C","text":"静止"},{"letter":"D","text":"运动"}],"images":[],"answer":"D","analysis":"课本：物质的根本属性是运动。恩格斯说：“运动，就它被理解为物质的存在方式、物质的固有属性这一最一般的意义来说，涵盖宇宙中发生的一切变化和过程。”时间和空间是运动着的物质的基本存在形式。"},{"id":"15161-T4","fileId":"15161","source":"2015-2016学年第1学期 A卷 第4题","paper":"2015-2016学年第1学期 A卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"马克思主义认为，包括自然界、人类社会和意识在内的整个世界都统一于","options":[{"letter":"A","text":"实践"},{"letter":"B","text":"物质"},{"letter":"C","text":"精神"},{"letter":"D","text":"社会存在"}],"images":[],"answer":"B","analysis":"课本：世界的统一性在于它的物质性，世界统一于物质。自然界是物质的，人类社会本质上是物质体系，意识是物质世界长期发展的产物。"},{"id":"15161-T5","fileId":"15161","source":"2015-2016学年第1学期 A卷 第5题","paper":"2015-2016学年第1学期 A卷","num":5,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"“观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已。”这表明","options":[{"letter":"A","text":"意识决定物质"},{"letter":"B","text":"意识在内容上是主观的，在形式上是客观的"},{"letter":"C","text":"物质决定意识"},{"letter":"D","text":"意识能够创造物质"}],"images":[],"answer":"C","analysis":"课本：马克思这句话说明意识是客观世界的主观映象，观念的内容来源于客观物质世界，即物质决定意识。正确表述应为“内容客观、形式主观”，B说反了。"},{"id":"15161-T6","fileId":"15161","source":"2015-2016学年第1学期 A卷 第6题","paper":"2015-2016学年第1学期 A卷","num":6,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"在客观规律面前，人的主观能动性表现为","options":[{"letter":"A","text":"人可以创造规律"},{"letter":"B","text":"人可以消灭规律"},{"letter":"C","text":"人可以改变规律"},{"letter":"D","text":"人可以认识和利用规律"}],"images":[],"answer":"D","analysis":"课本：规律是客观的，人不能创造、消灭或改变规律；但人在规律面前不是无能为力的，可以认识和利用规律，按照客观规律改造世界。尊重客观规律是正确发挥主观能动性的前提。"},{"id":"15161-T7","fileId":"15161","source":"2015-2016学年第1学期 A卷 第7题","paper":"2015-2016学年第1学期 A卷","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"唯物辩证法体系的实质和核心是","options":[{"letter":"A","text":"联系和发展的观点"},{"letter":"B","text":"对立统一规律"},{"letter":"C","text":"质量互变规律"},{"letter":"D","text":"否定之否定规律"}],"images":[],"answer":"B","analysis":"课本：对立统一规律是唯物辩证法的实质和核心。它揭示了事物普遍联系的根本内容和变化发展的内在动力，是贯穿其他规律和范畴的中心线索，也是认识世界和改造世界的根本方法。"},{"id":"15161-T8","fileId":"15161","source":"2015-2016学年第1学期 A卷 第8题","paper":"2015-2016学年第1学期 A卷","num":8,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"辩证否定的实质是","options":[{"letter":"A","text":"事物的自我否定"},{"letter":"B","text":"事物发展的环节"},{"letter":"C","text":"新旧事物联系的环节"},{"letter":"D","text":"“扬弃”"}],"images":[],"answer":"D","analysis":"课本：辩证否定的实质是“扬弃”，即新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素。A、B、C分别是辩证否定的特点、作用，不是“实质”的表述。"},{"id":"15161-T9","fileId":"15161","source":"2015-2016学年第1学期 A卷 第9题","paper":"2015-2016学年第1学期 A卷","num":9,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"人类最基本的实践活动是","options":[{"letter":"A","text":"科学文化实践"},{"letter":"B","text":"物质生产实践"},{"letter":"C","text":"社会政治实践"},{"letter":"D","text":"阶级斗争"}],"images":[],"answer":"B","analysis":"课本：实践的基本形式包括物质生产实践、社会政治实践和科学文化实践。其中物质生产实践是最基本的实践活动，构成全部社会生活的基础，其他实践形式在它基础上产生和发展。"},{"id":"15161-T10","fileId":"15161","source":"2015-2016学年第1学期 A卷 第10题","paper":"2015-2016学年第1学期 A卷","num":10,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"认识是主体在实践基础上对客体的能动反映。这是","options":[{"letter":"A","text":"唯心主义的观点"},{"letter":"B","text":"旧唯物主义的观点"},{"letter":"C","text":"辩证唯物主义的观点"},{"letter":"D","text":"不可知论者的观点"}],"images":[],"answer":"C","analysis":"课本：辩证唯物主义认识论把实践引入认识论、把辩证法应用于反映论，认为认识是主体在实践基础上对客体的能动反映，是反映性与创造性的统一。旧唯物主义是直观、被动的反映论。"},{"id":"15161-T11","fileId":"15161","source":"2015-2016学年第1学期 A卷 第11题","paper":"2015-2016学年第1学期 A卷","num":11,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"真理的本质属性是","options":[{"letter":"A","text":"绝对性"},{"letter":"B","text":"相对性"},{"letter":"C","text":"客观性"},{"letter":"D","text":"一元性"}],"images":[],"answer":"C","analysis":"课本：真理是标志主观与客观相符合的哲学范畴，是对客观事物及其规律的正确反映。真理的本质属性是客观性——真理的内容是对客观事物及其规律的正确反映，不以人的主观意志为转移。"},{"id":"15161-T12","fileId":"15161","source":"2015-2016学年第1学期 A卷 第12题","paper":"2015-2016学年第1学期 A卷","num":12,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"16世纪末，伽利略通过在比萨斜塔所做的自由落体实验，推翻了亚里士多德关于物体的降落速度与物体的重量成正比的说法。这件事说明","options":[{"letter":"A","text":"真理是对客观事物及其规律的正确反映"},{"letter":"B","text":"真理永远处在由相对向绝对的转化和发展中"},{"letter":"C","text":"实践是认识发展的动力"},{"letter":"D","text":"实践是检验认识真理性的唯一标准"}],"images":[],"answer":"D","analysis":"课本：实践是检验真理的唯一标准。伽利略用实验（实践）检验并推翻了亚里士多德的论断，正说明认识的真理性只能由实践来检验。"},{"id":"15161-T13","fileId":"15161","source":"2015-2016学年第1学期 A卷 第13题","paper":"2015-2016学年第1学期 A卷","num":13,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会意识相对独立性的突出表现是","options":[{"letter":"A","text":"社会意识与社会存在发展的不完全同步性和不平衡性"},{"letter":"B","text":"社会意识内部各种形式之间的相互影响及各自具有的历史继承性"},{"letter":"C","text":"社会意识对社会存在的能动的反作用"},{"letter":"D","text":"社会意识决定并支配着社会存在"}],"images":[],"answer":"C","analysis":"课本：社会意识相对独立性有三方面表现，其中社会意识对社会存在能动的反作用是相对独立性的突出表现。先进的社会意识促进社会发展，落后的社会意识阻碍社会发展。D夸大了社会意识的作用，是唯心史观。"},{"id":"15161-T14","fileId":"15161","source":"2015-2016学年第1学期 A卷 第14题","paper":"2015-2016学年第1学期 A卷","num":14,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"马克思认为，人类社会生活和全部历史的基础是","options":[{"letter":"A","text":"生产力"},{"letter":"B","text":"生产关系"},{"letter":"C","text":"生产工具"},{"letter":"D","text":"劳动对象"}],"images":[],"answer":"A","analysis":"课本：生产力是人类社会生活和全部历史的基础，是人类社会发展的最终决定力量。人们所达到的生产力的总和决定着社会状况。"},{"id":"15161-T15","fileId":"15161","source":"2015-2016学年第1学期 A卷 第15题","paper":"2015-2016学年第1学期 A卷","num":15,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"马克思说：“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。”这句话揭示了","options":[{"letter":"A","text":"生产关系对生产力具有能动的反作用"},{"letter":"B","text":"生产力状况决定生产关系的性质"},{"letter":"C","text":"经济基础决定上层建筑"},{"letter":"D","text":"科学技术是第一生产力"}],"images":[],"answer":"B","analysis":"课本：生产工具是生产力发展水平的客观尺度。生产力状况决定生产关系的性质，有什么样的生产力就有什么样的生产关系。题干以磨的变化说明生产力对生产关系性质的决定作用。"},{"id":"15161-T16","fileId":"15161","source":"2015-2016学年第1学期 A卷 第16题","paper":"2015-2016学年第1学期 A卷","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"经济基础决定上层建筑，这种情况","options":[{"letter":"A","text":"只存在于阶级社会"},{"letter":"B","text":"只存在于资本主义社会"},{"letter":"C","text":"只存在于社会主义社会"},{"letter":"D","text":"存在于一切社会形态"}],"images":[],"answer":"D","analysis":"课本：经济基础决定上层建筑是贯穿一切社会形态的普遍规律。任何社会都是经济基础与上层建筑的统一体，经济基础的性质决定上层建筑的性质，经济基础的变更必然引起上层建筑的变革。"},{"id":"15161-T17","fileId":"15161","source":"2015-2016学年第1学期 A卷 第17题","paper":"2015-2016学年第1学期 A卷","num":17,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"科学技术在通过促进经济和社会发展，造福于人类的同时，也带来环境污染、生态破坏、能源和资源枯竭等问题，有时甚至“表现为异己的、敌对的和统治的权力”。对此，我们应该","options":[{"letter":"A","text":"相信科学技术本身能够解决所有的问题"},{"letter":"B","text":"建立合理的社会制度保障科学技术的正确运用"},{"letter":"C","text":"反对科学技术的研究和使用"},{"letter":"D","text":"相信科学技术对于变革社会具有直接的决定作用"}],"images":[],"answer":"B","analysis":"课本：科学技术的社会作用具有两重性。全球性问题的产生主要是科技应用不当和社会制度原因造成的，解决这些问题既要依靠科技进一步发展，更要建立合理的社会制度来保障科技的正确运用。A、C、D均片面。"},{"id":"15161-T18","fileId":"15161","source":"2015-2016学年第1学期 A卷 第18题","paper":"2015-2016学年第1学期 A卷","num":18,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"关于历史的创造者问题，下列观点符合马克思主义的是","options":[{"letter":"A","text":"“人们自己创造自己的历史”"},{"letter":"B","text":"“如古之无圣人，人之类灭久矣”"},{"letter":"C","text":"伟人的活动是“全部世界历史的灵魂”"},{"letter":"D","text":"“历史者英雄之舞台也，舍英雄几无历史”"}],"images":[],"answer":"A","analysis":"课本：唯物史观主张人民群众是历史的创造者。马克思说“人们自己创造自己的历史”，但是是在既定的、制约着他们的环境中创造的。B、C、D都是夸大个人（圣人、伟人、英雄）作用的英雄史观。"},{"id":"15161-T19","fileId":"15161","source":"2015-2016学年第1学期 A卷 第19题","paper":"2015-2016学年第1学期 A卷","num":19,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"下列选项中反映商品所特有的社会属性的是","options":[{"letter":"A","text":"使用价值"},{"letter":"B","text":"私人劳动"},{"letter":"C","text":"价值"},{"letter":"D","text":"具体劳动"}],"images":[],"answer":"C","analysis":"课本：价值是凝结在商品中的无差别的一般人类劳动，是商品所特有的社会属性，体现商品生产者之间的社会关系。使用价值是自然属性，具体劳动创造使用价值，私人劳动是商品经济中劳动的社会性质之一。"},{"id":"15161-T20","fileId":"15161","source":"2015-2016学年第1学期 A卷 第20题","paper":"2015-2016学年第1学期 A卷","num":20,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"劳动生产力水平越高，单位商品的价值量就","options":[{"letter":"A","text":"越大"},{"letter":"B","text":"越小"},{"letter":"C","text":"不变"},{"letter":"D","text":"平均"}],"images":[],"answer":"B","analysis":"课本：单位商品的价值量与劳动生产率成反比。劳动生产率越高，单位时间内生产的商品数量越多，凝结在每件商品中的社会必要劳动时间就越少，单位商品价值量越小。"},{"id":"15161-T21","fileId":"15161","source":"2015-2016学年第1学期 A卷 第21题","paper":"2015-2016学年第1学期 A卷","num":21,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"货币转化为资本的关键，是它购买到了","options":[{"letter":"A","text":"生产资料"},{"letter":"B","text":"劳动者"},{"letter":"C","text":"劳动力"},{"letter":"D","text":"劳动"}],"images":[],"answer":"C","analysis":"课本：劳动力成为商品是货币转化为资本的前提。劳动力商品的使用价值是价值的源泉，它在消费（劳动）过程中能够创造出比自身价值更大的价值，即剩余价值，货币因此转化为资本。注意区分“劳动力”与“劳动”：劳动不是商品。"},{"id":"15161-T22","fileId":"15161","source":"2015-2016学年第1学期 A卷 第22题","paper":"2015-2016学年第1学期 A卷","num":22,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"根据资本不同部分在剩余价值生产中所起的作用不同，可以将资本区分为","options":[{"letter":"A","text":"所用资本和所费资本"},{"letter":"B","text":"固定资本和流动资本"},{"letter":"C","text":"固定资本和可变资本"},{"letter":"D","text":"不变资本和可变资本"}],"images":[],"answer":"D","analysis":"课本：根据资本在剩余价值生产中所起的作用不同，资本区分为不变资本（以生产资料形式存在，只转移价值不增殖）和可变资本（购买劳动力，创造剩余价值）。固定/流动资本的划分依据是价值周转方式。"},{"id":"15161-T23","fileId":"15161","source":"2015-2016学年第1学期 A卷 第23题","paper":"2015-2016学年第1学期 A卷","num":23,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"剩余价值率用公式来表示是","options":[{"letter":"A","text":"m'=v/m"},{"letter":"B","text":"m'=c/m"},{"letter":"C","text":"m'=m/v"},{"letter":"D","text":"m'=m/c"}],"images":[],"answer":"C","analysis":"课本：剩余价值率 m'=m/v，即剩余价值与可变资本的比率，它准确地反映了资本家对雇佣工人的剥削程度，故又称剥削率。"},{"id":"15161-T24","fileId":"15161","source":"2015-2016学年第1学期 A卷 第24题","paper":"2015-2016学年第1学期 A卷","num":24,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是追求超额剩余价值，但其客观后果则是整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，而剩余劳动时间相对延长，整个资本家阶级普遍获得更多的","options":[{"letter":"A","text":"绝对剩余价值"},{"letter":"B","text":"相对剩余价值"},{"letter":"C","text":"资本积累"},{"letter":"D","text":"平均利润"}],"images":[],"answer":"B","analysis":"课本：相对剩余价值是通过缩短必要劳动时间、相对延长剩余劳动时间生产的剩余价值，以全社会劳动生产率普遍提高为条件，是资本家追逐超额剩余价值的客观后果。"},{"id":"15161-T25","fileId":"15161","source":"2015-2016学年第1学期 A卷 第25题","paper":"2015-2016学年第1学期 A卷","num":25,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本有机构成提高的情况下，资本对劳动力的需求将会","options":[{"letter":"A","text":"日益绝对地减少"},{"letter":"B","text":"日益相对地增加"},{"letter":"C","text":"日益绝对地增加"},{"letter":"D","text":"日益相对地减少"}],"images":[],"answer":"D","analysis":"课本：资本有机构成（c∶v）提高意味着可变资本在总资本中的比重下降，资本对劳动力的需求日益相对地减少（有时甚至绝对减少），从而形成相对过剩人口。注意题干问的是“需求”的变化方向。"},{"id":"15161-T26","fileId":"15161","source":"2015-2016学年第1学期 A卷 第26题","paper":"2015-2016学年第1学期 A卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"所谓利润，是把剩余价值看作下列何者的产物或增加额","options":[{"letter":"A","text":"可变资本"},{"letter":"B","text":"成本价格"},{"letter":"C","text":"生产价格"},{"letter":"D","text":"全部垫付资本"}],"images":[],"answer":"D","analysis":"课本：当剩余价值被看作全部预付资本（垫付资本）的产物或增加额时，剩余价值就转化为利润。利润掩盖了剩余价值的真正来源（可变资本）。"},{"id":"15161-T27","fileId":"15161","source":"2015-2016学年第1学期 A卷 第27题","paper":"2015-2016学年第1学期 A卷","num":27,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义经济危机爆发的根本原因是","options":[{"letter":"A","text":"一些商品生产者在出卖了自己的商品后不接着购买他人生产的商品"},{"letter":"B","text":"某些债务人在债务到期时不能支付，使整个信用关系遭到破坏"},{"letter":"C","text":"资本主义的基本矛盾"},{"letter":"D","text":"社会两大部类的生产在规模上和结构上经常处于失衡状态"}],"images":[],"answer":"C","analysis":"课本：资本主义经济危机爆发的根本原因是资本主义的基本矛盾，即生产社会化和生产资料资本主义私人占有之间的矛盾。其具体表现为个别企业生产的有组织性与整个社会生产的无政府状态的矛盾、生产无限扩大趋势与劳动人民有支付能力的需求相对缩小的矛盾。"},{"id":"15161-T28","fileId":"15161","source":"2015-2016学年第1学期 A卷 第28题","paper":"2015-2016学年第1学期 A卷","num":28,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"垄断资本的实质在于获取","options":[{"letter":"A","text":"绝对剩余价值"},{"letter":"B","text":"超额剩余价值"},{"letter":"C","text":"平均利润"},{"letter":"D","text":"垄断利润"}],"images":[],"answer":"D","analysis":"课本：垄断资本的实质在于获取垄断利润，即垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利润主要通过垄断价格来实现。"},{"id":"15161-T29","fileId":"15161","source":"2015-2016学年第1学期 A卷 第29题","paper":"2015-2016学年第1学期 A卷","num":29,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"金融寡头对国家机器的控制，主要是通过","options":[{"letter":"A","text":"自由竞争实现的"},{"letter":"B","text":"同政府的“个人联合”来实现的"},{"letter":"C","text":"一定的垄断组织形式实现的"},{"letter":"D","text":"“参与制”实现的"}],"images":[],"answer":"B","analysis":"课本：金融寡头在政治上的统治主要是通过同政府的“个人联合”实现的；在经济领域中的统治则是通过“参与制”实现的。注意两个搭配不要混淆。"},{"id":"15161-T30","fileId":"15161","source":"2015-2016学年第1学期 A卷 第30题","paper":"2015-2016学年第1学期 A卷","num":30,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"为国家垄断资本主义奠定理论基础的是","options":[{"letter":"A","text":"英国经济学家亚当·斯密发表《国富论》"},{"letter":"B","text":"英国经济学家大卫·李嘉图发表《政治经济学及赋税原理》"},{"letter":"C","text":"英国经济学家凯恩斯发表《就业、利息和货币通论》"},{"letter":"D","text":"美国总统罗斯福实施“新政”"}],"images":[],"answer":"C","analysis":"课本：凯恩斯的《就业、利息和货币通论》主张国家干预经济，为国家垄断资本主义奠定了理论基础。罗斯福“新政”是国家垄断资本主义的实践而非理论基础。"},{"id":"15161-T31","fileId":"15161","source":"2015-2016学年第1学期 A卷 第31题","paper":"2015-2016学年第1学期 A卷","num":31,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"multi","subtype":"","desc":"马克思主义的三个直接理论来源是","options":[{"letter":"A","text":"古希腊罗马哲学"},{"letter":"B","text":"德国古典哲学"},{"letter":"C","text":"英国古典政治经济学"},{"letter":"D","text":"英法两国的空想社会主义"}],"images":[],"answer":"BCD","analysis":"课本导论：德国古典哲学、英国古典政治经济学、英法空想社会主义为马克思主义的创立提供了直接的理论来源。古希腊罗马哲学是更广泛意义上的思想来源，不属于“三个直接理论来源”。"},{"id":"15161-T32","fileId":"15161","source":"2015-2016学年第1学期 A卷 第32题","paper":"2015-2016学年第1学期 A卷","num":32,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"联系具有普遍性，其具体含义为","options":[{"letter":"A","text":"任何事物内部的不同部分和要素都是相互联系的"},{"letter":"B","text":"任何事物都不能孤立存在，都同其他事物处于一定的相互联系中"},{"letter":"C","text":"整个世界是相互联系的统一整体"},{"letter":"D","text":"事物的联系是事物本身所固有的，不是主观臆想的"}],"images":[],"answer":"ABC","analysis":"课本：联系的普遍性有三层含义：事物内部各部分和要素相互联系；任何事物都同其他事物处于相互联系之中；整个世界是相互联系的统一整体。D表述的是联系的客观性，不是普遍性。"},{"id":"15161-T33","fileId":"15161","source":"2015-2016学年第1学期 A卷 第33题","paper":"2015-2016学年第1学期 A卷","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"下列各项体现矛盾的同一性的有","options":[{"letter":"A","text":"动中有静，静中有动"},{"letter":"B","text":"有无相生，难易相成"},{"letter":"C","text":"城门失火，殃及池鱼"},{"letter":"D","text":"乐极生悲，苦尽甘来"}],"images":[],"answer":"ABD","analysis":"课本：矛盾的同一性指矛盾双方相互依存、相互贯通（在一定条件下相互转化）。“动中有静”“有无相生”“乐极生悲”都体现矛盾双方的相互依存和转化。C“城门失火，殃及池鱼”体现的是事物的普遍联系，不特指矛盾同一性。"},{"id":"15161-T34","fileId":"15161","source":"2015-2016学年第1学期 A卷 第34题","paper":"2015-2016学年第1学期 A卷","num":34,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"实践在认识中的决定作用表现为","options":[{"letter":"A","text":"实践是认识的来源"},{"letter":"B","text":"实践是认识发展的动力"},{"letter":"C","text":"实践是认识的目的"},{"letter":"D","text":"实践是检验认识真理性的唯一标准"}],"images":[],"answer":"ABCD","analysis":"课本：实践是认识的基础，对认识具有决定作用，具体表现为四点：实践是认识的来源；实践是认识发展的动力；实践是认识的目的；实践是检验认识真理性的唯一标准。"},{"id":"15161-T35","fileId":"15161","source":"2015-2016学年第1学期 A卷 第35题","paper":"2015-2016学年第1学期 A卷","num":35,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"理性认识的形式有","options":[{"letter":"A","text":"概念"},{"letter":"B","text":"表象"},{"letter":"C","text":"判断"},{"letter":"D","text":"推理"}],"images":[],"answer":"ACD","analysis":"课本：认识过程包括感性认识和理性认识两个阶段。感性认识的形式是感觉、知觉、表象；理性认识的形式是概念、判断、推理。B表象属于感性认识。"},{"id":"15161-T36","fileId":"15161","source":"2015-2016学年第1学期 A卷 第36题","paper":"2015-2016学年第1学期 A卷","num":36,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"下列社会意识形式中，属于意识形态的有","options":[{"letter":"A","text":"政治法律思想"},{"letter":"B","text":"形式逻辑"},{"letter":"C","text":"自然科学"},{"letter":"D","text":"哲学"}],"images":[],"answer":"AD","analysis":"课本：社会意识形态（意识形态）包括政治法律思想、道德、艺术、宗教、哲学等，具有阶级性，反映特定经济基础并为其服务。自然科学、形式逻辑等不属于意识形态，它们本身没有阶级性，可以为不同的社会制度服务。"},{"id":"15161-T37","fileId":"15161","source":"2015-2016学年第1学期 A卷 第37题","paper":"2015-2016学年第1学期 A卷","num":37,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"下列各项属于生产关系内容的有","options":[{"letter":"A","text":"生产资料所有制关系"},{"letter":"B","text":"劳动资料和劳动对象"},{"letter":"C","text":"产品分配关系"},{"letter":"D","text":"生产中人与人的关系"}],"images":[],"answer":"ACD","analysis":"课本：生产关系包括三个方面：生产资料所有制关系、生产中人与人的关系、产品分配关系。劳动资料和劳动对象属于生产力的要素，不属于生产关系。"},{"id":"15161-T38","fileId":"15161","source":"2015-2016学年第1学期 A卷 第38题","paper":"2015-2016学年第1学期 A卷","num":38,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"产业资本在循环过程中要经历三个不同的阶段，资本依次执行的是","options":[{"letter":"A","text":"货币资本的职能"},{"letter":"B","text":"生产资本的职能"},{"letter":"C","text":"商品资本的职能"},{"letter":"D","text":"不变资本的职能"}],"images":[],"answer":"ABC","analysis":"课本：产业资本循环经历购买、生产、售卖三个阶段，资本依次执行货币资本（购买劳动力和生产资料）、生产资本（生产剩余价值）、商品资本（实现价值和剩余价值）三种职能。不变资本是按剩余价值生产中的作用划分的概念。"},{"id":"15161-T39","fileId":"15161","source":"2015-2016学年第1学期 A卷 第39题","paper":"2015-2016学年第1学期 A卷","num":39,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"社会再生产的顺利进行，要求","options":[{"letter":"A","text":"缩短资本周转时间"},{"letter":"B","text":"加快流动资本的周转速度"},{"letter":"C","text":"生产中所耗费的资本在价值上得到补偿"},{"letter":"D","text":"实际生产过程中所耗费的生产资料和消费资料得到实物的替换"}],"images":[],"answer":"CD","analysis":"课本：社会再生产的核心问题是社会总产品的实现问题，要求生产中所耗费的资本在价值上得到补偿（价值补偿），所耗费的生产资料和消费资料得到实物的替换（实物补偿）。A、B影响的是资本周转速度，不是再生产顺利进行的实现条件本身。"},{"id":"15161-T40","fileId":"15161","source":"2015-2016学年第1学期 A卷 第40题","paper":"2015-2016学年第1学期 A卷","num":40,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"导致经济全球化迅猛发展的因素主要有","options":[{"letter":"A","text":"科学技术的进步和生产力的发展"},{"letter":"B","text":"跨国公司的发展"},{"letter":"C","text":"国际分工进一步深化"},{"letter":"D","text":"各国经济体制的变革"}],"images":[],"answer":"ABD","analysis":"课本：导致经济全球化迅猛发展的因素主要有三点：科学技术的进步和生产力的发展提供了坚实的物质基础和根本推动力；跨国公司的发展提供了适宜的企业组织形式；各国经济体制的变革（和国际经济组织的发展）提供了体制与组织保障。国际分工的深化是经济全球化的表现和背景，不在三点动因之列。"},{"id":"16171-T1","fileId":"16171","source":"2016-2017学年第1学期 A卷 第1题","paper":"2016-2017学年第1学期 A卷","num":1,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"马克思主义公开问世的标志是","options":[{"letter":"A","text":"《德意志意识形态》的出版"},{"letter":"B","text":"《资本论》的出版"},{"letter":"C","text":"《反杜林论》的出版"},{"letter":"D","text":"《共产党宣言》的发表"}],"images":[],"answer":"D","analysis":"课本导论：1848年2月《共产党宣言》发表，标志着马克思主义公开问世。《德意志意识形态》写于1845年前后但当时未出版；《资本论》第一卷出版于1867年。"},{"id":"16171-T2","fileId":"16171","source":"2016-2017学年第1学期 A卷 第2题","paper":"2016-2017学年第1学期 A卷","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"黑格尔说，割下来的手就不是真正的人手了。这句话表达的哲学道理是","options":[{"letter":"A","text":"承认世界的统一性"},{"letter":"B","text":"承认世界的本原是物质的"},{"letter":"C","text":"承认普遍联系的辩证法观点"},{"letter":"D","text":"否认联系的形而上学观点"}],"images":[],"answer":"C","analysis":"课本：联系是事物本身所固有的，事物各部分只有在整体联系中才具有其原有的性质和功能。手一旦离开身体就丧失其作为“人手”的意义，说明部分离不开整体，体现的是普遍联系的辩证法观点。"},{"id":"16171-T3","fileId":"16171","source":"2016-2017学年第1学期 A卷 第3题","paper":"2016-2017学年第1学期 A卷","num":3,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"矛盾的两种基本属性是指","options":[{"letter":"A","text":"普遍性和特殊性"},{"letter":"B","text":"斗争性和同一性"},{"letter":"C","text":"变动性和稳定性"},{"letter":"D","text":"绝对性和相对性"}],"images":[],"answer":"B","analysis":"课本：矛盾的同一性和斗争性是矛盾的两种基本属性。同一性指矛盾双方相互依存、相互贯通；斗争性指矛盾双方相互排斥、相互分离。普遍性与特殊性是矛盾问题的精髓所在，不是矛盾的属性。"},{"id":"16171-T4","fileId":"16171","source":"2016-2017学年第1学期 A卷 第4题","paper":"2016-2017学年第1学期 A卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"世界的真正统一性在于","options":[{"letter":"A","text":"实践"},{"letter":"B","text":"物质性"},{"letter":"C","text":"意识"},{"letter":"D","text":"绝对性和相对性"}],"images":[],"answer":"B","analysis":"课本：马克思主义认为，世界的统一性在于它的物质性，世界统一于物质。这一结论由哲学和自然科学的长期发展所证明。"},{"id":"16171-T5","fileId":"16171","source":"2016-2017学年第1学期 A卷 第5题","paper":"2016-2017学年第1学期 A卷","num":5,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会生活在本质上是","options":[{"letter":"A","text":"自然条件"},{"letter":"B","text":"神定的一种秩序"},{"letter":"C","text":"人类意识活动的产物"},{"letter":"D","text":"实践的"}],"images":[],"answer":"D","analysis":"课本：实践是使物质世界分化为自然界与人类社会的历史前提，又是使自然界与人类社会统一起来的现实基础；社会生活在本质上是实践的。"},{"id":"16171-T6","fileId":"16171","source":"2016-2017学年第1学期 A卷 第6题","paper":"2016-2017学年第1学期 A卷","num":6,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"马克思主义哲学认为，意识是客观世界的主观映象。这是说","options":[{"letter":"A","text":"意识是客观精神和主观感觉的产物"},{"letter":"B","text":"意识是沟通主、客观的桥梁"},{"letter":"C","text":"意识的形式是主观的，而内容是客观的"},{"letter":"D","text":"意识的形式是客观的，而内容是主观的"}],"images":[],"answer":"C","analysis":"课本：意识是客观世界的主观映象，其内容来源于客观世界，形式则是主观的；意识不是独立的客观精神。"},{"id":"16171-T7","fileId":"16171","source":"2016-2017学年第1学期 A卷 第7题","paper":"2016-2017学年第1学期 A卷","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"习近平在布鲁日欧洲学院的演讲中曾引用《老子》的一段话：“图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。”这段话体现的哲理是","options":[{"letter":"A","text":"量变是质变的必要准备"},{"letter":"B","text":"质变是量变的必然结果"},{"letter":"C","text":"量变和质变是相互对立的"},{"letter":"D","text":"量变和质变是相互渗透的"}],"images":[],"answer":"A","analysis":"课本：量变质变规律指出，量变是质变的必要准备，质变是量变的必然结果。“难事作于易、大事作于细”强调从易处、细处着手积累，正体现量变积累是达成质变（办成难事大事）的必要准备。"},{"id":"16171-T8","fileId":"16171","source":"2016-2017学年第1学期 A卷 第8题","paper":"2016-2017学年第1学期 A卷","num":8,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"“从物到感觉和思想”与“从思想和感觉到物”，这是","options":[{"letter":"A","text":"辩证唯物论与旧唯物论两条认识路线的对立"},{"letter":"B","text":"辩证法和形而上学的对立"},{"letter":"C","text":"唯物主义与唯心主义两条认识路线的对立"},{"letter":"D","text":"可知论与不可知论的对立"}],"images":[],"answer":"C","analysis":"课本：唯物主义坚持物质第一性、意识第二性，即从物到感觉和思想；唯心主义则把思想和感觉看作本原，二者体现两条根本对立的认识路线。"},{"id":"16171-T9","fileId":"16171","source":"2016-2017学年第1学期 A卷 第9题","paper":"2016-2017学年第1学期 A卷","num":9,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"把通过眼、耳、鼻、舌、身等感觉器官捕捉到一个梨子的各种属性，在意识中把它们联系起来形成关于这个梨子的感性形象。这种反映形式是","options":[{"letter":"A","text":"感觉"},{"letter":"B","text":"知觉"},{"letter":"C","text":"表象"},{"letter":"D","text":"概念"}],"images":[],"answer":"B","analysis":"课本：知觉是对客观事物外部特征的整体反映。感觉只反映个别属性，表象是事物不在面前时在头脑中再现的形象，概念属于理性认识。"},{"id":"16171-T10","fileId":"16171","source":"2016-2017学年第1学期 A卷 第10题","paper":"2016-2017学年第1学期 A卷","num":10,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"真理和谬误的界限在于","options":[{"letter":"A","text":"是否符合人的利益和愿望"},{"letter":"B","text":"是否符合马克思主义"},{"letter":"C","text":"是否为大多数人所接受"},{"letter":"D","text":"是否反映了客观事物的本质和规律"}],"images":[],"answer":"D","analysis":"课本：真理是对客观事物及其规律的正确反映，谬误是对客观事物及其规律的歪曲反映。二者的原则界限在于是否如实反映了客观事物的本质和规律，而不在于主观利益、权威或人数。"},{"id":"16171-T11","fileId":"16171","source":"2016-2017学年第1学期 A卷 第11题","paper":"2016-2017学年第1学期 A卷","num":11,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"辩证唯物主义认识论第一的和基本的观点是","options":[{"letter":"A","text":"唯物论的观点"},{"letter":"B","text":"辩证法的观点"},{"letter":"C","text":"实践的观点"},{"letter":"D","text":"可知论的观点"}],"images":[],"answer":"C","analysis":"课本：实践观点是马克思主义认识论首要的和基本的观点，实践是认识的来源、动力、目的和检验真理的唯一标准。"},{"id":"16171-T12","fileId":"16171","source":"2016-2017学年第1学期 A卷 第12题","paper":"2016-2017学年第1学期 A卷","num":12,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"下列选项中，正确表述认识过程两次飞跃的是","options":[{"letter":"A","text":"感觉——知觉——表象"},{"letter":"B","text":"实践——认识——实践"},{"letter":"C","text":"概念——判断——推理"},{"letter":"D","text":"意识——物质——意识"}],"images":[],"answer":"B","analysis":"课本：认识过程的两次飞跃：从实践到认识（感性认识到理性认识），再从认识到实践。两次飞跃的完整过程表述为“实践——认识——实践”。A、C分别是感性认识和理性认识的形式序列。"},{"id":"16171-T13","fileId":"16171","source":"2016-2017学年第1学期 A卷 第13题","paper":"2016-2017学年第1学期 A卷","num":13,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"实践之所以能够作为检验真理的唯一标准，这是由","options":[{"letter":"A","text":"实践的历史性决定的"},{"letter":"B","text":"实践的有条件性、相对性决定的"},{"letter":"C","text":"真理的绝对性和相对性决定的"},{"letter":"D","text":"真理的本性和实践的特点决定的"}],"images":[],"answer":"D","analysis":"课本：实践作为检验真理的唯一标准，是由真理的本性（主观认识与客观实际相符合）和实践的特点（直接现实性）共同决定的。"},{"id":"16171-T14","fileId":"16171","source":"2016-2017学年第1学期 A卷 第14题","paper":"2016-2017学年第1学期 A卷","num":14,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"生产关系范畴反映的是","options":[{"letter":"A","text":"人与自然之间的关系"},{"letter":"B","text":"人与人之间的经济关系"},{"letter":"C","text":"人与人之间的政治关系"},{"letter":"D","text":"人与人之间的思想关系"}],"images":[],"answer":"B","analysis":"课本：生产关系是人们在物质生产过程中形成的不以人的意志为转移的经济关系，即人与人之间的经济（物质利益）关系。生产关系作为人与人的关系，总是同物结合着并作为物出现，分析时必须透过物看到人与人的关系。"},{"id":"16171-T15","fileId":"16171","source":"2016-2017学年第1学期 A卷 第15题","paper":"2016-2017学年第1学期 A卷","num":15,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"近年来国务院多次召开常务会议，就深化行政审批制度改革、“简政放权”做出重大决定，以激发市场主体的创造活力。“简政放权”的主要哲学依据是","options":[{"letter":"A","text":"人民群众是历史创造者的原理"},{"letter":"B","text":"生产关系一定要适合生产力状况的规律"},{"letter":"C","text":"社会存在决定社会意识的原理"},{"letter":"D","text":"上层建筑一定要适合经济基础状况的规律"}],"images":[],"answer":"D","analysis":"课本：行政审批制度属于政治上层建筑，简政放权是调整上层建筑使之适合经济基础状况的改革，依据的是上层建筑一定要适合经济基础状况的规律。"},{"id":"16171-T16","fileId":"16171","source":"2016-2017学年第1学期 A卷 第16题","paper":"2016-2017学年第1学期 A卷","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"社会基本矛盾是指","options":[{"letter":"A","text":"生产力和生产关系的矛盾"},{"letter":"B","text":"生产力和生产关系、经济基础和上层建筑的矛盾"},{"letter":"C","text":"社会存在和社会意识的矛盾"},{"letter":"D","text":"人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}],"images":[],"answer":"B","analysis":"课本：社会基本矛盾即生产力和生产关系、经济基础和上层建筑的矛盾。这两对矛盾贯穿人类社会发展过程的始终，是社会发展的根本动力。D是我国社会主义初级阶段曾表述的社会主要矛盾。"},{"id":"16171-T17","fileId":"16171","source":"2016-2017学年第1学期 A卷 第17题","paper":"2016-2017学年第1学期 A卷","num":17,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"英雄史观的理论前提是","options":[{"letter":"A","text":"社会存在决定社会意识"},{"letter":"B","text":"人是社会历史的主体"},{"letter":"C","text":"人的意识对社会存在具有能动的作用"},{"letter":"D","text":"社会意识决定社会存在"}],"images":[],"answer":"D","analysis":"课本：英雄史观从社会意识决定社会存在的唯心史观出发，夸大少数英雄人物的作用，否认人民群众是历史的创造者。"},{"id":"16171-T18","fileId":"16171","source":"2016-2017学年第1学期 A卷 第18题","paper":"2016-2017学年第1学期 A卷","num":18,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"制约人民群众创造历史的首要的、决定性的条件是","options":[{"letter":"A","text":"经济条件"},{"letter":"B","text":"政治地位"},{"letter":"C","text":"传统观念"},{"letter":"D","text":"文化水平"}],"images":[],"answer":"A","analysis":"课本：人民群众创造历史的活动受到一定社会历史条件的制约，其中经济条件对人民群众创造历史的活动具有首要的、决定性的影响。"},{"id":"16171-T19","fileId":"16171","source":"2016-2017学年第1学期 A卷 第19题","paper":"2016-2017学年第1学期 A卷","num":19,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"马克思说：“如果物没有用，那么其中包含的劳动也就没有用，不能算作劳动，因此不形成价值。”这表明","options":[{"letter":"A","text":"只要物有使用价值，也就有价值"},{"letter":"B","text":"使用价值是价值的物质承担者"},{"letter":"C","text":"使用价值与价值是不可分离的"},{"letter":"D","text":"价值是由使用价值决定的"}],"images":[],"answer":"B","analysis":"课本：商品的使用价值是价值的物质承担者。没有使用价值，凝结在商品中的劳动就不能形成价值；但有使用价值的物品不一定具有价值。"},{"id":"16171-T20","fileId":"16171","source":"2016-2017学年第1学期 A卷 第20题","paper":"2016-2017学年第1学期 A卷","num":20,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"劳动力商品与其他商品在使用价值上有一个很大的不同是指","options":[{"letter":"A","text":"它存在于人的身体之内"},{"letter":"B","text":"它在一定条件下可以转化为商品"},{"letter":"C","text":"它的使用价值是价值的源泉"},{"letter":"D","text":"它的价值受历史和道德因素的影响"}],"images":[],"answer":"C","analysis":"课本：劳动力商品最重要的特点在于，它的使用价值是价值的源泉，并且能够创造出比自身价值更大的价值。"},{"id":"16171-T21","fileId":"16171","source":"2016-2017学年第1学期 A卷 第21题","paper":"2016-2017学年第1学期 A卷","num":21,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义的生产过程具有二重性，它是","options":[{"letter":"A","text":"劳动过程和价值形成过程的统一"},{"letter":"B","text":"价值形成过程与价值增殖过程的统一"},{"letter":"C","text":"生产过程与流通过程的统一"},{"letter":"D","text":"劳动过程和价值增殖过程的统一"}],"images":[],"answer":"D","analysis":"课本：资本主义生产过程具有二重性，一方面是生产使用价值的劳动过程，另一方面是生产剩余价值的价值增殖过程。"},{"id":"16171-T22","fileId":"16171","source":"2016-2017学年第1学期 A卷 第22题","paper":"2016-2017学年第1学期 A卷","num":22,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"不变资本是资本主义生产过程中","options":[{"letter":"A","text":"以生产资料形态存在的资本"},{"letter":"B","text":"用于购买劳动力的资本"},{"letter":"C","text":"固定资本"},{"letter":"D","text":"流动资本"}],"images":[],"answer":"A","analysis":"课本：以生产资料形态存在的资本，在生产过程中只转移自己的价值量而不发生价值增殖，叫不变资本（c）；用来购买劳动力的资本在生产过程中创造出比自身价值更大的价值，叫可变资本（v）。固定/流动资本是按价值周转方式的另一种划分。"},{"id":"16171-T23","fileId":"16171","source":"2016-2017学年第1学期 A卷 第23题","paper":"2016-2017学年第1学期 A卷","num":23,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"在商品经济条件下，价值规律的表现形式是","options":[{"letter":"A","text":"商品的价格经常高于商品的价值"},{"letter":"B","text":"商品的价格经常低于商品的价值"},{"letter":"C","text":"商品的价格总是与商品的价值不一致"},{"letter":"D","text":"商品的价格围绕商品的价值自发波动"}],"images":[],"answer":"D","analysis":"课本：价值规律的表现形式是商品的价格围绕价值自发波动。价格受供求影响偏离价值，但从长期和全社会看，价格总额与价值总额一致，价格波动始终以价值为基础。"},{"id":"16171-T24","fileId":"16171","source":"2016-2017学年第1学期 A卷 第24题","paper":"2016-2017学年第1学期 A卷","num":24,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本主义生产过程中，直接导致相对过剩人口形成的是","options":[{"letter":"A","text":"资本有机构成的提高"},{"letter":"B","text":"资本有机构成的下降"},{"letter":"C","text":"资本对劳动力需求的增加"},{"letter":"D","text":"人口增长速度超过资本增长速度"}],"images":[],"answer":"A","analysis":"课本：资本有机构成提高使可变资本在总资本中的比重相对下降，资本对劳动力的需求日益相对减少，从而形成相对过剩人口（产业后备军）。这是资本积累的必然产物。"},{"id":"16171-T25","fileId":"16171","source":"2016-2017学年第1学期 A卷 第25题","paper":"2016-2017学年第1学期 A卷","num":25,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"社会再生产的核心问题是社会总产品的实现问题，即社会总产品的","options":[{"letter":"A","text":"生产和分配问题"},{"letter":"B","text":"循环和周转问题"},{"letter":"C","text":"价值补偿和实物补偿问题"},{"letter":"D","text":"物质补偿和精神补偿问题"}],"images":[],"answer":"C","analysis":"课本：社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿（替换）问题。只有两个补偿都实现，社会再生产才能顺利进行。"},{"id":"16171-T26","fileId":"16171","source":"2016-2017学年第1学期 A卷 第26题","paper":"2016-2017学年第1学期 A卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"为了得到尽可能高的利润率和尽可能多的利润，不同部门的资本家之间展开激烈的竞争，大量资本必然从利润率低的部门转投到利润率高的部门，从而导致","options":[{"letter":"A","text":"垄断利润的产生"},{"letter":"B","text":"资本集中于少数人之手"},{"letter":"C","text":"绝对剩余价值的生产"},{"letter":"D","text":"利润率平均化"}],"images":[],"answer":"D","analysis":"课本：部门之间的竞争和资本转移使不同部门的利润率趋于平均化，形成平均利润率，等量资本获得等量利润，商品价值转化为生产价格。"},{"id":"16171-T27","fileId":"16171","source":"2016-2017学年第1学期 A卷 第27题","paper":"2016-2017学年第1学期 A卷","num":27,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"在资本主义发展过程中，垄断的形成是","options":[{"letter":"A","text":"生产集中和资本集中发展到一定阶段的结果"},{"letter":"B","text":"生产输出的结果"},{"letter":"C","text":"金融资本统治的结果"},{"letter":"D","text":"国家干预经济生活的结果"}],"images":[],"answer":"A","analysis":"课本：自由竞争引起生产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本主义发展的客观规律。"},{"id":"16171-T28","fileId":"16171","source":"2016-2017学年第1学期 A卷 第28题","paper":"2016-2017学年第1学期 A卷","num":28,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"金融寡头在经济领域中的统治主要是通过","options":[{"letter":"A","text":"自由竞争实现的"},{"letter":"B","text":"“参与制”实现的"},{"letter":"C","text":"掌握新闻媒体实现的"},{"letter":"D","text":"同政府的“个人联合”来实现的"}],"images":[],"answer":"B","analysis":"课本：金融寡头在经济领域中的统治主要是通过“参与制”实现的；在政治上的统治主要通过同政府的“个人联合”实现；掌握新闻媒体等是其左右社会生活的手段。注意区分。"},{"id":"16171-T29","fileId":"16171","source":"2016-2017学年第1学期 A卷 第29题","paper":"2016-2017学年第1学期 A卷","num":29,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"二战后，占主导地位的资本主义生产资料所有制是","options":[{"letter":"A","text":"私人资本所有制"},{"letter":"B","text":"私人股份资本所有制"},{"letter":"C","text":"国家资本所有制"},{"letter":"D","text":"法人资本所有制"}],"images":[],"answer":"D","analysis":"课本：二战后资本主义生产资料所有制发生新变化，国家资本所有制形成并发挥作用，法人资本所有制崛起并成为居主导地位的资本所有制形式。19世纪末20世纪初占主导的是私人股份资本所有制。"},{"id":"16171-T30","fileId":"16171","source":"2016-2017学年第1学期 A卷 第30题","paper":"2016-2017学年第1学期 A卷","num":30,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"当代资本主义新变化的实质是","options":[{"letter":"A","text":"资本主义生产关系的根本性质发生了变化"},{"letter":"B","text":"克服了资本主义的基本矛盾"},{"letter":"C","text":"改变了资本主义制度的本质"},{"letter":"D","text":"资本主义生产关系的根本性质没有发生变化"}],"images":[],"answer":"D","analysis":"课本：当代资本主义的新变化是在资本主义制度基本框架内的变化，并不意味着资本主义生产关系的根本性质发生了变化。"},{"id":"16171-T31","fileId":"16171","source":"2016-2017学年第1学期 A卷 第31题","paper":"2016-2017学年第1学期 A卷","num":31,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"multi","subtype":"","desc":"马克思一生的两个伟大发现是指","options":[{"letter":"A","text":"唯物史观"},{"letter":"B","text":"唯物辩证法"},{"letter":"C","text":"科学社会主义"},{"letter":"D","text":"剩余价值学说"}],"images":[],"answer":"AD","analysis":"课本：唯物史观和剩余价值学说是马克思一生的两个伟大发现，它们使社会主义由空想变为科学。"},{"id":"16171-T32","fileId":"16171","source":"2016-2017学年第1学期 A卷 第32题","paper":"2016-2017学年第1学期 A卷","num":32,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"哲学基本问题包括两方面的内容，分别是","options":[{"letter":"A","text":"思维和存在何者是第一性的问题"},{"letter":"B","text":"世界是如何发展的问题"},{"letter":"C","text":"思维能否认识和正确认识存在的问题"},{"letter":"D","text":"世界的本质是一元或多元的问题"}],"images":[],"answer":"AC","analysis":"课本：哲学基本问题包括思维和存在何者为第一性，以及思维和存在是否具有同一性两个方面。"},{"id":"16171-T33","fileId":"16171","source":"2016-2017学年第1学期 A卷 第33题","paper":"2016-2017学年第1学期 A卷","num":33,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"下列选项中，属于感性认识和理性认识辩证关系内容的有","options":[{"letter":"A","text":"理性认识依赖于感性认识"},{"letter":"B","text":"理性认识只有回到实践中去，才能得到检验和发展"},{"letter":"C","text":"感性认识有待于发展和深化为理性认识"},{"letter":"D","text":"感性认识和理性认识相互渗透、相互包含"}],"images":[],"answer":"ACD","analysis":"课本：感性认识是理性认识的基础，感性认识有待于发展为理性认识，二者相互渗透、相互包含。B表述的是认识回到实践的问题。"},{"id":"16171-T34","fileId":"16171","source":"2016-2017学年第1学期 A卷 第34题","paper":"2016-2017学年第1学期 A卷","num":34,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"multi","subtype":"","desc":"意识能动作用主要表现在","options":[{"letter":"A","text":"意识活动具有目的性和计划性"},{"letter":"B","text":"意识活动具有创造性"},{"letter":"C","text":"意识具有指导实践改造客观世界的作用"},{"letter":"D","text":"意识具有指导、控制人的行为和生理活动的作用"}],"images":[],"answer":"ABCD","analysis":"课本：意识的能动作用集中表现为目的性和计划性、创造性、指导实践改造客观世界，以及调控人的行为和生理活动。"},{"id":"16171-T35","fileId":"16171","source":"2016-2017学年第1学期 A卷 第35题","paper":"2016-2017学年第1学期 A卷","num":35,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"实践在认识中的决定作用主要表现为","options":[{"letter":"A","text":"实践是认识的来源"},{"letter":"B","text":"实践是认识发展的动力"},{"letter":"C","text":"实践是认识的目的"},{"letter":"D","text":"实践是检验认识真理性的唯一标准"}],"images":[],"answer":"ABCD","analysis":"课本：实践是认识的来源、认识发展的动力、认识的目的，也是检验认识真理性的唯一标准。"},{"id":"16171-T36","fileId":"16171","source":"2016-2017学年第1学期 A卷 第36题","paper":"2016-2017学年第1学期 A卷","num":36,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"社会存在主要包括","options":[{"letter":"A","text":"物质生产方式"},{"letter":"B","text":"人口因素"},{"letter":"C","text":"意识形态"},{"letter":"D","text":"自然地理环境"}],"images":[],"answer":"ABD","analysis":"课本：社会存在包括自然地理环境、人口因素和物质生产方式。意识形态属于社会意识。"},{"id":"16171-T37","fileId":"16171","source":"2016-2017学年第1学期 A卷 第37题","paper":"2016-2017学年第1学期 A卷","num":37,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"multi","subtype":"","desc":"20世纪中期以来，科学技术革命对生产方式产生的影响主要有","options":[{"letter":"A","text":"改变了社会生产力的构成要素"},{"letter":"B","text":"改变了人们的劳动形式"},{"letter":"C","text":"使得学习日益成为人们生活的一项重要内容"},{"letter":"D","text":"改变了经济结构，特别是导致就业结构发生变革"}],"images":[],"answer":"ABD","analysis":"课本：现代科技革命改变了生产力构成要素、劳动形式和社会经济结构。学习成为生活的重要内容属于对生活方式的影响。"},{"id":"16171-T38","fileId":"16171","source":"2016-2017学年第1学期 A卷 第38题","paper":"2016-2017学年第1学期 A卷","num":38,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"产业资本运动必须具备的两个基本前提条件是","options":[{"letter":"A","text":"产业资本的三种职能形式必须在空间上同时并存"},{"letter":"B","text":"社会总产品在价值上得到补偿、在实物上得到替换"},{"letter":"C","text":"生产资本被区分为固定资本和流动资本"},{"letter":"D","text":"产业资本的三种职能形式必须在时间上继起"}],"images":[],"answer":"AD","analysis":"课本：产业资本正常循环必须保持三种职能形式在空间上并存，并使每一种职能形式在时间上相继转化。"},{"id":"16171-T39","fileId":"16171","source":"2016-2017学年第1学期 A卷 第39题","paper":"2016-2017学年第1学期 A卷","num":39,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"私人劳动和社会劳动的矛盾之所以成为私有制商品经济的基本矛盾，在于该矛盾","options":[{"letter":"A","text":"贯穿商品经济发展过程的始终"},{"letter":"B","text":"决定着商品经济的本质及发展过程"},{"letter":"C","text":"是商品经济的其他一切矛盾的基础"},{"letter":"D","text":"决定着商品生产者的命运"}],"images":[],"answer":"ABCD","analysis":"课本：私人劳动和社会劳动的矛盾贯穿私有制商品经济始终，决定其本质和发展过程，是其他矛盾的基础，并决定商品生产者的命运。"},{"id":"16171-T40","fileId":"16171","source":"2016-2017学年第1学期 A卷 第40题","paper":"2016-2017学年第1学期 A卷","num":40,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"导致经济全球化迅猛发展的因素有","options":[{"letter":"A","text":"科学技术的进步和生产力的发展"},{"letter":"B","text":"跨国公司的发展"},{"letter":"C","text":"各国经济体制的变革"},{"letter":"D","text":"世界贸易组织的成立"}],"images":[],"answer":"ABCD","analysis":"课本：科技进步和生产力发展是根本推动力，跨国公司提供适宜的组织形式，各国经济体制变革和国际经济组织发展提供制度与组织保障。"},{"id":"20211-T1","fileId":"20211","source":"2020-2021学年第1学期 B卷 第1题","paper":"2020-2021学年第1学期 B卷","num":1,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"马克思恩格斯进一步发展和完善的英国古典经济学理论是","options":[{"letter":"A","text":"劳动价值论"},{"letter":"B","text":"剩余价值论"},{"letter":"C","text":"辩证法"},{"letter":"D","text":"历史观"}],"images":[],"answer":"A","analysis":"课本指出，马克思批判继承并扬弃了英国古典政治经济学关于劳动创造价值的思想，创立了科学的劳动价值论，并在此基础上创立了剩余价值论。因此，进一步发展和完善的英国古典经济学理论是劳动价值论。"},{"id":"20211-T2","fileId":"20211","source":"2020-2021学年第1学期 B卷 第2题","paper":"2020-2021学年第1学期 B卷","num":2,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"哲学基本问题是指","options":[{"letter":"A","text":"思维与存在的问题"},{"letter":"B","text":"思维与存在的关系问题"},{"letter":"C","text":"辩证法与形而上学的关系问题"},{"letter":"D","text":"唯物主义与唯心主义的关系问题"}],"images":[],"answer":"B","analysis":"课本：恩格斯指出，全部哲学特别是近代哲学的重大的基本问题，是思维和存在的关系问题，包括何者为第一性与有无同一性两个方面。"},{"id":"20211-T3","fileId":"20211","source":"2020-2021学年第1学期 B卷 第3题","paper":"2020-2021学年第1学期 B卷","num":3,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"以下不是唯物主义运动观的表述为","options":[{"letter":"A","text":"运动是物质的根本属性"},{"letter":"B","text":"运动就是精神的运动"},{"letter":"C","text":"物质和运动不可分割"},{"letter":"D","text":"运动和静止相互依赖、相互渗透、相互包含"}],"images":[],"answer":"B","analysis":"课本：唯物主义运动观认为运动是物质的根本属性和存在方式，物质和运动不可分割，运动和静止辩证统一。“运动就是精神的运动”把运动归结为精神的运动，是唯心主义运动观，设想无物质的运动。"},{"id":"20211-T4","fileId":"20211","source":"2020-2021学年第1学期 B卷 第4题","paper":"2020-2021学年第1学期 B卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"有人认为，既然人的意识是对客观外部世界的反映，那么人脑里的“鬼”、“神”意识就是对外在世界上鬼、神真实存在的反映。这种观念的错误在于","options":[{"letter":"A","text":"混淆了人类意识自然演化的阶段"},{"letter":"B","text":"把意识看成是物质的产物"},{"letter":"C","text":"认为意识是对存在的直观反映"},{"letter":"D","text":"夸大意识的能动作用"}],"images":[],"answer":"C","analysis":"课本：意识是客观世界的主观映象，是对客观存在的能动反映而非直观、照镜子式的反映。“鬼”“神”意识是对客观世界的虚幻的、歪曲的反映，其原型仍可追溯到客观世界。该观点把意识等同于对存在的直观反映，是旧唯物主义直观反映论的错误。"},{"id":"20211-T5","fileId":"20211","source":"2020-2021学年第1学期 B卷 第5题","paper":"2020-2021学年第1学期 B卷","num":5,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"某地区进入供暖季后出现雾霾，而一旦出现大风天气或等到春暖花开后，雾霾就会散去或减少，从该地区较长时间的数据变化看，经过人们努力治霾，污染物排放总量在持续走低；但在某些时段，环境空气质量污染指数会迅速攀升，甚至“爆表”。这种看似“矛盾”的现象凸显了大气污染防治的一大特点：天帮忙很重要，但人努力才是根本。“人努力”与“天帮忙”之间的关系对我们正确处理主观能动性和客观规律之间辩证关系的启示是","options":[{"letter":"A","text":"尊重事物的客观规律是正确发挥主观能动性的前提"},{"letter":"B","text":"人类有意识的思想活动是掌握客观规律的根本前提"},{"letter":"C","text":"认识活动是客观规律性与主观能动性相统一的基础"},{"letter":"D","text":"尚未认识的外在自然规律对人的实践活动起着至关重要的作用"}],"images":[],"answer":"A","analysis":"课本：尊重客观规律是正确发挥主观能动性的前提，人们只有在认识和掌握客观规律的基础上才能有效地改造世界；同时只有充分发挥主观能动性才能正确认识和利用客观规律。“人努力”（主观能动性）必须建立在尊重治霾客观规律的基础上。实践（而非认识）是二者统一的基础，B、C错误。"},{"id":"20211-T6","fileId":"20211","source":"2020-2021学年第1学期 B卷 第6题","paper":"2020-2021学年第1学期 B卷","num":6,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"“风定花犹落，鸟鸣山更幽”形象地表达了动和静的辩证关系是","options":[{"letter":"A","text":"静不是动，动不是静"},{"letter":"B","text":"静中有动，动中有静"},{"letter":"C","text":"动是必然的，静是偶然的"},{"letter":"D","text":"动是静的原因，静是动的结果"}],"images":[],"answer":"B","analysis":"课本：运动和静止相互依赖、相互渗透、相互包含，“动中有静、静中有动”。“风定”（静）而“花落”（动），“鸟鸣”（动）衬“山幽”（静），形象表达了静中有动、动中有静的辩证关系。"},{"id":"20211-T7","fileId":"20211","source":"2020-2021学年第1学期 B卷 第7题","paper":"2020-2021学年第1学期 B卷","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"“橘生淮南则为橘，生为淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了","options":[{"letter":"A","text":"事物的发展变化以时间地点和条件为转移"},{"letter":"B","text":"事物的普遍联系是通过中介来实现的"},{"letter":"C","text":"任何实体事物都是普遍联系之网上的一个网结"},{"letter":"D","text":"事物的变化和发展是一个过程"}],"images":[],"answer":"A","analysis":"课本：联系具有条件性，一切以时间、地点和条件为转移。同一棵橘树因水土（外部条件）不同而发生性质变化，说明事物的存在和发展依赖于具体的条件。"},{"id":"20211-T8","fileId":"20211","source":"2020-2021学年第1学期 B卷 第8题","paper":"2020-2021学年第1学期 B卷","num":8,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"“世界不是既成事物的集合体，而是过程的集合体”的观点是","options":[{"letter":"A","text":"形而上学的思想"},{"letter":"B","text":"唯物辩证法的思想"},{"letter":"C","text":"诡辩论的思想"},{"letter":"D","text":"相对主义的思想"}],"images":[],"answer":"B","analysis":"课本：这是恩格斯关于唯物辩证法发展观的经典论断。唯物辩证法认为一切事物都作为过程而存在，世界是过程的集合体；形而上学则用孤立、静止、片面的观点看世界，把事物看作既成的、不变的。"},{"id":"20211-T9","fileId":"20211","source":"2020-2021学年第1学期 B卷 第9题","paper":"2020-2021学年第1学期 B卷","num":9,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"中国古代哲学家公孙龙“白马非马”之说的错误在于割裂了","options":[{"letter":"A","text":"内因和外因的关系"},{"letter":"B","text":"矛盾统一性和斗争性的关系"},{"letter":"C","text":"矛盾主要方面和次要方面的关系"},{"letter":"D","text":"矛盾的普遍性和特殊性的关系"}],"images":[],"answer":"D","analysis":"课本：矛盾的普遍性和特殊性（共性和个性）是辩证统一的，共性寓于个性之中。“白马”是个性，“马”是共性，白马非马论只看到二者的差别而否认其联系，割裂了矛盾的普遍性和特殊性的关系。"},{"id":"20211-T10","fileId":"20211","source":"2020-2021学年第1学期 B卷 第10题","paper":"2020-2021学年第1学期 B卷","num":10,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"面对消极腐败的东西，我们一定要提高警惕，做到见微知著，防微杜渐。因为","options":[{"letter":"A","text":"量变积累到一定程度就会引起质变"},{"letter":"B","text":"原因必然引起结果"},{"letter":"C","text":"外因通过内因而起作用"},{"letter":"D","text":"矛盾双方在一定条件下相互转化"}],"images":[],"answer":"A","analysis":"课本：量变质变规律告诉我们，量变是质变的必要准备，量变达到一定程度必然引起质变。“防微杜渐”就是要防止消极因素的量变积累引发质变，体现了方法论上对量变质变规律的运用。"},{"id":"20211-T11","fileId":"20211","source":"2020-2021学年第1学期 B卷 第11题","paper":"2020-2021学年第1学期 B卷","num":11,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"两条根本对立的认识路线是","options":[{"letter":"A","text":"可知论与不可知论"},{"letter":"B","text":"唯物辩证法与形而上学"},{"letter":"C","text":"唯物主义反映论与唯心主义先验论"},{"letter":"D","text":"能动革命的反映论与直观被动的反映论"}],"images":[],"answer":"C","analysis":"课本：在认识的本质问题上存在着两条根本对立的认识路线：一条是从物到感觉和思想的唯物主义反映论路线，一条是从思想和感觉到物的唯心主义先验论路线。"},{"id":"20211-T12","fileId":"20211","source":"2020-2021学年第1学期 B卷 第12题","paper":"2020-2021学年第1学期 B卷","num":12,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"马克思说：“搬运夫和哲学家之间的原始差别要比家犬和猎犬之间的差别小得多。他们之间的鸿沟是分工掘成的。”这表明人的才能","options":[{"letter":"A","text":"与人的先天生理素质没有关联"},{"letter":"B","text":"由人的社会政治地位决定"},{"letter":"C","text":"取决于人的主观努力的程度"},{"letter":"D","text":"主要来源于后天的实践"}],"images":[],"answer":"D","analysis":"课本：实践是认识的基础和来源。人的才能差别主要不是先天生理素质造成的，而是后天社会实践（分工）的产物，强调实践在人的认识和能力形成中的决定作用。A说法绝对化，B、C不符合题意。"},{"id":"20211-T13","fileId":"20211","source":"2020-2021学年第1学期 B卷 第13题","paper":"2020-2021学年第1学期 B卷","num":13,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"“真理是观念与主体感觉相符合”的看法是","options":[{"letter":"A","text":"形而上学的真理观"},{"letter":"B","text":"唯心主义真理观"},{"letter":"C","text":"辩证唯物主义真理观"},{"letter":"D","text":"机械唯物主义真理观"}],"images":[],"answer":"B","analysis":"课本：真理是标志主观与客观相符合的哲学范畴，其内容是客观的。把真理归结为“观念与主体感觉相符合”，以主观感觉作为真理的标准，否认了真理的客观性，是唯心主义真理观（如实用主义“有用即真理”一类的观点）。"},{"id":"20211-T14","fileId":"20211","source":"2020-2021学年第1学期 B卷 第14题","paper":"2020-2021学年第1学期 B卷","num":14,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"20世纪50年代，北大荒一片荒凉。由于人口剧增，生产力水平低下，吃饭问题成为中国面临的首要问题，于是人们不得不靠扩大耕地面积增加粮食产量，经过半个世纪的开垦，北大荒成了全国闻名的“北大仓”。然而由于过度开垦已经造成了许多生态问题。现在，黑龙江垦区全面停止开荒，退耕还“荒”。这说明","options":[{"letter":"A","text":"人与自然的和谐最终以恢复原始生态为归宿"},{"letter":"B","text":"人们改造自然的一切行为都会遭到“自然界的报复”"},{"letter":"C","text":"人们应合理地调节人与自然之间的物质变换"},{"letter":"D","text":"人在自然界面前总是处于被支配的地位"}],"images":[],"answer":"C","analysis":"课本：人类通过生产实践与自然界进行物质变换。人们应当合理地调节人与自然之间的物质变换，在尊重自然规律的前提下改造自然。从“北大荒”到“北大仓”再到退耕还“荒”，正体现了人与自然关系的合理调节。A、B、D均片面。"},{"id":"20211-T15","fileId":"20211","source":"2020-2021学年第1学期 B卷 第15题","paper":"2020-2021学年第1学期 B卷","num":15,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"“大众心理影响经济走势”这一社会现象蕴含的哲理是","options":[{"letter":"A","text":"社会意识决定社会存在"},{"letter":"B","text":"社会意识反作用于社会存在"},{"letter":"C","text":"社会心理左右社会发展方向"},{"letter":"D","text":"正确的社会意识才能影响社会发展"}],"images":[],"answer":"B","analysis":"课本：社会存在决定社会意识，社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。大众心理（社会心理）影响经济走势，正体现了社会意识对社会存在的反作用。A颠倒了二者关系，C夸大社会心理作用，D错误——落后的社会意识也影响社会发展。"},{"id":"20211-T16","fileId":"20211","source":"2020-2021学年第1学期 B卷 第16题","paper":"2020-2021学年第1学期 B卷","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"下列属于政治上层建筑的是","options":[{"letter":"A","text":"政治法律思想"},{"letter":"B","text":"政治法律制度"},{"letter":"C","text":"哲学"},{"letter":"D","text":"艺术"}],"images":[],"answer":"B","analysis":"课本：上层建筑由观念上层建筑（意识形态，如政治法律思想、道德、艺术、宗教、哲学等）和政治上层建筑（政治法律制度及设施和政治组织）两部分构成。政治法律制度属于政治上层建筑；政治法律思想、哲学、艺术属于观念上层建筑。"},{"id":"20211-T17","fileId":"20211","source":"2020-2021学年第1学期 B卷 第17题","paper":"2020-2021学年第1学期 B卷","num":17,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"对社会发展起决定作用的是","options":[{"letter":"A","text":"地理环境"},{"letter":"B","text":"人口因素"},{"letter":"C","text":"历史人物"},{"letter":"D","text":"生产方式"}],"images":[],"answer":"D","analysis":"课本：在社会物质生活条件中，地理环境和人口因素是社会存在和发展的必要条件，只能加速或延缓社会发展；物质生产方式才是社会历史发展的决定力量，决定社会的性质和面貌及社会形态的更替。"},{"id":"20211-T18","fileId":"20211","source":"2020-2021学年第1学期 B卷 第18题","paper":"2020-2021学年第1学期 B卷","num":18,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"马克思主义认为，人的本质属性是","options":[{"letter":"A","text":"社会属性"},{"letter":"B","text":"自然属性"},{"letter":"C","text":"永恒不变的"},{"letter":"D","text":"体现在人民群众身上的"}],"images":[],"answer":"A","analysis":"课本：马克思指出：“人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。”人的本质属性是社会属性，人的本质是具体的、历史的、发展变化的，不是永恒不变的。"},{"id":"20211-T19","fileId":"20211","source":"2020-2021学年第1学期 B卷 第19题","paper":"2020-2021学年第1学期 B卷","num":19,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"构成私有制商品经济基本矛盾的是","options":[{"letter":"A","text":"商品使用价值和价值的矛盾"},{"letter":"B","text":"具体劳动和抽象劳动的矛盾"},{"letter":"C","text":"私人劳动和社会劳动的矛盾"},{"letter":"D","text":"简单劳动与复杂劳动的矛盾"}],"images":[],"answer":"C","analysis":"课本：私人劳动和社会劳动的矛盾构成私有制商品经济的基本矛盾：它决定着商品经济的本质及其发展过程，是商品经济其他一切矛盾的基础，决定着商品生产者的命运。"},{"id":"20211-T20","fileId":"20211","source":"2020-2021学年第1学期 B卷 第20题","paper":"2020-2021学年第1学期 B卷","num":20,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"商品的价值量与生产商品所耗费的劳动时间成正比，与（ ）成反比","options":[{"letter":"A","text":"劳动量"},{"letter":"B","text":"劳动生产率"},{"letter":"C","text":"劳动强度"},{"letter":"D","text":"商品数量"}],"images":[],"answer":"B","analysis":"课本：单位商品的价值量与生产该商品所耗费的社会必要劳动时间成正比，与劳动生产率成反比。这是劳动价值论的基本原理。"},{"id":"20211-T21","fileId":"20211","source":"2020-2021学年第1学期 B卷 第21题","paper":"2020-2021学年第1学期 B卷","num":21,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"劳动力成为商品的两个条件，除了劳动者没有任何生产资料和生活资料，还有","options":[{"letter":"A","text":"劳动者是奴隶"},{"letter":"B","text":"劳动者是农民"},{"letter":"C","text":"劳动者是自由人"},{"letter":"D","text":"劳动者没有人身自由"}],"images":[],"answer":"C","analysis":"课本：劳动力成为商品必须具备两个条件：一是劳动者是自由人，能够把自己的劳动力当作自己的商品来支配；二是劳动者没有别的商品可以出卖，没有任何生产资料和生活资料。注意区分“劳动力”与“劳动者”。"},{"id":"20211-T22","fileId":"20211","source":"2020-2021学年第1学期 B卷 第22题","paper":"2020-2021学年第1学期 B卷","num":22,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义生产具有二重性，一方面它是物质资料的生产过程，另一方面它是生产剩余价值的过程，即","options":[{"letter":"A","text":"价值创造过程"},{"letter":"B","text":"价值形成过程"},{"letter":"C","text":"价值消费过程"},{"letter":"D","text":"价值增殖过程"}],"images":[],"answer":"D","analysis":"课本：资本主义生产过程是劳动过程和价值增殖过程的统一。价值增殖过程是剩余价值的生产过程，是资本主义生产方式的绝对规律；价值形成过程如果不超过一定点，就只是价值形成过程，超过这一点就成为价值增殖过程。"},{"id":"20211-T23","fileId":"20211","source":"2020-2021学年第1学期 B卷 第23题","paper":"2020-2021学年第1学期 B卷","num":23,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"绝对剩余价值生产和相对剩余价值生产","options":[{"letter":"A","text":"都是依靠延长工作日获得的"},{"letter":"B","text":"都是依靠提高劳动生产率获得的"},{"letter":"C","text":"都是依靠减少工人的必要劳动时间获得的"},{"letter":"D","text":"都是依靠增加工人的剩余劳动时间获得的"}],"images":[],"answer":"D","analysis":"课本：绝对剩余价值靠绝对延长工作日（增加剩余劳动时间）生产；相对剩余价值靠缩短必要劳动时间、相对延长剩余劳动时间生产。二者方式不同，但实质都是依靠增加工人的剩余劳动时间，体现了资本对劳动的剥削。"},{"id":"20211-T24","fileId":"20211","source":"2020-2021学年第1学期 B卷 第24题","paper":"2020-2021学年第1学期 B卷","num":24,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本主义生产过程中，直接导致相对过剩人口形成的是","options":[{"letter":"A","text":"人口增长速度超过资本增长速度"},{"letter":"B","text":"资本有机构成的提高"},{"letter":"C","text":"资本积累的增长"},{"letter":"D","text":"资本有机构成的下降"}],"images":[],"answer":"B","analysis":"课本：资本有机构成提高使可变资本比重相对下降，资本对劳动力的需求日益相对减少，直接导致相对过剩人口的形成。相对过剩人口是资本积累的必然产物，也是资本主义生产方式存在和发展的必要条件。"},{"id":"20211-T25","fileId":"20211","source":"2020-2021学年第1学期 B卷 第25题","paper":"2020-2021学年第1学期 B卷","num":25,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在产业资本循环的三个阶段中，购买阶段产业资本执行的是（ ）的职能","options":[{"letter":"A","text":"货币资本"},{"letter":"B","text":"生产资本"},{"letter":"C","text":"商品资本"},{"letter":"D","text":"流通资本"}],"images":[],"answer":"A","analysis":"课本：产业资本循环经历购买、生产、售卖三个阶段：购买阶段以货币资本职能购买劳动力和生产资料；生产阶段执行生产资本职能，生产剩余价值；售卖阶段执行商品资本职能，实现价值和剩余价值。"},{"id":"20211-T26","fileId":"20211","source":"2020-2021学年第1学期 B卷 第26题","paper":"2020-2021学年第1学期 B卷","num":26,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义工资的本质是","options":[{"letter":"A","text":"雇佣工人全部劳动的报酬"},{"letter":"B","text":"雇佣工人剩余劳动的报酬"},{"letter":"C","text":"雇佣工人劳动的价值或价格"},{"letter":"D","text":"雇佣工人劳动力的价值或价格"}],"images":[],"answer":"D","analysis":"课本：资本主义工资的本质是劳动力的价值或价格。工资在现象上表现为“劳动的价格”，掩盖了必要劳动与剩余劳动的界限，从而掩盖了剥削关系。劳动不是商品，没有价值。"},{"id":"20211-T27","fileId":"20211","source":"2020-2021学年第1学期 B卷 第27题","paper":"2020-2021学年第1学期 B卷","num":27,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"为了得到尽可能多的利润，不同生产部门的资本家之间展开激烈的竞争，大量资本必然从利润率低的部门转投到利润率高的部门，从而导致","options":[{"letter":"A","text":"资本集中到少数人手中"},{"letter":"B","text":"垄断利润的产生"},{"letter":"C","text":"利润率平均化"},{"letter":"D","text":"绝对剩余价值生产"}],"images":[],"answer":"C","analysis":"课本：部门之间的竞争引起资本在部门之间的转移，导致利润率平均化，形成平均利润率，价值转化为生产价格。资本集中到少数人手中是竞争和信用作用的结果，属于资本积聚与集中的范畴。"},{"id":"20211-T28","fileId":"20211","source":"2020-2021学年第1学期 B卷 第28题","paper":"2020-2021学年第1学期 B卷","num":28,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"垄断资本主义的产生并占统治地位是","options":[{"letter":"A","text":"资本原始积累的结果"},{"letter":"B","text":"争夺短缺资源的产物"},{"letter":"C","text":"生产和资本集中发展到一定程度的必然结果"},{"letter":"D","text":"资本主义国际竞争的结果"}],"images":[],"answer":"C","analysis":"课本：自由竞争引起生产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断。19世纪末20世纪初，垄断成为资本主义经济生活的基础，资本主义进入垄断阶段（帝国主义阶段）。"},{"id":"20211-T29","fileId":"20211","source":"2020-2021学年第1学期 B卷 第29题","paper":"2020-2021学年第1学期 B卷","num":29,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"（ ）的发展为经济全球化提供了适宜的企业组织形式","options":[{"letter":"A","text":"各国经济体制改革"},{"letter":"B","text":"科学技术"},{"letter":"C","text":"跨国公司"},{"letter":"D","text":"贸易保护思想"}],"images":[],"answer":"C","analysis":"课本：导致经济全球化迅猛发展的因素主要有三点，其中跨国公司的发展为经济全球化提供了适宜的企业组织形式，跨国公司在全球范围内利用各地优势组织生产，促进了生产要素的全球流动。"},{"id":"20211-T30","fileId":"20211","source":"2020-2021学年第1学期 B卷 第30题","paper":"2020-2021学年第1学期 B卷","num":30,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"19世纪末20世纪初，股份公司成为主要的企业组织形式，这时，（ ）取代私人资本所有制成为占主导地位的所有制形式","options":[{"letter":"A","text":"私人股份资本所有制"},{"letter":"B","text":"封建土地所有制"},{"letter":"C","text":"同业公会所有制"},{"letter":"D","text":"国家资本所有制"}],"images":[],"answer":"A","analysis":"课本：资本主义所有制经历了演变：资本主义初期以个人（私人）资本所有制为主导；19世纪末20世纪初私人股份资本所有制取代个人资本所有制占主导地位；二战后国家资本所有制和法人资本所有制相继崛起。"},{"id":"20211-T31","fileId":"20211","source":"2020-2021学年第1学期 B卷 第31题","paper":"2020-2021学年第1学期 B卷","num":31,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"multi","subtype":"","desc":"马克思主义产生的直接思想渊源是","options":[{"letter":"A","text":"德国古典哲学"},{"letter":"B","text":"英国古典政治经济学"},{"letter":"C","text":"法国英国的空想社会主义"},{"letter":"D","text":"文艺复兴思想"}],"images":[],"answer":"ABC","analysis":"课本导论：德国古典哲学、英国古典政治经济学、英法空想社会主义为马克思主义的创立提供了直接的理论来源。文艺复兴思想是更广泛意义上的人类思想文化成果，不属于三个直接理论来源。"},{"id":"20211-T32","fileId":"20211","source":"2020-2021学年第1学期 B卷 第32题","paper":"2020-2021学年第1学期 B卷","num":32,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"联系普遍性的含义包括","options":[{"letter":"A","text":"任何事物内部的不同部分和要素之间都是相互联系的"},{"letter":"B","text":"不同的联系构成事物内部和事物之间的存在状态和发展趋势"},{"letter":"C","text":"任何事物都不能孤立存在，都同其他事物处在一定的联系之中"},{"letter":"D","text":"整个世界是相互联系的统一整体"}],"images":[],"answer":"ACD","analysis":"课本：联系的普遍性有三层含义：事物内部不同部分和要素相互联系；任何事物都不能孤立存在；整个世界是相互联系的统一整体。B“不同的联系构成事物的存在状态和发展趋势”讲的是联系的多样性、条件性，不属于普遍性的含义。"},{"id":"20211-T33","fileId":"20211","source":"2020-2021学年第1学期 B卷 第33题","paper":"2020-2021学年第1学期 B卷","num":33,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"“是就是，否就否，除此之外，都是鬼话”，这一观点的错误在于","options":[{"letter":"A","text":"它对否定的理解是孤立的、片面的"},{"letter":"B","text":"它对肯定的理解是孤立的、片面的"},{"letter":"C","text":"它否定了肯定与否定的对立统一关系"},{"letter":"D","text":"它否认了事物发展的曲折性"}],"images":[],"answer":"ABC","analysis":"课本：辩证法认为肯定与否定是对立统一的，肯定中包含着否定，否定中包含着肯定。该观点把肯定与否定绝对对立起来，对肯定和否定的理解都是孤立、片面的，是形而上学的否定观。D与题干无直接关系。"},{"id":"20211-T34","fileId":"20211","source":"2020-2021学年第1学期 B卷 第34题","paper":"2020-2021学年第1学期 B卷","num":34,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"multi","subtype":"","desc":"辩证的否定观的基本内容是","options":[{"letter":"A","text":"否定是事物的自我否定，是事物内部矛盾运动的结果"},{"letter":"B","text":"否定是新事物对旧事物既批判又继承"},{"letter":"C","text":"否定是新事物对旧事物的完全否定"},{"letter":"D","text":"否定是新旧事物联系和发展的环节"}],"images":[],"answer":"ABD","analysis":"课本：辩证否定观的基本内容：否定是事物的自我否定，是事物内部矛盾运动的结果；否定是事物发展的环节和联系的环节；辩证否定的实质是“扬弃”，即新事物对旧事物既批判又继承。C“完全否定”是形而上学否定观。"},{"id":"20211-T35","fileId":"20211","source":"2020-2021学年第1学期 B卷 第35题","paper":"2020-2021学年第1学期 B卷","num":35,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"multi","subtype":"","desc":"割裂感性认识和理性认识的辩证统一会导致","options":[{"letter":"A","text":"诡辩论"},{"letter":"B","text":"经验论"},{"letter":"C","text":"唯理论"},{"letter":"D","text":"二元论"}],"images":[],"answer":"BC","analysis":"课本：感性认识和理性认识是辩证统一的。割裂二者的辩证统一，在实际工作中表现为经验主义和教条主义，在哲学理论上则表现为经验论（片面夸大感性认识）和唯理论（片面夸大理性认识）。"},{"id":"20211-T36","fileId":"20211","source":"2020-2021学年第1学期 B卷 第36题","paper":"2020-2021学年第1学期 B卷","num":36,"chapter":{"label":"导论","section":"四、马克思主义的当代价值","raw":"导论 · 四、马克思主义的当代价值"},"type":"multi","subtype":"","desc":"习近平新时代中国特色社会主义思想是","options":[{"letter":"A","text":"马克思主义中国化最新理论成果"},{"letter":"B","text":"党和人民实践经验和集体智慧的结晶"},{"letter":"C","text":"中国特色社会主义理论体系的重要组成部分"},{"letter":"D","text":"全党全国人民为实现中华民族伟大复兴而奋斗的行动指南"}],"images":[],"answer":"ABCD","analysis":"课本导论：习近平新时代中国特色社会主义思想是马克思主义中国化时代化的最新成果，是党和人民实践经验和集体智慧的结晶，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。四项均为标准表述。"},{"id":"20211-T37","fileId":"20211","source":"2020-2021学年第1学期 B卷 第37题","paper":"2020-2021学年第1学期 B卷","num":37,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"劳动力是任何社会生产的基本要素，在特定的社会发展阶段和特定的历史条件下，劳动力作为一种特殊商品，其价值的构成包括","options":[{"letter":"A","text":"维持劳动者自身生命所必需的生活资料的价值"},{"letter":"B","text":"劳动者在必要劳动时间内创造的价值"},{"letter":"C","text":"劳动者繁育后代所必需的生活资料的价值"},{"letter":"D","text":"培养和训练劳动者所需要的费用"}],"images":[],"answer":"ACD","analysis":"课本：劳动力商品的价值包括三部分：维持劳动者本人生存所必需的生活资料的价值；维持劳动者家属生存所必需的生活资料的价值；劳动者接受教育和训练所支出的费用。B“必要劳动时间内创造的价值”就是劳动力价值本身的再生产，不是其构成部分。"},{"id":"20211-T38","fileId":"20211","source":"2020-2021学年第1学期 B卷 第38题","paper":"2020-2021学年第1学期 B卷","num":38,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"影响资本积累规模大小的因素有","options":[{"letter":"A","text":"剩余价值率的高低"},{"letter":"B","text":"劳动生产率的高低"},{"letter":"C","text":"所用资本与所费资本之间的差额"},{"letter":"D","text":"资本家垫付资本的大小"}],"images":[],"answer":"ABCD","analysis":"课本：影响资本积累规模的因素有：对劳动力的剥削程度（剩余价值率）；社会劳动生产率的水平；所用资本和所费资本之间的差额；资本家预付资本的大小。四个选项均为课本所列因素。"},{"id":"20211-T39","fileId":"20211","source":"2020-2021学年第1学期 B卷 第39题","paper":"2020-2021学年第1学期 B卷","num":39,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"国家垄断资本主义对资本主义经济发展的积极作用有","options":[{"letter":"A","text":"在一定程度上促进了社会生产力的发展"},{"letter":"B","text":"解决了垄断资本主义内在矛盾的深化与尖锐"},{"letter":"C","text":"劳动人民的生活水平有所改善和提高"},{"letter":"D","text":"加快了这些国家国民经济的现代化进程"}],"images":[],"answer":"ACD","analysis":"课本：国家垄断资本主义在一定程度上促进了社会生产力的发展，加快了国民经济的现代化进程，劳动人民生活水平有所改善和提高。但国家垄断资本主义没有改变资本主义私有制，不可能解决（只能缓和）垄断资本主义的内在矛盾，B错误。"},{"id":"20211-T40","fileId":"20211","source":"2020-2021学年第1学期 B卷 第40题","paper":"2020-2021学年第1学期 B卷","num":40,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"multi","subtype":"","desc":"二战后，资本主义经济政治都发生了新变化。这些变化的主要表现除了生产资料所有制变化外，还包括","options":[{"letter":"A","text":"劳资关系和分配关系的变化"},{"letter":"B","text":"社会阶层和阶级结构的变化"},{"letter":"C","text":"经济调节机制和经济危机形态的变化"},{"letter":"D","text":"经济制度的变化"}],"images":[],"answer":"ABC","analysis":"课本：二战后资本主义新变化的主要表现：生产资料所有制的变化；劳资关系和分配关系的变化；社会阶层和阶级结构的变化；经济调节机制和经济危机形态的变化；政治制度的变化。这些变化是资本主义制度基本框架内的变化，资本主义经济制度的根本性质没有变，D错误。"},{"id":"21221-T1","fileId":"21221","source":"2021-2022学年第1学期 A卷 第1题","paper":"2021-2022学年第1学期 A卷","num":1,"chapter":{"label":"导论","section":"二、马克思主义的创立与发展","raw":"导论 · 二、马克思主义的创立与发展"},"type":"choice","subtype":"single","desc":"马克思一生的两个伟大发现是（）","options":[{"letter":"A","text":"唯物主义和辩证法"},{"letter":"B","text":"辩证法和剩余价值学说"},{"letter":"C","text":"唯物主义和剩余价值学说"},{"letter":"D","text":"唯物史观和剩余价值学说"}],"images":[],"answer":"D","analysis":"课本导论：马克思一生的两个伟大发现是唯物史观和剩余价值学说。正是这两大发现使社会主义从空想变为科学。唯物主义和辩证法在马克思之前已有思想成果，马克思的贡献在于将其结合并贯彻到社会历史领域。"},{"id":"21221-T2","fileId":"21221","source":"2021-2022学年第1学期 A卷 第2题","paper":"2021-2022学年第1学期 A卷","num":2,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"马克思主义首要的和基本的观点是（）","options":[{"letter":"A","text":"实践观点"},{"letter":"B","text":"世界统一于物质的观点"},{"letter":"C","text":"人民群众创造历史的观点"},{"letter":"D","text":"社会主义必然代替资本主义的观点"}],"images":[],"answer":"A","analysis":"课本：马克思主义哲学从实践出发理解社会生活，把实践观点作为首要的和基本的观点。实践性是马克思主义理论区别于其他理论的显著特征。"},{"id":"21221-T3","fileId":"21221","source":"2021-2022学年第1学期 A卷 第3题","paper":"2021-2022学年第1学期 A卷","num":3,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"我国东汉时期的思想家王充认为，人的形体和精神都是禀“气”而生的，“夫人所以生者，阴、阳气也。阴气主为骨肉，阳气主为精神”；人死则精气散灭，形体腐朽，不可能变为鬼。王充的观点属于（）","options":[{"letter":"A","text":"客观唯心主义"},{"letter":"B","text":"古代朴素唯物主义"},{"letter":"C","text":"近代形而上学唯物主义"},{"letter":"D","text":"辩证唯物主义"}],"images":[],"answer":"B","analysis":"课本：古代朴素唯物主义把世界的本原归结为一种或几种具体的物质形态（如气、水、火等），坚持了唯物主义的根本方向但缺乏科学论证。王充以“气”解释形体和精神，属于古代朴素唯物主义。"},{"id":"21221-T4","fileId":"21221","source":"2021-2022学年第1学期 A卷 第4题","paper":"2021-2022学年第1学期 A卷","num":4,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第一节 世界的多样性与物质统一性","raw":"第一章 世界的物质性及发展规律 · 第一节 世界的多样性与物质统一性"},"type":"choice","subtype":"single","desc":"1920年，人们在印度加尔各答的丛林中发现了一个由狼哺育的小女孩，为她取名卡玛拉。据记载，“狼孩”卡玛拉当时年龄约七八岁，但智力仅相当于六个月大的婴儿，在经过人类九年的抚养教育后，她的智力才上升到了三四岁孩子的水平。狼孩卡玛拉的事例说明（）","options":[{"letter":"A","text":"人的意识只是自然界长期发展的产物"},{"letter":"B","text":"社会实践在意识的产生和发展中起着决定性的作用"},{"letter":"C","text":"意识是人脑这样一种特殊物质的机能和属性"},{"letter":"D","text":"意识在内容上是客观的，在形式上是主观的"}],"images":[],"answer":"B","analysis":"课本：意识既是自然界长期发展的产物，更是社会历史发展的产物。社会实践特别是劳动在意识的产生和发展中起决定性作用。“狼孩”有人脑却无人的意识，说明离开社会实践，意识不能产生和发展。A“只是”表述错误。"},{"id":"21221-T5","fileId":"21221","source":"2021-2022学年第1学期 A卷 第5题","paper":"2021-2022学年第1学期 A卷","num":5,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"当前，新冠疫情起伏反复，病毒变异频繁。面对传染病大流行，中国倡导国际社会共同构建人类卫生健康共同体，团结合作、共克时艰。中国的主张从哲学上讲是因为（）","options":[{"letter":"A","text":"世界上的事物是多样的"},{"letter":"B","text":"世界是过程的集合体"},{"letter":"C","text":"世界是既成事物的集合体"},{"letter":"D","text":"世界是相互联系的统一整体"}],"images":[],"answer":"D","analysis":"课本：联系的普遍性表明，整个世界是相互联系的统一整体，任何事物都不能孤立存在。疫情是全球性挑战，各国命运相连，构建人类卫生健康共同体正是从世界普遍联系的整体出发的。C是形而上学观点。"},{"id":"21221-T6","fileId":"21221","source":"2021-2022学年第1学期 A卷 第6题","paper":"2021-2022学年第1学期 A卷","num":6,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"一百年来，党坚持把马克思主义写在自己的旗帜上，不断推进马克思主义中国化时代化，用博大胸怀吸收人类创造的一切优秀文明成果，用马克思主义中国化的科学理论引领伟大实践。马克思主义中国化时代化的哲学基础是（）","options":[{"letter":"A","text":"矛盾同一性和斗争性辩证关系的原理"},{"letter":"B","text":"矛盾普遍性和特殊性辩证关系的原理"},{"letter":"C","text":"主要矛盾和次要矛盾辩证关系的原理"},{"letter":"D","text":"矛盾的主要方面和次要方面辩证关系的原理"}],"images":[],"answer":"B","analysis":"课本：矛盾的普遍性和特殊性（共性和个性）辩证关系原理，是马克思主义普遍真理同各国具体实际相结合的哲学基础。马克思主义中国化时代化正是把马克思主义普遍真理（共性）同中国具体实际（个性）相结合。"},{"id":"21221-T7","fileId":"21221","source":"2021-2022学年第1学期 A卷 第7题","paper":"2021-2022学年第1学期 A卷","num":7,"chapter":{"label":"第一章 世界的物质性及发展规律","section":"第二节 事物的普遍联系和变化发展","raw":"第一章 世界的物质性及发展规律 · 第二节 事物的普遍联系和变化发展"},"type":"choice","subtype":"single","desc":"今天，我们比历史上任何时期都更接近、更有信心和能力实现中华民族伟大复兴的目标，但同时必须清醒认识到，中华民族伟大复兴绝不是轻轻松松、敲锣打鼓就能实现的，前进道路上仍然存在可以预料和难以预料的各种风险挑战。中华民族复兴的道路前途光明但又存在风险挑战，是下列哪个规律的生动体现（）","options":[{"letter":"A","text":"对立统一规律"},{"letter":"B","text":"量变质变规律"},{"letter":"C","text":"否定之否定规律"},{"letter":"D","text":"经济基础与上层建筑矛盾运动规律"}],"images":[],"answer":"C","analysis":"课本：否定之否定规律揭示了事物发展的方向和道路——前进性与曲折性的统一，事物发展是螺旋式上升、波浪式前进的。“前途光明、道路曲折”正是否定之否定规律的体现。方法论对应原理是本题分析的关键。"},{"id":"21221-T8","fileId":"21221","source":"2021-2022学年第1学期 A卷 第8题","paper":"2021-2022学年第1学期 A卷","num":8,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"香港、澳门回归祖国后，党中央审时度势，采取建立健全一系列法律制度和执行机制等举措，推动香港局势实现由乱到治的重大转折，为推进依法治港治澳、“一国两制”实践行稳致远打下了坚实基础。党中央的举措属于（）","options":[{"letter":"A","text":"物质生产实践"},{"letter":"B","text":"社会政治实践"},{"letter":"C","text":"科学文化实践"},{"letter":"D","text":"虚拟实践"}],"images":[],"answer":"B","analysis":"课本：实践的基本形式包括物质生产实践、社会政治实践和科学文化实践。社会政治实践是处理各种社会政治关系的实践，主要指人们的政治活动，与国家政权、政治制度、法律制度的建立和运行相联系。依法治港治澳的举措属于社会政治实践。"},{"id":"21221-T9","fileId":"21221","source":"2021-2022学年第1学期 A卷 第9题","paper":"2021-2022学年第1学期 A卷","num":9,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"“社会一旦有技术上的需要，这种需要就会比十所大学更能把科学推向前进。”这句话蕴含的认识论哲理是（）","options":[{"letter":"A","text":"实践是认识的来源"},{"letter":"B","text":"实践是认识发展的动力"},{"letter":"C","text":"实践是认识的目的"},{"letter":"D","text":"实践是检验认识真理性的标准"}],"images":[],"answer":"B","analysis":"课本：实践是认识发展的动力：实践不断产生新问题、提出新需要，推动人们进行新的探索和研究。“社会的技术需要推动科学发展”正体现了实践需要是认识（科学）发展的动力。"},{"id":"21221-T10","fileId":"21221","source":"2021-2022学年第1学期 A卷 第10题","paper":"2021-2022学年第1学期 A卷","num":10,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"唐朝诗人崔护《题都城南庄》：“去年今日此门中，人面桃花相映红。人面不知何处去，桃花依旧笑春风。”崔护作诗时脑海中浮现的“人面桃花相映红”，属于下列哪种认识形式（）","options":[{"letter":"A","text":"感觉"},{"letter":"B","text":"知觉"},{"letter":"C","text":"表象"},{"letter":"D","text":"判断"}],"images":[],"answer":"C","analysis":"课本：感性认识的三种形式：感觉（对事物个别属性的反映）、知觉（对事物整体形象的反映）、表象（对过去感知过的事物形象的回忆和再现）。作诗时“脑海中浮现”过去的景象，属于表象。判断属于理性认识。"},{"id":"21221-T11","fileId":"21221","source":"2021-2022学年第1学期 A卷 第11题","paper":"2021-2022学年第1学期 A卷","num":11,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"意大利人马可·波罗在中国看到用煤作燃料，大感惊奇，在他的《游记》中记录：“契丹（即中国）全境有一种黑石，采自山中，如同脉络，燃烧与薪无异，其火候且较薪为优，盖若夜燃火，次晨不息。其质优良，致使全境不燃他物。”据记载，中国早在西汉时期就已开发使用煤，但在很长时间里，煤的利用仅限于做饭、取暖、冶铁等很窄的范围内。近代以来随着科技和工业的发展，煤在民用、工业、科技等多方面的丰富用途被逐渐开发出来。煤的利用史反映了价值的下列哪个特征（）","options":[{"letter":"A","text":"主体性"},{"letter":"B","text":"客观性"},{"letter":"C","text":"多维性"},{"letter":"D","text":"社会历史性"}],"images":[],"answer":"D","analysis":"课本：价值具有社会历史性：价值关系中的主体和客体都是历史的、发展着的，价值随着主体实践能力、需要及历史条件的变化而变化。煤的用途随科技和历史发展而不断扩展，正体现价值的社会历史性。"},{"id":"21221-T12","fileId":"21221","source":"2021-2022学年第1学期 A卷 第12题","paper":"2021-2022学年第1学期 A卷","num":12,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"马克思说：“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。”这说明（）","options":[{"letter":"A","text":"生产力状况决定生产关系的性质"},{"letter":"B","text":"生产关系的变化决定生产力的发展"},{"letter":"C","text":"生产关系对生产力具有能动的反作用"},{"letter":"D","text":"生产关系一定要适合生产力的状况"}],"images":[],"answer":"A","analysis":"课本：这是课本原话引用的经典论断。生产工具是生产力发展水平的客观尺度，生产力状况决定生产关系的性质，有什么样的生产力就形成什么样的生产关系和社会。"},{"id":"21221-T13","fileId":"21221","source":"2021-2022学年第1学期 A卷 第13题","paper":"2021-2022学年第1学期 A卷","num":13,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"党的十一届三中全会以后，我国改革开放走过波澜壮阔的历程，取得举世瞩目的成就。随着实践发展，改革进入攻坚期和深水区。党中央深刻认识到，实践发展永无止境，解放思想永无止境，改革开放也永无止境，改革只有进行时、没有完成时，必须以更大的政治勇气和智慧推进全面深化改革，有效破除各方面体制机制弊端。关于中国的社会主义改革，下列认识错误的是（）","options":[{"letter":"A","text":"社会主义社会也需要经常进行改革"},{"letter":"B","text":"它是社会主义制度的自我完善和自我发展"},{"letter":"C","text":"它是同一种社会形态发展过程中的量变和部分质变"},{"letter":"D","text":"其实质是用新的社会制度代替旧的社会制度"}],"images":[],"answer":"D","analysis":"课本：改革是社会发展的直接动力，是社会主义制度的自我完善和自我发展，是在同一种社会形态范围内的量变和部分质变，不是用一种社会制度代替另一种社会制度（那是社会革命的实质）。D说法错误，符合题意。"},{"id":"21221-T14","fileId":"21221","source":"2021-2022学年第1学期 A卷 第14题","paper":"2021-2022学年第1学期 A卷","num":14,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"工业污染、基因歧视、网络诈骗……科学技术在运用于社会时遇到了越来越突出的问题，这警示人们（）","options":[{"letter":"A","text":"科学技术的发展实际上意味着人类改造自然能力的削弱"},{"letter":"B","text":"科学技术是资产阶级剥削压迫人民的工具"},{"letter":"C","text":"科学技术已经完全“表现为异己的、敌对的和统治的权力”"},{"letter":"D","text":"应建立合理的社会制度保障科学技术的正确运用"}],"images":[],"answer":"D","analysis":"课本：科学技术的社会作用具有两重性。科技运用中出现的问题主要由社会制度和运用方式造成，应当建立合理的社会制度保障科技的正确运用，使科技造福人类。A、B、C都是对科技作用的片面或错误理解。"},{"id":"21221-T15","fileId":"21221","source":"2021-2022学年第1学期 A卷 第15题","paper":"2021-2022学年第1学期 A卷","num":15,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"中国共产党百年奋斗的历史经验之一，是坚持人民至上。坚持人民至上也是下列哪个哲学观念的必然要求（）","options":[{"letter":"A","text":"少数英雄人物是历史的创造者"},{"letter":"B","text":"人民群众是历史的创造者"},{"letter":"C","text":"人的本质是一切社会关系的总和"},{"letter":"D","text":"整体的社会历史是个体的历史的堆砌"}],"images":[],"answer":"B","analysis":"课本：唯物史观认为人民群众是历史的创造者，是社会物质财富和精神财富的创造者，是社会变革的决定力量。坚持人民至上正是人民群众是历史创造者原理在实践中的必然要求。A是英雄史观。"},{"id":"21221-T16","fileId":"21221","source":"2021-2022学年第1学期 A卷 第16题","paper":"2021-2022学年第1学期 A卷","num":16,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"choice","subtype":"single","desc":"习近平说：“不能用今天的时代条件、发展水平、认识水平去衡量和要求前人，不能苛求前人干出只有后人才能干出的业绩来。”这提示我们，评价历史人物应采用哪种方法（）","options":[{"letter":"A","text":"历史分析方法"},{"letter":"B","text":"阶级分析方法"},{"letter":"C","text":"矛盾分析方法"},{"letter":"D","text":"创新思维方法"}],"images":[],"answer":"A","analysis":"课本：评价历史人物要坚持历史分析方法和阶级分析方法。历史分析方法要求从特定的历史背景出发，把历史人物置于当时的历史条件下加以考察，不能用今天的标准苛求前人。"},{"id":"21221-T17","fileId":"21221","source":"2021-2022学年第1学期 A卷 第17题","paper":"2021-2022学年第1学期 A卷","num":17,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"马克思通过对资本主义生产中价值增殖过程的分析，把雇佣工人的劳动时间分为（）","options":[{"letter":"A","text":"生产使用价值的时间和生产价值的时间"},{"letter":"B","text":"转移旧价值的时间和创造新价值的时间"},{"letter":"C","text":"生产生产资料的时间和生产剩余价值的时间"},{"letter":"D","text":"生产劳动力的时间和生产剩余价值的时间"}],"images":[],"answer":"D","analysis":"课本：在价值增殖过程中，雇佣工人的劳动时间分为两部分：必要劳动时间（用于再生产劳动力价值的时间）和剩余劳动时间（无偿为资本家生产剩余价值的时间）。这一区分揭示了剩余价值的来源和资本主义剥削的秘密。"},{"id":"21221-T18","fileId":"21221","source":"2021-2022学年第1学期 A卷 第18题","paper":"2021-2022学年第1学期 A卷","num":18,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"某钢铁企业因铁矿石价格上涨，增加了该厂的预付资本数量，这使得该厂的资本结构发生了变化，所变化的资本构成是（）","options":[{"letter":"A","text":"资本技术构成"},{"letter":"B","text":"资本价值构成"},{"letter":"C","text":"资本物质构成"},{"letter":"D","text":"资本有机构成"}],"images":[],"answer":"B","analysis":"课本：资本的技术构成由生产技术水平决定（生产资料与劳动力的比例）；资本的价值构成是不变资本与可变资本的价值比例；由技术构成决定并反映技术构成变化的价值构成叫资本的有机构成。铁矿石涨价并未改变生产技术水平，只是改变了资本的价值构成。注意区分四个概念。"},{"id":"21221-T19","fileId":"21221","source":"2021-2022学年第1学期 A卷 第19题","paper":"2021-2022学年第1学期 A卷","num":19,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"马克思把商品转换成货币称为“商品的惊险跳跃”，如果这个跳跃不成功，摔坏的不是商品，但一定是商品占有者。这是因为只有商品变为货币（）","options":[{"letter":"A","text":"货币才能转化为资本"},{"letter":"B","text":"价值才能转化为使用价值"},{"letter":"C","text":"抽象劳动才能转化为具体劳动"},{"letter":"D","text":"私人劳动才能转化为社会劳动"}],"images":[],"answer":"D","analysis":"课本：在私有制商品经济中，商品生产者的劳动直接表现为私人劳动，只有商品成功卖出（换成货币），其劳动才被社会承认，私人劳动才能转化为社会劳动。“惊险的跳跃”不成功，商品生产者的私人劳动得不到社会承认，就会亏本破产。"},{"id":"21221-T20","fileId":"21221","source":"2021-2022学年第1学期 A卷 第20题","paper":"2021-2022学年第1学期 A卷","num":20,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"二战后，占主导地位的资本主义生产资料所有制是（）","options":[{"letter":"A","text":"私人资本所有制"},{"letter":"B","text":"私人股份资本所有制"},{"letter":"C","text":"国家资本所有制"},{"letter":"D","text":"法人资本所有制"}],"images":[],"answer":"D","analysis":"课本：二战后资本主义所有制发生新变化：国家资本所有制形成并发挥重要作用，法人资本所有制崛起并成为居主导地位的资本所有制形式。"},{"id":"21221-T21","fileId":"21221","source":"2021-2022学年第1学期 A卷 第21题","paper":"2021-2022学年第1学期 A卷","num":21,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"choice","subtype":"single","desc":"生产和资本集中是（）","options":[{"letter":"A","text":"垄断发展的结果"},{"letter":"B","text":"大企业所占比重不断增加的结果"},{"letter":"C","text":"资本家追求剩余价值的结果"},{"letter":"D","text":"越来越多的资本为少数大资本家所支配的结果"}],"images":[],"answer":"C","analysis":"课本：资本家为了追求更多的剩余价值并在竞争中取胜，必然不断扩大生产规模、吞并中小企业，从而引起生产集中和资本集中。生产集中和资本集中是资本家追求剩余价值的结果，其发展到一定阶段引起垄断（因果顺序不能颠倒）。"},{"id":"21221-T22","fileId":"21221","source":"2021-2022学年第1学期 A卷 第22题","paper":"2021-2022学年第1学期 A卷","num":22,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"货币的本质是（）","options":[{"letter":"A","text":"商品交换的媒介"},{"letter":"B","text":"商品价值的一般等价物"},{"letter":"C","text":"商品的等价物"},{"letter":"D","text":"商品的相对价值形式"}],"images":[],"answer":"B","analysis":"课本：货币是商品交换发展到一定阶段的产物，是固定充当一般等价物的特殊商品，其本质是商品价值的一般等价物，体现商品生产者之间的社会经济关系。A只是货币的流通手段职能。"},{"id":"21221-T23","fileId":"21221","source":"2021-2022学年第1学期 A卷 第23题","paper":"2021-2022学年第1学期 A卷","num":23,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"作为价值实体的劳动是（）","options":[{"letter":"A","text":"具体劳动"},{"letter":"B","text":"抽象劳动"},{"letter":"C","text":"简单劳动"},{"letter":"D","text":"复杂劳动"}],"images":[],"answer":"B","analysis":"课本：劳动二重性理论指出，具体劳动创造商品的使用价值，抽象劳动（撇开具体形式的无差别的一般人类劳动）形成商品的价值实体，是价值的唯一源泉。原答案图此处OCR为A，与课本不符，已按课本更正为B。"},{"id":"21221-T24","fileId":"21221","source":"2021-2022学年第1学期 A卷 第24题","paper":"2021-2022学年第1学期 A卷","num":24,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"马克思指出：“如果物没有用，那么其中包含的劳动也就没有用，不能算作劳动，因此不形成价值。”这段话说明（）","options":[{"letter":"A","text":"价值的存在以物的有用性为前提"},{"letter":"B","text":"价值的存在与物的有用性互为前提"},{"letter":"C","text":"只要物是有用的，它就有价值"},{"letter":"D","text":"物越是有用就越有价值"}],"images":[],"answer":"A","analysis":"课本：使用价值是价值的物质承担者。一个物如果没有用（没有使用价值），其中包含的劳动也不能形成价值，即价值的存在以物的有用性为前提。但有使用价值的物不一定有价值（如空气），二者不是互为前提，B、C、D均错误。"},{"id":"21221-T25","fileId":"21221","source":"2021
