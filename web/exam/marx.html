认识论之第一的和基本的观点是","options":[{"letter":"A","text":"物质决定意识"},{"letter":"B","text":"实践"},{"letter":"C","text":"世界是可知的"},{"letter":"D","text":"对立统一"}],"images":[],"answer":"B","analysis":"课本第二章讲实践对认识的决定作用时，引《实践论》的话说，实践的观点是辩证唯物论的认识论之第一的和基本的观点。之所以第一，是因为实践是认识的基础：它既是认识的来源和动力，又是认识的目的和检验真理的唯一标准。A回答的是世界本原问题，是一切唯物论的共通前提；C是可知论与不可知论的分界；D是辩证法的实质和核心。"},{"id":"MARX-SELECTED-QYK-0055","fileId":"MARX-SELECTED","source":"精选练习题 第72题（QYK-0055）","paper":"精选练习题","num":72,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"辩证唯物主义认识论认为，认识的本质是","options":[{"letter":"A","text":"人的认识是主观自生的"},{"letter":"B","text":"认识是主体在实践基础上对客体的能动反映"},{"letter":"C","text":"认识是照镜子似的反射活动"},{"letter":"D","text":"认识是先于人的实践经验的东西"}],"images":[],"answer":"B","analysis":"课本第二章指出，认识的本质是主体在实践基础上对客体的能动反映：它要以客观事物为原型和摹本，又包含在实践中透过现象把握本质、在观念中分解加工对象的创造方面。A主观自生、D先于实践经验，都是否认认识来源于实践的唯心主义先验论；C照镜子似的直观反射是旧唯物主义反映论的缺陷，恰恰丢掉了能动性和创造性。"},{"id":"MARX-SELECTED-QYK-0058","fileId":"MARX-SELECTED","source":"精选练习题 第73题（QYK-0058）","paper":"精选练习题","num":73,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第一节 实践与认识","raw":"第二章 实践与认识及其发展规律 · 第一节 实践与认识"},"type":"choice","subtype":"single","desc":"“我们的实践证明：感觉到了的东西，我们不能立刻理解它，只有理解了的东西才更深刻地感觉它。”这一观点属于","options":[{"letter":"A","text":"主观唯心主义"},{"letter":"B","text":"客观唯心主义"},{"letter":"C","text":"辩证唯物主义"},{"letter":"D","text":"形而上学唯物主义"}],"images":[],"answer":"C","analysis":"这句话出自毛泽东《实践论》。课本第二章引它来说明感性认识与理性认识相互渗透：一方面承认感觉是认识的起点，这是唯物论；另一方面强调只有理解了的东西才能更深刻地感觉它，认识要上升到理性并反过来深化感性，这是辩证法。A、B否认认识源于客观实在，D只讲直观的感性反映、说不清感性与理性的辩证转化，都不合此意。"},{"id":"MARX-SELECTED-QYK-0060","fileId":"MARX-SELECTED","source":"精选练习题 第74题（QYK-0060）","paper":"精选练习题","num":74,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"真理的本质属性是","options":[{"letter":"A","text":"绝对性"},{"letter":"B","text":"相对性"},{"letter":"C","text":"客观性"},{"letter":"D","text":"一元性"}],"images":[],"answer":"C","analysis":"课本第二章讲真理的客观性：真理的内容是对客观事物及其规律的正确反映，包含着不依赖于人的意识的客观内容，所以客观性是真理的本质属性；真理的形式虽属主观，却不决定它是否为真理。A、B是真理发展过程中的两种属性，D一元性指同一对象的真理只有一个，二者都以客观性为前提。"},{"id":"MARX-SELECTED-QYK-0062","fileId":"MARX-SELECTED","source":"精选练习题 第75题（QYK-0062）","paper":"精选练习题","num":75,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"真理的绝对性是指","options":[{"letter":"A","text":"真理主客观统一的确定性"},{"letter":"B","text":"人类认识无需扩展"},{"letter":"C","text":"人类认识发展的无限性"},{"letter":"D","text":"人类认识无需深化"}],"images":[],"answer":"AC","analysis":"真理的绝对性有两层含义：一是任何真理都同谬误有原则界限，都包含不依赖于主体的客观内容，这种主客观统一的确定性是绝对的；二是人类认识按其本性能够正确认识无限发展着的物质世界，每前一步都是对它的接近，这种发展的无限性也是绝对的，故A、C。B、D称认识无需扩展、无需深化，等于否认真理的相对性。"},{"id":"MARX-SELECTED-QYK-0063","fileId":"MARX-SELECTED","source":"精选练习题 第76题（QYK-0063）","paper":"精选练习题","num":76,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"真理的相对性是指","options":[{"letter":"A","text":"人类认识的广度总是有限度的"},{"letter":"B","text":"人类认识反映事物的深度是有限度的"},{"letter":"C","text":"真理里也有谬误的成分"},{"letter":"D","text":"谬误和真理的界限是模糊的"}],"images":[],"answer":"AB","analysis":"课本第二章讲，真理的相对性是指一定条件下的正确认识总是有限度的、不完善的：就广度看，任何真理只是对客观世界某一阶段、某一部分的认识，认识有待扩展；就深度看，任何真理只是对特定对象一定层次的认识，认识有待深化。A、B正是这两层含义。C、D把认识的有限度说成真理包含谬误，但在确定范围内，真理与谬误的界限分明而非模糊。"},{"id":"MARX-SELECTED-QYK-0064","fileId":"MARX-SELECTED","source":"精选练习题 第77题（QYK-0064）","paper":"精选练习题","num":77,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"把人类认识之旅中的“里程碑”当成“终点站”，是（ ）的表现。","options":[{"letter":"A","text":"绝对主义"},{"letter":"B","text":"诡辩论"},{"letter":"C","text":"相对主义"},{"letter":"D","text":"独断论"}],"images":[],"answer":"AD","analysis":"课本第二章指出，割裂真理的绝对性与相对性会走向形而上学的真理观。绝对主义又称独断论，它片面夸大绝对性、否认真理是发展的，把阶段性认识凝固化，正是把“里程碑”当“终点站”，A、D是同一错误的两种名称，都入选。相对主义相反，借口真理会变而抹杀其客观内容，由此滑向主观真理论、不可知论和诡辩论，故B、C落选。"},{"id":"MARX-SELECTED-QYK-0066","fileId":"MARX-SELECTED","source":"精选练习题 第78题（QYK-0066）","paper":"精选练习题","num":78,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"实践之所以能够作为检验真理的唯一标准，这是由","options":[{"letter":"A","text":"实践的自觉能动性决定的"},{"letter":"B","text":"真理的本性和实践的特点决定的"},{"letter":"C","text":"真理的绝对性和相对性决定的"},{"letter":"D","text":"实践标准的确定性与不确定性决定的"}],"images":[],"answer":"B","analysis":"课本第二章指出，实践之所以能够作为检验真理的唯一标准，是由真理的本性和实践的特点决定的：真理在于主观认识与客观实际相符合，检验这种符合只能靠把二者连接起来的实践，而实践具有直接现实性。A只说到实践的自觉能动性这一个特点，C讲真理的绝对性与相对性，D讲实践标准自身的确定与不确定，都不是它成为唯一标准的根据。"},{"id":"MARX-SELECTED-QYK-0068","fileId":"MARX-SELECTED","source":"精选练习题 第79题（QYK-0068）","paper":"精选练习题","num":79,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"choice","subtype":"single","desc":"实践作为检验真理的标准是","options":[{"letter":"A","text":"确定性与不确定性的统一"},{"letter":"B","text":"唯一性和最终性的统一"},{"letter":"C","text":"归根到底性和绝对性的统一"},{"letter":"D","text":"相对性与条件性的统一"}],"images":[],"answer":"A","analysis":"课本第二章引列宁的论述指出，实践标准实质上决不能完全地证实或驳倒人类的任何表象。它确定，因为能够检验认识真理性的只有实践，并由它作出最终裁决；它又不确定，因为任何具体实践都受历史条件限制，检验是个不断反复的过程。所以实践标准是确定性与不确定性的统一。B、C把它看作一次完成，D则只讲相对性。"},{"id":"MARX-SELECTED-QYK-0071","fileId":"MARX-SELECTED","source":"精选练习题 第80题（QYK-0071）","paper":"精选练习题","num":80,"chapter":{"label":"第二章 实践与认识及其发展规律","section":"第二节 真理与价值","raw":"第二章 实践与认识及其发展规律 · 第二节 真理与价值"},"type":"multi","subtype":"","desc":"我国社会主义核心价值观的基本内容包括","options":[{"letter":"A","text":"富强、民主、文明、和谐"},{"letter":"B","text":"自由、平等、公正、法治"},{"letter":"C","text":"爱国、敬业、诚信、友善"},{"letter":"D","text":"繁荣、稳定、法制、环保"}],"images":[],"answer":"ABC","analysis":"课本第二章讲价值观与核心价值观时列出，社会主义核心价值观的基本内容是富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善，依次回答建设什么样的国家、什么样的社会、培育什么样的公民，A、B、C合起来正是这十二个概念。D不是教材的规范表述，“法制”尤易与“法治”混用，法治才是其中的正确提法。"},{"id":"MARX-SELECTED-QYK-0075","fileId":"MARX-SELECTED","source":"精选练习题 第81题（QYK-0075）","paper":"精选练习题","num":81,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"社会意识的相对独立性主要表现在","options":[{"letter":"A","text":"社会存在决定社会意识"},{"letter":"B","text":"社会意识与社会存在发展具有不完全同步性和不平衡性"},{"letter":"C","text":"社会意识内部各种形式之间存在相互影响且各自具有历史继承性"},{"letter":"D","text":"社会意识对社会存在具有能动的反作用"}],"images":[],"answer":"BCD","analysis":"课本第三章指出，社会意识的相对独立性是说它在根本上受社会存在决定的同时，还有自身特有的发展规律，主要有三条：与社会存在发展具有不完全同步性和不平衡性；内部诸形式相互影响并各有历史继承性；对社会存在有能动的反作用，这是突出表现。B、C、D 对应这三条。A 是社会存在的决定作用，恰是独立性所相对的前提，不是其表现。"},{"id":"MARX-SELECTED-QYK-0077","fileId":"MARX-SELECTED","source":"精选练习题 第82题（QYK-0077）","paper":"精选练习题","num":82,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在生产关系中，最基本的是","options":[{"letter":"A","text":"产品分配关系"},{"letter":"B","text":"生产资料所有制关系"},{"letter":"C","text":"生产中人与人的关系"},{"letter":"D","text":"政治关系"}],"images":[],"answer":"B","analysis":"课本第三章指出，生产关系包括生产资料所有制关系、生产中人与人的关系和产品分配关系，其中所有制关系是最基本的、具有决定意义的方面：它是物质资料生产的前提，生产、分配和消费关系在很大程度上由它决定，它还是区分不同生产方式、判定社会经济结构性质的客观依据。A、C由所有制派生并反作用于它，D政治关系属于上层建筑。"},{"id":"MARX-SELECTED-QYK-0078","fileId":"MARX-SELECTED","source":"精选练习题 第83题（QYK-0078）","paper":"精选练习题","num":83,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"生产力的基本要素包括","options":[{"letter":"A","text":"劳动者"},{"letter":"B","text":"劳动生产率"},{"letter":"C","text":"劳动资料"},{"letter":"D","text":"劳动对象"}],"images":[],"answer":"ACD","analysis":"课本第三章把生产力看作结构复杂的系统，其基本要素是劳动资料即劳动手段、劳动对象和劳动者：劳动资料中最重要的是生产工具，它是区分社会经济时代的客观依据；劳动对象是现实生产的必要前提；劳动者是生产力中最活跃的因素。B劳动生产率只是反映劳动有效程度、产出与耗费对比的指标，用来说明生产力发展水平，本身不是生产力系统的实体要素。"},{"id":"MARX-SELECTED-QYK-0079","fileId":"MARX-SELECTED","source":"精选练习题 第84题（QYK-0079）","paper":"精选练习题","num":84,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"生产关系是人们在物质生产过程中形成的不以人的意志为转移的","options":[{"letter":"A","text":"政治关系"},{"letter":"B","text":"经济关系"},{"letter":"C","text":"思想关系"},{"letter":"D","text":"社会关系"}],"images":[],"answer":"B","analysis":"课本第三章把生产关系定义为物质生产过程中形成、不以人的意志为转移的经济关系，B是这一界定用语。D社会关系最易混：教材只说生产关系是社会关系中最基本的部分，政治、家庭、宗教等其他社会关系都受它支配，笼统答成社会关系便失去确定性；A政治关系和C思想关系恰恰属于被生产关系制约的层面。"},{"id":"MARX-SELECTED-QYK-0081","fileId":"MARX-SELECTED","source":"精选练习题 第85题（QYK-0081）","paper":"精选练习题","num":85,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"经济基础的实质是","options":[{"letter":"A","text":"社会一定发展阶段上的基本经济制度"},{"letter":"B","text":"国家政权"},{"letter":"C","text":"经济体制"},{"letter":"D","text":"市场经济"}],"images":[],"answer":"A","analysis":"课本第三章：经济基础是一定发展阶段生产力所决定的生产关系的总和，占支配地位的生产关系决定社会性质，其实质就是该阶段的基本经济制度。B国家政权属于政治上层建筑，并非经济基础；C经济体制是基本经济制度采取的组织形式和管理形式，是生产关系的具体实现形式；D市场经济只是资源配置方式。"},{"id":"MARX-SELECTED-QYK-0082","fileId":"MARX-SELECTED","source":"精选练习题 第86题（QYK-0082）","paper":"精选练习题","num":86,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"choice","subtype":"single","desc":"在整个上层建筑中，居于主导地位。","options":[{"letter":"A","text":"政治法律思想"},{"letter":"B","text":"观念上层建筑"},{"letter":"C","text":"意识形态"},{"letter":"D","text":"政治上层建筑"}],"images":[],"answer":"D","analysis":"课本第三章把上层建筑分成两部分：观念上层建筑即意识形态，含政治法律思想、道德、艺术、宗教、哲学等；政治上层建筑指政治法律制度、设施和政权组织等，其中政治上层建筑居于主导地位，国家政权又是它的核心，故选D。B与C同指观念部分，A只是观念上层建筑里的一项，都不占主导地位。"},{"id":"MARX-SELECTED-QYK-0086","fileId":"MARX-SELECTED","source":"精选练习题 第87题（QYK-0086）","paper":"精选练习题","num":87,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第一节 人类社会的存在与发展","raw":"第三章 人类社会及其发展规律 · 第一节 人类社会的存在与发展"},"type":"multi","subtype":"","desc":"社会形态包括社会的，是三者具体的、历史的统一。","options":[{"letter":"A","text":"经济形态"},{"letter":"B","text":"政治形态"},{"letter":"C","text":"意识形态"},{"letter":"D","text":"非意识形态"}],"images":[],"answer":"ABC","analysis":"课本第三章指出，社会形态是同生产力发展一定阶段相适应的经济基础与上层建筑的统一体，包括社会的经济形态、政治形态和意识形态，是三者具体的、历史的统一，其中经济形态是社会形态的基础，所有制关系具有决定意义。D不选：非意识形态只是社会意识内部按是否属于上层建筑所作的划分，并不构成社会形态的一个方面。"},{"id":"MARX-SELECTED-QYK-0087","fileId":"MARX-SELECTED","source":"精选练习题 第88题（QYK-0087）","paper":"精选练习题","num":88,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"社会基本矛盾是指","options":[{"letter":"A","text":"生产力和生产关系的矛盾"},{"letter":"B","text":"生产力和生产关系、经济基础和上层建筑的矛盾"},{"letter":"C","text":"社会存在和社会意识的矛盾"},{"letter":"D","text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}],"images":[],"answer":"B","analysis":"课本第三章说，社会基本矛盾是贯穿社会发展过程始终、规定社会发展的基本性质和总趋势、并对历史发展起根本推动作用的矛盾，它就是生产力与生产关系、经济基础与上层建筑这两对矛盾，故B正确。A只列了一对，不完整；C是社会历史观的基本问题；D是新时代我国社会的主要矛盾，属特定时期的矛盾，不是贯穿始终的基本矛盾。"},{"id":"MARX-SELECTED-QYK-0088","fileId":"MARX-SELECTED","source":"精选练习题 第89题（QYK-0088）","paper":"精选练习题","num":89,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"multi","subtype":"","desc":"社会基本结构主要包括","options":[{"letter":"A","text":"经济结构"},{"letter":"B","text":"生产结构"},{"letter":"C","text":"政治结构"},{"letter":"D","text":"观念结构"}],"images":[],"answer":"ACD","analysis":"课本第三章指出，生产力和生产关系、经济基础和上层建筑这两对矛盾规定并反映了社会的基本结构，社会基本结构主要包括经济结构、政治结构和观念结构，故选ACD。其中经济结构是广义的，指包含生产力和生产关系两方面的生产方式。B“生产结构”并非课本使用的概念，生产方面的内容已经归入经济结构，不能再单列为并列的一项。"},{"id":"MARX-SELECTED-QYK-0090","fileId":"MARX-SELECTED","source":"精选练习题 第90题（QYK-0090）","paper":"精选练习题","num":90,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"人类社会发展和进步的最终决定力量是","options":[{"letter":"A","text":"生产力"},{"letter":"B","text":"生产关系"},{"letter":"C","text":"经济基础"},{"letter":"D","text":"上层建筑"}],"images":[],"answer":"A","analysis":"课本第三章讲社会基本矛盾的作用时指出，生产力是社会基本矛盾运动中最基本的动力因素，是人类社会发展和进步的最终决定力量：它决定生产关系的性质，并归根到底决定其他社会关系的基本面貌，B、C、D都处于被决定的一面。注意区分几个提法：社会基本矛盾是历史发展的根本动力，阶级斗争是阶级社会的直接动力，生产力才是最终决定力量。"},{"id":"MARX-SELECTED-QYK-0091","fileId":"MARX-SELECTED","source":"精选练习题 第91题（QYK-0091）","paper":"精选练习题","num":91,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"中国特色社会主义进入新时代的重要标志和依据是","options":[{"letter":"A","text":"我国仍处于社会主义初级阶段"},{"letter":"B","text":"我国社会主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾"},{"letter":"C","text":"我国社会生产力水平显著提高"},{"letter":"D","text":"我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}],"images":[],"answer":"D","analysis":"课本第三章讲社会主要矛盾及其转化时指出，主要矛盾变化会使社会发展呈现新的阶段性特点。进入新时代，我国社会主要矛盾由物质文化需要同落后的社会生产之间的矛盾，转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，这一变化正是把握新时代的钥匙。B是转化前的旧提法，A是必须立足的基本国情，C只是矛盾转化的条件。"},{"id":"MARX-SELECTED-QYK-0092","fileId":"MARX-SELECTED","source":"精选练习题 第92题（QYK-0092）","paper":"精选练习题","num":92,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"是社会基本矛盾在阶级社会中的表现，是阶级社会发展的直接动力。","options":[{"letter":"A","text":"社会革命"},{"letter":"B","text":"社会改革"},{"letter":"C","text":"阶级斗争"},{"letter":"D","text":"经济利益冲突"}],"images":[],"answer":"C","analysis":"课本第三章第二节指出，阶级斗争是阶级利益根本冲突的对抗阶级之间的对立和斗争，是社会基本矛盾在阶级社会中的表现，是阶级社会发展的直接动力。A 社会革命是社会基本矛盾引起的广泛而深刻的社会变革，主要推动社会形态更替；B 改革是同一社会制度自我完善的重要动力；D 经济利益冲突是阶级斗争围绕的轴心，不是这一规定本身。"},{"id":"MARX-SELECTED-QYK-0093","fileId":"MARX-SELECTED","source":"精选练习题 第93题（QYK-0093）","paper":"精选练习题","num":93,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"multi","subtype":"","desc":"阶级分析方法要求","options":[{"letter":"A","text":"全面、动态地分析阶级状况"},{"letter":"B","text":"分析各阶级的经济地位、政治立场和意识形态"},{"letter":"C","text":"准确把握各阶级之间的关系和阶级力量的对比及其变化"},{"letter":"D","text":"把握社会运动和社会生活的脉搏"}],"images":[],"answer":"ABCD","analysis":"课本第三章讲，阶级分析方法就是运用马克思主义的阶级和阶级斗争观点去观察阶级社会的现象。它要求全面而不是孤立、动态而不是静止地分析阶级状况，分析各阶级的经济地位、政治立场和意识形态，准确把握各阶级之间的关系和力量对比及其变化，进而把握社会运动和社会生活的脉搏。四项环环相扣，是政党制定路线方针政策的依据，故全选。"},{"id":"MARX-SELECTED-QYK-0094","fileId":"MARX-SELECTED","source":"精选练习题 第94题（QYK-0094）","paper":"精选练习题","num":94,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"choice","subtype":"single","desc":"（ ）从反动阶级手里转移到革命阶级手里，是实现社会形态变革的首要的、基本的标志。","options":[{"letter":"A","text":"生产资料"},{"letter":"B","text":"国家政权"},{"letter":"C","text":"经济基础"},{"letter":"D","text":"意识形态"}],"images":[],"answer":"B","analysis":"课本第三章讲，社会革命是阶级斗争的最高形式，实质是革命阶级推翻反动阶级的统治、用新制度代替旧制度，而国家政权从反动阶级手里转移到革命阶级手里，才是社会形态变革首要的、基本的标志。A生产资料所有制的转移是变革要解决的内容，C经济基础、D意识形态是同一社会形态的构成环节，都不能充当这个标志。"},{"id":"MARX-SELECTED-QYK-0096","fileId":"MARX-SELECTED","source":"精选练习题 第95题（QYK-0096）","paper":"精选练习题","num":95,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第二节 社会历史发展的动力","raw":"第三章 人类社会及其发展规律 · 第二节 社会历史发展的动力"},"type":"multi","subtype":"","desc":"科技革命对生产方式产生的影响主要有","options":[{"letter":"A","text":"改变了社会生产力的构成要素"},{"letter":"B","text":"改变了人们的劳动形式"},{"letter":"C","text":"学习日益成为生活中的一项重要内容"},{"letter":"D","text":"改变了社会经济结构,特别是导致产业结构发生变革"}],"images":[],"answer":"ABD","analysis":"课本第三章把科技革命的作用分成生产方式、生活方式和思维方式三个层面。就生产方式而言，它改变了社会生产力的构成要素，改变了人们的劳动形式，也改变了社会经济结构尤其是产业结构，A、B、D三条正对应于此。C说的是学习日益成为生活的重要内容，属于对生活方式的影响，与题干所问的生产方式不对应，故不选。"},{"id":"MARX-SELECTED-QYK-0099","fileId":"MARX-SELECTED","source":"精选练习题 第96题（QYK-0099）","paper":"精选练习题","num":96,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"multi","subtype":"","desc":"人民群众在创造历史过程中的决定作用表现在","options":[{"letter":"A","text":"人民群众是社会物质财富的创造者"},{"letter":"B","text":"人民群众是社会精神财富的创造者"},{"letter":"C","text":"人民群众是社会变革的决定力量"},{"letter":"D","text":"人民群众创造历史的活动受到一定社会历史条件的制约"}],"images":[],"answer":"ABC","analysis":"课本第三章从三方面讲这一决定作用：劳动群众从事物质资料生产，是社会物质财富的创造者；人民群众的实践是一切精神财富的源泉并直接参与其创造；生产关系变革和社会制度更替必须借助人民群众的力量，因而是社会变革的决定力量。D本身也是课本观点，但讲的是人民群众的活动受历史条件制约，不是决定作用的表现。"},{"id":"MARX-SELECTED-QYK-0103","fileId":"MARX-SELECTED","source":"精选练习题 第97题（QYK-0103）","paper":"精选练习题","num":97,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"multi","subtype":"","desc":"唯物史观主张，评价历史人物时应该坚持","options":[{"letter":"A","text":"无视其历史局限性"},{"letter":"B","text":"历史分析方法"},{"letter":"C","text":"阶级分析方法"},{"letter":"D","text":"无视其阶级局限性"}],"images":[],"answer":"BC","analysis":"历史人物带着特定的历史特征和阶级特点出现，所以课本主张评价他们要坚持历史分析方法和阶级分析方法：从当时的历史条件出发考察其是非功过，又把人物放到所属阶级的关系中衡量，故选B、C。A、D恰好说反了，课本明确反对无视历史局限性和阶级局限性，既不用今人标准苛求前人，也不回避其局限。"},{"id":"MARX-SELECTED-QYK-0104","fileId":"MARX-SELECTED","source":"精选练习题 第98题（QYK-0104）","paper":"精选练习题","num":98,"chapter":{"label":"第三章 人类社会及其发展规律","section":"第三节 人民群众在历史发展中的作用","raw":"第三章 人类社会及其发展规律 · 第三节 人民群众在历史发展中的作用"},"type":"multi","subtype":"","desc":"关于群众、阶级、政党、领袖的关系，正确的是","options":[{"letter":"A","text":"群众是划分为阶级的"},{"letter":"B","text":"阶级通常是由政党领导的"},{"letter":"C","text":"政党是由领袖来主持的"},{"letter":"D","text":"群众、阶级、政党、领袖构成一个有机整体"}],"images":[],"answer":"ABCD","analysis":"课本第三章第三节依据列宁的论述逐层展开：群众是划分为阶级的，对群众的历史作用要作具体的阶级分析；阶级通常是由政党领导的，政党是阶级组织最集中、最严密、最高级的形式；政党是由领袖来主持的，否则活动就会涣散无序。A、B、C三条正是课本的三个层次，D是本节结论：四者环环相扣、相互依存，构成一个有机整体。"},{"id":"MARX-SELECTED-QYK-0105","fileId":"MARX-SELECTED","source":"精选练习题 第99题（QYK-0105）","paper":"精选练习题","num":99,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"商品经济得以产生的社会历史条件是","options":[{"letter":"A","text":"存在社会分工"},{"letter":"B","text":"自然经济的瓦解"},{"letter":"C","text":"商人和高利贷者的出现"},{"letter":"D","text":"生产资料和劳动产品属于不同的所有者"}],"images":[],"answer":"AD","analysis":"课本第四章指出，商品经济是以交换为目的而进行生产的经济形式，其产生有两个条件：一是存在社会分工，使生产者的劳动相互依赖；二是生产资料和劳动产品属于不同的所有者，交换须按等价原则进行，故A、D入选。B自然经济的瓦解是商品经济成长的结果而非前提；C商人和高利贷者的出现以商品经济已存在为前提，属后来的现象。"},{"id":"MARX-SELECTED-QYK-0108","fileId":"MARX-SELECTED","source":"精选练习题 第100题（QYK-0108）","paper":"精选练习题","num":100,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"“一种物品如果没有使用价值，就是无用之物，即使人们为之付出了大量的劳动，也没有价值。”这表明","options":[{"letter":"A","text":"只要物品有使用价值也就有价值"},{"letter":"B","text":"价值是由使用价值决定的"},{"letter":"C","text":"使用价值与价值是相互排斥的"},{"letter":"D","text":"使用价值是价值的物质承担者"}],"images":[],"answer":"D","analysis":"课本第四章讲商品二因素的对立统一，题干说的是统一性：使用价值是价值的物质承担者，价值寓于使用价值之中，无用的东西即使费很多劳动也没有价值，故选D。A把统一性说成无条件互推，有使用价值而非劳动产品的阳光、空气同样没有价值；B颠倒了二者关系，价值是凝结的抽象劳动，不由使用价值决定；C讲的是对立性，与题干强调的方向不符。"},{"id":"MARX-SELECTED-QYK-0109","fileId":"MARX-SELECTED","source":"精选练习题 第101题（QYK-0109）","paper":"精选练习题","num":101,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"生产商品的劳动二重性是指","options":[{"letter":"A","text":"私人劳动和社会劳动"},{"letter":"B","text":"具体劳动和抽象劳动"},{"letter":"C","text":"简单劳动和复杂劳动"},{"letter":"D","text":"具体劳动和社会劳动"}],"images":[],"answer":"B","analysis":"课本第四章指出，生产商品的劳动具有二重性，即具体劳动和抽象劳动：具体劳动创造使用价值，抽象劳动形成价值，二者是同一劳动过程不可分割的两个方面，劳动的二重性决定商品的二因素。A私人劳动与社会劳动是私有制商品经济的基本矛盾，C简单劳动与复杂劳动讲的是劳动的计量差别，D把不同层次的分类拼在一起。"},{"id":"MARX-SELECTED-QYK-0110","fileId":"MARX-SELECTED","source":"精选练习题 第102题（QYK-0110）","paper":"精选练习题","num":102,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"决定商品价值量的是","options":[{"letter":"A","text":"社会必要劳动时间"},{"letter":"B","text":"个别劳动时间"},{"letter":"C","text":"使用价值"},{"letter":"D","text":"劳动生产率"}],"images":[],"answer":"A","analysis":"课本第四章讲商品价值量的决定时指出，价值是凝结在商品中无差别的一般人类劳动，决定它的不是个别劳动时间，而是社会必要劳动时间，即在现有社会正常生产条件下、按社会平均的劳动熟练程度和强度制造商品所需的时间。B个别劳动时间只关系到生产者自身的盈亏；C使用价值是价值的物质承担者；D劳动生产率只使单位商品价值量按反比变动。"},{"id":"MARX-SELECTED-QYK-0112","fileId":"MARX-SELECTED","source":"精选练习题 第103题（QYK-0112）","paper":"精选练习题","num":103,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"商品的价值量同简单劳动与复杂劳动有密切的关系，说法正确的有","options":[{"letter":"A","text":"商品价值量是以简单劳动为尺度的"},{"letter":"B","text":"少量的复杂劳动等于多量的简单劳动"},{"letter":"C","text":"复杂劳动换算成简单劳动是商品生产者自觉计算出来的"},{"letter":"D","text":"复杂劳动等于自乘的或多倍的简单劳动"}],"images":[],"answer":"ABD","analysis":"课本第四章讲商品价值量的决定时指出，复杂劳动要还原为简单劳动来计量：商品的价值量以简单劳动为尺度，复杂劳动等于自乘的或多倍的简单劳动，所以少量复杂劳动等于多量简单劳动。A、B、D 均与此一致。C 恰好说反了——在以私有制为基础的商品经济中，这种换算不是商品生产者自觉计算出来的，而是在商品交换过程中自发实现的。"},{"id":"MARX-SELECTED-QYK-0113","fileId":"MARX-SELECTED","source":"精选练习题 第104题（QYK-0113）","paper":"精选练习题","num":104,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"货币最基本的职能是","options":[{"letter":"A","text":"价值尺度"},{"letter":"B","text":"流通手段"},{"letter":"C","text":"支付手段"},{"letter":"D","text":"世界货币"}],"images":[],"answer":"AB","analysis":"课本第四章指出，货币具有价值尺度、流通手段、贮藏手段、支付手段和世界货币等职能，其中最基本的是价值尺度和流通手段：前者把商品的价值表现为价格，后者充当商品交换的媒介，其余职能都是在这两个职能基础上随商品经济的发展而派生出来的。C支付手段见于赊购赊销与清偿债务，D世界货币是流通手段越出国界，均不入选。"},{"id":"MARX-SELECTED-QYK-0114","fileId":"MARX-SELECTED","source":"精选练习题 第105题（QYK-0114）","paper":"精选练习题","num":105,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"multi","subtype":"","desc":"价值规律在市场配置资源过程中的作用表现在","options":[{"letter":"A","text":"自发地调节供求关系"},{"letter":"B","text":"自发地调节生产资料和劳动力在社会各生产部门之间的分配比例"},{"letter":"C","text":"自发地刺激社会生产力的发展"},{"letter":"D","text":"自发地调节社会收入的分配"}],"images":[],"answer":"BCD","analysis":"课本第四章把价值规律的作用概括为三个“自发”：自发调节生产资料和劳动力在社会各生产部门之间的分配比例，自发刺激社会生产力的发展，自发调节社会收入的分配。A“自发地调节供求关系”不在其列：供求变动只是使价格围绕价值上下波动，属于价值规律的表现形式和发生作用的机制，课本并未把它单列为一条作用。"},{"id":"MARX-SELECTED-QYK-0115","fileId":"MARX-SELECTED","source":"精选练习题 第106题（QYK-0115）","paper":"精选练习题","num":106,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第一节 商品经济和价值规律","raw":"第四章 资本主义的本质及规律 · 第一节 商品经济和价值规律"},"type":"choice","subtype":"single","desc":"以私有制为基础的商品经济的基本矛盾是","options":[{"letter":"A","text":"具体劳动和抽象劳动的矛盾"},{"letter":"B","text":"脑力劳动和体力劳动的矛盾"},{"letter":"C","text":"私人劳动和社会劳动的矛盾"},{"letter":"D","text":"商品的使用价值和价值的矛盾"}],"images":[],"answer":"C","analysis":"课本第四章讲，私有制商品经济中商品生产者的劳动由社会分工决定而具有社会性质，又由生产资料私有制决定而具有私人性质，二者的矛盾是商品经济的基本矛盾，C正确。A具体劳动与抽象劳动、D使用价值与价值的矛盾都根源于这一矛盾，是它的表现而不是根源；B脑力劳动与体力劳动的差别只是一种历史性的分工，不在其列。"},{"id":"MARX-SELECTED-QYK-0116","fileId":"MARX-SELECTED","source":"精选练习题 第107题（QYK-0116）","paper":"精选练习题","num":107,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"multi","subtype":"","desc":"资本主义产生的途径有两个。","options":[{"letter":"A","text":"农村自然经济的瓦解"},{"letter":"B","text":"从小商品经济分化出来"},{"letter":"C","text":"从商人和高利贷者转化而来"},{"letter":"D","text":"城市行会组织的瓦解"}],"images":[],"answer":"BC","analysis":"课本第四章讲，资本主义产生的途径有两条：一是小商品经济剧烈分化，条件好的作坊主成为最早的工业资本家，破产者连同帮工、学徒沦为雇佣工人；二是商人和高利贷者通过包买、放债控制小生产者，转化为工业资本家。A、D两项中自然经济与行会组织的瓦解，是资本主义生产关系得以产生的社会条件，不是途径本身。"},{"id":"MARX-SELECTED-QYK-0118","fileId":"MARX-SELECTED","source":"精选练习题 第108题（QYK-0118）","paper":"精选练习题","num":108,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在工作日长度不变的条件下，通过缩短必要劳动时间而相对延长剩余劳动时间所生产的剩余价值是","options":[{"letter":"A","text":"绝对剩余价值"},{"letter":"B","text":"平均剩余价值"},{"letter":"C","text":"超额剩余价值"},{"letter":"D","text":"相对剩余价值"}],"images":[],"answer":"D","analysis":"课本第四章的界定很清楚：工作日长度不变，靠缩短必要劳动时间、相应把剩余劳动时间拉长的办法取得的，是相对剩余价值，故选D。A的绝对剩余价值以必要劳动时间为既定，靠延长工作日或提高劳动强度取得；C的超额剩余价值是个别企业率先提高劳动生产率带来的个别价值低于社会价值的差额；B不是教材概念。"},{"id":"MARX-SELECTED-QYK-0119","fileId":"MARX-SELECTED","source":"精选练习题 第109题（QYK-0119）","paper":"精选练习题","num":109,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"资本主义条件下的生产自动化，包括机器人、自动化生产线、“无人工厂”，属于","options":[{"letter":"A","text":"可变资本"},{"letter":"B","text":"不变资本"},{"letter":"C","text":"用于购买劳动力的资本"},{"letter":"D","text":"流动资本"}],"images":[],"answer":"B","analysis":"课本第四章指出，生产自动化只是意味着剩余价值生产所使用的生产工具更加先进，机器人、自动化生产线和“无人工厂”本质上是物化劳动，属于不变资本，只把原有价值转移到产品中去，并不创造新价值和剩余价值。A和C原是同一类资本，即可变资本，它才是剩余价值的唯一源泉；就价值周转方式看，机器属于固定资本，D也不对。"},{"id":"MARX-SELECTED-QYK-0121","fileId":"MARX-SELECTED","source":"精选练习题 第110题（QYK-0121）","paper":"精选练习题","num":110,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"所谓相对过剩人口，指的是","options":[{"letter":"A","text":"过剩或多余的人口"},{"letter":"B","text":"社会生产发展绝对不需要的"},{"letter":"C","text":"劳动力供给满足不了资本的需要"},{"letter":"D","text":"劳动力供给超过了资本的需要"}],"images":[],"answer":"D","analysis":"课本第四章讲资本积累：资本有机构成不断提高，可变资本相对减少，资本对劳动力的需求日益相对减少，于是形成大量失业，即相对过剩人口，指的是劳动力的供给超过了资本的需要，故选D。关键是“相对”二字：他们并非社会生产绝对不需要，只是不为资本增殖所需要，才被说成“过剩”“多余”。A、B把相对说成绝对，C把供求方向说反了。"},{"id":"MARX-SELECTED-QYK-0124","fileId":"MARX-SELECTED","source":"精选练习题 第111题（QYK-0124）","paper":"精选练习题","num":111,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"在资本主义制度下，工资表现为“劳动的价格”或工人全部劳动的报酬，这就模糊了","options":[{"letter":"A","text":"工人必要劳动和剩余劳动的界限"},{"letter":"B","text":"工人具体劳动和抽象劳动的界限"},{"letter":"C","text":"工人私人劳动和社会劳动的界限"},{"letter":"D","text":"工人简单劳动和复杂劳动的界限"}],"images":[],"answer":"A","analysis":"课本第四章指出，资本主义工资的本质是劳动力的价值或价格，却表现为“劳动的价格”或全部劳动的报酬。工资既然像是全部劳动的价钱，必要劳动与剩余劳动的界限就被抹平，剥削关系被掩盖，故选A。B具体劳动与抽象劳动是生产商品的劳动二重性；C私人劳动与社会劳动是简单商品经济的基本矛盾；D讲复杂劳动折算为简单劳动，均与工资假象无关。"},{"id":"MARX-SELECTED-QYK-0128","fileId":"MARX-SELECTED","source":"精选练习题 第112题（QYK-0128）","paper":"精选练习题","num":112,"chapter":{"label":"第四章 资本主义的本质及规律","section":"第二节 资本主义经济制度","raw":"第四章 资本主义的本质及规律 · 第二节 资本主义经济制度"},"type":"choice","subtype":"single","desc":"利润转化为平均利润后，商品是以什么为中心进行交换","options":[{"letter":"A","text":"价值"},{"letter":"B","text":"生产成本"},{"letter":"C","text":"剩余价值"},{"letter":"D","text":"生产价格"}],"images":[],"answer":"D","analysis":"课本第四章讲剩余价值分配时指出，利润转化为平均利润，价值也就转化为生产价格，生产价格是生产成本与平均利润之和。转化之后，商品不再以价值而以生产价格为基础交换，市场价格的变动也不再以价值为中心。A是转化前的基础，B生产成本与C剩余价值只是生产价格的两个构成部分，都不能充当交换的中心。"},{"id":"MARX-SELECTED-QYK-0136","fileId":"MARX-SELECTED","source":"精选练习题 第113题（QYK-0136）","paper":"精选练习题","num":113,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第一节 垄断资本主义的形成与发展","raw":"第五章 资本主义的发展及其趋势 · 第一节 垄断资本主义的形成与发展"},"type":"multi","subtype":"","desc":"导致经济全球化迅猛发展的因素主要有","options":[{"letter":"A","text":"各国经济体制的变革和国际经济组织的发展"},{"letter":"B","text":"经济波动和经济危机的深化"},{"letter":"C","text":"跨国公司的发展提供了适宜的企业组织形式"},{"letter":"D","text":"科学技术的进步和生产力的发展"}],"images":[],"answer":"ACD","analysis":"课本第五章指出，导致经济全球化迅猛发展的因素有三：科技进步和生产力发展提供坚实的物质基础与根本推动力，跨国公司的发展提供适宜的企业组织形式，各国经济体制变革和国际经济组织的发展提供体制与组织保障，此三项即 D、C、A。B 混淆了因果，经济波动和经济危机是全球化中暴露的矛盾，不是推动其发展的动因。"},{"id":"MARX-SELECTED-QYK-0138","fileId":"MARX-SELECTED","source":"精选练习题 第114题（QYK-0138）","paper":"精选练习题","num":114,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"choice","subtype":"single","desc":"第二次世界大战后，占主导地位的资本主义生产资料所有制是","options":[{"letter":"A","text":"国家资本所有制"},{"letter":"B","text":"法人资本所有制"},{"letter":"C","text":"私人股份资本所有制"},{"letter":"D","text":"私人资本所有制"}],"images":[],"answer":"B","analysis":"课本第五章讲当代资本主义变化的表现时指出，第二次世界大战后法人资本所有制崛起，成为居主导地位的资本所有制形式；国家资本所有制虽也形成并发挥重要作用，但主要限于基础设施和公共事业，在经济中所占比重并不大，A是最易混的干扰项。C私人股份资本所有制是19世纪末20世纪初取代私人资本所有制而居主导的形式，D则是更早的形态。"},{"id":"MARX-SELECTED-QYK-0139","fileId":"MARX-SELECTED","source":"精选练习题 第115题（QYK-0139）","paper":"精选练习题","num":115,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"multi","subtype":"","desc":"资本家及其代理人采取的缓和劳资关系的激励制度有","options":[{"letter":"A","text":"职工选举管理者"},{"letter":"B","text":"职工参与决策"},{"letter":"C","text":"终身雇佣"},{"letter":"D","text":"职工持股"}],"images":[],"answer":"BCD","analysis":"课本第五章讲战后资本主义生产关系的变化时指出，随着生产力发展和工人阶级反抗力量壮大，资本家及其代理人采取职工参与决策、终身雇佣、职工持股等激励制度，促使工人自觉地服从资本家的意志，以增强工人对企业的归属感。A职工选举管理者课本并无此制度：所有权与控制权分离后，实际控制企业的是资本家一方聘任的高级职业经理。"},{"id":"MARX-SELECTED-QYK-0141","fileId":"MARX-SELECTED","source":"精选练习题 第116题（QYK-0141）","paper":"精选练习题","num":116,"chapter":{"label":"第五章 资本主义的发展及其趋势","section":"第二节 正确认识当代资本主义的新变化","raw":"第五章 资本主义的发展及其趋势 · 第二节 正确认识当代资本主义的新变化"},"type":"multi","subtype":"","desc":"2008年金融危机后，西方国家出现的经济发展失调主要表现在","options":[{"letter":"A","text":"虚拟经济与实体经济发展失衡"},{"letter":"B","text":"债务负担沉重"},{"letter":"C","text":"福利风险增加"},{"letter":"D","text":"民主陷阱会阻碍国家治理"}],"images":[],"answer":"ABC","analysis":"课本第五章把2008年国际金融危机后西方经济发展的失调概括为三点：虚拟经济与实体经济失衡、福利风险增加、债务负担沉重，A、B、C正在其列，产业空心化和政府救市又分别是第一、三点的典型后果。D中的“民主陷阱”阻碍国家治理属于政治体制失灵的表现，不在经济层面，故不选。"},{"id":"MARX-SELECTED-QYK-0143","fileId":"MARX-SELECTED","source":"精选练习题 第117题（QYK-0143）","paper":"精选练习题","num":117,"chapter":{"label":"第六章 社会主义的发展及其规律","section":"第二节 科学社会主义基本原则","raw":"第六章 社会主义的发展及其规律 · 第二节 科学社会主义基本原则"},"type":"multi","subtype":"","desc":"正确把握科学社会主义基本原则","options":[{"letter":"A","text":"必须始终坚持科学社会主义基本原则,反对任何背离科学社会主义基本原则的错误倾向"},{"letter":"B","text":"必须始终坚持科学社会主义基本原则,不能改变"},{"letter":"C","text":"要善于把科学社会主义基本原则与本国实际相结合,创造性地回答和解决社会主义革命、建设、改革中的重大问题"},{"letter":"D","text":"紧跟时代和实践的发展,在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则"}],"images":[],"answer":"ACD","analysis":"课本第六章讲正确把握科学社会主义基本原则有三条：一是始终坚持、反对背离，伯恩施坦正是借口“发展”而抛弃原则走上修正主义；二是把原则同本国实际和时代特征相结合，创造性地回答革命、建设、改革中的重大问题；三是紧跟时代和实践，在总结新鲜经验中丰富和发展这些原则。B把坚持变成固守教条，与“理论是行动指南”相悖。"},{"id":"MARX-SELECTED-QYK-0145","fileId":"MARX-SELECTED","source":"精选练习题 第118题（QYK-0145）","paper":"精选练习题","num":118,"chapter":{"label":"第七章 共产主义崇高理想及其最终实现","section":"第一节 展望未来共产主义新社会","raw":"第七章 共产主义崇高理想及其最终实现 · 第一节 展望未来共产主义新社会"},"type":"multi","subtype":"","desc":"共产主义社会的基本特征是","options":[{"letter":"A","text":"物质财富极大丰富,生产资料按劳分配"},{"letter":"B","text":"社会关系高度和谐,人们精神境界极大提高"},{"letter":"C","text":"物质财富极大丰富,消费资料按需分配"},{"letter":"D","text":"实现每个人自由而全面的发展,人类从必然王国向自由王国飞跃"}],"images":[],"answer":"BCD","analysis":"课本第七章把共产主义社会的基本特征概括为三条：物质财富极大丰富、消费资料按需分配；社会关系高度和谐、人们精神境界极大提高；每个人自由而全面发展，人类从必然王国走向自由王国，即B、C、D。A错在分配方式，共产主义对个人消费品实行按需分配，按劳分配只是社会主义阶段的原则，生产资料归社会公有。"},{"id":"MARX-SELECTED-QYK-0146","fileId":"MARX-SELECTED","source":"精选练习题 第119题（QYK-0146）","paper":"精选练习题","num":119,"chapter":{"label":"第七章 共产主义崇高理想及其最终实现","section":"第三节 共产主义远大理想与中国特色社会主义共同理想","raw":"第七章 共产主义崇高理想及其最终实现 · 第三节 共产主义远大理想与中国特色社会主义共同理想"},"type":"multi","subtype":"","desc":"正确认识和把握共产主义远大理想与中国特色社会主义共同理想的关系，要","options":[{"letter":"A","text":"从时间上看,远大理想与共同理想的关系是最终理想与阶段性理想的关系"},{"letter":"B","text":"从层次上看,远大理想与共同理想的关系是最高纲领和最低纲领的关系"},{"letter":"C","text":"从范围上看,远大理想与共同理想的关系也是全人类理想与全体中国人民理想的关系"},{"letter":"D","text":"任何时候都要坚持远大理想和共同理想的统一,不能把它们割裂开来、对立起来"}],"images":[],"answer":"ABCD","analysis":"课本第七章这一节从三个维度展开：时间上，二者是最终理想与阶段性理想的关系；层次上，是最高纲领与最低纲领的关系；范围上，是全人类理想与全体中国人民理想的关系，A、B、C正对应这三个维度。D是课本的结论：要用辩证思维和历史思维把握二者，任何时候都不能把它们割裂开来、对立起来，既不能空谈远大理想，也不能讳言甚至丢掉远大理想。"}]}</script>
<script id="app-script">
// ═══════════════ 视图渲染 ═══════════════
const $=id=>document.getElementById(id);
const qs=id=>DATA.questions.find(q=>q.id===id);

function init(){
  loadRecords();loadSyncCfg();
  const embedded=JSON.parse($('marx-data').textContent);
  const dataReady=location.protocol==='file:'||window!==window.top
    ?Promise.resolve(embedded)
    :fetch('marx-data.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).catch(()=>embedded);
  dataReady.then(async d=>{
    DATA=d;
    $('app-sub').textContent=d.questions.length+' 题 · '+new Set(d.questions.map(q=>q.paper)).size+' 套卷 · 本地保存'+(syncCfg?' · ☁':'');
    if(syncCfg)await pullCloud(true);   // 已配置同步：启动时静默拉取合并
    updateWrongBadge();
    restoreUI();
  }).catch(e=>{
    $('main').innerHTML='<div class="empty"><div class="big">⚠</div>题库加载失败（'+e.message+'）</div>';
  });
}

const MODE_ORDER=['chapter','paper','wrong'];

function syncModeTabs(){
  document.querySelectorAll('.mode').forEach(b=>{
    const active=b.dataset.mode===mode;
    b.classList.toggle('active',active);
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(active));
    b.tabIndex=active?0:-1;
  });
  const resetAction=$('menu-reset-wrong');
  if(resetAction)resetAction.classList.toggle('hidden',mode!=='wrong');
}

function animateModeChange(direction){
  const main=$('main');
  main.classList.remove('mode-enter-next','mode-enter-prev');
  clearTimeout(main._modeAnimationTimer);
  if(!direction||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  void main.offsetWidth;
  main.classList.add(direction>0?'mode-enter-next':'mode-enter-prev');
  main._modeAnimationTimer=setTimeout(()=>main.classList.remove('mode-enter-next','mode-enter-prev'),240);
}

function switchMode(m){
  if(!MODE_ORDER.includes(m))return;
  const direction=Math.sign(MODE_ORDER.indexOf(m)-MODE_ORDER.indexOf(mode));
  mode=m;view='list';
  syncModeTabs();
  saveUI();renderList();animateModeChange(direction);
}

// 恢复上次离开时的界面状态（模式/分组/练习进度）
function restoreUI(){
  const ui=loadUI();
  if(ui.mode&&['chapter','paper','wrong'].includes(ui.mode))mode=ui.mode;
  syncModeTabs();
  lastOpenGrp=ui.lastOpenGrp||null;
  if(ui.wrongGroup&&['date','chapter','paper'].includes(ui.wrongGroup))wrongGroup=ui.wrongGroup;
  const s=ui.session;
  if(s&&Array.isArray(s.list)&&s.list.length){
    // 题库重建后失效的题自动剔除；全部失效则回列表
    const valid=s.list.filter(id=>DATA.questions.some(q=>q.id===id));
    if(valid.length){
      pracList=valid;
      pracIdx=Math.min(Math.max(s.idx||0,0),valid.length-1);
      pracTitle=s.title||'继续练习';
      view='practice';
      renderPractice();
      return;
    }
  }
  renderList();
}

// ─── 列表视图 ───
function renderList(){
  setPracticeChrome(false);
  if(!DATA)return;
  const main=$('main');
  if(mode==='chapter'){
    // 章 → 节 两级分组；章、节顺序按教材目录（《马克思主义基本原理（2023年版）》），不涉及考题的小节以浅蓝标出；每章首项为必备知识（源自教材）
    const TB=(DATA.textbook&&DATA.textbook.sections)||{};
    const NOTES=(DATA.textbook&&DATA.textbook.notes)||{};
    const chapters=[];const cmap={};
    for(const q of DATA.questions){
      const cl=q.chapter.label;
      if(!cmap[cl]){cmap[cl]={label:cl,secs:{}};chapters.push(cmap[cl]);}
      const c=cmap[cl];const sl=q.chapter.section||'未分节';
      (c.secs[sl]=c.secs[sl]||[]).push(q.id);
    }
    chapters.sort((a,b)=>{
      const tbKeys=Object.keys(TB);const ia=tbKeys.indexOf(a.label),ib=tbKeys.indexOf(b.label);
      if(ia>=0&&ib>=0)return ia-ib;
      const na=parseInt((a.label.match(/第\s*(\d+)\s*章/)||[])[1]||'999',10);
      const nb=parseInt((b.label.match(/第\s*(\d+)\s*章/)||[])[1]||'999',10);
      return na-nb;
    });
    if(!chapters.length){main.innerHTML=emptyHtml('暂无题目');return;}
    main.innerHTML=chapters.map((c,ci)=>{
      const allIds=Object.values(c.secs).flat();
      const total=allIds.length;
      const doneN=allIds.filter(doneIn).length;
      const open=lastOpenGrp===c.label?' open':'';
      const labelAttr=escHtml(c.label).replace(/"/g,'&quot;');
      // 必备知识首项（内容源自教材，按章编排）
      const noteRow=NOTES[c.label]
        ?'<div class="sec sec-note" onclick="toggleNotes('+ci+')"><span>📘 必备知识</span><span class="nb-arrow">▶</span></div>'
        +'<div class="notes-body" id="notes-'+ci+'" data-ch="'+labelAttr+'"></div>':'';
      // 小节按教材目录顺序；无题小节浅蓝展示；教材结构外的孤立小节兜底排在末尾
      const tbSecs=TB[c.label]||Object.keys(c.secs);
      const extraSecs=Object.keys(c.secs).filter(sl=>!tbSecs.includes(sl));
      const secRows=tbSecs.concat(extraSecs).map(sl=>{
        const ids=c.secs[sl];
        if(!ids){return '<div class="sec sec-none" onclick="toast(\'本节暂无真题考题\')"><span>'+escHtml(sl)+'</span><span class="cnt">不涉及考题</span></div>';}
        const dn=ids.filter(doneIn).length;
        return '<div class="sec" onclick="startPractice('+JSON.stringify(ids).replace(/"/g,'&quot;')+', '+JSON.stringify(escHtml(c.label+' · '+sl)).replace(/"/g,'&quot;')+')"><span>'+escHtml(sl)+'</span><span class="cnt">'+dn+'/'+ids.length+'</span></div>';
      }).join('');
      return '<div class="grp'+open+'" id="grp-'+ci+'">'
        +'<div class="grp-h" onclick="toggleGrp('+ci+', '+JSON.stringify(c.label).replace(/"/g,'&quot;')+')"><span>'+escHtml(c.label)+'</span><span><span class="meta">'+doneN+'/'+total+' 题</span><span class="grp-progress"><i style="width:'+(total?Math.round(doneN/total*100):0)+'%"></i></span><span class="arrow">▶</span></span></div>'
        +'<div class="grp-body">'+noteRow+secRows+'</div></div>';
    }).join('');
  }else if(mode==='paper'){
    const papers=[];const pmap={};
    for(const q of DATA.questions){
      if(!pmap[q.paper]){pmap[q.paper]=[];papers.push(q.paper);}
      pmap[q.paper].push(q.id);
    }
    if(!papers.length){main.innerHTML=emptyHtml('暂无题目');return;}
    main.innerHTML=papers.map(p=>{
      const ids=pmap[p];const dn=ids.filter(doneIn).length;
      const name=paperName(p,papers);
      return '<div class="qrow" onclick="startPractice('+JSON.stringify(ids).replace(/"/g,'&quot;')+', '+JSON.stringify(escHtml(name)).replace(/"/g,'&quot;')+')">'
        +'<div class="qn" style="width:auto;height:auto;border-radius:8px;padding:6px 10px;font-size:12px">卷</div>'
        +'<div class="info"><div class="t1">'+escHtml(name)+'</div><div class="t2">共 '+ids.length+' 题 · 已做 '+dn+'</div></div>'
        +'<span style="color:var(--gray)">▶</span></div>';
    }).join('');
  }else{
    const wqs=DATA.questions.filter(q=>isWrong(q.id));
    // 工具栏：分类切换（按日期/按章节/按真题）
    const seg=(g,txt)=>'<button class="wseg'+(wrongGroup===g?' active':'')+'" onclick="setWrongGroup(\''+g+'\')">'+txt+'</button>';
    const toolbar='<div class="wtoolbar"><div class="wsegs">'+seg('date','按日期')+seg('chapter','按章节')+seg('paper','按真题')+'</div></div>';
    if(!wqs.length){main.innerHTML=toolbar+emptyHtml('🎉','还没有错题，继续保持！');return;}
    const keyOf=q=>{
      if(wrongGroup==='chapter')return q.chapter.label;
      if(wrongGroup==='paper')return q.paper.replace(/\s*[AB]卷$/,''); // 不区分 A/B 卷，同学年同课程归一组
      const ts=rec(q.id).at;
      if(!ts)return '无日期';
      const d=new Date(ts),p=n=>String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    };
    const order=[];const gmap={};
    for(const q of wqs){const k=keyOf(q);if(!gmap[k]){gmap[k]=[];order.push(k);}gmap[k].push(q);}
    if(wrongGroup==='date')order.sort((a,b)=>b.localeCompare(a));
    if(wrongGroup==='chapter')order.sort((a,b)=>chapNum(a)-chapNum(b));
    main.innerHTML=toolbar+order.map(k=>'<div class="wgrp"><div class="wgrp-h"><span>'+escHtml(k)+'</span><span class="cnt">'+gmap[k].length+' 题</span></div>'+gmap[k].map(q=>qrowHtml(q)).join('')+'</div>').join('');
  }
}

function emptyHtml(big,txt){
  if(txt===undefined){txt=big;big='📭';}
  return '<div class="empty"><div class="big">'+big+'</div>'+escHtml(txt)+'</div>';
}

function toggleGrp(ci,label){
  const el=$('grp-'+ci);
  const willOpen=!el.classList.contains('open');
  el.classList.toggle('open');
  lastOpenGrp=willOpen?label:null;
  saveUI();
}

// 必备知识渲染：## 标题 + - 列表 + 普通段落，公式交 KaTeX 排版（内容源自教材）
function renderNotes(text){
  if(!text)return'';
  let html='',list=[];
  const flushList=()=>{if(list.length){html+='<ul>'+list.join('')+'</ul>';list=[];}};
  for(const raw of String(text).split('\n')){
    const line=raw.trim();
    if(!line)continue;
    if(/^##\s+/.test(line)){flushList();html+='<h2>'+renderTex(line.replace(/^##\s+/,''))+'</h2>';continue;}
    if(/^-\s+/.test(line)){list.push('<li>'+renderTex(line.replace(/^-\s+/,''))+'</li>');continue;}
    flushList();html+='<p>'+renderTex(line)+'</p>';
  }
  flushList();
  return html;
}

// 必备知识首项展开/收起（懒渲染 + KaTeX 排版）
function toggleNotes(ci){
  const el=$('notes-'+ci);
  const grp=el.closest('.grp');
  if(el.style.display==='block'){el.style.display='none';grp.classList.remove('note-open');return;}
  if(!el.dataset.loaded){
    const md=(DATA.textbook&&DATA.textbook.notes)||{};
    el.innerHTML=renderNotes(md[el.dataset.ch]);
    applyMath(el);
    el.dataset.loaded='1';
  }
  el.style.display='block';grp.classList.add('note-open');
}

// 错题列表行：同步显示来源 + 溯源 + 最近作答时间；点击进入错题集练习（错题顺序）
function qrowHtml(q){
  const r=rec(q.id);
  const meta=[escHtml(q.chapter.raw),r.at?fmtTs(r.at):'',r.n?'作答 '+r.n+' 次':''].filter(Boolean).join(' · ');
  return '<div class="qrow" onclick="startPractice(wrongIds(), \'错题重做\', '+JSON.stringify(q.id).replace(/"/g,'&quot;')+')">'
    +'<div class="qn wrong">'+q.num+'</div>'
    +'<div class="info"><div class="t1">'+escHtml(q.source)+'</div>'
    +'<div class="t2">'+meta+'</div></div>'
    +'<span style="color:var(--gray)">▶</span></div>';
}
function wrongIds(){return DATA.questions.filter(q=>isWrong(q.id)).map(q=>q.id);}

// 卷名显示：不区分 A/B 卷，去掉后缀；若去后缀后与其他卷重名（同课程 A/B 卷并存）则退回完整卷名
function paperName(p,papers){
  const s=p.replace(/\s*[AB]卷$/,'');
  const dup=papers.filter(x=>x.replace(/\s*[AB]卷$/,'')===s).length>1;
  return dup?p:s;
}

// 章节排序：课本用中文数字（第一章…第七章），导论排最前
const CN_NUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function chapNum(s){
  if(s==='导论')return 0;
  const m=String(s).match(/第\s*([一二三四五六七八九])\s*章/);
  return m?CN_NUM[m[1]]:999;
}

// 错题分类切换（持久化选择）
function setWrongGroup(g){wrongGroup=g;saveUI();renderList();}

// 重置弹层：可选清空错题标记，或清空全部做题记录（两步确认）
function resetWrong(){
  const nw=DATA.questions.filter(q=>isWrong(q.id)).length;
  const na=Object.values(records).filter(r=>!r.cleared).length;
  const mask=document.createElement('div');
  mask.className='qnav-mask';
  mask.innerHTML='<div class="qnav-box">'
    +'<div class="qnav-hd"><span>重置</span><span class="qnav-x" onclick="this.closest(\'.qnav-mask\').remove()">✕</span></div>'
    +'<button class="rst-btn"'+(nw?'':' disabled')+' onclick="doResetWrong(this)">清空错题标记'+(nw?'（'+nw+' 道）':'')+'</button>'
    +'<button class="rst-btn danger"'+(na?'':' disabled')+' onclick="doResetAll(this)">清空全部做题记录'+(na?'（'+na+' 条）':'')+'</button>'
    +'<div class="rst-tip">清空做题记录会同时移除错题本与全部作答历史，需两步确认，不可恢复。</div>'
    +'</div>';
  mask.addEventListener('click',e=>{if(e.target===mask)mask.remove();});
  document.body.appendChild(mask);
}

// 清空错题标记：保留作答记录，一次确认（弹层选择 + 确认为两步）
function doResetWrong(btn){
  const n=DATA.questions.filter(q=>isWrong(q.id)).length;
  btn.closest('.qnav-mask').remove();
  if(!confirm('清空全部 '+n+' 道错题标记？\n（作答记录保留）'))return;
  const now=Date.now();
  for(const qid of Object.keys(records)){if(records[qid].wrong)records[qid]={...records[qid],wrong:false,at:now};}
  saveRecords();pushNow();renderList();toast('错题已清零');
}

// 清空全部做题记录：二次确认，防止误删
function doResetAll(btn){
  const n=Object.values(records).filter(r=>!r.cleared).length;
  btn.closest('.qnav-mask').remove();
  if(!confirm('【确认 1/2】将清空全部做题记录（共 '+n+' 条，含错题本与作答历史）。继续？'))return;
  if(!confirm('【确认 2/2】最后确认：清空后不可恢复，确定重置？'))return;
  const now=Date.now();const cleared={};
  for(const qid of Object.keys(records))cleared[qid]={cleared:true,at:now};
  records=cleared;
  try{localStorage.removeItem(LS_RESUME);}catch(e){}
  saveRecords();pushNow();renderList();toast('做题记录已全部清空');
}

function startPractice(ids,title,anchorId){
  unitDlgShown=false;
  pracList=ids.slice();pracTitle=title;view='practice';
  pracIdx=anchorId?Math.max(0,pracList.indexOf(anchorId)):resumeIdx(ids);
  saveUI();renderPractice();
}
function backToList(){
  // 单元完成检测：小节/整卷全部答完 → 点返回时弹窗（保留进度/清除作答保留错题）
  if(mode!=='wrong'&&view==='practice'&&pracList.length&&!unitDlgShown&&pracList.some(doneIn)){
    unitDlgShown=true;showUnitDialog();return;
  }
  unitDlgShown=false;
  if(view==='practice')saveResume();
  view='list';saveUI();renderList();$('main').scrollTop=0;
}

function renderPractice(){
  const main=$('main');
  if(!pracList.length){setPracticeChrome(false);main.innerHTML=emptyHtml('🎉','错题已清零！');return;}
  setPracticeChrome(true);
  const qid=pracList[pracIdx];
  const q=qs(qid);
  const r=rec(qid);
  const rv=recIn(qid)||{}; // 本训练可见的作答状态（章节/真题互不可见，错题模式看全局）

  // 标签：章节模式只显示来源，真题模式只显示溯源，错题模式都显示
  let tags='';
  if(mode==='chapter')tags='<span class="tag src">'+escHtml(q.source)+'</span>';
  else if(mode==='paper')tags='<span class="tag chap">'+escHtml(q.chapter.raw)+'</span>';
  else tags='<span class="tag src">'+escHtml(q.source)+'</span><span class="tag chap">'+escHtml(q.chapter.raw)+'</span>';
  const tname=q.type==='multi'?'多选题':(q.subtype==='judge'?'判断题':'单选题');

  let html='<div class="pv-top">'
    +'<button class="back-btn" onclick="backToList()">← 返回</button>'
    +'<div class="pv-title">'+practiceTitleHtml(pracTitle)+'</div>'
    +'<button class="pv-cnt" onclick="toggleQNav()" title="点击跳题">'+(pracIdx+1)+' / '+pracList.length+' ▾</button></div>';

  // 进度条
  const doneCnt=mode==='wrong'?pracList.filter(id=>redoDone.has(id)).length:pracList.filter(doneIn).length;
  html+='<div class="pv-progress"><i style="width:'+(pracList.length?Math.round(doneCnt/pracList.length*100):0)+'%"></i></div>';

  html+='<div class="qcard"><div class="qhead">'+tags+'<span class="tag type">'+tname+'</span></div>'
    +'<div class="qbody">'+renderMd(questionDesc(q,mode==='chapter'?null:q.num))+'</div>';

  // 错题重做：错题模式下打开即全新题面，作答/看答案状态取本次会话
  // （答对移出错题本后仍保持重做态，让“上次错选”与结果显示完整）
  const redoing=mode==='wrong'&&(isWrong(qid)||redoDone.has(qid)||redoPeeked.has(qid));
  const answered=redoing?redoDone.has(qid):(rv.my!==undefined||rv.ok!==undefined);
  const peeked=redoing&&!answered&&redoPeeked.has(qid);

  if(q.type==='multi'){
    const ansLetters=String(q.answer||'');
    const sel=multiSel[qid]||'';
    html+='<div class="opts">'+normalizedOptions(q).map(o=>{
      let cls='opt';
      if(answered){
        const isAns=ansLetters.includes(o.letter);
        const isMy=String(rv.my||'').includes(o.letter);
        if(isAns)cls+=' correct';
        else if(isMy)cls+=' incorrect';
      }else if(peeked){
        if(ansLetters.includes(o.letter))cls+=' correct';
        else if(String(r.my||'').includes(o.letter))cls+=' incorrect';
      }else if(sel.includes(o.letter)){cls+=' sel';}
      return '<div class="'+cls+'" onclick="pickMulti(\''+qid+'\',\''+o.letter+'\')"><span class="opt-l">'+o.letter+'</span><span class="opt-t">'+renderMd(o.text)+'</span></div>';
    }).join('')+'</div>';
    if(!answered&&!peeked)html+='<div class="open-act"><button class="btn primary"'+(sel?'':' disabled')+' onclick="submitMulti(\''+qid+'\')">提交答案（已选 '+sel.length+' 项）</button></div>';
    if(redoing&&!answered)html+='<div class="open-act">'+(peeked
      ?'<button class="btn" onclick="redoReset(\''+qid+'\')">🔄 重做本题</button>'
      :'<button class="btn show" onclick="redoPeek(\''+qid+'\')">📖 查看答案</button>')+'</div>';
  }else if(q.type==='choice'){
    const ansLetters=String(q.answer||'');
    html+='<div class="opts">'+normalizedOptions(q).map(o=>{
      let cls='opt';
      if(answered){
        const isAns=ansLetters===o.letter;
        const isMy=rv.my===o.letter;
        if(isAns)cls+=' correct';
        else if(isMy)cls+=' incorrect';
      }else if(peeked){
        if(ansLetters===o.letter)cls+=' correct';
        else if(r.my===o.letter)cls+=' incorrect';
      }
      return '<div class="'+cls+'" onclick="pickOpt(\''+qid+'\',\''+o.letter+'\')"><span class="opt-l">'+o.letter+'</span><span class="opt-t">'+renderMd(o.text)+'</span></div>';
    }).join('')+'</div>';
    if(redoing&&!answered)html+='<div class="open-act">'+(peeked
      ?'<button class="btn" onclick="redoReset(\''+qid+'\')">🔄 重做本题</button>'
      :'<button class="btn show" onclick="redoPeek(\''+qid+'\')">📖 查看答案</button>')+'</div>';
  }else{
    // 开放题：错题重做走会话态（打开=未作答），常规模式保持原逻辑
    if(redoing){
      if(answered){
        html+='<div class="open-act"><button class="btn" onclick="redoReset(\''+qid+'\')">🔄 重做本题</button></div>';
      }else if(peeked){
        html+='<div class="open-act">'
          +'<button class="btn mark-wrong" onclick="judgeOpen(\''+qid+'\',false)">✗ 我做错了，加入错题</button>'
          +'<button class="btn mark-right" onclick="judgeOpen(\''+qid+'\',true)">✓ 我做对了</button>'
          +'<button class="btn" onclick="redoReset(\''+qid+'\')">🔄 重做本题</button></div>';
      }else{
        html+='<div class="open-act"><button class="btn show" onclick="redoPeek(\''+qid+'\')">📖 查看答案</button></div>';
      }
    }else if(!rv.revealed){
      html+='<div class="open-act"><button class="btn show" onclick="reveal(\''+qid+'\')">📖 查看答案</button></div>';
    }else if(rv.wrong===undefined||(rv.wrong===false&&rv.ok===undefined)){
      html+='<div class="open-act">'
        +'<button class="btn mark-wrong" onclick="judgeOpen(\''+qid+'\',false)">✗ 我做错了，加入错题</button>'
        +'<button class="btn mark-right" onclick="judgeOpen(\''+qid+'\',true)">✓ 我做对了</button></div>';
    }
  }

  // 上次错选提示（重做作答后显示 prevMy；仅看答案时显示原错选 r.my）
  const prevSel=answered?r.prevMy:r.my;
  if(redoing&&(answered||peeked)&&prevSel)html+='<div class="prev-ans">上次错选：'+escHtml(String(prevSel))+'</div>';

  // 答案 + 解析区（作答后或展开后显示）
  const vok=redoing?r.ok:rv.ok;
  if(redoing?(answered||peeked):(answered||rv.revealed)){
    if(!((q.type==='choice'||q.type==='multi')&&vok!==undefined)){
    let hd='答案',hcls='';
    if(q.type==='choice'&&vok!==undefined){hd=vok?'✔ 回答正确':'✘ 回答错误';hcls=vok?'right':'wrong';}
    html+='<div class="ansbox"><div class="hd '+hcls+'">'+hd+'</div><div class="ct">'+renderMd(q.answer)+'</div></div>';
    }
    if(q.analysis)html+='<div class="ansbox ana-fold open"><div class="hd" onclick="toggleAna(this)"><span>📖 课本解析</span><span class="ana-arrow">▶</span></div><div class="ct">'+renderAnalysis(q.analysis)+'</div></div>';
  }
  html+='</div>';

  // 同题重渲染（轮询/存档/标记等触发）不打断阅读：保留滚动位置与解析折叠状态；切题才回顶部
  var _sameQ=(renderPractice._lastQid===qid);
  var _st=_sameQ?main.scrollTop:0;
  var _folds=_sameQ?Array.prototype.map.call(main.querySelectorAll('.ansbox.ana-fold'),function(el){return el.classList.contains('open');}):null;

  // 卡片排版缓存：题面卡（qcard）按作答状态复用已排版 DOM，切题与回看不重复 KaTeX 渲染。
  // 卡片内容由 qid + 模式 + 作答状态唯一决定，记录字段变化（含云端合并）都会反映在缓存键里。
  var _cut=html.indexOf('<div class="qcard">');
  var _ckey=[qid,mode,redoing?1:0,answered?1:0,peeked?1:0,rv.revealed?1:0,
    rv.my||'',rv.wrong===undefined?'':(rv.wrong?1:0),prevSel||'',
    vok===undefined?'':(vok?1:0),
    (typeof multiSel!=='undefined'?(multiSel[qid]||''):'')].join('|');
  if(!renderPractice._cards)renderPractice._cards=new Map();
  var _cached=renderPractice._cards.get(_ckey);
  var _cardEl;
  main.innerHTML=html.slice(0,_cut);
  if(_cached){
    _cardEl=_cached;
    main.appendChild(_cardEl);
  }else{
    main.insertAdjacentHTML('beforeend',html.slice(_cut));
    _cardEl=main.lastElementChild;
    renderPractice._cards.set(_ckey,_cardEl);
    if(renderPractice._cards.size>24)renderPractice._cards.delete(renderPractice._cards.keys().next().value);
    // 分阶段排版：题干与选项先行（立即可读可答），答案/解析推迟一帧补齐
    applyMath(_cardEl.querySelector('.qbody'));
    var _optsEl=_cardEl.querySelector('.opts');
    if(_optsEl)applyMath(_optsEl);
    requestAnimationFrame(function(){
      var _cts=_cardEl.querySelectorAll('.ansbox .ct');
      for(var _ci=0;_ci<_cts.length;_ci++)applyMath(_cts[_ci]);
    });
  }
  if(_sameQ&&_folds&&_folds.length){
    var _nf=_cardEl.querySelectorAll('.ansbox.ana-fold');
    for(var _fi=0;_fi<Math.min(_folds.length,_nf.length);_fi++){if(_folds[_fi])_nf[_fi].classList.add('open');}
  }
  renderPractice._lastQid=qid;
  main.scrollTop=_st;
}

// ─── 错题重做会话态：错题模式打开即全新题面，重做/看答案只影响本次会话展示 ───
const redoDone=new Set(),redoPeeked=new Set();
function redoActive(qid){return mode==='wrong'&&isWrong(qid);}
function redoPeek(qid){if(!redoActive(qid))return;redoPeeked.add(qid);renderPractice();}
function redoReset(qid){redoDone.delete(qid);redoPeeked.delete(qid);if(typeof multiSel!=='undefined')delete multiSel[qid];renderPractice();}

// ─── 作答动作 ───
function pickOpt(qid,letter){
  const q=qs(qid);const r=rec(qid);
  const redo=redoActive(qid);
  if(redo?(redoDone.has(qid)||redoPeeked.has(qid)):((recIn(qid)||{}).my!==undefined))return; // 已作答或已看答案，锁定（仅限本训练）
  const correct=String(q.answer||'').trim()===letter;
  if(redo){
    redoDone.add(qid);
    records[qid]={my:letter,ok:correct,wrong:!correct,n:(r.n||0)+1,at:Date.now(),prevMy:r.my,prevOk:r.ok,via:mode};
    saveRecords();renderPractice();
    toast(correct?'🎉 答对了，已移出错题本':'✘ 又答错了，仍保留在错题本');
    return;
  }
  records[qid]={my:letter,ok:correct,wrong:!correct,n:(r.n||0)+1,at:Date.now(),via:mode};
  saveRecords();renderPractice();
  if(!correct&&mode==='wrong')toast('已加入错题本');
}

// 多选题：选项可多选/取消，点“提交答案”后一次性判分（与官方评分一致：少选、多选、错选均不得分）
let multiSel={};
function pickMulti(qid,letter){
  const r=rec(qid);
  const redo=redoActive(qid);
  if(redo?(redoDone.has(qid)||redoPeeked.has(qid)):((recIn(qid)||{}).my!==undefined))return;
  const s=multiSel[qid]||'';
  multiSel[qid]=s.includes(letter)?s.replace(letter,''):s+letter;
  renderPractice();
}
function submitMulti(qid){
  const q=qs(qid);const r=rec(qid);
  const redo=redoActive(qid);
  if(redo?(redoDone.has(qid)||redoPeeked.has(qid)):((recIn(qid)||{}).my!==undefined))return;
  const sel=[...(multiSel[qid]||'')].sort().join('');
  if(!sel){toast('请先选择选项');return;}
  const ans=[...String(q.answer||'')].sort().join('');
  const correct=ans===sel;
  if(redo){
    redoDone.add(qid);
    records[qid]={my:sel,ok:correct,wrong:!correct,n:(r.n||0)+1,at:Date.now(),prevMy:r.my,prevOk:r.ok,via:mode};
    delete multiSel[qid];
    saveRecords();renderPractice();
    toast(correct?'🎉 答对了，已移出错题本':'✘ 又答错了，仍保留在错题本');
    return;
  }
  records[qid]={my:sel,ok:correct,wrong:!correct,n:(r.n||0)+1,at:Date.now(),via:mode};
  delete multiSel[qid];
  saveRecords();renderPractice();
  if(!correct&&mode==='wrong')toast('已加入错题本');
}

function reveal(qid){
  const r=rec(qid);
  records[qid]={...r,revealed:true,n:(r.n||0)+1,at:Date.now(),via:mode};
  saveRecords();renderPractice();
}

function judgeOpen(qid,ok){
  const r=rec(qid);
  const redo=redoActive(qid);
  if(redo){redoDone.add(qid);redoPeeked.delete(qid);}
  records[qid]={...r,ok,wrong:!ok,at:Date.now(),via:mode};
  saveRecords();renderPractice();
  if(redo)toast(ok?'🎉 答对了，已移出错题本':'✘ 又答错了，仍保留在错题本');
  else if(!ok&&mode==='wrong')toast('已加入错题本');else if(ok)toast('已记录 ✓');
}

function clearWrong(qid){
  const r=rec(qid);
  records[qid]={...r,wrong:false,ok:true,at:Date.now()};
  saveRecords();
  // 错题回顾模式下，移出错题后自动进入下一题，列表清零时回列表页
  if(mode==='wrong'){
    pracList=pracList.filter(id=>isWrong(id));
    if(!pracList.length){toast('错题已清零 ✓');backToList();return;}
    if(pracIdx>=pracList.length)pracIdx=pracList.length-1;
  }
  saveUI();
  renderPractice();toast('已移出错题 ✓');
}

// ─── 单元完成：点返回时若小节/整卷全部答完，弹窗（保留进度 或 清除作答保留错题）───
let unitDlgShown=false;
function showUnitDialog(){
  const dn=pracList.filter(doneIn).length, all=dn===pracList.length;
  const mask=document.createElement('div');
  mask.className='qnav-mask';
  mask.innerHTML='<div class="qnav-box">'
    +'<div class="qnav-hd"><span>'+(all?'🎉 ':'')+escHtml(pracTitle)+(all?' 已全部答完（'+pracList.length+' 题）':' 已答 '+dn+'/'+pracList.length+' 题')+'</span><span class="qnav-x" onclick="closeUnitDialog()">✕</span></div>'
    +'<button class="rst-btn" onclick="closeUnitDialog(true)">保留进度，下次继续</button>'
    +'<button class="rst-btn danger" onclick="clearUnitProgress(this)">清除作答情况（保留错题）</button>'
    +'<div class="rst-tip">保留进度下次接着做；清除后本单元进度归零可重做，做错的题仍保留在错题重做中。</div>'
    +'</div>';
  mask.addEventListener('click',e=>{if(e.target===mask)closeUnitDialog();});
  document.body.appendChild(mask);
}
function closeUnitDialog(goBack){
  const m=document.querySelector('.qnav-mask');
  if(m)m.remove();
  if(goBack)backToList();
}
function clearUnitProgress(btn){
  if(!confirm('将清除本单元 '+pracList.length+' 题的作答情况（错题记录保留），确定？'))return;
  const now=Date.now();
  for(const qid of pracList){
    if(typeof multiSel!=='undefined')delete multiSel[qid];
    const w=rec(qid);
    records[qid]=w.wrong?{wrong:true,n:w.n||1,at:now}:{cleared:true,at:now};
  }
  unitDlgShown=false;pracIdx=0;
  btn.closest('.qnav-mask').remove();
  saveRecords();pushNow();
  backToList();toast('作答已清除，错题已保留');
}
function pNav(d){
  const ni=pracIdx+d;
  if(ni<0||ni>=pracList.length)return;
  pracIdx=ni;saveUI();renderPractice();
}

// ─── 题号选择弹层：点计数器弹出，点背景关闭 ───
function toggleQNav(){
  const old=document.getElementById('qnav-mask');
  if(old){old.remove();return;}
  const m=document.createElement('div');
  m.className='qnav-mask';m.id='qnav-mask';
  m.innerHTML='<div class="qnav-box"><div class="qnav-hd"><span>跳转题目（蓝=当前 绿=已做'+(mode==='wrong'?' 红=错题':'')+'）</span><span class="qnav-x" onclick="toggleQNav()">✕</span></div>'
    +'<div class="qnum-grid">'+pracList.map((id,i)=>{
      const qq=qs(id);let cls='qnum';
      if(i===pracIdx)cls+=' cur';
      else if(mode==='wrong'&&isWrong(id))cls+=' wrong';
      else if(doneIn(id))cls+=' done';
      const jumpNumber=mode==='chapter'?i+1:qq.num;
      return '<button class="'+cls+'" onclick="goToQ('+i+')">'+jumpNumber+'</button>';
    }).join('')+'</div></div>';
  m.addEventListener('click',e=>{if(e.target===m)toggleQNav();});
  document.body.appendChild(m);
}
function goToQ(i){
  if(i<0||i>=pracList.length)return;
  pracIdx=i;saveUI();toggleQNav();renderPractice();
}

// 键盘快捷键（桌面）
document.addEventListener('keydown',e=>{
  if(view!=='practice')return;
  if(e.key==='ArrowLeft')pNav(-1);
  else if(e.key==='ArrowRight')pNav(1);
  else if(view==='practice'&&e.key>='1'&&e.key<='5'){
    const q=qs(pracList[pracIdx]);
    if(q&&q.type==='choice'){const L=String.fromCharCode(64+parseInt(e.key));if(q.options.some(o=>o.letter===L))pickOpt(q.id,L);}
  }
});

// 鼠标侧键（桌面）：后退键=上一题，前进键=下一题；preventDefault 拦截浏览器默认的历史导航
document.addEventListener('mousedown',e=>{if(e.button===3||e.button===4)e.preventDefault();});
document.addEventListener('mouseup',e=>{if(e.button===3||e.button===4)e.preventDefault();});
document.addEventListener('auxclick',e=>{
  if(e.button!==3&&e.button!==4)return;
  e.preventDefault();
  if(view!=='practice')return;
  if(e.target instanceof Element&&e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  pNav(e.button===4?1:-1);
});

let tX=0,tY=0,tOn=false,tView='list';
const swipeBlockedTarget=target=>target instanceof Element&&!!target.closest('button,input,select,textarea,label,a,.opt,img,.katex-display,.menu-pop,.qnav-mask,[contenteditable="true"]');
const mainSwipeArea=document.getElementById('main');
mainSwipeArea.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||swipeBlockedTarget(e.target)){tOn=false;return;}
  tX=e.touches[0].clientX;tY=e.touches[0].clientY;tView=view;tOn=true;
},{passive:true});
mainSwipeArea.addEventListener('touchcancel',()=>{tOn=false;},{passive:true});
mainSwipeArea.addEventListener('touchend',e=>{
  if(!tOn)return;tOn=false;
  const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)<64||Math.abs(dx)<=Math.abs(dy)*1.45)return;
  if(tView==='practice'&&view==='practice'){pNav(dx<0?1:-1);return;}
  if(tView!=='list'||view!=='list')return;
  const next=MODE_ORDER.indexOf(mode)+(dx<0?1:-1);
  if(next>=0&&next<MODE_ORDER.length)switchMode(MODE_ORDER[next]);
},{passive:true});

init();
</script>
